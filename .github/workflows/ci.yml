# Build and tests on every push to main and every pull request. A job runs only when files that
# matter to it changed; the job "changes" decides this. Skipped jobs count as passed for required
# checks, so the checks stay the same on every pull request. A manual run (workflow_dispatch) runs
# every job. The performance tests do not run here: they need the reference host (see README.md
# and dec-performance-tests).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      images: ${{ steps.filter.outputs.images }}
      docs: ${{ steps.filter.outputs.docs }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Everything the Go build, the contracts and the tests read.
            code:
              - '**/*.go'
              - '**/*.proto'
              - 'go.mod'
              - 'go.sum'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'Makefile'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            # Everything that goes into the container images.
            images:
              - 'Dockerfile'
              - '.dockerignore'
              - 'hub/**'
              - 'client/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            # The pages of the stage and the portal, and the preview that renders them.
            ui:
              - 'hub/stage/**'
              - 'hub/portal/**'
              - 'hub/preview.go'
              - 'tests/contract/preview_test.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            # Everything the docsite shows or builds from: its pages, the architecture, and the
            # programs, whose help makes the command reference. Keep in step with docs.yml.
            docs:
              - 'docs/**'
              - 'USER_GUIDE.md'
              - 'README.md'
              - 'AGENTS.md'
              - 'tests/README.md'
              - 'client/**'
              - 'hub/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'scripts/publish-docs.sh'
              - '.github/actions/build-docs/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docs.yml'

  # Always runs: any new file can be outside the architecture model, and the check is quick.
  arch:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: whisper.cpp sources (go.mod points to its Go bindings)
        run: make third_party/whisper.cpp
      - name: Architecture model and architecture test
        run: make arch

  test:
    name: Contracts and contract tests
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: whisper.cpp version
        id: ref
        run: echo "whisper=$(sed -n 's/^WHISPER_REF ?= //p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: whisper.cpp from cache
        id: whisper
        uses: actions/cache@v6
        with:
          path: third_party/whisper.cpp
          key: whisper-portable-${{ runner.os }}-${{ runner.arch }}-${{ steps.ref.outputs.whisper }}
      # Portable: runners differ in their CPUs, and the cache moves between them. A native build
      # can stop with SIGILL on another runner.
      - name: Build whisper.cpp
        if: steps.whisper.outputs.cache-hit != 'true'
        run: make whisper WHISPER_NATIVE=OFF
      # The Protobuf tools pull many modules that are not in go.sum. A cache keeps them from the
      # network; on a miss, a failed download is tried again.
      - name: Protobuf tools from cache
        id: prototools
        uses: actions/cache@v6
        with:
          path: ~/protobuf-tools
          key: protobuf-tools-${{ runner.os }}-${{ runner.arch }}-buf1.57.0-go1.36.12-connect2.0.2
      - name: Install the Protobuf tools
        if: steps.prototools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/protobuf-tools
          export GOBIN=~/protobuf-tools
          for tool in github.com/bufbuild/buf/cmd/buf@v1.57.0 \
                      google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12 \
                      connectrpc.com/connect/v2/cmd/protoc-gen-connect-go@v2.0.2; do
            for attempt in 1 2 3; do
              go install "$tool" && break
              [ "$attempt" = 3 ] && exit 1
              echo "retrying $tool in 10 s"; sleep 10
            done
          done
      - name: Protobuf tools on the path
        run: echo ~/protobuf-tools >> "$GITHUB_PATH"
      - name: Generated code matches the contracts
        run: make check-generated
      - name: Vet and contract tests
        run: make contract

  e2e:
    name: End-to-end tests
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: whisper.cpp version
        id: ref
        run: echo "whisper=$(sed -n 's/^WHISPER_REF ?= //p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: whisper.cpp from cache
        id: whisper
        uses: actions/cache@v6
        with:
          path: third_party/whisper.cpp
          key: whisper-portable-${{ runner.os }}-${{ runner.arch }}-${{ steps.ref.outputs.whisper }}
      # Portable: runners differ in their CPUs, and the cache moves between them. A native build
      # can stop with SIGILL on another runner.
      - name: Build whisper.cpp
        if: steps.whisper.outputs.cache-hit != 'true'
        run: make whisper WHISPER_NATIVE=OFF
      - name: Models from cache
        id: models
        uses: actions/cache@v6
        with:
          path: ~/.local/share/agentic-office/models
          key: models-ggml-small-silero-v6.2.0
      - name: Download the models
        if: steps.models.outputs.cache-hit != 'true'
        run: make models
      - name: End-to-end tests
        run: make e2e-all

  # Builds the docsite as the publish workflow (docs.yml) does, without publishing. A broken link
  # or a failed build fails here, before the merge.
  docs:
    name: Docsite
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-docs

  images:
    name: Container images build
    needs: changes
    if: needs.changes.outputs.images == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: hub
          push: false
          cache-from: type=gha,scope=hub-amd64
          cache-to: type=gha,scope=hub-amd64,mode=max
      - name: Build the client image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: office
          push: false
          cache-from: type=gha,scope=office-amd64
          cache-to: type=gha,scope=office-amd64,mode=max

  # Renders every fixture page of the stage and the portal (office-hub preview -out) and keeps the
  # pages as a workflow artifact, so a reviewer can look at a changed template. It needs no hub, no
  # secret and no Node.js. It fails when a fixture does not render. It is no required check.
  # The pull request gets no comment: that needs the permission pull-requests: write, which this
  # workflow does not have. The job summary names the artifact.
  ui-preview:
    name: UI preview
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: whisper.cpp sources (go.mod points to its Go bindings)
        run: make third_party/whisper.cpp
      - name: Build office-hub
        run: go build -o "$RUNNER_TEMP/office-hub" ./hub
      - name: Render the fixture pages
        run: '"$RUNNER_TEMP/office-hub" preview -src . -out "$RUNNER_TEMP/ui-preview"'
      - name: Upload the pages
        uses: actions/upload-artifact@v7
        with:
          name: ui-preview
          path: ${{ runner.temp }}/ui-preview
          if-no-files-found: error
          retention-days: 30
      - name: Say where the pages are
        run: |
          {
            echo "### UI preview"
            echo
            echo "$(find "$RUNNER_TEMP/ui-preview" -name '*.html' | wc -l) fixture pages of the stage and the portal rendered."
            echo "Download the workflow artifact **ui-preview** below, unzip it and open \`index.html\`."
          } >> "$GITHUB_STEP_SUMMARY"
