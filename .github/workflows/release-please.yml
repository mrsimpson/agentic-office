# Semantic versioning from conventional commits (see AGENTS.md).
#
# On every push to main, release-please reads the commits since the last release and keeps one
# release pull request open: it holds the next version and the CHANGELOG. The maintainer merges it
# when a release should go out. Merging creates the tag and the GitHub release, and the tag starts
# release.yml, which builds and publishes the images and the binaries.
#
# release-please works with the token of the GitHub App "version bumper", not with GITHUB_TOKEN.
# What GITHUB_TOKEN creates (a pull request, a tag) does not start other workflows: the checks would
# never run on the release pull request, and release.yml would not start on the tag. The App is
# configured with the variable VERSION_BUMPER_APPID and the private key in VERSION_BUMPER_SECRET.
# It needs write access to contents, pull requests and issues (release-please sets labels).
name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    steps:
      - id: app
        name: Token of the version bumper App
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET || vars.VERSION_BUMPER_SECRET }}
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
