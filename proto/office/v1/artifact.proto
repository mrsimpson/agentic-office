// Artifact tools (if-artifact-api): deterministic tools without streaming. The first stage
// renders slides only. Artifacts have IDs, for example "slides/42", that the stage uses.
//
// The architecture names HTTPS/JSON for this interface. Connect serves the same contract as plain
// HTTP with JSON.
syntax = "proto3";

package office.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mrsimpson/agentic-office/core/api/office/v1;officev1";

service ArtifactService {
  // RenderSlides renders a deck from a structured description and stores it as an artifact.
  rpc RenderSlides(RenderSlidesRequest) returns (RenderSlidesResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
}

message Slide {
  string title = 1;
  repeated string bullets = 2;
  string notes = 3;
}

message RenderSlidesRequest {
  string command_id = 1;
  string title = 2;
  repeated Slide slides = 3;
  string author_participant_id = 4;
}

message RenderSlidesResponse {
  Artifact artifact = 1;
  bool duplicate = 2;
}

message Artifact {
  // id is for example "slides/42".
  string id = 1;
  string media_type = 2;
  bytes content = 3;
  string author_participant_id = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetArtifactRequest {
  string id = 1;
}

message GetArtifactResponse {
  Artifact artifact = 1;
}
