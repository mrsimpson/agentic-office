// Meeting session: session commands (if-session-commands) and session stream (if-session-stream).
//
// Every command carries a command_id that the client creates: unique and sortable by time, for
// example a UUIDv7 (dec-idempotent-commands). If the same command_id arrives again, the server
// returns the stored event, sets duplicate to true and creates no new event. Each successful
// command creates exactly one event.
syntax = "proto3";

package office.v1;

import "google/protobuf/timestamp.proto";
import "office/v1/common.proto";
import "office/v1/events.proto";

option go_package = "github.com/mrsimpson/agentic-office/core/api/office/v1;officev1";

service SessionService {
  // Join adds the calling participant to a session. A repeated join command_id returns the same
  // participant, so a restarted client stays the same participant.
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  // SubmitUtterance appends an utterance.final event.
  rpc SubmitUtterance(SubmitUtteranceRequest) returns (SubmitUtteranceResponse);
  rpc RetractUtterance(RetractUtteranceRequest) returns (RetractUtteranceResponse);
  // SubmitSignal appends a turn.end, silence.long or addressed event.
  rpc SubmitSignal(SubmitSignalRequest) returns (SubmitSignalResponse);
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc RaiseHand(RaiseHandRequest) returns (RaiseHandResponse);
  rpc UpdateMinutes(UpdateMinutesRequest) returns (UpdateMinutesResponse);
  rpc ShowArtifact(ShowArtifactRequest) returns (ShowArtifactResponse);
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse);

  // Subscribe sends every event with an ID greater than after_event_id, then live events.
  // The stream closes after session.ended.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

// CommandResult is the result of every session command.
message CommandResult {
  Event event = 1;
  // duplicate is true if the command_id was already known and no new event was created.
  bool duplicate = 2;
}

message JoinRequest {
  string session_id = 1;
  string command_id = 2;
  string display_name = 3;
  ParticipantKind kind = 4;
  bool captured = 5;
}

message JoinResponse {
  string participant_id = 1;
  CommandResult result = 2;
}

message LeaveRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
}

message LeaveResponse {
  CommandResult result = 1;
}

message SubmitUtteranceRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  string text = 4;
  Modality modality = 5;
  google.protobuf.Timestamp transcribed_at = 6;
}

message SubmitUtteranceResponse {
  CommandResult result = 1;
}

message RetractUtteranceRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  uint32 utterance_event_id = 4;
}

message RetractUtteranceResponse {
  CommandResult result = 1;
}

message SubmitSignalRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  oneof signal {
    TurnEnd turn_end = 10;
    SilenceLong silence_long = 11;
    Addressed addressed = 12;
  }
}

message SubmitSignalResponse {
  CommandResult result = 1;
}

message PauseRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
}

message PauseResponse {
  CommandResult result = 1;
}

message ResumeRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
}

message ResumeResponse {
  CommandResult result = 1;
}

message RaiseHandRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  string topic = 4;
}

message RaiseHandResponse {
  CommandResult result = 1;
}

message UpdateMinutesRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  string text = 4;
}

message UpdateMinutesResponse {
  CommandResult result = 1;
}

message ShowArtifactRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  string artifact_id = 4;
}

message ShowArtifactResponse {
  CommandResult result = 1;
}

message EndSessionRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
}

message EndSessionResponse {
  CommandResult result = 1;
}

message SubscribeRequest {
  string session_id = 1;
  // after_event_id is the cursor: the ID of the last event the client has. 0 means from the start.
  uint32 after_event_id = 2;
}

message SubscribeResponse {
  Event event = 1;
}
