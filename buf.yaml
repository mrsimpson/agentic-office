version: v2
# One module per interface. Each interface owns its contract and its types (see chapter 5 and
# concept-module-boundaries in docs/architecture/). There are no shared proto files.
modules:
  - path: hub/session/api
  - path: hub/identity/api
  - path: hub/records/decision/api
  - path: hub/records/minutes/api
  - path: hub/records/note/api
  - path: hub/tasks/api
  - path: hub/artifacts/api
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
