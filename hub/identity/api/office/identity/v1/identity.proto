// Identity: auth API (if-auth-api), concept-identity, dec-auth-keypair.
//
// Every participant has its own Ed25519 key pair, created locally. Only the public key is sent.
// A client gets a challenge, signs it with its private key and receives a short-lived access token
// bound to its key. A system admin registers users and keys with the user API (if-user-api).
//
// Every call to the office hub, except GetChallenge and ExchangeChallenge, carries the token in
// the header "Authorization: Bearer <token>". A call without a valid token fails with
// unauthenticated; the client then authenticates again. A call that the token does not allow fails
// with permission_denied.
syntax = "proto3";

package office.identity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mrsimpson/agentic-office/hub/identity/api;identityv1";

service IdentityService {
  // GetChallenge returns a one-time challenge for a registered public key.
  rpc GetChallenge(GetChallengeRequest) returns (GetChallengeResponse);
  // ExchangeChallenge checks the signature and returns an access token bound to the key.
  // A challenge can be exchanged once, also if the signature is wrong.
  rpc ExchangeChallenge(ExchangeChallengeRequest) returns (ExchangeChallengeResponse);
  // CreateStageLink returns a read-only link to the stage of one session. Any participant may
  // create one. The token of the link only allows SessionStreamService.Subscribe for that session.
  rpc CreateStageLink(CreateStageLinkRequest) returns (CreateStageLinkResponse);
  // CreatePortalLink creates a link that opens the portal (if-portal-web, dec-web-portal) for the
  // user who calls. The link holds a code that works once and expires after a few minutes. Every
  // user may call it; a stage link may not. It belongs to no tenant: tenant_id only names the page
  // that the portal opens first, and must be a tenant of the caller. It is idempotent by
  // command_id.
  rpc CreatePortalLink(CreatePortalLinkRequest) returns (CreatePortalLinkResponse);
  // ExchangePortalLink swaps the code of a portal link for an access token of the key that
  // created the link. The token belongs to no tenant: a call names its tenant as every call does.
  // The code works once. It needs no token.
  rpc ExchangePortalLink(ExchangePortalLinkRequest) returns (ExchangePortalLinkResponse);
  // WhoAmI returns the caller: the user, whether it is a system admin, and its active memberships.
  // It belongs to no tenant. A stage link may not call it.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // IssueAgentToken gives a human member of a tenant a short-lived access token as a team agent of
  // that tenant (dec-team-agents). The caller is the agent launcher: the token names the agent as
  // the participant, the caller and the version of the definition that the caller confirmed. The
  // token allows what a member of the tenant may do, except what only a human may do. It belongs
  // to no tenant: the request names it. A team agent that was removed, or a caller who is no
  // member, gets the answer for an agent that does not exist.
  rpc IssueAgentToken(IssueAgentTokenRequest) returns (IssueAgentTokenResponse);
}

message GetChallengeRequest {
  // public_key is the raw 32-byte Ed25519 public key.
  bytes public_key = 1;
}

message GetChallengeResponse {
  // challenge starts with the bytes "agentic-office auth v1\n". Clients sign nothing else.
  bytes challenge = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ExchangeChallengeRequest {
  bytes public_key = 1;
  bytes challenge = 2;
  // signature is the Ed25519 signature of the challenge.
  bytes signature = 3;
}

message ExchangeChallengeResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // participant_id is the identity the key belongs to. It is also the participant ID in every
  // session.
  string participant_id = 3;
  // display_name is the name of the participant, for example as the author of a commit.
  string display_name = 4;
}

message CreatePortalLinkRequest {
  string command_id = 1;
  // tenant_id is the tenant whose pages the portal opens first, or empty for the start page. It
  // must be an active membership of the caller, or the call fails with not_found.
  string tenant_id = 2;
}

message CreatePortalLinkResponse {
  // url has the form <server>/portal/login?code=<code>.
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ExchangePortalLinkRequest {
  string code = 1;
}

message ExchangePortalLinkResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string participant_id = 3;
  // tenant_id is the tenant that the link named, or empty.
  string tenant_id = 4;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  string participant_id = 1;
  string display_name = 2;
  ActorKind kind = 3;
  bool system_admin = 4;
  // memberships are the active memberships of the caller, ordered by tenant.
  repeated TenantMembership memberships = 5;
}

// TenantMembership is an active membership of the caller.
message TenantMembership {
  string tenant_id = 1;
  bool tenant_admin = 2;
}

message CreateStageLinkRequest {
  string command_id = 1;
  string session_id = 2;
}

message CreateStageLinkResponse {
  // url has the form <server>/stage/<session_id>?token=<token>.
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// ActorKind tells whether an actor is a human device or an agent (concept-identity).
enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;
  ACTOR_KIND_HUMAN = 1;
  ACTOR_KIND_AGENT = 2;
}

message IssueAgentTokenRequest {
  string tenant_id = 1;
  // agent_id is the participant ID of the team agent.
  string agent_id = 2;
  // definition_version is the version of the definition file that the caller confirmed, as the
  // archive read interface names it. It is a statement of the caller: Identity records it in the
  // token and checks nothing about it.
  string definition_version = 3;
}

message IssueAgentTokenResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // participant_id is the ID of the team agent.
  string participant_id = 3;
  // display_name is the name of the agent as its token shows it, also as the author of commits: the
  // name of the agent, the agent launcher and the version.
  string display_name = 4;
}
