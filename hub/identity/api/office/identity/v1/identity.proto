// Identity: auth API (if-auth-api), concept-identity, dec-auth-keypair.
//
// Every participant has its own Ed25519 key pair, created locally. Only the public key is sent.
// A client gets a challenge, signs it with its private key and receives a short-lived access token
// bound to its key. Keys are registered by hand by an admin in the first stage.
//
// Every call to the office hub, except GetChallenge and ExchangeChallenge, carries the token in
// the header "Authorization: Bearer <token>". A call without a valid token fails with
// unauthenticated; the client then authenticates again. A call that the token does not allow fails
// with permission_denied.
syntax = "proto3";

package office.identity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mrsimpson/agentic-office/hub/identity/api;identityv1";

service IdentityService {
  // GetChallenge returns a one-time challenge for a registered public key.
  rpc GetChallenge(GetChallengeRequest) returns (GetChallengeResponse);
  // ExchangeChallenge checks the signature and returns an access token bound to the key.
  // A challenge can be exchanged once, also if the signature is wrong.
  rpc ExchangeChallenge(ExchangeChallengeRequest) returns (ExchangeChallengeResponse);
  // CreateStageLink returns a read-only link to the stage of one session. Any participant may
  // create one. The token of the link only allows SessionStreamService.Subscribe for that session.
  rpc CreateStageLink(CreateStageLinkRequest) returns (CreateStageLinkResponse);

  // Admin commands. Only a token of an admin key may call them.
  rpc RegisterKey(RegisterKeyRequest) returns (RegisterKeyResponse);
  rpc RevokeKey(RevokeKeyRequest) returns (RevokeKeyResponse);
  // ListKeys lists every key with its participant, ordered by participant ID and key ID. Only
  // admin keys may call it.
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  // CreateAdminLink creates a link that opens the admin web view (if-admin-web) for the admin
  // who calls. The link holds a code that works once and expires after a few minutes. Only admin
  // keys may call it. It is idempotent by command_id.
  rpc CreateAdminLink(CreateAdminLinkRequest) returns (CreateAdminLinkResponse);
  // ExchangeAdminLink swaps the code of an admin link for an access token of the admin key that
  // created the link. The code works once. It needs no token.
  rpc ExchangeAdminLink(ExchangeAdminLinkRequest) returns (ExchangeAdminLinkResponse);
}

message GetChallengeRequest {
  // public_key is the raw 32-byte Ed25519 public key.
  bytes public_key = 1;
}

message GetChallengeResponse {
  // challenge starts with the bytes "agentic-office auth v1\n". Clients sign nothing else.
  bytes challenge = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ExchangeChallengeRequest {
  bytes public_key = 1;
  bytes challenge = 2;
  // signature is the Ed25519 signature of the challenge.
  bytes signature = 3;
}

message ExchangeChallengeResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // participant_id is the identity the key belongs to. It is also the participant ID in every
  // session.
  string participant_id = 3;
}

message CreateStageLinkRequest {
  string command_id = 1;
  string session_id = 2;
}

message CreateStageLinkResponse {
  // url has the form <server>/stage/<session_id>?token=<token>.
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RegisterKeyRequest {
  string command_id = 1;
  // participant_id is the identity the key belongs to. A participant can have several keys.
  // 1 to 64 letters, digits, ".", "_" or "-", chosen by the admin, for example "ada".
  string participant_id = 2;
  // display_name and kind are required for a new participant. For a known participant they may
  // be empty; if set, they must match.
  string display_name = 3;
  ActorKind kind = 4;
  bytes public_key = 5;
}

message RegisterKeyResponse {
  // key_id is "SHA256:" and the unpadded base64 form of the SHA-256 hash of the public key.
  string key_id = 1;
}

// RevokeKey ends all tokens of the key at once. Keys of the admin file cannot be revoked here.
message RevokeKeyRequest {
  string command_id = 1;
  string key_id = 2;
}

message RevokeKeyResponse {}

message ListKeysRequest {}

message ListKeysResponse {
  repeated KeyInfo keys = 1;
}

message KeyInfo {
  string key_id = 1;
  string participant_id = 2;
  string display_name = 3;
  ActorKind kind = 4;
  bool revoked = 5;
  // admin is true for a key of the admin file.
  bool admin = 6;
}

message CreateAdminLinkRequest {
  string command_id = 1;
}

message CreateAdminLinkResponse {
  // url has the form <server>/admin/login?code=<code>.
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ExchangeAdminLinkRequest {
  string code = 1;
}

message ExchangeAdminLinkResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string participant_id = 3;
}

// ActorKind tells whether an actor is a human device or an agent (concept-identity).
enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;
  ACTOR_KIND_HUMAN = 1;
  ACTOR_KIND_AGENT = 2;
}
