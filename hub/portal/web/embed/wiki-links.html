{{if .}}<ul class="refs">{{range .}}<li data-link="{{.Path}}"{{if .Broken}} data-broken-link{{end}}>{{if .Href}}<a class="name" href="{{.Href}}">{{.Title}}</a> <small><code>{{.Path}}</code></small>{{else}}<code>{{.Path}}</code>{{if .Broken}} <span class="badge revoked">leads nowhere</span>{{else}} <small>not in the wiki: a directory, or a file that waits for the release of its session</small>{{end}}{{end}}</li>{{end}}</ul>{{end}}
