// Session commands (if-session-commands): the synchronous calls of a participant in a meeting
// session, the checks of a session log, and the offer of a copy after the hub lost events.
//
// Every command carries a command_id that the client creates: unique and sortable by time, for
// example a UUIDv7 (dec-idempotent-commands). If the same command_id arrives again, the server
// returns the stored event, sets duplicate to true and creates no new event. Each successful
// command creates exactly one event.
//
// The events and the signed tree heads are the types of the session stream (if-session-stream,
// office.sessionstream.v1): the stream owns the event log.
//
// Every call needs an access token (see identity.proto). The participant ID in a session is the
// participant of the token. Every participant_id in a request must be that participant, or the
// call fails with permission_denied. A stage link token cannot call these commands.
syntax = "proto3";

package office.sessioncommands.v1;

import "google/protobuf/timestamp.proto";
import "office/sessionstream/v1/events.proto";

option go_package = "github.com/mrsimpson/agentic-office/hub/session/commandsapi;sessioncommandsv1";

service SessionCommandsService {
  // Join adds the participant of the token to a session. A participant joins once: a repeated
  // join, with the same or a new command_id, returns the first join with duplicate set, as long
  // as the participant has not left.
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  // SubmitUtterance appends an utterance.final event.
  rpc SubmitUtterance(SubmitUtteranceRequest) returns (SubmitUtteranceResponse);
  rpc MarkOffTheRecord(MarkOffTheRecordRequest) returns (MarkOffTheRecordResponse);
  // SubmitSignal appends a turn.end, silence.long or addressed event.
  rpc SubmitSignal(SubmitSignalRequest) returns (SubmitSignalResponse);
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc RaiseHand(RaiseHandRequest) returns (RaiseHandResponse);
  rpc UpdateMinutes(UpdateMinutesRequest) returns (UpdateMinutesResponse);
  rpc FocusArtifact(FocusArtifactRequest) returns (FocusArtifactResponse);
  // EndSession stores the minutes and appends session.ended. The answer carries the release
  // status of the session: released at once by the hub when no human took part, else waiting
  // until the deadline (the end plus the grace period of the tenant).
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse);

  // ReleaseSession releases what the session staged (concept-session-release): it appends
  // session.released, and the hub moves the staging area of the session into the artifact
  // repository with the caller as the author. Only a human who took part in the session may
  // release it (also one who left, and the participant who imported it); an agent gets
  // permission_denied, everyone else not_found. The session must have ended and must not be
  // released (failed_precondition). A release lifts an objection. The hub stores the event before
  // it answers and completes the move after a restart.
  //
  // Before it releases, the hub searches the staged files for word-for-word quotes of sentences
  // off the record. While it finds any, it refuses: it appends no event and answers without a
  // result, with the places and a quote token. The caller releases anyway with the same command
  // again and accept_quotes set to that token. The hub searches again and releases only if the
  // search gives the same token; otherwise it refuses again with the new places and token. The
  // hub changes no content.
  rpc ReleaseSession(ReleaseSessionRequest) returns (ReleaseSessionResponse);
  // ObjectToRelease holds the release of an ended session (concept-session-release): it appends
  // release.objected, and the hub does not release the session when its grace period ends. Only a
  // human releases it then. Who may object: as for ReleaseSession. A session that is held or
  // released fails with failed_precondition.
  rpc ObjectToRelease(ObjectToReleaseRequest) returns (ObjectToReleaseResponse);
  // GetRelease returns the release of a session (concept-session-release). Who may read the
  // session, as the session stream decides (stream.proto), gets the release status, the paths of
  // the staged files and, once the session is released, its release commit. Every other member of
  // the tenant gets only the release status and the release commit of a released session; for
  // them a session that is not released does not exist (not_found). A stage link gets
  // permission_denied.
  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse);

  // GetTreeHead, GetConsistencyProof and GetInclusionProof answer only who may read the
  // session, as the session stream decides (stream.proto); everybody else gets not_found.
  // GetTreeHead returns the signed tree head of the session log (dec-merkle-log): for the current
  // log, or for its first tree_size events.
  rpc GetTreeHead(GetTreeHeadRequest) returns (GetTreeHeadResponse);
  // GetConsistencyProof returns the proof that the log of second_size events extends the log of
  // first_size events (RFC 9162, section 2.1.4).
  rpc GetConsistencyProof(GetConsistencyProofRequest) returns (GetConsistencyProofResponse);
  // GetInclusionProof returns the proof that one event is in the tree of tree_size events
  // (RFC 9162, section 2.1.3).
  rpc GetInclusionProof(GetInclusionProofRequest) returns (GetInclusionProofResponse);
  // GetHubKey returns the public key with which the hub signs tree heads. The key stays the same
  // across restarts of the hub.
  rpc GetHubKey(GetHubKeyRequest) returns (GetHubKeyResponse);

  // OfferLog offers the copy of a session log that a peer holds (dec-restore-from-peers). After a
  // restart, the hub has the log only up to its last write to the archive; a peer with a longer
  // copy offers the events after the last event of the hub. The hub accepts the copy only if it
  // proves itself: the tree head of the copy must carry a valid signature of the hub key, the
  // events must give its root hash, and the log of the hub must be a prefix of it (consistency
  // proof against the last signed tree head of the hub). The hub then appends the missing events
  // with their IDs, so all cursors stay valid. A copy that is not longer than the log of the hub
  // is a no-op, so the first copy that fits wins. A copy that does not verify fails with
  // invalid_argument; a copy signed by the hub that does not extend its log (a fork) fails with
  // failed_precondition. OfferLog creates no new event, so it needs no command_id: a repeated
  // offer is a no-op.
  rpc OfferLog(OfferLogRequest) returns (OfferLogResponse);
}

// CommandResult is the result of every session command.
message CommandResult {
  office.sessionstream.v1.Event event = 1;
  // duplicate is true if the command_id was already known and no new event was created.
  bool duplicate = 2;
}

message JoinRequest {
  string session_id = 1;
  string command_id = 2;
  // display_name is the name in this session. Empty means the registered name.
  string display_name = 3;
  // kind is optional. If set, it must be the registered kind.
  office.sessionstream.v1.ParticipantKind kind = 4;
  bool captured = 5;
}

message JoinResponse {
  string participant_id = 1;
  CommandResult result = 2;
}

message LeaveRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
}

message LeaveResponse {
  CommandResult result = 1;
}

message SubmitUtteranceRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  string text = 4;
  office.sessionstream.v1.Modality modality = 5;
  google.protobuf.Timestamp transcribed_at = 6;
}

message SubmitUtteranceResponse {
  CommandResult result = 1;
}

message MarkOffTheRecordRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  uint32 utterance_event_id = 4;
}

message MarkOffTheRecordResponse {
  CommandResult result = 1;
}

message SubmitSignalRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  oneof signal {
    office.sessionstream.v1.TurnEnd turn_end = 10;
    office.sessionstream.v1.SilenceLong silence_long = 11;
    office.sessionstream.v1.Addressed addressed = 12;
  }
}

message SubmitSignalResponse {
  CommandResult result = 1;
}

message PauseRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
}

message PauseResponse {
  CommandResult result = 1;
}

message ResumeRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
}

message ResumeResponse {
  CommandResult result = 1;
}

message RaiseHandRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  string topic = 4;
}

message RaiseHandResponse {
  CommandResult result = 1;
}

message UpdateMinutesRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  string text = 4;
}

message UpdateMinutesResponse {
  CommandResult result = 1;
}

message FocusArtifactRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  string artifact_id = 4;
}

message FocusArtifactResponse {
  CommandResult result = 1;
}

message EndSessionRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
}

message EndSessionResponse {
  CommandResult result = 1;
  // release is the release status of the session after its end.
  ReleaseStatus release = 2;
}

// ReleaseStatus is the release status of a session (concept-session-release).
message ReleaseStatus {
  ReleaseState state = 1;
  // deadline is when the hub releases the session; set while the state is waiting.
  google.protobuf.Timestamp deadline = 2;
}

enum ReleaseState {
  RELEASE_STATE_UNSPECIFIED = 0;
  // The session runs; what it creates waits in its staging area.
  RELEASE_STATE_OPEN = 1;
  // The session has ended and waits for its release until the deadline.
  RELEASE_STATE_WAITING = 2;
  // A human objected; only a human releases the session now.
  RELEASE_STATE_HELD = 3;
  // The session is released.
  RELEASE_STATE_RELEASED = 4;
}

message ReleaseSessionRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
  // accept_quotes is the quote token of an earlier refusal. With it, the hub releases despite
  // the quotes, as long as a new search gives the same token.
  string accept_quotes = 4;
}

message ReleaseSessionResponse {
  // result is the session.released event. It is unset when the hub refused the release because
  // of quotes.
  CommandResult result = 1;
  // quotes are the places where a staged file of the session quotes a sentence off the record
  // word for word: the reason of a refusal, or the quotes that accept_quotes accepted. They name
  // the place, never the sentence. A repeated command_id returns none.
  repeated Quote quotes = 2;
  // quote_token is set when the hub refused the release because of quotes. It is a hash over the
  // session and the exact quotes that the search found; it reveals no sentence.
  string quote_token = 3;
}

// Quote is a place in a staged file that quotes a sentence off the record word for word.
message Quote {
  // path is the path of the file in the artifact repository.
  string path = 1;
  // line is the line of the file where the quote starts, from 1.
  uint32 line = 2;
  // utterance_event_id is the utterance.final event that is off the record.
  uint32 utterance_event_id = 3;
}

message ObjectToReleaseRequest {
  string session_id = 1;
  string command_id = 2;
  string participant_id = 3;
}

message ObjectToReleaseResponse {
  CommandResult result = 1;
}

message GetReleaseRequest {
  string session_id = 1;
}

message GetReleaseResponse {
  ReleaseStatus status = 1;
  // staged are the paths of the files in the staging area of the session, ordered, while it is
  // not released. Only who may read the session gets them.
  repeated string staged = 2;
  // commit is the release commit in the artifact repository, once the release moved the staging
  // area. It is unset before, and for a release that had nothing to move.
  ReleaseCommit commit = 3;
  // may_release is set when the caller may release or object now: a human who took part, while
  // the session waits for its release or is held.
  bool may_release = 4;
}

// ReleaseCommit is the commit that moved the staged files of a session into the artifact
// repository.
message ReleaseCommit {
  string commit_id = 1;
  google.protobuf.Timestamp time = 2;
  // released_by is the author of the commit: the human who released. It is unset when the hub
  // released the session.
  CommitAuthor released_by = 3;
  // authors are the authors of the staged files, named as co-authors of the commit (trailer
  // Co-authored-by), without the author of the commit.
  repeated CommitAuthor authors = 4;
  // paths are the files that the commit wrote, ordered.
  repeated string paths = 5;
}

// CommitAuthor is an author of a commit, as Git records it.
message CommitAuthor {
  string name = 1;
  string email = 2;
}

message GetTreeHeadRequest {
  string session_id = 1;
  // tree_size is the size of the tree: the first tree_size events. 0 means the current log.
  uint32 tree_size = 2;
}

message GetTreeHeadResponse {
  office.sessionstream.v1.SignedTreeHead tree_head = 1;
}

message GetConsistencyProofRequest {
  string session_id = 1;
  // first_size is the size of the older tree. It must be at least 1.
  uint32 first_size = 2;
  // second_size is the size of the newer tree, at least first_size. 0 means the current log.
  uint32 second_size = 3;
}

message GetConsistencyProofResponse {
  uint32 first_size = 1;
  uint32 second_size = 2;
  // hashes are the node hashes of the proof, in the order of RFC 9162. Empty if both sizes are
  // equal.
  repeated bytes hashes = 3;
}

message GetInclusionProofRequest {
  string session_id = 1;
  // event_id is the event to prove. Its leaf index is event_id minus one.
  uint32 event_id = 2;
  // tree_size is the size of the tree, at least event_id. 0 means the current log.
  uint32 tree_size = 3;
}

message GetInclusionProofResponse {
  uint32 event_id = 1;
  uint32 tree_size = 2;
  // hashes are the node hashes of the audit path, from the leaf to the root (RFC 9162).
  repeated bytes hashes = 3;
}

message GetHubKeyRequest {}

message GetHubKeyResponse {
  // public_key is the Ed25519 public key of the hub (32 bytes).
  bytes public_key = 1;
}

message OfferLogRequest {
  string session_id = 1;
  // after_event_id is the last event before the offered events. It is at most the last event of
  // the hub; the hub uses its own events up to it. 0 offers the whole log.
  uint32 after_event_id = 2;
  // events are the events after_event_id + 1 to tree_head.tree_size, in order, as the peer
  // received them. A placeholder (an utterance off the record) verifies by its leaf_hash.
  repeated office.sessionstream.v1.Event events = 3;
  // tree_head is a tree head signed by the hub over the events 1 to tree_size of the copy, for
  // example the last one of the session stream.
  office.sessionstream.v1.SignedTreeHead tree_head = 4;
}

message OfferLogResponse {
  // accepted is true if the hub appended events from the copy. It is false for a copy that is
  // not longer than the log of the hub.
  bool accepted = 1;
  // tree_head is the signed tree head of the log of the hub after the offer.
  office.sessionstream.v1.SignedTreeHead tree_head = 2;
}
