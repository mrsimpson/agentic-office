// Session stream (if-session-stream): the event log of a session from a cursor onwards, then
// live, and the events after a cursor on request (dec-events-from-cursor).
//
// The stream owns the event log: the events (events.proto) and the signed tree heads over them
// (dec-merkle-log). The session commands (office.sessioncommands.v1) return events of these types.
//
// Every call needs an access token (see identity.proto). A stage link token may only call
// Subscribe, for the session of the link.
syntax = "proto3";

package office.sessionstream.v1;

import "office/sessionstream/v1/events.proto";

option go_package = "github.com/mrsimpson/agentic-office/hub/session/streamapi;sessionstreamv1";

service SessionStreamService {
  // Subscribe sends every event with an ID greater than after_event_id, then live events.
  // The stream closes after session.ended. It ends with unauthenticated when the token expires
  // or its key is revoked; the client authenticates again and resumes from its cursor.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // GetEvents returns the events with an ID greater than after_event_id, at most limit of them
  // (dec-events-from-cursor). A participant calls it when it finds a gap in its copy, or polls it
  // instead of following a stream or a file. IDs have no gaps; an utterance that is off the record
  // is a placeholder with its ID.
  rpc GetEvents(GetEventsRequest) returns (GetEventsResponse);
}

message SubscribeRequest {
  string session_id = 1;
  // after_event_id is the cursor: the ID of the last event the client has. 0 means from the start.
  uint32 after_event_id = 2;
}

message SubscribeResponse {
  Event event = 1;
  // tree_head is the tree head signed by the hub over the events 1 to event.id. The hub sets it
  // on the last event it has when it sends it, so a subscriber always holds a signed head over
  // its whole copy, and can prove its copy after the hub lost events (OfferLog).
  SignedTreeHead tree_head = 2;
}

message GetEventsRequest {
  string session_id = 1;
  // after_event_id is the cursor: the last event ID the caller has. 0 reads from the start.
  uint32 after_event_id = 2;
  // limit is the maximum number of events. 0 means 100; at most 1000.
  uint32 limit = 3;
}

message GetEventsResponse {
  repeated Event events = 1;
  // more is true if there are more events after the last one returned.
  bool more = 2;
}
