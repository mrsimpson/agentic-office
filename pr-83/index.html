ce","stimulus":"Every write to the archive takes 5 s (OPEN) while participants speak","response":"Commands and the stream run as usual; later events go into the next write","metric":"qs-transcript-to-log still \u003c 200 ms; no queue of writes builds up"},"startLine":136,"endLine":143,"inArc42Fence":true},{"kind":"prose","text":"","line":145,"renderedHtml":""},{"kind":"heading","level":2,"text":"Resume after a network drop","line":146},{"kind":"prose","text":"","line":147,"renderedHtml":"\u003cp>A participant&#39;s network drops in the middle of a meeting and comes back. While offline, the person\nkeeps speaking. After the connection is back, the local log is complete again, and the queued\nutterances are in the session log in the right order.\u003c/p>\n"},{"kind":"prose","text":"A participant's network drops in the middle of a meeting and comes back. While offline, the person","line":148,"renderedHtml":""},{"kind":"prose","text":"keeps speaking. After the connection is back, the local log is complete again, and the queued","line":149,"renderedHtml":""},{"kind":"prose","text":"utterances are in the session log in the right order.","line":150,"renderedHtml":""},{"kind":"prose","text":"","line":151,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-resume-after-drop","title":"Resume after a network drop","quality":"qg-resumability","stimulus":"The network of a participant with --mic drops for 60 s (OPEN) and comes back","response":"Queued utterances are stored in order; the local log receives all missed events","metric":"0 lost and 0 duplicate events; local log complete within 2 s after reconnect (OPEN)"},"startLine":153,"endLine":160,"inArc42Fence":true},{"kind":"prose","text":"","line":162,"renderedHtml":""},{"kind":"heading","level":2,"text":"Speaker sees what was sent","line":163},{"kind":"prose","text":"","line":164,"renderedHtml":"\u003cp>After every sentence, the speaker sees its status in the terminal.\u003c/p>\n"},{"kind":"prose","text":"After every sentence, the speaker sees its status in the terminal.","line":165,"renderedHtml":""},{"kind":"prose","text":"","line":166,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-sender-sees-status","title":"Status of own sentences is visible","quality":"qg-usability","stimulus":"A sentence is sent or marked off the record","response":"The terminal shows the status; the stage shows the capture status","metric":"Status visible ≤ 1 s after the hub confirms it (OPEN)"},"startLine":168,"endLine":175,"inArc42Fence":true},{"kind":"prose","text":"","line":177,"renderedHtml":""}]},{"filePath":"docs/architecture/11-risks.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Risks and Technical Debt","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"heading","level":2,"text":"Classified sentences stay with the agent","line":3},{"kind":"prose","text":"","line":4,"renderedHtml":"\u003cp>A sentence that is marked off the record afterwards is already in the local files and in the\ncontext of the agents that read it. It cannot be removed from an agent&#39;s context.\u003c/p>\n"},{"kind":"prose","text":"A sentence that is marked off the record afterwards is already in the local files and in the","line":5,"renderedHtml":""},{"kind":"prose","text":"context of the agents that read it. It cannot be removed from an agent's context.","line":6,"renderedHtml":""},{"kind":"prose","text":"","line":7,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-retraction-leak","title":"Sentences marked off the record stay in agent context","severity":"high","mitigation":"The interfaces suppress the text of sentences off the record for every later reader (dec-off-the-record); the agent contract requires respecting the mark"},"startLine":9,"endLine":14,"inArc42Fence":true},{"kind":"prose","text":"","line":16,"renderedHtml":""},{"kind":"heading","level":2,"text":"Legal uncertainty about listening in","line":17},{"kind":"prose","text":"","line":18,"renderedHtml":"\u003cp>Consent, retention and how to handle people without a client are not settled yet.\u003c/p>\n"},{"kind":"prose","text":"Consent, retention and how to handle people without a client are not settled yet.","line":19,"renderedHtml":""},{"kind":"prose","text":"","line":20,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-consent","title":"Consent and retention not settled","severity":"high","mitigation":"Joining with the microphone is the consent (dec-consent-by-mic); capture status on the stage; data protection review before first use"},"startLine":22,"endLine":27,"inArc42Fence":true},{"kind":"prose","text":"","line":29,"renderedHtml":""},{"kind":"heading","level":2,"text":"Whisper too slow on laptops","line":30},{"kind":"prose","text":"","line":31,"renderedHtml":"\u003cp>Whisper is the real latency risk. In the spike, a small model needed about 0.9 s per sentence on\na CPU, whatever the length of the sentence. The large model was too slow for live use. From the end\nof speech to the log it took about 1.4 s. The jitter of the Go audio loop is no problem (p99 about\n1 ms), even while Whisper runs.\u003c/p>\n"},{"kind":"prose","text":"Whisper is the real latency risk. In the spike, a small model needed about 0.9 s per sentence on","line":32,"renderedHtml":""},{"kind":"prose","text":"a CPU, whatever the length of the sentence. The large model was too slow for live use. From the end","line":33,"renderedHtml":""},{"kind":"prose","text":"of speech to the log it took about 1.4 s. The jitter of the Go audio loop is no problem (p99 about","line":34,"renderedHtml":""},{"kind":"prose","text":"1 ms), even while Whisper runs.","line":35,"renderedHtml":""},{"kind":"prose","text":"","line":36,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-whisper-latency","title":"Local transcription too slow","severity":"high","mitigation":"Smaller or quantised models; a shorter audio window per sentence; a GPU where available; measure on real participant laptops; if echo cancellation later needs tighter timing, build it as a small Rust or C component behind a clear interface"},"startLine":38,"endLine":43,"inArc42Fence":true},{"kind":"prose","text":"","line":45,"renderedHtml":""},{"kind":"heading","level":2,"text":"Agents without a file system","line":46},{"kind":"prose","text":"","line":47,"renderedHtml":"\u003cp>Agents that only use an API cannot follow a local file.\u003c/p>\n"},{"kind":"prose","text":"Agents that only use an API cannot follow a local file.","line":48,"renderedHtml":""},{"kind":"prose","text":"","line":49,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-no-filesystem","title":"Agents without a shared file system","severity":"medium","mitigation":"Events after a cursor, polled by the agent (dec-events-from-cursor)"},"startLine":51,"endLine":56,"inArc42Fence":true},{"kind":"prose","text":"","line":58,"renderedHtml":""},{"kind":"heading","level":2,"text":"The agent harnesses and ACP change fast","line":59},{"kind":"prose","text":"","line":60,"renderedHtml":"\u003cp>The Agent Client Protocol is young, and the harnesses implement it in different ways and versions.\nClaude Code needs an adapter that is a separate package. Harnesses name tools differently in their\npermission requests, so a rule that allows only the office tools can miss or block a tool. The\noffice cannot test real harnesses in its CI, because they need a model and a key.\u003c/p>\n"},{"kind":"prose","text":"The Agent Client Protocol is young, and the harnesses implement it in different ways and versions.","line":61,"renderedHtml":""},{"kind":"prose","text":"Claude Code needs an adapter that is a separate package. Harnesses name tools differently in their","line":62,"renderedHtml":""},{"kind":"prose","text":"permission requests, so a rule that allows only the office tools can miss or block a tool. The","line":63,"renderedHtml":""},{"kind":"prose","text":"office cannot test real harnesses in its CI, because they need a model and a key.","line":64,"renderedHtml":""},{"kind":"prose","text":"","line":65,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-harness-drift","title":"Agent harnesses and ACP change and differ","severity":"medium","mitigation":"The runner uses only the stable core of ACP (initialize, one session with MCP servers, prompt, cancel, permission requests) and tests it against a test double; the user guide names the tested harness commands; the permission rule is configurable (dec-agent-runner-delivery)"},"startLine":67,"endLine":72,"inArc42Fence":true},{"kind":"prose","text":"","line":74,"renderedHtml":""},{"kind":"heading","level":2,"text":"Waking the agent costs time and money","line":75},{"kind":"prose","text":"","line":76,"renderedHtml":"\u003cp>The runner checks after each utterance whether to wake the agent. If it wakes a harness with a\nlarge model too often, the agent spends tokens on utterances that do not concern it, and it may\nlag behind a fast meeting. The check itself also runs for every utterance.\u003c/p>\n"},{"kind":"prose","text":"The runner checks after each utterance whether to wake the agent. If it wakes a harness with a","line":77,"renderedHtml":""},{"kind":"prose","text":"large model too often, the agent spends tokens on utterances that do not concern it, and it may","line":78,"renderedHtml":""},{"kind":"prose","text":"lag behind a fast meeting. The check itself also runs for every utterance.","line":79,"renderedHtml":""},{"kind":"prose","text":"","line":80,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-agent-wakeups","title":"Checking and waking the agent per utterance is slow and costly","severity":"medium","mitigation":"A small, fast decision model that the user brings makes the check and wakes the agent only when it should act (dec-byo-decision-model); queued utterances go out together in one prompt (dec-agent-runner-delivery)"},"startLine":82,"endLine":87,"inArc42Fence":true},{"kind":"prose","text":"","line":89,"renderedHtml":""},{"kind":"heading","level":2,"text":"Loudspeakers instead of a headset","line":90},{"kind":"prose","text":"","line":91,"renderedHtml":"\u003cp>If someone uses loudspeakers, other people&#39;s voices end up in their transcript, and sentences\nappear twice.\u003c/p>\n"},{"kind":"prose","text":"If someone uses loudspeakers, other people's voices end up in their transcript, and sentences","line":92,"renderedHtml":""},{"kind":"prose","text":"appear twice.","line":93,"renderedHtml":""},{"kind":"prose","text":"","line":94,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-speaker-mode","title":"Echo and duplicates with loudspeakers","severity":"medium","mitigation":"Headset required (con-headset-only); echo cancellation, voice print and deduplication in issue #1"},"startLine":96,"endLine":101,"inArc42Fence":true},{"kind":"prose","text":"","line":103,"renderedHtml":""},{"kind":"heading","level":2,"text":"Maturity of Connect RPC","line":104},{"kind":"prose","text":"","line":105,"renderedHtml":"\u003cp>Connect RPC is a CNCF sandbox project. connect-go is stable. connect-python is still 0.x and was\nrenamed recently. connect-rust became an official\nimplementation in 2026-08; it passes the full conformance suite but is still 0.x. Few large\nadopters are publicly known.\u003c/p>\n"},{"kind":"prose","text":"Connect RPC is a CNCF sandbox project. connect-go is stable. connect-python is still 0.x and was","line":106,"renderedHtml":""},{"kind":"prose","text":"renamed recently. connect-rust became an official","line":107,"renderedHtml":""},{"kind":"prose","text":"implementation in 2026-08; it passes the full conformance suite but is still 0.x. Few large","line":108,"renderedHtml":""},{"kind":"prose","text":"adopters are publicly known.","line":109,"renderedHtml":""},{"kind":"prose","text":"","line":110,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-connect-maturity","title":"Connect RPC is not equally mature in all languages","severity":"medium","mitigation":"Use Go with the stable connect-go for all parts (dec-languages); keep the protocol code in one module of the shared core; the protocol is plain HTTP with JSON, so we could replace the library if needed"},"startLine":112,"endLine":117,"inArc42Fence":true},{"kind":"prose","text":"","line":119,"renderedHtml":""},{"kind":"heading","level":2,"text":"A changed session in the repository or in a peer copy","line":120},{"kind":"prose","text":"","line":121,"renderedHtml":"\u003cp>Someone with access to the Git repository could change a stored session, and a peer could change\nthe copy it supplies after a crash.\u003c/p>\n"},{"kind":"prose","text":"Someone with access to the Git repository could change a stored session, and a peer could change","line":122,"renderedHtml":""},{"kind":"prose","text":"the copy it supplies after a crash.","line":123,"renderedHtml":""},{"kind":"prose","text":"","line":124,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-forged-copy","title":"Forged session copies","severity":"high","mitigation":"Merkle tree with tree heads signed by the hub; the hub checks every peer copy, and every reader can check the repository (dec-merkle-log)"},"startLine":126,"endLine":131,"inArc42Fence":true},{"kind":"prose","text":"","line":133,"renderedHtml":""},{"kind":"heading","level":2,"text":"Writing to Git is slow","line":134},{"kind":"prose","text":"","line":135,"renderedHtml":"\u003cp>A Git commit takes noticeable time. If the session waited for it, every command would be slow, and\na slow repository could build up a queue.\u003c/p>\n"},{"kind":"prose","text":"A Git commit takes noticeable time. If the session waited for it, every command would be slow, and","line":136,"renderedHtml":""},{"kind":"prose","text":"a slow repository could build up a queue.","line":137,"renderedHtml":""},{"kind":"prose","text":"","line":138,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-archive-latency","title":"Slow writes to the archive hold up the session","severity":"medium","mitigation":"Writes run in the background with a configurable interval; at most one write in progress; later events go into the next write (dec-session-persistence)"},"startLine":140,"endLine":145,"inArc42Fence":true},{"kind":"prose","text":"","line":147,"renderedHtml":""},{"kind":"heading","level":2,"text":"An imported conversation is taken for a live one","line":148},{"kind":"prose","text":"","line":149,"renderedHtml":"\u003cp>The hub did not see an imported conversation happen. Its messages may be incomplete or made up,\nand the hub cannot check who said them. A reader who takes an imported session for a live one\ntrusts it more than it deserves.\u003c/p>\n"},{"kind":"prose","text":"The hub did not see an imported conversation happen. Its messages may be incomplete or made up,","line":150,"renderedHtml":""},{"kind":"prose","text":"and the hub cannot check who said them. A reader who takes an imported session for a live one","line":151,"renderedHtml":""},{"kind":"prose","text":"trusts it more than it deserves.","line":152,"renderedHtml":""},{"kind":"prose","text":"","line":153,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-imported-conversation","title":"An imported conversation is taken for a live session","severity":"medium","mitigation":"An imported session is marked by its first event, with its source and the participant who imported it; imported speakers have marked IDs; the signature over an imported log only proves who imported it and that it has not changed (dec-session-import); the stage names the source of an imported session and never shows it as live"},"startLine":155,"endLine":160,"inArc42Fence":true},{"kind":"prose","text":"","line":162,"renderedHtml":""}]},{"filePath":"docs/architecture/12-glossary.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Glossary","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"heading","level":2,"text":"Participant","line":3},{"kind":"prose","text":"","line":4,"renderedHtml":"\u003cp>The central role in the system. Humans and agents are treated the same way.\u003c/p>\n"},{"kind":"prose","text":"The central role in the system. Humans and agents are treated the same way.","line":5,"renderedHtml":""},{"kind":"prose","text":"","line":6,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-participant","title":"Participant","definition":"A human or an agent in a session, with an identity, a kind (human or agent) and roles"},"startLine":8,"endLine":12,"inArc42Fence":true},{"kind":"prose","text":"","line":14,"renderedHtml":""},{"kind":"heading","level":2,"text":"Session","line":15},{"kind":"prose","text":"","line":16,"renderedHtml":"\u003cp>The frame of one meeting in the office.\u003c/p>\n"},{"kind":"prose","text":"The frame of one meeting in the office.","line":17,"renderedHtml":""},{"kind":"prose","text":"","line":18,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-session","title":"Session","definition":"One meeting in the office, with its own event log, participants and stage"},"startLine":20,"endLine":24,"inArc42Fence":true},{"kind":"prose","text":"","line":26,"renderedHtml":""},{"kind":"heading","level":2,"text":"Session log","line":27},{"kind":"prose","text":"","line":28,"renderedHtml":"\u003cp>The shared source of truth of a session.\u003c/p>\n"},{"kind":"prose","text":"The shared source of truth of a session.","line":29,"renderedHtml":""},{"kind":"prose","text":"","line":30,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-session-log","title":"Session log","definition":"The append-only event log of a session; replicated locally as a JSONL file"},"startLine":32,"endLine":36,"inArc42Fence":true},{"kind":"prose","text":"","line":38,"renderedHtml":""},{"kind":"heading","level":2,"text":"Cursor","line":39},{"kind":"prose","text":"","line":40,"renderedHtml":"\u003cp>How a client knows where it stopped reading.\u003c/p>\n"},{"kind":"prose","text":"How a client knows where it stopped reading.","line":41,"renderedHtml":""},{"kind":"prose","text":"","line":42,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-cursor","title":"Cursor","definition":"The ID of the last event a client has read; used to resume after a drop"},"startLine":44,"endLine":48,"inArc42Fence":true},{"kind":"prose","text":"","line":50,"renderedHtml":""},{"kind":"heading","level":2,"text":"Utterance","line":51},{"kind":"prose","text":"","line":52,"renderedHtml":"\u003cp>The basic unit of what is said or written in the log.\u003c/p>\n"},{"kind":"prose","text":"The basic unit of what is said or written in the log.","line":53,"renderedHtml":""},{"kind":"prose","text":"","line":54,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-utterance","title":"Utterance","definition":"One finished contribution of a participant, spoken (voice) or written (text)"},"startLine":56,"endLine":60,"inArc42Fence":true},{"kind":"prose","text":"","line":62,"renderedHtml":""},{"kind":"heading","level":2,"text":"Raised hand","line":63},{"kind":"prose","text":"","line":64,"renderedHtml":"\u003cp>How participants, especially agents, ask to speak.\u003c/p>\n"},{"kind":"prose","text":"How participants, especially agents, ask to speak.","line":65,"renderedHtml":""},{"kind":"prose","text":"","line":66,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-hand-raise","title":"Raised hand","definition":"A signal on the stage that a participant wants to contribute; the moderator gives the floor"},"startLine":68,"endLine":72,"inArc42Fence":true},{"kind":"prose","text":"","line":74,"renderedHtml":""},{"kind":"heading","level":2,"text":"Stage","line":75},{"kind":"prose","text":"","line":76,"renderedHtml":"\u003cp>The visible presence of the office in the meeting.\u003c/p>\n"},{"kind":"prose","text":"The visible presence of the office in the meeting.","line":77,"renderedHtml":""},{"kind":"prose","text":"","line":78,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-stage","title":"Stage","definition":"The web view of a session (minutes, raised hands, artifacts, capture status), shown by screen share"},"startLine":80,"endLine":84,"inArc42Fence":true},{"kind":"prose","text":"","line":86,"renderedHtml":""},{"kind":"heading","level":2,"text":"Ears","line":87},{"kind":"prose","text":"","line":88,"renderedHtml":"\u003cp>The audio connector of the office.\u003c/p>\n"},{"kind":"prose","text":"The audio connector of the office.","line":89,"renderedHtml":""},{"kind":"prose","text":"","line":90,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-ears","title":"Ears","definition":"The local audio pipeline of a human (VAD, Whisper) that sends only text"},"startLine":92,"endLine":96,"inArc42Fence":true},{"kind":"prose","text":"","line":98,"renderedHtml":""},{"kind":"heading","level":2,"text":"Single ear","line":99},{"kind":"prose","text":"","line":100,"renderedHtml":"\u003cp>The listening mode of the first stage.\u003c/p>\n"},{"kind":"prose","text":"The listening mode of the first stage.","line":101,"renderedHtml":""},{"kind":"prose","text":"","line":102,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-single-ear","title":"Single ear","definition":"A listening mode in which only the owner of the device is transcribed"},"startLine":104,"endLine":108,"inArc42Fence":true},{"kind":"prose","text":"","line":110,"renderedHtml":""},{"kind":"heading","level":2,"text":"Room ear","line":111},{"kind":"prose","text":"","line":112,"renderedHtml":"\u003cp>A later extension for meeting rooms.\u003c/p>\n"},{"kind":"prose","text":"A later extension for meeting rooms.","line":113,"renderedHtml":""},{"kind":"prose","text":"","line":114,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-room-ear","title":"Room ear","definition":"A later listening mode for several speakers at one microphone, with speaker recognition"},"startLine":116,"endLine":120,"inArc42Fence":true},{"kind":"prose","text":"","line":122,"renderedHtml":""},{"kind":"heading","level":2,"text":"Artifact","line":123},{"kind":"prose","text":"","line":124,"renderedHtml":"\u003cp>The general word for what the stage shows. Each type of artifact has its own interface\n(\u003ccode>dec-records-per-type\u003c/code>); today slide decks are the only type.\u003c/p>\n"},{"kind":"prose","text":"The general word for what the stage shows. Each type of artifact has its own interface","line":125,"renderedHtml":""},{"kind":"prose","text":"(`dec-records-per-type`); today slide decks are the only type.","line":126,"renderedHtml":""},{"kind":"prose","text":"","line":127,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-artifact","title":"Artifact","definition":"Anything that the stage can show by an ID with its type in front, for example the slide deck slides/42"},"startLine":129,"endLine":133,"inArc42Fence":true},{"kind":"prose","text":"","line":135,"renderedHtml":""},{"kind":"heading","level":2,"text":"Slide deck","line":136},{"kind":"prose","text":"","line":137,"renderedHtml":"\u003cp>One type of record of the hub, and today the only type of artifact.\u003c/p>\n"},{"kind":"prose","text":"One type of record of the hub, and today the only type of artifact.","line":138,"renderedHtml":""},{"kind":"prose","text":"","line":139,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-slide-deck","title":"Slide deck","definition":"A set of slides (title, bullets, speaker notes) that the hub renders deterministically to one HTML document; the hub keeps its input and the rendered document in the archive"},"startLine":141,"endLine":145,"inArc42Fence":true},{"kind":"prose","text":"","line":147,"renderedHtml":""},{"kind":"heading","level":2,"text":"Record","line":148},{"kind":"prose","text":"","line":149,"renderedHtml":"\u003cp>What the hub keeps for the team, one type per interface (\u003ccode>dec-records-per-type\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"What the hub keeps for the team, one type per interface (`dec-records-per-type`).","line":150,"renderedHtml":""},{"kind":"prose","text":"","line":151,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-record","title":"Record","definition":"A decision, the minutes of a session or a note that the hub stores in the archive, with its author and whether the author is a human or an agent; it replaces the earlier journal entry"},"startLine":153,"endLine":157,"inArc42Fence":true},{"kind":"prose","text":"","line":159,"renderedHtml":""},{"kind":"heading","level":2,"text":"Task","line":160},{"kind":"prose","text":"","line":161,"renderedHtml":"\u003cp>A work item of the team (\u003ccode>dec-records-per-type\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"A work item of the team (`dec-records-per-type`).","line":162,"renderedHtml":""},{"kind":"prose","text":"","line":163,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-task","title":"Task","definition":"A work item with a title, a description, an assignee, a status (open, in progress, done or cancelled) and an optional link to a session; for now a local draft that the hub stores in the archive, later synced with the task tool of the team"},"startLine":165,"endLine":169,"inArc42Fence":true},{"kind":"prose","text":"","line":171,"renderedHtml":""},{"kind":"heading","level":2,"text":"Task reference","line":172},{"kind":"prose","text":"","line":173,"renderedHtml":"\u003cp>How clients name a task.\u003c/p>\n"},{"kind":"prose","text":"How clients name a task.","line":174,"renderedHtml":""},{"kind":"prose","text":"","line":175,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-task-reference","title":"Task reference","definition":"The stable name of a task, a text with a scheme such as local:42 for a draft of the hub or github:owner/repo#12 for an issue; clients keep it and pass it back but never build or read its parts"},"startLine":177,"endLine":181,"inArc42Fence":true},{"kind":"prose","text":"","line":183,"renderedHtml":""},{"kind":"heading","level":2,"text":"Actor","line":184},{"kind":"prose","text":"","line":185,"renderedHtml":"\u003cp>Who authenticates against the office.\u003c/p>\n"},{"kind":"prose","text":"Who authenticates against the office.","line":186,"renderedHtml":""},{"kind":"prose","text":"","line":187,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-actor","title":"Actor","definition":"A participant with its own key pair; every human device and every agent is one actor"},"startLine":189,"endLine":193,"inArc42Fence":true},{"kind":"prose","text":"","line":195,"renderedHtml":""},{"kind":"heading","level":2,"text":"Agent harness","line":196},{"kind":"prose","text":"","line":197,"renderedHtml":"\u003cp>The program in which an agent runs and that holds its conversation with a model, for example\nClaude Code, opencode or Kiro. We say &quot;harness&quot; and not &quot;agent&quot; when we mean the program that the\nagent runner starts.\u003c/p>\n"},{"kind":"prose","text":"The program in which an agent runs and that holds its conversation with a model, for example","line":198,"renderedHtml":""},{"kind":"prose","text":"Claude Code, opencode or Kiro. We say \"harness\" and not \"agent\" when we mean the program that the","line":199,"renderedHtml":""},{"kind":"prose","text":"agent runner starts.","line":200,"renderedHtml":""},{"kind":"prose","text":"","line":201,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-agent-harness","title":"Agent harness","definition":"The program that runs an agent and its model, for example Claude Code, opencode or Kiro; the agent runner starts it and talks to it over ACP"},"startLine":203,"endLine":207,"inArc42Fence":true},{"kind":"prose","text":"","line":209,"renderedHtml":""},{"kind":"heading","level":2,"text":"Agent runner","line":210},{"kind":"prose","text":"","line":211,"renderedHtml":"\u003cp>The part of the participant client that keeps an agent in a meeting (\u003ccode>bb-agent-runner\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"The part of the participant client that keeps an agent in a meeting (`bb-agent-runner`).","line":212,"renderedHtml":""},{"kind":"prose","text":"","line":213,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-agent-runner","title":"Agent runner","definition":"The part of the client that follows the local log for an agent and starts the agent's turns in its harness over ACP, when the check after an utterance says it should act"},"startLine":215,"endLine":219,"inArc42Fence":true},{"kind":"prose","text":"","line":221,"renderedHtml":""},{"kind":"heading","level":2,"text":"Agent Client Protocol (ACP)","line":222},{"kind":"prose","text":"","line":223,"renderedHtml":"\u003cp>An open protocol between a client and a coding agent, published at agentclientprotocol.com. The\nclient starts the agent and talks JSON-RPC with it over standard input and output.\u003c/p>\n"},{"kind":"prose","text":"An open protocol between a client and a coding agent, published at agentclientprotocol.com. The","line":224,"renderedHtml":""},{"kind":"prose","text":"client starts the agent and talks JSON-RPC with it over standard input and output.","line":225,"renderedHtml":""},{"kind":"prose","text":"","line":226,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-acp","title":"Agent Client Protocol (ACP)","definition":"An open JSON-RPC protocol over standard input and output between a client, here the agent runner, and an agent harness"},"startLine":228,"endLine":232,"inArc42Fence":true},{"kind":"prose","text":"","line":234,"renderedHtml":""},{"kind":"heading","level":2,"text":"Decision model","line":235},{"kind":"prose","text":"","line":236,"renderedHtml":"\u003cp>A model that the user brings for the agent runner (\u003ccode>dec-byo-decision-model\u003c/code>). It is not the agent:\nit only decides whether the agent should be woken.\u003c/p>\n"},{"kind":"prose","text":"A model that the user brings for the agent runner (`dec-byo-decision-model`). It is not the agent:","line":237,"renderedHtml":""},{"kind":"prose","text":"it only decides whether the agent should be woken.","line":238,"renderedHtml":""},{"kind":"prose","text":"","line":239,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-decision-model","title":"Decision model","definition":"A model that the user brings and that tells the agent runner after each utterance whether the agent should act and whether a block of topics has ended"},"startLine":241,"endLine":245,"inArc42Fence":true},{"kind":"prose","text":"","line":247,"renderedHtml":""},{"kind":"heading","level":2,"text":"Off the record","line":248},{"kind":"prose","text":"","line":249,"renderedHtml":"\u003cp>A later mark on an own sentence.\u003c/p>\n"},{"kind":"prose","text":"A later mark on an own sentence.","line":250,"renderedHtml":""},{"kind":"prose","text":"","line":251,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-off-the-record","title":"Off the record","definition":"A mark that the speaker puts on their own utterance after it was said; the interfaces then deliver it only as a placeholder without its text"},"startLine":253,"endLine":257,"inArc42Fence":true},{"kind":"prose","text":"","line":259,"renderedHtml":""},{"kind":"heading","level":2,"text":"Peer","line":260},{"kin ading","level":2,"text":"Imported session","line":297},{"kind":"prose","text":"","line":298,"renderedHtml":"\u003cp>A session that was not held in the office.\u003c/p>\n"},{"kind":"prose","text":"A session that was not held in the office.","line":299,"renderedHtml":""},{"kind":"prose","text":"","line":300,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-imported-session","title":"Imported session","definition":"A session whose log starts with a conversation that happened outside the office and that a participant imported; its first event marks it as imported and names the source"},"startLine":302,"endLine":306,"inArc42Fence":true},{"kind":"prose","text":"","line":308,"renderedHtml":""}]}],"ignoreDirectives":[{"ruleCode":"H020","reason":"Commands and stream are two contracts of one Connect service; they share its package","file":"docs/architecture/05-building-blocks.arc42.md","line":110,"used":false},{"ruleCode":"H020","reason":"The local log is a file for actors, replication control is an in-process call; both are realized by the replicator","file":"docs/architecture/05-building-blocks.arc42.md","line":827,"used":false}],"coverage":{"covered":[{"path":"client","claimedBy":[{"id":"bb-participant-client","path":"client","kind":"building-block"}],"overlapping":false},{"path":"client/replicator","claimedBy":[{"id":"bb-participant-client","path":"client","kind":"building-block"},{"id":"bb-replicator","path":"client/replicator","kind":"building-block"},{"id":"if-local-log","path":"client/replicator","kind":"interface"},{"id":"if-replication","path":"client/replicator","kind":"interface"}],"overlapping":true},{"path":"hub","claimedBy":[{"id":"bb-office-hub","path":"hub","kind":"building-block"}],"overlapping":false},{"path":"hub/session/api","claimedBy":[{"id":"bb-office-hub","path":"hub","kind":"building-block"},{"id":"bb-session-service","path":"hub/session","kind":"building-block"},{"id":"if-session-commands","path":"hub/session/ap  with \u003ccode>--mic\u003c/code>. Pipeline: microphone → VAD → Whisper (local) → utterances to the\nsession. The first stage needs a headset and has no voice print and no echo cancellation\n(\u003ccode>con-headset-only\u003c/code>). Raw audio never leaves the device. During a network drop, the ears keep\ntranscribing and queue the utterances locally. They send them in order once the connection is back.\u003c/p>\n"},{"kind":"prose","text":"Only for humans with `--mic`. Pipeline: microphone → VAD → Whisper (local) → utterances to the","line":839,"renderedHtml":""},{"kind":"prose","text":"session. The first stage needs a headset and has no voice print and no echo cancellation","line":840,"renderedHtml":""},{"kind":"prose","text":"(`con-headset-only`). Raw audio never leaves the device. During a network drop, the ears keep","line":841,"renderedHtml":""},{"kind":"prose","text":"transcribing and queue the utterances locally. They send them in order once the connection is back.","line":842,"renderedHtml":""},{"kind":"prose","text":"","line":843,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-ears","title":"Ears","parent":"bb-participant-client","technology":"Go / whisper.cpp, including its voice activity detection","requires":"if-client-core, if-session-commands","implements":"concept-edge-transcription, concept-test-strategy","path":"client/ears"},"startLine":845,"endLine":853,"inArc42Fence":true},{"kind":"prose","text":"","line":855,"renderedHtml":""},{"kind":"prose","text":"","line":856,"renderedHtml":""}],"elements":[{"id":"bb-ears","title":"Ears","technology":"Go / whisper.cpp, including its voice activity detection","parent":"bb-participant-client","path":"client/ears","implements":["concept-edge-transcription","concept-test-strategy"],"requires":["if-client-core","if-session-commands"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":845,"heading":"Ears","prose":"\nOnly for humans with `--mic`. Pipeline: microphone → VAD → Whisper (local) → utterances to the\nsession. The first stage needs a headset and has no voice print and no echo cancellation\n(`con-headset-only`). Raw audio never leaves the device. During a network drop, the ears keep\ntranscribing and queue the utterances locally. They send them in order once the connection is back.\n"}},{"id":"bb-participant-client","title":"Participant client","technology":"Go (one binary)","path":"client","implements":["concept-participant-model","concept-read-file-write-tools","concept-module-boundaries"],"requires":[],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":520,"heading":"Participant client","prose":"\nRuns locally on every participant's computer and is the same for humans and agents. It contains\nthe CLI, the MCP server, the log replicator, the agent runner and, optionally, the ears. Unlike the\nhub, the client may contain models (`dec-models-in-client`): the speech model of the ears, and a\ndecision model that the user brings for the agent runner.\n"}},{"id":"concept-edge-transcription","title":"Local transcription; only text leaves the device","category":"privacy","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":119,"heading":"Transcription at the edge","prose":"\nEach human transcribes only themselves, locally. Raw audio never leaves the device. Only text and\nmetadata are sent. With a headset, the single ear comes for free. Use with loudspeakers (echo\ncancellation, voice print) and the room ear (speaker recognition) come later. Voice prints are\nbiometric data (Art. 9 GDPR) and need explicit consent.\n"}},{"id":"concept-test-strategy","title":"Test strategy for the audio pipeline","category":"testing","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":199,"heading":"Test strategy","prose":"\n**No unit tests.** Every building block is tested as a black box through its interfaces\n(`con-no-unit-tests`, `con-contract-tests`). The interfaces in chapter 5 are the contracts.\n\n**Automated end-to-end tests** run on a host without a microphone. They feed a recorded\nWAV file through the ears in real time. This covers the whole pipeline after audio capture: voice\nactivity detection, Whisper, submitting the utterance, the session log and the local copy. The\ntests also cover resume after the replicator is killed.\n\n**End-to-end tests never check performance.** They check behaviour only: no audio leaves the\ndevice, no event is lost or duplicated, the status of a sentence becomes visible. They pass on any\nhost that runs the system. **Performance tests** are separate. They check the timing criteria of\nthe quality scenarios (chapter 10) with their full lengths and run on the reference host.\n\n**Architecture test.** A test checks the code against this model on every run of the tests (see\n`concept-module-boundaries`).\n\n**Manual tests** cover what a WAV file cannot: real audio capture from a device and Whisper\naccuracy on real speech. A person joins with a headset on a participant laptop and speaks a few\nsentences. We do this before we judge recognition quality, because the test WAV is synthetic and\ncleaner than a headset in a meeting.\n\n**Not planned:** a virtual microphone on the hub host. It needs administrator rights and adds\nlittle.\n"}},{"id":"dn-participant-laptop","title":"Participant computer","type":"device","hosts":["bb-cli","bb-client-core","bb-replicator","bb-ears"],"parent":"env-mvp","kind":"deployment-node","loc":{"file":"docs/architecture/07-deployment-view.arc42.md","line":62,"heading":"Participant computer","prose":"\nThe laptop of a human with a headset. It runs the CLI, the log replicator and the ears with local\nWhisper. The client comes as a ready binary for Linux and macOS. It chooses its speech model by\nthe spoken language and by whether its build can use a GPU, downloads it once, on first use, and\nchecks it (`dec-model-download`). OPEN: minimum hardware for real-time Whisper with the large\nmodels.\n"}},{"id":"if-client-core","title":"Client core API","provider":"bb-client-core","protocol":"In-process Go call","path":"client/core","kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":707,"heading":"Client core API","prose":"\nThe in-process interface of the client core for the adapters: configuration, authenticated\nclients of the office hub, command IDs and the commands of a participant.\n"}},{"id":"if-session-commands","title":"Session commands","provider":"bb-office-hub","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/session/api","extensions":{"realized-by":"bb-session-service"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":111,"heading":"Session commands","prose":"\nSynchronous calls that answer at once: `join`, `leave`, `utterance.submit`, `utterance.mark_off_the_record`,\n`pause`, `hand.raise`, `minutes.update`, `stage.show`. Each successful call creates one event in the\nlog. Each call carries an ID created by the client, so a repeated call has no extra effect.\n\nThe session commands also let anyone with a token check a session log (`dec-merkle-log`): they\nreturn the signed tree head of a log (for the current log or for its first events), a\nconsistency proof between two sizes, an inclusion proof for one event, and the public key of the\nhub that signs the tree heads. The verification code for clients belongs to this interface,\nbecause the interface owns the event types.\n\nAfter a restart, a peer offers its copy of a session log with one more command\n(`dec-restore-from-peers`): the events the hub misses and a tree head signed by the hub over the\ncopy. The hub accepts the copy only if it verifies and extends its own log. A copy that is not\nlonger has no effect, and a copy that does not verify or forks fails.\n"}},{"id":"rs-authenticate","title":"Participant authenticates with its key","involves":["bb-cli","bb-mcp","bb-ears","bb-client-core","bb-identity","bb-session-service","bb-participant-client","bb-office-hub"],"trigger":"First call of a client, or the access token is about to expire","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":132,"heading":"Participant authenticates","prose":"\nBefore its first call, a client (CLI, MCP server or ears) asks Identity for a challenge. It signs\nthe challenge with its private key and gets a short-lived access token. It sends the token with\nevery call. The session checks the token and knows the participant. Shortly before the token\nexpires, the client repeats the steps. This also happens after a network drop.\n"}},{"id":"rs-human-speaks","title":"Human speaks, agent receives the sentence","involves":["bb-ears","bb-client-core","bb-session-service","bb-replicator","bb-cli","bb-participant-client","bb-office-hub"],"trigger":"End of sentence (VAD pause) in the headset signal","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":50,"heading":"Human speaks","prose":"\nA human joined with `--mic`. The ears detect the end of a sentence, Whisper transcribes it locally,\nand the utterance is sent. The session appends it to the log. Every replicator writes it to its\nlocal file. The speaker's terminal shows the status \"sent\".\n"}},{"id":"rs-network-drop","title":"Network drop and resume","involves":["bb-ears","bb-session-service","bb-replicator","bb-participant-client","bb-office-hub"],"trigger":"Network connection of a participant is lost and comes back","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":92,"heading":"Network drop and resume","prose":"\nThe network of a participant drops for a while. The ears keep transcribing and queue utterances\nlocally. The replicator loses the stream. When the network is back, the ears send the queued\nutterances in order. Each one carries its client ID, so nothing is stored twice. The replicator\nreconnects with the ID of its last line and receives everything it missed.\n"}}],"edges":[{"from":"bb-ears","to":"bb-participant-client","relation":"parent"},{"from":"bb-ears","to":"concept-edge-transcription","relation":"implements"},{"from":"bb-ears","to":"concept-test-strategy","relation":"implements"},{"from":"bb-ears","to":"if-client-core","relation":"requires"},{"from":"bb-ears","to":"if-session-commands","relation":"requires"},{"from":"rs-human-speaks","to":"bb-ears","relation":"involves"},{"from":"rs-network-drop","to":"bb-ears","relation":"involves"},{"from":"rs-authenticate","to":"bb-ears","relation":"involves"},{"from":"dn-participant-laptop","to":"bb-ears","relation":"hosts"}]},"head":{"nodes":[{"kind":"heading","level":3,"text":"Ears","line":837},{"kind":"prose","text":"","line":838,"renderedHtml":"\u003cp>Only for humans with \u003ccode>--mic\u003c/code>. Pipeline: microphone → VAD → Whisper (local) → utterances to the\nsession. The first stage needs a headset and has no voice print and no echo cancellation\n(\u003ccode>con-headset-only\u003c/code>). Raw audio never leaves the device. During a network drop, the ears keep\ntranscribing and queue the utterances locally. They send them in order once the connection is back.\nThe ears choose their speech model by language and speed (\u003ccode>dec-model-download\u003c/code>). They give Whisper\nthe vocabulary of the project and the names of the participants as a prompt\n(\u003ccode>dec-vocabulary-prompt\u003c/code>); the CLI reads the names from the local log and passes them on.\u003c/p>\n"},{"kind":"prose","text":"Only for humans with `--mic`. Pipeline: microphone → VAD → Whisper (local) → utterances to the","line":839,"renderedHtml":""},{"kind":"prose","text":"session. The first stage needs a headset and has no voice print and no echo cancellation","line":840,"renderedHtml":""},{"kind":"prose","text":"(`con-headset-only`). Raw audio never leaves the devi .\nThe ears choose their speech model by language and speed (`dec-model-download`). They give Whisper\nthe vocabulary of the project and the names of the participants as a prompt\n(`dec-vocabulary-prompt`); the CLI reads the names from the local log and passes them on.\n"}},{"id":"bb-participant-client","title":"Participant client","technology":"Go (one binary)","path":"client","implements":["concept-participant-model","concept-read-file-write-tools","concept-module-boundaries"],"requires":[],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":520,"heading":"Participant client","prose":"\nRuns locally on every participant's computer and is the same for humans and agents. It contains\nthe CLI, the MCP server, the log replicator, the agent runner and, optionally, the ears. Unlike the\nhub, the client may contain models (`dec-models-in-client`): the speech model of the ears, and a\ndecision model that the user brings for the agent runner.\n"}},{"id":"concept-edge-transcription","title":"Local transcription; only text leaves the device","category":"privacy","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":119,"heading":"Transcription at the edge","prose":"\nEach human transcribes only themselves, locally. Raw audio never leaves the device. Only text and\nmetadata are sent. With a headset, the single ear comes for free. Use with loudspeakers (echo\ncancellation, voice print) and the room ear (speaker recognition) come later. Voice prints are\nbiometric data (Art. 9 GDPR) and need explicit consent.\n"}},{"id":"concept-test-strategy","title":"Test strategy for the audio pipeline","category":"testing","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":199,"heading":"Test strategy","prose":"\n**No unit tests.** Every building block is tested as a black box through its interfaces\n(`con-no-unit-tests`, `con-contract-tests`). The interfaces in chapter 5 are the contracts.\n\n**Automated end-to-end tests** run on a host without a microphone. They feed a recorded\nWAV file through the ears in real time. This covers the whole pipeline after audio capture: voice\nactivity detection, Whisper, submitting the utterance, the session log and the local copy. The\ntests also cover resume after the replicator is killed.\n\n**End-to-end tests never check performance.** They check behaviour only: no audio leaves the\ndevice, no event is lost or duplicated, the status of a sentence becomes visible. They pass on any\nhost that runs the system. **Performance tests** are separate. They check the timing criteria of\nthe quality scenarios (chapter 10) with their full lengths and run on the reference host.\n\n**Architecture test.** A test checks the code against this model on every run of the tests (see\n`concept-module-boundaries`).\n\n**Manual tests** cover what a WAV file cannot: real audio capture from a device and Whisper\naccuracy on real speech. A person joins with a headset on a participant laptop and speaks a few\nsentences. We do this before we judge recognition quality, because the test WAV is synthetic and\ncleaner than a headset in a meeting.\n\n**Not planned:** a virtual microphone on the hub host. It needs administrator rights and adds\nlittle.\n"}},{"id":"dn-participant-laptop","title":"Participant computer","type":"device","hosts":["bb-cli","bb-client-core","bb-replicator","bb-ears"],"parent":"env-mvp","kind":"deployment-node","loc":{"file":"docs/architecture/07-deployment-view.arc42.md","line":62,"heading":"Participant computer","prose":"\nThe laptop of a human with a headset. It runs the CLI, the log replicator and the ears with local\nWhisper. The client comes as a ready binary for Linux and macOS. It chooses its speech model by\nthe spoken language and by whether its build can use a GPU, downloads it once, on first use, and\nchecks it (`dec-model-download`). OPEN: minimum hardware for real-time Whisper with the large\nmodels.\n"}},{"id":"if-client-core","title":"Client core API","provider":"bb-client-core","protocol":"In-process Go call","path":"client/core","kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":707,"heading":"Client core API","prose":"\nThe in-process interface of the client core for the adapters: configuration, authenticated\nclients of the office hub, command IDs and the commands of a participant.\n"}},{"id":"if-session-commands","title":"Session commands","provider":"bb-office-hub","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/session/api","extensions":{"realized-by":"bb-session-service"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":111,"heading":"Session commands","prose":"\nSynchronous calls that answer at once: `join`, `leave`, `utterance.submit`, `utterance.mark_off_the_record`,\n`pause`, `hand.raise`, `minutes.update`, `stage.show`. Each successful call creates one event in the\nlog. Each call carries an ID created by the client, so a repeated call has no extra effect.\n\nThe session commands also let anyone with a token check a session log (`dec-merkle-log`): they\nreturn the signed tree head of a log (for the current log or for its first events), a\nconsistency proof between two sizes, an inclusion proof for one event, and the public key of the\nhub that signs the tree heads. The verification code for clients belongs to this interface,\nbecause the interface owns the event types.\n\nAfter a restart, a peer offers its copy of a session log with one more command\n(`dec-restore-from-peers`): the events the hub misses and a tree head signed by the hub over the\ncopy. The hub accepts the copy only if it verifies and extends its own log. A copy that is not\nlonger has no effect, and a copy that does not verify or forks fails.\n"}},{"id":"rs-authenticate","title":"Participant authenticates with its key","involves":["bb-cli","bb-mcp","bb-ears","bb-client-core","bb-identity","bb-session-service","bb-participant-client","bb-office-hub"],"trigger":"First call of a client, or the access token is about to expire","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":132,"heading":"Participant authenticates","prose":"\nBefore its first call, a client (CLI, MCP server or ears) asks Identity for a challenge. It signs\nthe challenge with its private key and gets a short-lived access token. It sends the token with\nevery call. The session checks the token and knows the participant. Shortly before the token\nexpires, the client repeats the steps. This also happens after a network drop.\n"}},{"id":"rs-human-speaks","title":"Human speaks, agent receives the sentence","involves":["bb-ears","bb-client-core","bb-session-service","bb-replicator","bb-cli","bb-participant-client","bb-office-hub"],"trigger":"End of sentence (VAD pause) in the headset signal","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":50,"heading":"Human speaks","prose":"\nA human joined with `--mic`. The ears detect the end of a sentence, Whisper transcribes it locally,\nand the utterance is sent. The session appends it to the log. Every replicator writes it to its\nlocal file. The speaker's terminal shows the status \"sent\".\n"}},{"id":"rs-network-drop","title":"Network drop and resume","involves":["bb-ears","bb-session-service","bb-replicator","bb-participant-client","bb-office-hub"],"trigger":"Network connection of a participant is lost and comes back","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":92,"heading":"Network drop and resume","prose":"\nThe network of a participant drops for a while. The ears keep transcribing and queue utterances\nlocally. The replicator loses the stream. When the network is back, the ears send the queued\nutterances in order. Each one carries its client ID, so nothing is stored twice. The replicator\nreconnects with the ID of its last line and receives everything it missed.\n"}}],"edges":[{"from":"bb-ears","to":"bb-participant-client","relation":"parent"},{"from":"bb-ears","to":"concept-edge-transcription","relation":"implements"},{"from":"bb-ears","to":"concept-test-strategy","relation":"implements"},{"from":"bb-ears","to":"if-client-core","relation":"requires"},{"from":"bb-ears","to":"if-session-commands","relation":"requires"},{"from":"rs-human-speaks","to":"bb-ears","relation":"involves"},{"from":"rs-network-drop","to":"bb-ears","relation":"involves"},{"from":"rs-authenticate","to":"bb-ears","relation":"involves"},{"from":"dn-participant-laptop","to":"bb-ears","relation":"hosts"}]},"elements":[{"id":"bb-ears","kind":"building-block","status":"unchanged","attributes":[],"proseChanged":true,"proseMentions":[],"base":{"file":"docs/architecture/05-building-blocks.arc42.md","line":845},"head":{"file":"docs/architecture/05-building-blocks.arc42.md","line":848},"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Participant client","Ears"],"occurrence":1}}],"diagrams":[]}],"outline":[{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View"],"occurrence":1},"level":1,"title":"Building Block View","status":"unchanged","empty":false,"head":{"startLine":1,"endLine":11}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Overview"],"occurrence":1},"level":2,"title":"Overview","status":"unchanged","empty":false,"head":{"startLine":12,"endLine":38}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Office hub"],"occurrence":1},"level":2,"title":"Office hub","status":"unchanged","empty":false,"head":{"startLine":39,"endLine":91}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Office hub","Session commands"],"occurrence":1},"level":3,"title":"Session com adingPath":["Building Block View","Participant client","Agent Client Protocol (client side)"],"occurrence":1},"level":3,"title":"Agent Client Protocol (client side)","status":"unchanged","empty":false,"head":{"startLine":627,"endLine":652}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Participant client","Decision model"],"occurrence":1},"level":3,"title":"Decision model","status":"unchanged","empty":false,"head":{"startLine":653,"endLine":680}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Participant client","Client core"],"occurrence":1},"level":3,"title":"Client core","status":"unchanged","empty":false,"head":{"startLine":681,"endLine":700}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Participant client","Client core","Client core API"],"occurrence":1},"level":4,"title":"Client core API","status":"unchanged","empty":false,"head":{"startLine":701,"endLine":715}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Participant client","office CLI"],"occurrence":1},"level":3,"title":"office CLI","status":"unchanged","empty":false,"head":{"startLine":716,"endLine":737}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Participant client","MCP server"],"occurrence":1},"level":3,"title":"MCP server","status":"unchanged","empty":false,"head":{"startLine":738,"endLine":755}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Participant client","Agent runner"],"occurrence":1},"level":3,"title":"Agent runner","status":"unchanged","empty":false,"head":{"startLine":756,"endLine":792}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Participant client","Log replicator"],"occurrence":1},"level":3,"title":"Log replicator","status":"unchanged","empty":false,"head":{"startLine":793,"endLine":819}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Participant client","Log replicator","Replication control"],"occurrence":1},"level":4,"title":"Replication control","status":"unchanged","empty":false,"head":{"startLine":820,"endLine":836}},{"section":{"file":"docs/architecture/05-building-blocks.arc42.md","headingPath":["Building Block View","Participant client","Ears"],"occurrence":1},"level":3,"title":"Ears","status":"modified","empty":false,"head":{"startLine":837,"endLine":9007199254740991}}]},{"file":"docs/architecture/09-decisions.arc42.md","title":"Architecture Decisions","added":1,"modified":0,"removed":0,"segments":[{"status":"added","section":{"file":"docs/architecture/09-decisions.arc42.md","headingPath":["Architecture Decisions","The ears give Whisper the vocabulary of the project and the names of the participants"],"occurrence":1},"head":{"nodes":[{"kind":"heading","level":2,"text":"The ears give Whisper the vocabulary of the project and the names of the participants","line":889},{"kind":"prose","text":"","line":890,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Whisper often misspells names and terms of a project, for example product names,\nabbreviations and the names of the people in the meeting. These words matter most in minutes and\ntasks. Whisper accepts a short text as a prompt before each sentence and then prefers its words\nand spellings. The prompt is short: Whisper keeps only the last part of a long one.\n\u003cstrong>Decision:\u003c/strong> The ears build the prompt from two sources: a vocabulary file of the project in the\nworking directory of the client (or a file the participant names), then the display names of the\nparticipants of the session, which the client knows from its local log. The terms keep their\norder in the file; the names follow. What does not fit is cut at the end, so the first terms of\nthe file always count. The ears report how many terms and names they use and how many they cut.\nThe previous sentence as additional context is an option and off by default, because nobody has\nmeasured yet whether it helps. \u003cstrong>Consequences:\u003c/strong> A team improves the transcription by writing a\nplain text file; no model is trained. The vocabulary and the names stay on the device like the\naudio (\u003ccode>concept-edge-transcription\u003c/code>). A wrong or very long vocabulary can make Whisper write a\nterm that was not said. OPEN: the effect on the error rate is not measured; a measurement corpus\nis out of scope of the epic (#66). \u003cstrong>Rejected:\u003c/strong> fine-tuning a model per team (training data and\ncompute that a team does not have); correcting the text after Whisper (it cannot recover a word\nthat Whisper did not hear as such).\u003c/p>\n"},{"kind":"prose","text":"**Context:** Whisper often misspells names and terms of a project, for example product names,","line":891,"renderedHtml":""},{"kind":"prose","text":"abbreviations and the names of the people in the meeting. These words matter most in minutes and","line":892,"renderedHtml":""},{"kind":"prose","text":"tasks. Whisper accepts a short text as a prompt before each sentence and then prefers its words","line":893,"renderedHtml":""},{"kind":"prose","text":"and spellings. The prompt is short: Whisper keeps only the last part of a long one.","line":894,"renderedHtml":""},{"kind":"prose","text":"**Decision:** The ears build the prompt from two sources: a vocabulary file of the project in the","line":895,"renderedHtml":""},{"kind":"prose","text":"working directory of the client (or a file the participant names), then the display names of the","line":896,"renderedHtml":""},{"kind":"prose","text":"participants of the session, which the client knows from its local log. The terms keep their","line":897,"renderedHtml":""},{"kind":"prose", ","status":"proposed","date":"2026-11-11","addresses":["qg-usability","qg-confidentiality"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":910,"heading":"The ears give Whisper the vocabulary of the project and the names of the participants","prose":"\n**Context:** Whisper often misspells names and terms of a project, for example product names,\nabbreviations and the names of the people in the meeting. These words matter most in minutes and\ntasks. Whisper accepts a short text as a prompt before each sentence and then prefers its words\nand spellings. The prompt is short: Whisper keeps only the last part of a long one.\n**Decision:** The ears build the prompt from two sources: a vocabulary file of the project in the\nworking directory of the client (or a file the participant names), then the display names of the\nparticipants of the session, which the client knows from its local log. The terms keep their\norder in the file; the names follow. What does not fit is cut at the end, so the first terms of\nthe file always count. The ears report how many terms and names they use and how many they cut.\nThe previous sentence as additional context is an option and off by default, because nobody has\nmeasured yet whether it helps. **Consequences:** A team improves the transcription by writing a\nplain text file; no model is trained. The vocabulary and the names stay on the device like the\naudio (`concept-edge-transcription`). A wrong or very long vocabulary can make Whisper write a\nterm that was not said. OPEN: the effect on the error rate is not measured; a measurement corpus\nis out of scope of the epic (#66). **Rejected:** fine-tuning a model per team (training data and\ncompute that a team does not have); correcting the text after Whisper (it cannot recover a word\nthat Whisper did not hear as such).\n"}},{"id":"qg-confidentiality","title":"Confidentiality","priority":"high","kind":"quality-goal","loc":{"file":"docs/architecture/10-quali
