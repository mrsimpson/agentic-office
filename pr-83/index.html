ssion stream also answers a one-time request: \"give me the\nevents after cursor N\". The hub is the only writer of a session log and gives every event an\nID that grows by one, so the order is free of conflicts and a gap is visible from the IDs alone.\nA participant polls this request when it finds a gap, or instead of a local file. No event needs\nthe ID of its predecessor. **Consequences:** Agents without a file system can take part by\npolling. A suppressed utterance must keep its ID (`dec-off-the-record`). If the hub loses a\nlog, it restores it from the archive and the peers, so cursors stay valid\n(`dec-restore-from-peers`). **Rejected:** a long-poll tool only for MCP; a predecessor ID in every event (not needed with a\nsingle writer).\n"}},{"id":"dec-gateway-cli","title":"Gateway as a CLI","status":"accepted","date":"2026-11-06","addresses":["qg-usability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":250,"heading":"Gateway as a CLI","prose":"\n**Decision:** At first, the gateway is a CLI. It shows what was recorded and sent, and it lets the\nuser pause and mark a sentence off the record. **Consequences:** There is no separate user interface. The display is a\nfiltered view of the local log.\n"}},{"id":"dec-headless-byoa","title":"Headless office, bring your own agent","status":"accepted","date":"2026-11-06","addresses":["con-no-intelligence"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":14,"heading":"Headless, no intelligence in the application","prose":"\n**Context:** Agents improve fast, and every team uses different ones. **Decision:** The application\nonly exposes APIs (MCP, CLI) and media connectors. The agent makes the judgements.\n**Consequences:** The hub stays deterministic and testable. Features that need judgement do not\nbelong in the hub (`dec-models-in-client`).\n"}},{"id":"dec-hub-signing-key","title":"The signing key is given to the hub at start","status":"accepted","date":"2026-11-07","addresses":["risk-forged-copy","qg-confidentiality"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":706,"heading":"The signing key of the hub is given at start","prose":"\n**Context:** The hub signs tree heads. Clients and readers of the archive trust these signatures.\nA key that the hub creates by itself on first start is easy to lose or replace without anyone\nnoticing. **Decision:** The operator gives the hub its signing key when the hub starts, at first\nas the name of a key file on the command line. The hub does not create a signing key by itself\nand does not start without one. **Consequences:** The operator controls the key and can keep it\nwith other secrets. Replacing the key is a deliberate act. OPEN: how clients pin the public key\nof the hub (#41). **Rejected:** a key that the hub creates in its data directory.\n"}},{"id":"dec-idempotent-commands","title":"Idempotent commands with client-generated IDs","status":"accepted","date":"2026-11-06","addresses":["qg-resumability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":337,"heading":"Idempotent commands with client IDs","prose":"\n**Context:** After a network drop, a client does not know if its last command arrived.\n**Decision:** Every command carries an ID that the client creates. The IDs are unique and sortable\nby time. The hub stores the ID with the event. If the same ID arrives again, the hub returns\nthe existing event and creates no new one. This also applies to `join`: the client keeps its join\ncommand ID, so a restarted client stays the same participant. **Consequences:** Clients can simply\nrepeat commands after a drop. The hub must keep the IDs at least for the life of the session.\nThe spike confirmed this: 0 lost and 0 duplicate events while the replicator was killed three\ntimes.\n"}},{"id":"dec-import-format","title":"An own JSON format for imported conversations, read by the client","status":"proposed","date":"2026-11-07","addresses":["qg-usability","con-no-intelligence"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":841,"heading":"An own JSON format for imported conversations, read by the client","prose":"\n**Context:** Conversations come from many tools, each with its own export. The import interface\nshould not change with every new tool. **Decision:** The first import format is our own: one JSON\ndocument per conversation with its title, its source, its participants and its utterances in\norder. The client core reads it and sends the conversation to the hub in pages, so the CLI and the\nMCP server accept the same format. The README of the client documents the format with an example.\nAdapters for other formats, for example chat exports or WebVTT transcripts of meeting tools, are\nlater work in the client and translate into the same pages. **Consequences:** The hub knows only\nthe import interface, not the formats of other tools. An agent can write a conversation as one\nJSON object, in a file or directly as the argument of the MCP tool. A very long conversation is\none file, but goes to the hub in pages. **Rejected:** one line per message (the file then needs a\nheader line of another kind, and an agent cannot write it as one object); the JSON form of the\ninterface itself (paging and enum names would leak into a format for authors); reading the\nformats in the hub (every new tool would change the hub).\n"}},{"id":"dec-languages","title":"Go for all parts in one monorepo","status":"accepted","date":"2026-11-06","addresses":["risk-connect-maturity","risk-whisper-latency","qg-performance"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":383,"heading":"Go for everything, one monorepo","prose":"\n**Context:** We want one toolchain in one monorepo. The CLI should be easy to install. The ears need\nlocal Whisper. **Decision:** All parts are written in **Go**: server, CLI, MCP server, log\nreplicator, ears and stage. They live in one monorepo with one shared core. The stage is rendered on\nthe hub with Go templates and gets live updates through server-sent events. It needs no\nTypeScript and no frontend build. **Reasons:** connect-go is stable (v2); there is an official MCP\nSDK for Go; Go builds one static binary for the CLI; whisper.cpp has Go bindings, so the ears need\nno Python. **Consequences:** One language, one build, shared types between all parts. The ears use\nwhisper.cpp, so building the ears also needs a C/C++ compiler. Rich interaction in the\nbrowser would need a new decision. **Considered:** Rust (official connect-rust since 2026-08, but\nstill 0.x; strong for real-time audio, slower development); Python for the ears (connect-python not\nstable); TypeScript for the stage (second toolchain).\n"}},{"id":"dec-local-single-ear","title":"Local transcription per participant (single ear, headset)","status":"accepted","date":"2026-11-06","addresses":["con-privacy-law","con-headset-only","qg-confidentiality","risk-speaker-mode"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":200,"heading":"Local gateway, single ear with a headset","prose":"\n**Context:** Whisper does not tell speakers apart. Loudspeakers and rooms cause echo and mixed\nsignals. **Decision:** Each human transcribes only themselves, locally, with a headset in the first\nstage. **Consequences:** Who is speaking follows from the setup. Raw audio stays local.\nLoudspeakers and rooms are not covered yet. **Rejected:** central speaker recognition (pyannote) on\na mixed signal.\n"}},{"id":"dec-log-as-file","title":"Session log as a locally replicated file","status":"accepted","date":"2026-11-06","addresses":["con-turn-based-agents","qg-performance","qg-resumability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":268,"heading":"Session log as a local file","prose":"\n**Context:** Agents work in turns, and MCP push rarely reaches the model. **Decision:** `join` starts\na local replicator that copies the log over a socket. It returns a file path at once, and the agent\nfollows that file. **Consequences:** The agent sets its pace with filters, the history is\nsearchable, and nothing depends on client features. It needs a shared file system.\n**Rejected:** MCP notifications as the main channel; long polling as the main channel.\n"}},{"id":"dec-merkle-log","title":"Merkle tree with tree heads signed by the hub","status":"accepted","date":"2026-11-07","addresses":["risk-forged-copy","qg-confidentiality"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":588,"heading":"The session log is a Merkle tree signed by the hub","prose":"\n**Context:** The Git repository is pure storage outside our control, and after a crash the hub\ntakes the missing events from a peer. Neither must be able to change a session unnoticed.\n**Decision:** The events of a session are the leaves of a Merkle tree, as in Certificate\nTransparency. The hub signs the tree head (root hash and size), at least with every write to the\narchive and in `session.ended`. Anyone can check a stored session against its signed tree head,\nand a consistency proof shows that a longer log extends a shorter one. The leaf of an utterance\nthat is off the record keeps its hash, so a copy with a placeholder still verifies.\n**Consequences:** Changes in the repository and forged peer copies are visible. The signing key\nof the hub needs protection. **Rejected:** a plain hash chain (it cannot prove that one log\nextends another without the whole log).\n"}},{"id":"dec-model-download","title":"The client chooses its speech model by language and speed and downloads it on first use","status":"proposed","date":"2026-11-10","addresses":["qg-usability","qg-confidentiality"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":880,"heading":"The client chooses its speech model by language and speed and downloads it on first use","prose":"\n**Context:** The ears need a Whisper model and a voice activity model. The client is published as\na ready binary, so a participant has no build step that could fetch them. One model does not fit\nevery meeting: a large model transcribes names and terms better, a model fine-tuned for one\nlanguage is better still for that language, but both are too slow for live use without a GPU. A\nsmall model is fast on every computer, but makes more mistakes. **Decision:** The client knows a\ncatalogue of speech models by name: a small multilingual model, a large multilingual model and a\nlarge model fine-tuned for German. The participant names the spoken language. The client takes the\nbest model for that language: the German model for German, the large multilingual model for every\nother language. The participant can ask for the fast model instead. When the build of the client\nhas no GPU support, the client takes the fast model by itself and says so. A participant can still\nname any model of the catalogue or a model file. When the ears start and the chosen model of the\ncatalogue is missing, the client downloads it once from its public source, or from a mirror that\nthe participant configures. It checks every file against a checksum that is pinned in the client\nand keeps only a matching file. Separate commands list the catalogue with what is downloaded and\nwhich model would be used, and download models ahead of time. A model file that the participant\nchose is never downloaded. **Consequences:** The first join with the microphone needs the network\nand takes longer; a large model is about 1.6 GB. Later joins are offline as before. Only the\nmodel files come in; no audio, text or identity goes out (`qg-confidentiality`). A changed or\ndamaged file at the source stops the download instead of changing the transcription. A new model\nor a new version needs a new client. The client decides about the GPU from its build, not from\nthe hardware; a participant with an own build can override it. OPEN: whether the large models are\nfast enough for live use on the GPUs of participant laptops (minimum hardware, chapter 7).\n**Rejected:** models inside the binary (gigabytes for agents that never listen); a download\nwithout a checksum (the client would load whatever the source serves); one fixed model for\neveryone (worse for German, or too slow without a GPU); detecting the GPU from the hardware (the\nbinary can only use what it was built with).\n"}},{"id":"dec-models-in-client","title":"The rule \"no intelligence\" binds the hub, not the client","status":"accepted","date":"2026-11-11","addresses":["con-no-intelligence"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":39,"heading":"The rule \"no intelligence\" binds the hub, not the client","prose":"\n**Context:** The rule \"no intelligence\" was written for the whole application. The hub holds the\nstate of the team and needs governance: its results must be deterministic and traceable. The\nclient runs on the computer of a participant, and the ears already use a speech model there. To\nkeep an agent in a meeting at a sensible cost, the client may want to ask a small model whether\nthe agent should act. **Decision:** `con-no-intelligence` applies to the hub only. The\nparticipant client may contain models, generative or not, on the participant's side. The office\nships no generative model; a user brings one (`dec-byo-decision-model`). **Consequences:** The\nhub stays as it is. A model in the client can only change what the client of that participant\ndoes, never what the hub stores or how it decides. Tests of the client use test doubles of such\nmodels and never call a real model. **Rejected:** a model in the hub (no governance); no model in\nthe client at all (the agent would have to be woken at every utterance, also when nobody needs\nit).\n"}},{"id":"dec-no-partials-in-log","title":"No partials in the session log","status":"accepted","date":"2026-11-06","addresses":["qg-performance"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":316,"heading":"No partials in the log","prose":"\n**Decision:** Partial transcripts (`partial`) are not replicated. Only final utterances and signals\nare. **Consequences:** Less noise, a smaller file, a shorter path into the log. Whoever needs\npartials can get them later through a separate option.\n"}},{"id":"dec-off-the-record","title":"Own sentences can be marked off the record; no retraction","status":"accepted","date":"2026-11-07","addresses":["risk-retraction-leak","qg-confidentiality"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":517,"heading":"Off the record instead of retraction","prose":"\n**Context:** A spoken sentence has been heard by everyone in the meeting, and agents have already\nread it. A retraction pretends that it was never said. **Decision:** What is said stays said.\nUtterances are never retracted or removed. A participant can mark their own sentence off the\nrecord afterwards. This is its own command; the hub checks that the caller is the speaker. The\nmark is a new event. The interfaces then suppress the text: they deliver a placeholder with the\nsame ID, the stage hides it, and it does not go into minutes, decisions or notes. Agents that already\nread it must respect the mark. The raw log keeps the original. Marking the sentences of others\n(moderation) is out of scope for the first stage (issue #31). **Consequences:** The log stays\ncomplete and honest. Suppression works for every reader that uses the interfaces, but not for\nwhat an agent already holds in its context. The published session keeps the original and the\nmark; reading it from the archive also gives the placeholder (`dec-session-persistence`).\n**Rejected:** retraction; a hold period before\npublishing (it adds seconds of latency); a general classification command (not needed yet).\n"}},{"id":"dec-own-whisper","title":"Own speech-to-text pipeline with Whisper and staged events","status":"accepted","date":"2026-11-06","addresses":["qg-performance"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":182,"heading":"Own speech-to-text pipeline with Whisper","prose":"\n**Context:** No transcribed stream is available. **Decision:** We connect Whisper ourselves.\n**Consequences:** We decide how fine-grained events are and when they are sent (end of sentence,\nchange of speaker). This allows the agent to process in stages. **Rejected:** transcription by the\nmeeting tool, because it is not available and cannot be controlled.\n"}},{"id":"dec-performance-tests","title":"Performance tests separate from end-to-end tests","status":"accepted","date":"2026-11-07","addresses":["qg-performance"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":468,"heading":"Performance tests separate from end-to-end tests","prose":"\n**Context:** A timing criterion made the end-to-end tests fail on a slower host, although every\nfunction worked. **Decision:** End-to-end tests check behaviour only and never fail on timing.\nThe timing criteria of the quality scenarios run as separate performance tests on the reference\nhost. **Consequences:** The end-to-end tests run on every host. Performance needs its own run and\nits own reference host.\n"}},{"id":"dec-records-per-type","title":"One interface of the hub for every type of record","status":"accepted","date":"2026-11-07","addresses":["qg-usability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":663,"heading":"One interface of the hub for every type of record","prose":"\n**Context:** Decisions, minutes, notes, tasks and slides are different things with different\nlives. Teams already use tools of their own for some of them, for example issues for tasks.\n**Decision:** The hub offers its own interface for every type: sessions, decisions, minutes,\nnotes, tasks and slides. Each interface owns its types (`concept-module-boundaries`). Behind\nevery interface, the hub decides where the records are stored; the storage can be exchanged per\ntype without changing the interface. The building blocks: one part of the hub for decisions,\nminutes and notes, one for tasks, one for slides, and one\narchive part that all of them use for storage.\n**Consequences:** A new type is a new interface. An agent always knows what it writes.\n**Rejected:** one journal for all kinds (it mixes\nrecords with different lives); tasks only in the hub (teams have their own task tools).\n"}},{"id":"dec-records-synchronous","title":"Records are written synchronously and before session writes","status":"accepted","date":"2026-11-07","addresses":["risk-archive-latency","qg-usability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":774,"heading":"Records are written synchronously and before session writes","prose":"\n**Context:** A client must learn whether its decision, note, task or slide deck was stored.\nSession logs are written in the background, and a Git commit can be slow. **Decision:** Records\nare written synchronously: a call returns only after the commit, and a failure reaches the\nclient. Writes of records go before waiting writes of session logs, so a record waits at most for\nthe one session write that is in progress, never for a queue. **Consequences:** Clients get a\nclear result. A slow repository slows records, but not the session itself. **Rejected:** records\nin the background (the client would not learn about a failure).\n"}},{"id":"dec-restore-from-peers","title":"The hub restores from the archive; peers fill in the rest","status":"accepted","date":"2026-11-07","addresses":["qg-resumability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":608,"heading":"Peers fill in what the archive does not have yet","prose":"\n**Context:** After a crash, the hub has lost the events since its last write to the archive.\n**Decision:** The hub restores a session from the archive. Any peer that still has a longer copy\nsupplies the missing events; the hub accepts them only if a consistency proof against the last\nsigned tree head holds, and continues the IDs after them. The first copy that fits wins.\n**Consequences:** Cursors stay valid, so no epoch is needed. No order among the peers is needed.\n**Rejected:** an epoch that only tells peers that the log is lost; restoring only from the peer\nthat joined first.\n"}},{"id":"dec-session-end-milestone","title":"The end of a session is a milestone, not a stop","status":"accepted","date":"2026-11-07","addresses":["qg-usability","risk-archive-latency"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":754,"heading":"The end of a session is a milestone, not a stop","prose":"\n**Context:** People keep working after a meeting: artifacts arrive later, and a meeting can go on\nanother day. **Decision:** `session.ended` is a milestone that triggers other work, for example\nthe write to the archive. It never blocks anything new; the triggered work runs in the\nbackground, and its result appears as an event in the session log. A later session command (join,\nspeak, raise a hand, show on the stage, pause or resume) opens the session again; the log shows\nthis as its own event. Artifacts through their own interfaces (decisions, minutes, notes, tasks,\nslides) may refer to an ended session and never open it again. Minutes are such an artifact: they\nare written only through the minutes interface and stored at once like every other artifact\n(`dec-records-synchronous`). While a session is open, the hub adds a notice to its log when its\nminutes change, so the stage and agents see them live. **Consequences:** Streams, replicators and\nagents keep following a session after its end until the participant leaves. The session itself\nno longer has a command to update minutes. **Rejected:** an end that rejects all later commands;\nminutes as a session command.\n"}},{"id":"dec-session-import","title":"Imported conversations become marked sessions","status":"proposed","date":"2026-11-07","addresses":["qg-usability","risk-imported-conversation"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":815,"heading":"Imported conversations become marked sessions","prose":"\n**Context:** Many conversations happen outside the office: in other meeting tools, in chats, or\nwith an agent. The team wants minutes, decisions, notes and tasks from them, like from a session.\nThe hub did not see these conversations happen, so it cannot order and sign their messages one by\none. Nobody may mistake such a session for a live one. **Decision:** The hub has its own\ninterface to import a whole conversation as a new session (`if-session-import`), in one call or in\npages. The meeting session realizes it, so every session log keeps one writer. The first event of\nan imported session marks it as imported, with its source, its title and the participant who\nimported it; a last event marks the end of the import. The speakers of the conversation become\nimported participants with a name and a kind; their IDs are marked as imported, so they never\nmatch a registered participant. The utterances keep their order and, if known, the time they were\nmade. Every page carries an ID created by the client (`dec-idempotent-commands`). Until the import\nis complete, the session takes only the pages of the participant who started it. After that, it is\na session like any other: participants join, write minutes and end it, and the stream, the events\nafter a cursor, the archive and the restore treat it like every other session. The end of an\nimport starts a write to the archive, like the end of a session. The hub signs tree\nheads over an imported log as over every log. The signature proves who imported the log and that\nit has not changed since; it does not prove that the speakers said what it says.\n**Consequences:** Agents and humans derive records from an imported session through the existing\ninterfaces, without a second path. Readers recognise an imported session by its first event. The\nnew events are a new revision of the session schema (`dec-session-schema`). OPEN: nobody can mark\nan imported sentence off the record, because the speakers are not participants with a key (#50).\nOPEN: an import that stops halfway leaves an incomplete session; it cannot be continued by a new\ncall of the client (#51). **Rejected:** a separate part of the hub with its own log (two writers,\nor an extra internal interface for writing many events at once); a signature per imported\nmessage (it would claim an order the hub never saw); ending the session with the import\n(participants could not write minutes into it any more); matching imported speakers to registered\nparticipants by name (the hub cannot check it).\n"}},{"id":"dec-session-persistence","title":"The hub persists sessions to a Git repository through an archive","status":"accepted","date":"2026-11-07","addresses":["risk-archive-latency","qg-resumability","qg-performance"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":565,"heading":"The hub persists sessions through an archive","prose":"\n**Context:** The hub orders every event and holds the complete log while a session runs. Every\npeer holds a copy too, but as the reading interface for agents, not as storage.\n**Decision:** The hub is the gateway to the archive: it brings the semantics (order, checks,\nsignatures, placeholders), and an external Git repository is the pure storage behind it. The hub\nwrites the log of a session to the archive at a configurable interval and at `session.ended`.\nWriting never holds up the session: it runs in the background, at most one write is in progress,\nand a write that takes longer than the interval makes the next write take everything that has\ncome since. More frequent is better; the interval only has to stay above the usual commit time.\nPeers do not publish. **Consequences:** One place writes, so there is no race between writers.\nA Git commit is slow, so the archive is always a little behind; the peers' copies cover the\nrest (`dec-restore-from-peers`). OPEN: which remote repository. **Rejected:** every peer publishes (redundant when the\nhub has the log); a commit per event that the session waits for (it slows every command);\nfully peer-to-peer ordering without a hub.\n"}},{"id":"dec-session-schema","title":"A session belongs to exactly one schema","status":"accepted","date":"2026-11-07","addresses":["risk-forged-copy","qg-resumability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":728,"heading":"A session belongs to exactly one schema","prose":"\n**Context:** The leaves of the Merkle tree depend on the encoding of the events, and the encoding\ndepends on the version of the session contract. A client with another version could compute\nother leaves and reject a correct copy. **Decision:** A session belongs to exactly one schema, the\nversion of the session contract it was started with. The session records its schema. Changes of\nthe schema are not taken over inside a running session: a hub with another schema does not\ncontinue a session of an older schema, and verifiers check a session with its own schema.\n**Consequences:** Copies and archived sessions stay verifiable after an update of the contract.\nAn update of the hub ends the use of running sessions of the old schema for writing.\n**Rejected:** a leaf format that is independent of the contract (more work now, not needed yet).\n"}},{"id":"dec-signed-head-in-stream","title":"The stream carries signed tree heads; a restored session waits for peers","status":"accepted","date":"2026-11-07","addresses":["qg-resumability","risk-forged-copy"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":639,"heading":"Every peer holds a signed tree head over its whole copy","prose":"\n**Context:** The hub accepts a peer copy only against a tree head it signed\n(`dec-restore-from-peers`, `dec-merkle-log`). But the events that the hub lost in a crash are\nexactly the ones after its last write to the archive, so the stored tree head does not cover them.\nAfter the restart, the hub also does not know how long the longest copy is. **Decision:** The\nsession stream carries a tree head signed by the hub together with the last event the hub has.\nSo every peer holds a signed head over its whole copy, and keeps it next to its local log. A peer\nwhose cursor the hub does not know offers the events the hub misses with that head. The hub checks\nthe signature with its own key, that the events give the root hash, and a consistency proof\nbetween its own head and the head of the copy. After a restart, a session that has not ended\ntakes no commands until a peer copy fits or a configurable wait is over, so no new event can take\nthe ID of a lost one. There is no wait if the hub stopped after a last write of every session.\n**Consequences:** A forged or changed copy fails, and the hub needs no extra storage per event.\nEvery batch of the stream costs one signature. Commands of a restored session can fail for up to\nthe wait; clients repeat them, which is safe (`dec-idempotent-commands`). OPEN: a session that the\nhub never wrote to the archive is unknown after a crash until a peer offers a whole copy; a peer\nthat comes back after the wait has a copy that forks. **Rejected:** a head signed only at every\nwrite to the archive (it does not cover the lost events); accepting a tail without a signed head\n(anyone could add events); persisting a head on the hub for every event (a write per event).\n"}},{"id":"dec-stage-screenshare","title":"Stage by screen share","status":"accepted","date":"2026-11-06","addresses":["con-any-meeting-tool","qg-usability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":216,"heading":"Stage by screen share instead of a meeting tool integration","prose":"\n**Context:** Bots for Zoom, Teams or Meet are costly and tied to one platform. **Decision:** The\nhub renders a stage as a web page that is shown by screen share. **Consequences:** It works with\nany tool. The agent's presence is visual. People without a client still see what happens.\n"}},{"id":"dec-text-first","title":"Text first, speech output later","status":"accepted","date":"2026-11-06","addresses":["qg-usability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":234,"heading":"Text first, speech output later","prose":"\n**Decision:** At first, agents contribute only as text on the stage. **Consequences:** The humans\nkeep control of the conversation: an agent raises its hand visibly, and the moderator gives the\nfloor. Speech output can be added later through the audio of the\nscreen share, without changing the architecture. The person who shares will then need echo\ncancellation.\n"}},{"id":"dec-unified-participant","title":"Humans and agents as participants of the same kind","status":"accepted","date":"2026-11-06","addresses":["qg-usability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":284,"heading":"One participant model","prose":"\n**Decision:** Humans and agents are participants with the same tools. For humans with a microphone,\nspeech is also transcribed. **Consequences:** The gateway is `join --mic`. The whole system can be\ntested without any agent.\n"}},{"id":"dec-vocabulary-prompt","title":"The ears give Whisper the vocabulary of the project and the names of the participants","status":"proposed","date":"2026-11-11","addresses":["qg-usability","qg-confidentiality"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":910,"heading":"The ears give Whisper the vocabulary of the project and the names of the participants","prose":"\n**Context:** Whisper often misspells names and terms of a project, for example product names,\nabbreviations and the names of the people in the meeting. These words matter most in minutes and\ntasks. Whisper accepts a short text as a prompt before each sentence and then prefers its words\nand spellings. The prompt is short: Whisper keeps only the last part of a long one.\n**Decision:** The ears build the prompt from two sources: a vocabulary file of the project in the\nworking directory of the client (or a file the participant names), then the display names of the\nparticipants of the session, which the client knows from its local log. The terms keep their\norder in the file; the names follow. What does not fit is cut at the end, so the first terms of\nthe file always count. The ears report how many terms and names they use and how many they cut.\nThe previous sentence as additional context is an option and off by default, because nobody has\nmeasured yet whether it helps. **Consequences:** A team improves the transcription by writing a\nplain text file; no model is trained. The vocabulary and the names stay on the device like the\naudio (`concept-edge-transcription`). A wrong or very long vocabulary can make Whisper write a\nterm that was not said. OPEN: the effect on the error rate is not measured; a measurement corpus\nis out of scope of the epic (#66). **Rejected:** fine-tuning a model per team (training data and\ncompute that a team does not have); correcting the text after Whisper (it cannot recover a word\nthat Whisper did not hear as such).\n"}},{"id":"dec-wake-check-per-utterance","title":"Check after each utterance whether to wake the agent","status":"accepted","date":"2026-11-12","addresses":["con-turn-based-agents","qg-usability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":96,"heading":"Check after each utterance whether to wake the agent","prose":"\n**Context:** The agent should notice when it is addressed, without a keyword. It should also\nnotice when a speaker starts a new topic within a monologue, or talks about something that\nconcerns the role of the agent. The end of a turn (`turn.end`) comes too late for that.\n**Decision:** After each utterance of another participant, the runner checks whether to wake the\nagent. A decision model that the user brings makes the check (`dec-byo-decision-model`). When it\nsays the agent should act, the runner sends the agent what others said since its last delivery,\nas one prompt. Each utterance says who spoke and whether that participant is a human or an\nagent. The agent decides by itself how to act: answer, raise its hand, or update the minutes\nsilently. OPEN: what the runner does without a decision model. A check per utterance would then\nwake the agent at every utterance. Until this is decided, the runner wakes it at each change of\nspeaker instead. **Consequences:** People talk to the agent in plain words, and the agent can\nfollow topics within a long monologue. The check runs for every utterance, so the decision model\nmust be fast and cheap. An agent may act while someone still speaks; it should not interrupt\nspeech, but raise its hand or write. **Rejected:** a wake-up only at each change of speaker (it\nmisses a new topic within a monologue); a keyword (not natural).\n"}},{"id":"dec-yaml-git-storage","title":"Every type as YAML in a local Git repository; push mocked","status":"accepted","date":"2026-11-07","addresses":["risk-archive-latency","qg-performance"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":686,"heading":"Everything as YAML in a local Git repository first","prose":"\n**Context:** The storage behind the interfaces should be local and predictably fast at first, and\nreplaceable later. **Decision:** At first, the hub stores every type as YAML files in a local Git\nrepository on the hub host and commits locally. The push to a remote is mocked. Tasks are local\ndrafts too. Later, tasks are synced with the task tool of the team (for example GitHub or GitLab\nissues), and the synced task replaces the local draft. **Consequences:** No external service is\nneeded to start, and commits stay fast. Sessions are written in the background at an interval\n(`dec-session-persistence`). The session log is the exception to YAML: it is stored with one\nline per event, in the same format as the local log of the peers, because it only grows and every\nwrite appends lines. **Rejected:** a database (not needed yet);\nexternal task tools from the start (slow and not predictable).\n"}},{"id":"qg-confidentiality","title":"Confidentiality","priority":"high","kind":"quality-goal","loc":{"file":"docs/architecture/10-quality-requirements.arc42.md","line":14,"heading":"Confidentiality","prose":"\nSpeech needs special protection (ISO 25010: security, confidentiality). Raw audio must not leave\nthe speaker's device, and only people who consented are captured.\n"}},{"id":"qg-performance","title":"Performance (latency)","priority":"high","kind":"quality-goal","loc":{"file":"docs/architecture/10-quality-requirements.arc42.md","line":28,"heading":"Performance","prose":"\nAn agent must be able to react within the natural pause after a contribution (ISO 25010:\nperformance efficiency, time behaviour). For this, speech must reach the session log without\nnoticeable delay.\n"}},{"id":"qg-resumability","title":"Resumability after network drops","priority":"high","kind":"quality-goal","loc":{"file":"docs/architecture/10-quality-requirements.arc42.md","line":42,"heading":"Resumability","prose":"\nNetworks drop, especially on laptops in meetings (ISO 25010: reliability, recoverability). After a\ndrop, every client continues where it stopped. No event is lost, and no event is stored or\ndelivered twice.\n"}},{"id":"qg-usability","title":"Usability (transparency of capture)","priority":"high","kind":"quality-goal","loc":{"file":"docs/architecture/10-quality-requirements.arc42.md","line":55,"heading":"Usability","prose":"\nParticipants see at all times what was captured and sent from them, and they can act on it\n(ISO 25010: usability, here mainly transparency and control).\n"}},{"id":"qs-archive-no-backpressure","title":"A slow archive does not delay the session","quality":"qg-performance","stimulus":"Every write to the archive takes 5 s (OPEN) while participants speak","response":"Commands and the stream run as usual; later events go into the next write","metric":"qs-transcript-to-log still \u003c 200 ms; no queue of writes builds up","kind":"quality-scenario","loc":{"file":"docs/architecture/10-quality-requirements.arc42.md","line":136,"heading":"Slow archive does not slow the session","prose":"\nThe hub writes to the archive in the background. Even with a slow Git repository, speech reaches\nthe local log of the other participants as fast as without it.\n"}},{"id":"qs-manual-headset","title":"Manual test with a real headset","quality":"qg-performance","stimulus":"A person joins with --mic on a participant laptop with a headset and speaks a few sentences","response":"Each sentence appears as utterance.final with readable text; no audio leaves the device","metric":"All spoken sentences arrive; recognition is good enough to follow the meeting (OPEN: define a word error rate)","kind":"quality-scenario","loc":{"file":"docs/architecture/10-quality-requirements.arc42.md","line":120,"heading":"Audio capture with a real headset","prose":"\nThe automated tests use a WAV file. This manual test checks real audio capture and recognition\nquality (see `concept-test-strategy`).\n"}},{"id":"qs-no-raw-audio","title":"No raw audio in outgoing traffic","quality":"qg-confidentiality","stimulus":"A participant speaks for 30 minutes with --mic while outgoing traffic is recorded","response":"The client sends only text events and metadata","metric":"0 bytes of audio data in the capture","kind":"quality-scenario","loc":{"file":"docs/architecture/10-quality-requirements.arc42.md","line":69,"heading":"No raw audio leaves the device","prose":"\nThis is the acceptance test for confidentiality. In a test meeting, a participant speaks with the\nears switched on. We record the outgoing network traffic of their client, for example with a proxy\nor a packet capture. We check that it contains only text events and no audio data.\n"}},{"id":"qs-resume-after-drop","title":"Resume after a network drop","quality":"qg-resumability","stimulus":"The network of a participant with --mic drops for 60 s (OPEN) and comes back","response":"Queued utterances are stored in order; the local log receives all missed events","metric":"0 lost and 0 duplicate events; local log complete within 2 s after reconnect (OPEN)","kind":"quality-scenario","loc":{"file":"docs/architecture/10-quality-requirements.arc42.md","line":153,"heading":"Resume after a network drop","prose":"\nA participant's network drops in the middle of a meeting and comes back. While offline, the person\nkeeps speaking. After the connection is back, the local log is complete again, and the queued\nutterances are in the session log in the right order.\n"}},{"id":"qs-sender-sees-status","title":"Status of own sentences is visible","quality":"qg-usability","stimulus":"A sentence is sent or marked off the record","response":"The terminal shows the status; the stage shows the capture status","metric":"Status visible ≤ 1 s after the hub confirms it (OPEN)","kind":"quality-scenario","loc":{"file":"docs/architecture/10-quality-requirements.arc42.md","line":168,"heading":"Speaker sees what was sent","prose":"\nAfter every sentence, the speaker sees its status in the terminal.\n"}},{"id":"qs-speech-to-log","title":"End of speech to event in the local log","quality":"qg-performance","stimulus":"A participant with --mic finishes a sentence","response":"utterance.final is in the local log of another participant","metric":"p95 ≤ 1.5 s on the reference hardware","kind":"quality-scenario","loc":{"file":"docs/architecture/10-quality-requirements.arc42.md","line":104,"heading":"From end of speech to the log","prose":"\nThis is what a participant experiences: the time from the end of a spoken sentence until the\nsentence is in the local log of another participant. It includes the pause that ends a sentence,\nWhisper and the way into the log. The reference hardware is the CPU-only host of the first stage.\n"}},{"id":"qs-transcript-to-log","title":"End of transcription to event in the log","quality":"qg-performance","stimulus":"Whisper returns a final utterance","response":"utterance.final is in the local log of another participant","metric":"\u003c 200 ms (OPEN: p95 or maximum)","kind":"quality-scenario","loc":{"file":"docs/architecture/10-quality-requirements.arc42.md","line":87,"heading":"From transcription to the session log","prose":"\nWe measure from the end of the transcription of a sentence (Whisper returns the final utterance)\nto the moment the event is in the local copy of the log at another participant. That is what an\nagent actually sees. The time for voice activity detection and Whisper is not included; the next\nscenario covers it.\n"}},{"id":"risk-agent-wakeups","title":"Checking and waking the agent per utterance is slow and costly","severity":"medium","mitigation":"A small, fast decision model that the user brings makes the check and wakes the agent only when it should act (dec-byo-decision-model); queued utterances go out together in one prompt (dec-agent-runner-delivery)","kind":"risk","loc":{"file":"docs/architecture/11-risks.arc42.md","line":82,"heading":"Waking the agent costs time and money","prose":"\nThe runner checks after each utterance whether to wake the agent. If it wakes a harness with a\nlarge model too often, the agent spends tokens on utterances that do not concern it, and it may\nlag behind a fast meeting. The check itself also runs for every utterance.\n"}},{"id":"risk-archive-latency","title":"Slow writes to the archive hold up the session","severity":"medium","mitigation":"Writes run in the background with a configurable interval; at most one write in progress; later events go into the next write (dec-session-persistence)","kind":"risk","loc":{"file":"docs/architecture/11-risks.arc42.md","line":140,"heading":"Writing to Git is slow","prose":"\nA Git commit takes noticeable time. If the session waited for it, every command would be slow, and\na slow repository could build up a queue.\n"}},{"id":"risk-connect-maturity","title":"Connect RPC is not equally mature in all languages","severity":"medium","mitigation":"Use Go with the stable connect-go for all parts (dec-languages); keep the protocol code in one module of the shared core; the protocol is plain HTTP with JSON, so we could replace the library if needed","kind":"risk","loc":{"file":"docs/architecture/11-risks.arc42.md","line":112,"heading":"Maturity of Connect RPC","prose":"\nConnect RPC is a CNCF sandbox project. connect-go is stable. connect-python is still 0.x and was\nrenamed recently. connect-rust became an official\nimplementation in 2026-08; it passes the full conformance suite but is still 0.x. Few large\nadopters are publicly known.\n"}},{"id":"risk-consent","title":"Consent and retention not settled","severity":"high","mitigation":"Joining with the microphone is the consent (dec-consent-by-mic); capture status on the stage; data protection review before first use","kind":"risk","loc":{"file":"docs/architecture/11-risks.arc42.md","line":22,"heading":"Legal uncertainty about listening in","prose":"\nConsent, retention and how to handle people without a client are not settled yet.\n"}},{"id":"risk-forged-copy","title":"Forged session copies","severity":"high","mitigation":"Merkle tree with tree heads signed by the hub; the hub checks every peer copy, and every reader can check the repository (dec-merkle-log)","kind":"risk","loc":{"file":"docs/architecture/11-risks.arc42.md","line":126,"heading":"A changed session in the repository or in a peer copy","prose":"\nSomeone with access to the Git repository could change a stored session, and a peer could change\nthe copy it supplies after a crash.\n"}},{"id":"risk-harness-drift","title":"Agent harnesses and ACP change and differ","severity":"medium","mitigation":"The runner uses only the stable core of ACP (initialize, one session with MCP servers, prompt, cancel, permission requests) and tests it against a test double; the user guide names the tested harness commands; the permission rule is configurable (dec-agent-runner-delivery)","kind":"risk","loc":{"file":"docs/architecture/11-risks.arc42.md","line":67,"heading":"The agent harnesses and ACP change fast","prose":"\nThe Agent Client Protocol is young, and the harnesses implement it in different ways and versions.\nClaude Code needs an adapter that is a separate package. Harnesses name tools differently in their\npermission requests, so a rule that allows only the office tools can miss or block a tool. The\noffice cannot test real harnesses in its CI, because they need a model and a key.\n"}},{"id":"risk-imported-conversation","title":"An imported conversation is taken for a live session","severity":"medium","mitigation":"An imported session is marked by its first event, with its source and the participant who imported it; imported speakers have marked IDs; the signature over an imported log only proves who imported it and that it has not changed (dec-session-import); the stage names the source of an imported session and never shows it as live","kind":"risk","loc":{"file":"docs/architecture/11-risks.arc42.md","line":155,"heading":"An imported conversation is taken for a live one","prose":"\nThe hub did not see an imported conversation happen. Its messages may be incomplete or made up,\nand the hub cannot check who said them. A reader who takes an imported session for a live one\ntrusts it more than it deserves.\n"}},{"id":"risk-no-filesystem","title":"Agents without a shared file system","severity":"medium","mitigation":"Events after a cursor, polled by the agent (dec-events-from-cursor)","kind":"risk","loc":{"file":"docs/architecture/11-risks.arc42.md","line":51,"heading":"Agents without a file system","prose":"\nAgents that only use an API cannot follow a local file.\n"}},{"id":"risk-retraction-leak","title":"Sentences marked off the record stay in agent context","severity":"high","mitigation":"The interfaces suppress the text of sentences off the record for every later reader (dec-off-the-record); the agent contract requires respecting the mark","kind":"risk","loc":{"file":"docs/architecture/11-risks.arc42.md","line":9,"heading":"Classified sentences stay with the agent","prose":"\nA sentence that is marked off the record afterwards is already in the local files and in the\ncontext of the agents that read it. It cannot be removed from an agent's context.\n"}},{"id":"risk-speaker-mode","title":"Echo and duplicates with loudspeakers","severity":"medium","mitigation":"Headset required (con-headset-only); echo cancellation, voice print and deduplication in issue #1","kind":"risk","loc":{"file":"docs/architecture/11-risks.arc42.md","line":96,"heading":"Loudspeakers instead of a headset","prose":"\nIf someone uses loudspeakers, other people's voices end up in their transcript, and sentences\nappear twice.\n"}},{"id":"risk-whisper-latency","title":"Local transcription too slow","severity":"high","mitigation":"Smaller or quantised models; a shorter audio window per sentence; a GPU where available; measure on real participant laptops; if echo cancellation later needs tighter timing, build it as a small Rust or C component behind a clear interface","kind":"risk","loc":{"file":"docs/architecture/11-risks.arc42.md","line":38,"heading":"Whisper too slow on laptops","prose":"\nWhisper is the real latency risk. In the spike, a small model needed about 0.9 s per sentence on\na CPU, whatever the length of the sentence. The large model was too slow for live use. From the end\nof speech to the log it took about 1.4 s. The jitter of the Go audio loop is no problem (p99 about\n1 ms), even while Whisper runs.\n"}},{"id":"term-acp","title":"Agent Client Protocol (ACP)","definition":"An open JSON-RPC protocol over standard input and output between a client, here the agent runner, and an agent harness","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":228,"heading":"Agent Client Protocol (ACP)","prose":"\nAn open protocol between a client and a coding agent, published at agentclientprotocol.com. The\nclient starts the agent and talks JSON-RPC with it over standard input and output.\n"}},{"id":"term-actor","title":"Actor","definition":"A participant with its own key pair; every human device and every agent is one actor","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":189,"heading":"Actor","prose":"\nWho authenticates against the office.\n"}},{"id":"term-agent-harness","title":"Agent harness","definition":"The program that runs an agent and its model, for example Claude Code, opencode or Kiro; the agent runner starts it and talks to it over ACP","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":203,"heading":"Agent harness","prose":"\nThe program in which an agent runs and that holds its conversation with a model, for example\nClaude Code, opencode or Kiro. We say \"harness\" and not \"agent\" when we mean the program that the\nagent runner starts.\n"}},{"id":"term-agent-runner","title":"Agent runner","definition":"The part of the client that follows the local log for an agent and starts the agent's turns in its harness over ACP, when the check after an utterance says it should act","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":215,"heading":"Agent runner","prose":"\nThe part of the participant client that keeps an agent in a meeting (`bb-agent-runner`).\n"}},{"id":"term-artifact","title":"Artifact","definition":"Anything that the stage can show by an ID with its type in front, for example the slide deck slides/42","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":129,"heading":"Artifact","prose":"\nThe general word for what the stage shows. Each type of artifact has its own interface\n(`dec-records-per-type`); today slide decks are the only type.\n"}},{"id":"term-cursor","title":"Cursor","definition":"The ID of the last event a client has read; used to resume after a drop","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":44,"heading":"Cursor","prose":"\nHow a client knows where it stopped reading.\n"}},{"id":"term-decision-model","title":"Decision model","definition":"A model that the user brings and that tells the agent runner after each utterance whether the agent should act and whether a block of topics has ended","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":241,"heading":"Decision model","prose":"\nA model that the user brings for the agent runner (`dec-byo-decision-model`). It is not the agent:\nit only decides whether the agent should be woken.\n"}},{"id":"term-ears","title":"Ears","definition":"The local audio pipeline of a human (VAD, Whisper) that sends only text","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":92,"heading":"Ears","prose":"\nThe audio connector of the office.\n"}},{"id":"term-hand-raise","title":"Raised hand","definition":"A signal on the stage that a participant wants to contribute; the moderator gives the floor","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":68,"heading":"Raised hand","prose":"\nHow participants, especially agents, ask to speak.\n"}},{"id":"term-hub","title":"Office hub","definition":"The separately deployed part that orders and distributes the events of a session, checks identities, renders the stage and is the gateway to the archive; its archive part writes sessions to a Git repository, which is the storage","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":289,"heading":"Hub","prose":"\nThe central part of the office.\n"}},{"id":"term-imported-session","title":"Imported session","definition":"A session whose log starts with a conversation that happened outside the office and that a participant imported; its first event marks it as imported and names the source","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":302,"heading":"Imported session","prose":"\nA session that was not held in the office.\n"}},{"id":"term-off-the-record","title":"Off the record","definition":"A mark that the speaker puts on their own utterance after it was said; the interfaces then deliver it only as a placeholder without its text","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":253,"heading":"Off the record","prose":"\nA later mark on an own sentence.\n"}},{"id":"term-participant","title":"Participant","definition":"A human or an agent in a session, with an identity, a kind (human or agent) and roles","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":8,"heading":"Participant","prose":"\nThe central role in the system. Humans and agents are treated the same way.\n"}},{"id":"term-peer","title":"Peer","definition":"A participant client that keeps a full copy of the session log and may publish it","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":265,"heading":"Peer","prose":"\nA participant as a keeper of the session.\n"}},{"id":"term-record","title":"Record","definition":"A decision, the minutes of a session or a note that the hub stores in the archive, with its author and whether the author is a human or an agent; it replaces the earlier journal entry","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":153,"heading":"Record","prose":"\nWhat the hub keeps for the team, one type per interface (`dec-records-per-type`).\n"}},{"id":"term-room-ear","title":"Room ear","definition":"A later listening mode for several speakers at one microphone, with speaker recognition","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":116,"heading":"Room ear","prose":"\nA later extension for meeting rooms.\n"}},{"id":"term-session","title":"Session","definition":"One meeting in the office, with its own event log, participants and stage","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":20,"heading":"Session","prose":"\nThe frame of one meeting in the office.\n"}},{"id":"term-session-log","title":"Session log","definition":"The append-only event log of a session; replicated locally as a JSONL file","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":32,"heading":"Session log","prose":"\nThe shared source of truth of a session.\n"}},{"id":"term-single-ear","title":"Single ear","definition":"A listening mode in which only the owner of the device is transcribed","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":104,"heading":"Single ear","prose":"\nThe listening mode of the first stage.\n"}},{"id":"term-slide-deck","title":"Slide deck","definition":"A set of slides (title, bullets, speaker notes) that the hub renders deterministically to one HTML document; the hub keeps its input and the rendered document in the archive","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":141,"heading":"Slide deck","prose":"\nOne type of record of the hub, and today the only type of artifact.\n"}},{"id":"term-stage","title":"Stage","definition":"The web view of a session (minutes, raised hands, artifacts, capture status), shown by screen share","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":80,"heading":"Stage","prose":"\nThe visible presence of the office in the meeting.\n"}},{"id":"term-task","title":"Task","definition":"A work item with a title, a description, an assignee, a status (open, in progress, done or cancelled) and an optional link to a session; for now a local draft that the hub stores in the archive, later synced with the task tool of the team","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":165,"heading":"Task","prose":"\nA work item of the team (`dec-records-per-type`).\n"}},{"id":"term-task-reference","title":"Task reference","definition":"The stable name of a task, a text with a scheme such as local:42 for a draft of the hub or github:owner/repo#12 for an issue; clients keep it and pass it back but never build or read its parts","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":177,"heading":"Task reference","prose":"\nHow clients name a task.\n"}},{"id":"term-tree-head","title":"Tree head","definition":"The root hash and size of the Merkle tree over the events of a session, signed by the hub","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":277,"heading":"Tree head","prose":"\nThe fingerprint of a session log.\n"}},{"id":"term-utterance","title":"Utterance","definition":"One finished contribution of a participant, spoken (voice) or written (text)","kind":"glossary-term","loc":{"file":"docs/architecture/12-glossary.arc42.md","line":56,"heading":"Utterance","prose":"\nThe basic unit of what is said or written in the log.\n"}}],"edges":[{"from":"actor-human","to":"if-cli","relation":"requires"},{"from":"actor-human","to":"if-audio-in","relation":"requires"},{"from":"actor-human","to":"if-local-log","relation":"requires"},{"from":"actor-human","to":"if-stage-web","relation":"requires"},{"from":"actor-agent","to":"if-mcp","relation":"requires"},{"from":"actor-agent","to":"if-cli","relation":"requires"},{"from":"actor-agent","to":"if-loca participant bb_cli as office CLI\n    participant bb_session as Meeting session\n    participant bb_replicator as Log replicator\n    participant bb_agent_runner as Agent runner\n    participant actor_decision_model as Decision model\n    participant actor_agent as Agent harness\n    participant bb_mcp as MCP server\n    actor_human->>bb_cli: speaks or types a question\n    bb_cli->>bb_session: utterance.submit\n    bb_session-->>bb_replicator: utterance.final\n    bb_replicator->>bb_replicator: append lines to the local log of the agent\n    bb_agent_runner->>bb_replicator: read new lines\n    bb_agent_runner->>actor_decision_model: new utterance, context, role\n    actor_decision_model-->>bb_agent_runner: act, addressed, topic_closed, reason\n    bb_agent_runner->>actor_agent: session/prompt (who said what)\n    actor_agent->>bb_mcp: utterance_say (answer)\n    bb_mcp->>bb_session: utterance.submit (as the agent)\n    actor_agent-->>bb_agent_runner: end of turn\n    bb_session-->>bb_replicator: utterance.final of the agent\n    Note over bb_agent_runner: leaves out the agent's own utterance","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":445}},{"kind":"diagram","diagramType":"deployment","view":"deployment","id":"deployment-overview","notation":"mermaid-architecture","roots":[],"aliases":"","source":"architecture-beta\n    group env-mvp(cloud)[First stage]\n    group dn-participant-laptop(server)[Participant computer] in env-mvp\n    group dn-agent-runtime(server)[Agent runtime] in env-mvp\n    group dn-office-hub(server)[Office hub] in env-mvp\n    service bb-ears(disk)[Ears] in dn-participant-laptop\n    service bb-cli(server)[office CLI] in dn-participant-laptop\n    service bb-replicator(disk)[Log replicator] in dn-participant-laptop\n    service bb-mcp(server)[MCP server] in dn-agent-runtime\n    service bb-agent-runner(server)[Agent runner] in dn-agent-runtime\n    service bb-session-service(server)[Meeting session] in dn-office-hub\n    service bb-records(database)[Records] in dn-office-hub\n    service bb-tasks(database)[Tasks] in dn-office-hub\n    service bb-slides(database)[Slides] in dn-office-hub\n    service bb-stage(internet)[Stage] in dn-office-hub\n    service bb-identity(server)[Identity] in dn-office-hub\n    service bb-archive(disk)[Archive] in dn-office-hub\n    bb-ears:R --> L:bb-session-service\n    bb-replicator:R --> L:bb-session-service\n    bb-mcp:L --> R:bb-session-service","loc":{"file":"docs/architecture/07-deployment-view.arc42.md","line":11}}],"documents":[{"filePath":"docs/architecture/01-introduction-and-goals.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Introduction and Goals","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"heading","level":2,"text":"1.1 Requirements Overview","line":3},{"kind":"prose","text":"","line":4,"renderedHtml":"\u003cp>Agentic Office is a \u003cstrong>headless office\u003c/strong>. It helps a company with administrative work, but its\nhub is not &quot;intelligent&quot; itself. It keeps the team&#39;s state (decisions, minutes, notes, tasks, artifacts). It\noffers deterministic tools (render slides, check business plans by calculation). And it opens\nsenses into the real world, starting with audio from meetings. The agent brings the thinking\n(&quot;bring your own agent&quot;).\u003c/p>\n\u003cp>Agents and humans are equal \u003cstrong>participants\u003c/strong>. Both use the same CLI or the same MCP server. There is\none difference: humans can also switch on a microphone. Their speech is then transcribed locally.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Use case\u003c/th>\n\u003cth>Summary\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Join a meeting\u003c/td>\n\u003ctd>A human or an agent joins a session and gets a local log file that is replicated continuously\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Capture speech\u003c/td>\n\u003ctd>Local Whisper transcribes only the device owner (headset) and sends text, never audio\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Take minutes and raise a hand\u003c/td>\n\u003ctd>An agent keeps the minutes, raises its hand on the stage and shows artifacts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Keep an agent in the meeting\u003c/td>\n\u003ctd>The agent runner wakes an agent when the speaker changes, so people can address it in plain words\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Show the stage\u003c/td>\n\u003ctd>A web view of the hub is shared by screen share in any meeting tool\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Create artifacts\u003c/td>\n\u003ctd>Slides, plan checks, decisions and notes through CLI or MCP, without streaming\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Track tasks\u003c/td>\n\u003ctd>Create tasks in a meeting, assign them and change their status through CLI or MCP; for now they are drafts in the hub\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Transparency\u003c/td>\n\u003ctd>Every participant sees what was recorded and sent from them, and can pause or mark it off the record\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Explicitly \u003cstrong>not\u003c/strong> in the first stage: speech output (TTS), video, use with loudspeakers, meeting\nrooms with several speakers at one microphone, and integration into meeting tools.\u003c/p>\n"},{"kind":"prose","text":"Agentic Office is a **headless office**. It helps a company with administrative work, but its","line":5,"renderedHtml":""},{"kind":"prose","text":"hub is not \"intelligent\" itself. It keeps the team's state (decisions, minutes, notes, tasks, artifacts). It","line":6,"renderedHtml":""},{"kind":"prose","text":"offers deterministic tools (render slides, check business plans by calculation). And it opens","line":7,"renderedHtml":""},{"kind":"prose","text":"senses into the real world, starting with audio from meetings. The agent brings the thinking","line":8,"renderedHtml":""},{"kind":"prose","text":"(\"bring your own agent\").","line":9,"renderedHtml":""},{"kind":"prose","text":"","line":10,"renderedHtml":""},{"kind":"prose","text":"Agents and humans are equal **participants**. Both use the same CLI or the same MCP server. There is","line":11,"renderedHtml":""},{"kind":"prose","text":"one difference: humans can also switch on a microphone. Their speech is then transcribed locally.","line":12,"renderedHtml":""},{"kind":"prose","text":"","line":13,"renderedHtml":""},{"kind":"prose","text":"| Use case | Summary |","line":14,"renderedHtml":""},{"kind":"prose","text":"|---|---|","line":15,"renderedHtml":""},{"kind":"prose","text":"| Join a meeting | A human or an agent joins a session and gets a local log file that is replicated continuously |","line":16,"renderedHtml":""},{"kind":"prose","text":"| Capture speech | Local Whisper transcribes only the device owner (headset) and sends text, never audio |","line":17,"renderedHtml":""},{"kind":"prose","text":"| Take minutes and raise a hand | An agent keeps the minutes, raises its hand on the stage and shows artifacts |","line":18,"renderedHtml":""},{"kind":"prose","text":"| Keep an agent in the meeting | The agent runner wakes an agent when the speaker changes, so people can address it in plain words |","line":19,"renderedHtml":""},{"kind":"prose","text":"| Show the stage | A web view of the hub is shared by screen share in any meeting tool |","line":20,"renderedHtml":""},{"kind":"prose","text":"| Create artifacts | Slides, plan checks, decisions and notes through CLI or MCP, without streaming |","line":21,"renderedHtml":""},{"kind":"prose","text":"| Track tasks | Create tasks in a meeting, assign them and change their status through CLI or MCP; for now they are drafts in the hub |","line":22,"renderedHtml":""},{"kind":"prose","text":"| Transparency | Every participant sees what was recorded and sent from them, and can pause or mark it off the record |","line":23,"renderedHtml":""},{"kind":"prose","text":"","line":24,"renderedHtml":""},{"kind":"prose","text":"Explicitly **not** in the first stage: speech output (TTS), video, use with loudspeakers, meeting","line":25,"renderedHtml":""},{"kind":"prose","text":"rooms with several speakers at one microphone, and integration into meeting tools.","line":26,"renderedHtml":""},{"kind":"prose","text":"","line":27,"renderedHtml":""},{"kind":"heading","level":2,"text":"1.2 Quality Goals","line":28},{"kind":"prose","text":"","line":29,"renderedHtml":"\u003cp>The quality goals, in this order: \u003cstrong>confidentiality\u003c/strong> (raw audio never leaves the device, and only\npeople who consented are captured), \u003cstrong>performance\u003c/strong> (speech reaches the session log without\nnoticeable delay), \u003cstrong>resumability\u003c/strong> (after a network drop, everything continues without lost or\nduplicated events) and \u003cstrong>usability\u003c/strong> (participants see what was captured from them).\u003c/p>\n\u003cp>See \u003ca href=\"10-quality-requirements.arc42.md\">10-quality-requirements.arc42.md\u003c/a> for the complete\nquality catalog with priorities and measurable scenarios.\u003c/p>\n"},{"kind":"prose","text":"The quality goals, in this order: **confidentiality** (raw audio never leaves the device, and only","line":30,"renderedHtml":""},{"kind":"prose","text":"people who consented are captured), **performance** (speech reaches the session log without","line":31,"renderedHtml":""},{"kind":"prose","text":"noticeable delay), **resumability** (after a network drop, everything continues without lost or","line":32,"renderedHtml":""},{"kind":"prose","text":"duplicated events) and **usability** (participants see what was captured from them).","line":33,"renderedHtml":""},{"kind":"prose","text":"","line":34,"renderedHtml":""},{"kind":"prose","text":"See [10-quality-requirements.arc42.md](10-quality-requirements.arc42.md) for the complete","line":35,"renderedHtml":""},{"kind":"prose","text":"quality catalog with priorities and measurable scenarios.","line":36,"renderedHtml":""},{"kind":"prose","text":"","line":37,"renderedHtml":""},{"kind":"heading","level":2,"text":"1.3 Stakeholders","line":38},{"kind":"prose","text":"","line":39,"renderedHtml":"\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Role\u003c/th>\n\u003cth>Contact\u003c/th>\n\u003cth>Expectations\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Initiator / product owner\u003c/td>\n\u003ctd>Repository owner (OPEN: name)\u003c/td>\n\u003ctd>A sound overall design that the own team can use early\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Human meeting participants\u003c/td>\n\u003ctd>Team\u003c/td>\n\u003ctd>Control over what is captured; no friction in the usual meeting tool\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agents (for example Claude Code, custom Agent SDK agents)\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>A simple, file-based interface; no special client features needed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent developers\u003c/td>\n\u003ctd>OPEN\u003c/td>\n\u003ctd>Stable CLI and MCP contracts, a machine-readable event format\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Data protection (GDPR, § 201 German Criminal Code)\u003c/td>\n\u003ctd>OPEN\u003c/td>\n\u003ctd>Consent, data minimisation, deletion, traceability\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Operations\u003c/td>\n\u003ctd>OPEN\u003c/td>\n\u003ctd>Easy self-hosting of the hub (OPEN: self-hosted or cloud?)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"kind":"prose","text":"| Role | Contact | Expectations |","line":40,"renderedHtml":""},{"kind":"prose","text":"|---|---|---|","line":41,"renderedHtml":""},{"kind":"prose","text":"| Initiator / product owner | Repository owner (OPEN: name) | A sound overall design that the own team can use early |","line":42,"renderedHtml":""},{"kind":"prose","text":"| Human meeting participants | Team | Control over what is captured; no friction in the usual meeting tool |","line":43,"renderedHtml":""},{"kind":"prose","text":"| Agents (for example Claude Code, custom Agent SDK agents) | — | A simple, file-based interface; no special client features needed |","line":44,"renderedHtml":""},{"kind":"prose","text":"| Agent developers | OPEN | Stable CLI and MCP contracts, a machine-readable event format |","line":45,"renderedHtml":""},{"kind":"prose","text":"| Data protection (GDPR, § 201 German Criminal Code) | OPEN | Consent, data minimisation, deletion, traceability |","line":46,"renderedHtml":""},{"kind":"prose","text":"| Operations | OPEN | Easy self-hosting of the hub (OPEN: self-hosted or cloud?) |","line":47,"renderedHtml":""},{"kind":"prose","text":"","line":48,"renderedHtml":""}]},{"filePath":"docs/architecture/02-constraints.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Architecture Constraints","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"heading","level":2,"text":"Data protection and confidentiality of speech","line":3},{"kind":"prose","text":"","line":4,"renderedHtml":"\u003cp>Listening in meetings touches the GDPR and § 201 of the German Criminal Code (confidentiality of\nthe spoken word). People who are captured must have consented, and they must be able to see that\nthey are captured. Captured content needs retention and deletion rules.\u003c/p>\n"},{"kind":"prose","text":"Listening in meetings touches the GDPR and § 201 of the German Criminal Code (confidentiality of","line":5,"renderedHtml":""},{"kind":"prose","text":"the spoken word). People who are captured must have consented, and they must be able to see that","line":6,"renderedHtml":""},{"kind":"prose","text":"they are captured. Captured content needs retention and deletion rules.","line":7,"renderedHtml":""},{"kind":"prose","text":"","line":8,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-privacy-law","title":"GDPR and § 201 German Criminal Code","category":"organizational","source":"Legislation (DE/EU)"},"startLine":10,"endLine":15,"inArc42Fence":true},{"kind":"prose","text":"","line":17,"renderedHtml":""},{"kind":"heading","level":2,"text":"Agents work in turns","line":18},{"kind":"prose","text":"","line":19,"renderedHtml":"\u003cp>Today&#39;s agents work in turns. Standard MCP clients usually do not pass server notifications on to\nthe model. The model only sees tool results. So the live connection must not depend on push\nfeatures of the client. An agent finishes a turn and then waits for a new prompt; something\noutside the agent must start its next turn (\u003ccode>dec-agent-runner-acp\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"Today's agents work in turns. Standard MCP clients usually do not pass server notifications on to","line":20,"renderedHtml":""},{"kind":"prose","text":"the model. The model only sees tool results. So the live connection must not depend on push","line":21,"renderedHtml":""},{"kind":"prose","text":"features of the client. An agent finishes a turn and then waits for a new prompt; something","line":22,"renderedHtml":""},{"kind":"prose","text":"outside the agent must start its next turn (`dec-agent-runner-acp`).","line":23,"renderedHtml":""},{"kind":"prose","text":"","line":24,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-turn-based-agents","title":"Agents work in turns; MCP push is rarely supported","category":"technical","source":"Behaviour of common agent clients (2026)"},"startLine":26,"endLine":31,"inArc42Fence":true},{"kind":"prose","text":"","line":33,"renderedHtml":""},{"kind":"heading","level":2,"text":"No intelligence in the hub","line":34},{"kind":"prose","text":"","line":35,"renderedHtml":"\u003cp>The office hub contains no LLM and makes no judgements about content. It stores, calculates,\nrenders and checks against rules. The hub holds the state of the team and needs governance:\nevery result of the hub must be deterministic and traceable. The agent does the judging and the\nwording.\u003c/p>\n\u003cp>The rule applies to the hub only. The participant client runs on the computer of a participant\nand may contain models, generative or not: the ears transcribe with a speech model, and the\nagent runner may ask a decision model that the user brings (\u003ccode>dec-models-in-client\u003c/code>).\nSpeech-to-text counts as conversion, not as judgement.\u003c/p>\n"},{"kind":"prose","text":"The office hub contains no LLM and makes no judgements about content. It stores, calculates,","line":36,"renderedHtml":""},{"kind":"prose","text":"renders and checks against rules. The hub holds the state of the team and needs governance:","line":37,"renderedHtml":""},{"kind":"prose","text":"every result of the hub must be deterministic and traceable. The agent does the judging and the","line":38,"renderedHtml":""},{"kind":"prose","text":"wording.","line":39,"renderedHtml":""},{"kind":"prose","text":"","line":40,"renderedHtml":""},{"kind":"prose","text":"The rule applies to the hub only. The participant client runs on the computer of a participant","line":41,"renderedHtml":""},{"kind":"prose","text":"and may contain models, generative or not: the ears transcribe with a speech model, and the","line":42,"renderedHtml":""},{"kind":"prose","text":"agent runner may ask a decision model that the user brings (`dec-models-in-client`).","line":43,"renderedHtml":""},{"kind":"prose","text":"Speech-to-text counts as conversion, not as judgement.","line":44,"renderedHtml":""},{"kind":"prose","text":"","line":45,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-no-intelligence","title":"No intelligence of its own in the hub","category":"convention","source":"Product vision; scope limited to the hub by the maintainer on 2026-11-11"},"startLine":47,"endLine":52,"inArc42Fence":true},{"kind":"prose","text":"","line":54,"renderedHtml":""},{"kind":"heading","level":2,"text":"Headset required for the ears","line":55},{"kind":"prose","text":"","line":56,"renderedHtml":"\u003cp>The first stage has no echo cancellation and no voice print. Only a headset makes sure that the\nears hear nothing but their owner. Use with loudspeakers is not supported. Issue #1 describes how\nto lift this constraint.\u003c/p>\n"},{"kind":"prose","text":"The first stage has no echo cancellation and no voice print. Only a headset makes sure that the","line":57,"renderedHtml":""},{"kind":"prose","text":"ears hear nothing but their owner. Use with loudspeakers is not supported. Issue #1 describes how","line":58,"renderedHtml":""},{"kind":"prose","text":"to lift this constraint.","line":59,"renderedHtml":""},{"kind":"prose","text":"","line":60,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-headset-only","title":"Ears only with a headset (no echo cancellation, no voice print)","category":"technical","source":"Scope of the first stage; to be lifted by issue #1"},"startLine":62,"endLine":67,"inArc42Fence":true},{"kind":"prose","text":"","line":69,"renderedHtml":""},{"kind":"heading","level":2,"text":"Any meeting tool, unchanged","line":70},{"kind":"prose","text":"","line":71,"renderedHtml":"\u003cp>Teams keep their meeting tool (Zoom, Teams, Meet, Jitsi …). The office must work without any\nintegration into these tools.\u003c/p>\n"},{"kind":"prose","text":"Teams keep their meeting tool (Zoom, Teams, Meet, Jitsi …). The office must work without any","line":72,"renderedHtml":""},{"kind":"prose","text":"integration into these tools.","line":73,"renderedHtml":""},{"kind":"prose","text":"","line":74,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-any-meeting-tool","title":"Any meeting tool, unchanged","category":"organizational","source":"Product vision"},"startLine":76,"endLine":81,"inArc42Fence":true},{"kind":"prose","text":"","line":83,"renderedHtml":""},{"kind":"heading","level":2,"text":"No unit tests","line":84},{"kind":"prose","text":"","line":85,"renderedHtml":"\u003cp>We do not w
