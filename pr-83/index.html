 talks JSON-RPC with it over its standard input and output. The\ncontract is the published protocol; the client takes the client side and the harness the agent\nside (\u003ccode>dec-agent-runner-acp\u003c/code>):\u003c/p>\n\u003cul>\n\u003cli>The runner opens one ACP session per meeting and hands it the office tools as an MCP server\nthat runs with the key of the agent.\u003c/li>\n\u003cli>It sends prompts: a first one with the role and the meeting, then what was said.\u003c/li>\n\u003cli>It answers the requests of the harness for permission to use a tool by a rule of the user\n(\u003ccode>dec-agent-runner-delivery\u003c/code>). It offers no access to its file system or terminal.\u003c/li>\n\u003cli>It ends the harness when the runner ends.\u003c/li>\n\u003c/ul>\n"},{"kind":"prose","text":"The participant client is the client of the Agent Client Protocol (ACP) for an agent harness,","line":629,"renderedHtml":""},{"kind":"prose","text":"for example Claude Code through its ACP adapter, opencode or Kiro. The agent runner starts the","line":630,"renderedHtml":""},{"kind":"prose","text":"harness as a child process and talks JSON-RPC with it over its standard input and output. The","line":631,"renderedHtml":""},{"kind":"prose","text":"contract is the published protocol; the client takes the client side and the harness the agent","line":632,"renderedHtml":""},{"kind":"prose","text":"side (`dec-agent-runner-acp`):","line":633,"renderedHtml":""},{"kind":"prose","text":"","line":634,"renderedHtml":""},{"kind":"prose","text":"- The runner opens one ACP session per meeting and hands it the office tools as an MCP server","line":635,"renderedHtml":""},{"kind":"prose","text":"  that runs with the key of the agent.","line":636,"renderedHtml":""},{"kind":"prose","text":"- It sends prompts: a first one with the role and the meeting, then what was said.","line":637,"renderedHtml":""},{"kind":"prose","text":"- It answers the requests of the harness for permission to use a tool by a rule of the user","line":638,"renderedHtml":""},{"kind":"prose","text":"  (`dec-agent-runner-delivery`). It offers no access to its file system or terminal.","line":639,"renderedHtml":""},{"kind":"prose","text":"- It ends the harness when the runner ends.","line":640,"renderedHtml":""},{"kind":"prose","text":"","line":641,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-acp-client","title":"Agent Client Protocol (client side)","provider":"bb-participant-client","x-realized-by":"bb-agent-runner","protocol":"ACP, JSON-RPC over stdio (agentclientprotocol.com)","path":"client/agentrunner"},"startLine":643,"endLine":650,"inArc42Fence":true},{"kind":"prose","text":"","line":652,"renderedHtml":""},{"kind":"heading","level":3,"text":"Decision model","line":653},{"kind":"prose","text":"","line":654,"renderedHtml":"\u003cp>The contract for a decision model that the user brings (\u003ccode>dec-byo-decision-model\u003c/code>). At each change\nof speaker, the agent runner sends a request: the session, the agent and its role, the\nparticipants, the recent context and the new utterances, and who ended the turn. The model\nanswers with structured output:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>act\u003c/code>: whether the agent should act now;\u003c/li>\n\u003cli>\u003ccode>addressed\u003c/code>: the participant whom the speaker addressed, or empty;\u003c/li>\n\u003cli>\u003ccode>topic_closed\u003c/code>: whether a block of topics has ended;\u003c/li>\n\u003cli>\u003ccode>reason\u003c/code>: a short reason, for the log of the runner.\u003c/li>\n\u003c/ul>\n\u003cp>The model is reached in one of two ways: an OpenAI-compatible chat endpoint with structured\noutput by JSON schema, or a command that reads the request as JSON on its standard input and\nwrites the answer as JSON on its standard output. The contract owns the request, the answer and\nits JSON schema.\u003c/p>\n"},{"kind":"prose","text":"The contract for a decision model that the user brings (`dec-byo-decision-model`). At each change","line":655,"renderedHtml":""},{"kind":"prose","text":"of speaker, the agent runner sends a request: the session, the agent and its role, the","line":656,"renderedHtml":""},{"kind":"prose","text":"participants, the recent context and the new utterances, and who ended the turn. The model","line":657,"renderedHtml":""},{"kind":"prose","text":"answers with structured output:","line":658,"renderedHtml":""},{"kind":"prose","text":"","line":659,"renderedHtml":""},{"kind":"prose","text":"- `act`: whether the agent should act now;","line":660,"renderedHtml":""},{"kind":"prose","text":"- `addressed`: the participant whom the speaker addressed, or empty;","line":661,"renderedHtml":""},{"kind":"prose","text":"- `topic_closed`: whether a block of topics has ended;","line":662,"renderedHtml":""},{"kind":"prose","text":"- `reason`: a short reason, for the log of the runner.","line":663,"renderedHtml":""},{"kind":"prose","text":"","line":664,"renderedHtml":""},{"kind":"prose","text":"The model is reached in one of two ways: an OpenAI-compatible chat endpoint with structured","line":665,"renderedHtml":""},{"kind":"prose","text":"output by JSON schema, or a command that reads the request as JSON on its standard input and","line":666,"renderedHtml":""},{"kind":"prose","text":"writes the answer as JSON on its standard output. The contract owns the request, the answer and","line":667,"renderedHtml":""},{"kind":"prose","text":"its JSON schema.","line":668,"renderedHtml":""},{"kind":"prose","text":"","line":669,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-decision-model","title":"Decision model","provider":"bb-participant-client","x-realized-by":"bb-agent-runner","protocol":"OpenAI-compatible chat completions with JSON schema, or JSON on stdin and stdout of a command","path":"client/agentrunner/decision"},"startLine":671,"endLine":678,"inArc42Fence":true},{"kind":"prose","text":"","line":680,"renderedHtml":""},{"kind":"heading","level":3,"text":"Client core","line":681},{"kind":"prose","text":"","line":682,"renderedHtml":"\u003cp>The shared core of the CLI, the MCP server and the ears (&quot;one core, two adapters&quot;,\n\u003ccode>dec-cli-and-mcp\u003c/code>). It holds the configuration of a participant, authenticates with Identity,\ncreates the command IDs and calls the interfaces of the office hub. It reads the import format\nof conversations and sends a conversation to the session import in pages\n(\u003ccode>dec-import-format\u003c/code>), so the CLI and the MCP server import in the same way. The adapters add only their\nown way of talking to a human or an agent.\u003c/p>\n"},{"kind":"prose","text":"The shared core of the CLI, the MCP server and the ears (\"one core, two adapters\",","line":683,"renderedHtml":""},{"kind":"prose","text":"`dec-cli-and-mcp`). It holds the configuration of a participant, authenticates with Identity,","line":684,"renderedHtml":""},{"kind":"prose","text":"creates the command IDs and calls the interfaces of the office hub. It reads the import format","line":685,"renderedHtml":""},{"kind":"prose","text":"of conversations and sends a conversation to the session import in pages","line":686,"renderedHtml":""},{"kind":"prose","text":"(`dec-import-format`), so the CLI and the MCP server import in the same way. The adapters add only their","line":687,"renderedHtml":""},{"kind":"prose","text":"own way of talking to a human or an agent.","line":688,"renderedHtml":""},{"kind":"prose","text":"","line":689,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-client-core","title":"Client core","technology":"Go","parent":"bb-participant-client","path":"client/core","requires":"if-session-commands, if-session-import, if-auth-api, if-decision-api, if-minutes-api, if-note-api, if-task-api, if-slides-api"},"startLine":691,"endLine":698,"inArc42Fence":true},{"kind":"prose","text":"","line":700,"renderedHtml":""},{"kind":"heading","level":4,"text":"Client core API","line":701},{"kind":"prose","text":"","line":702,"renderedHtml":"\u003cp>The in-process interface of the client core for the adapters: configuration, authenticated\nclients of the office hub, command IDs and the commands of a participant.\u003c/p>\n"},{"kind":"prose","text":"The in-process interface of the client core for the adapters: configuration, authenticated","line":703,"renderedHtml":""},{"kind":"prose","text":"clients of the office hub, command IDs and the commands of a participant.","line":704,"renderedHtml":""},{"kind":"prose","text":"","line":705,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-client-core","title":"Client core API","provider":"bb-client-core","protocol":"In-process Go call","path":"client/core"},"startLine":707,"endLine":713,"inArc42Fence":true},{"kind":"prose","text":"","line":715,"renderedHtml":""},{"kind":"heading","level":3,"text":"office CLI","line":716},{"kind":"prose","text":"","line":717,"renderedHtml":"\u003cp>The main access for humans and for agents with a shell. \u003ccode>office meeting join &lt;session&gt; [--mic]\u003c/code>\nstarts the replication and prints the log path. \u003ccode>office agent run\u003c/code> starts the agent runner for\nan agent harness. With \u003ccode>--mic\u003c/code>, the terminal shows the user&#39;s own\nutterances with their status (partial → final → sent / off the record). Keys let the user pause and\nmark a sentence off the record. \u003ccode>office session import &lt;file&gt;\u003c/code> imports a conversation from a\nfile in the import format of the client (\u003ccode>dec-import-format\u003c/code>). Other commands cover slides, the\nstage, decisions, minutes, notes and tasks.\u003c/p>\n"},{"kind":"prose","text":"The main access for humans and for agents with a shell. `office meeting join \u003csession> [--mic]`","line":718,"renderedHtml":""},{"kind":"prose","text":"starts the replication and prints the log path. `office agent run` starts the agent runner for","line":719,"renderedHtml":""},{"kind":"prose","text":"an agent harness. With `--mic`, the terminal shows the user's own","line":720,"renderedHtml":""},{"kind":"prose","text":"utterances with their status (partial → final → sent / off the record). Keys let the user pause and","line":721,"renderedHtml":""},{"kind":"prose","text":"mark a sentence off the record. `office session import \u003cfile>` imports a conversation from a","line":722,"renderedHtml":""},{"kind":"prose","text":"file in the import format of the client (`dec-import-format`). Other commands cover slides, the","line":723,"renderedHtml":""},{"kind":"prose","text":"stage, decisions, minutes, notes and tasks.","line":724,"renderedHtml":""},{"kind":"prose","text":"","line":725,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-cli","title":"office CLI","technology":"Go, single binary","parent":"bb-participant-client","requires":"if-client-core, if-replication, if-session-commands, if-slides-api, if-auth-api","implements":"concept-read-file-write-tools","path":"client/cli"},"startLine":727,"endLine":735,"inArc42Fence":true},{"kind":"prose","text":"","line":737,"renderedHtml":""},{"kind":"heading","level":3,"text":"MCP server","line":738},{"kind":"prose","text":"","line":739,"renderedHtml":"\u003cp>A local MCP server (stdio) with the same features as the CLI. \u003ccode>meeting.join\u003c/code> starts the\nreplication and returns the path to the log file. The replication lives as long as the MCP\nprocess.\u003c/p>\n"},{"kind":"prose","text":"A local MCP server (stdio) with the same features as the CLI. `meeting.join` starts the","line":740,"renderedHtml":""},{"kind":"prose","text":"replication and returns the path to the log file. The replication lives as long as the MCP","line":741,"renderedHtml":""},{"kind":"prose","text":"process.","line":742,"renderedHtml":""},{"kind":"prose","text":"","line":743,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-mcp","title":"MCP server","technology":"Go / official MCP Go SDK","parent":"bb-participant-client","requires":"if-client-core, if-replication, if-session-commands, if-slides-api, if-auth-api","implements":"concept-read-file-write-tools","path":"client/mcp"},"startLine":745,"endLine":753,"inArc42Fence":true},{"kind":"prose","text":"","line":755,"renderedHtml":""},{"kind":"heading","level":3,"text":"Agent runner","line":756},{"kind":"prose","text":"","line":757,"renderedHtml":"\u003cp>Keeps an agent in the meeting (\u003ccode>dec-agent-runner-acp\u003c/code>). Agents work in turns\n(\u003ccode>con-turn-based-agents\u003c/code>): after a turn they wait for a human. The runner does not wait. For one\nsession and one agent key, it:\u003c/p>\n\u003cul>\n\u003cli>joins the session as the agent and runs the log replicator in its own process, so it follows\nthe local log of the agent;\u003c/li>\n\u003cli>starts the agent harness, opens one ACP session and hands it the office tools as an MCP server\nwith the key of the agent;\u003c/li>\n\u003cli>sends a first prompt with the role of the agent and the meeting;\u003c/li>\n\u003cli>after each utterance of another participant, checks whether to wake the agent\n(\u003ccode>dec-wake-check-per-utterance\u003c/code>): it asks the decision model, if the user brought one\n(\u003ccode>dec-byo-decision-model\u003c/code>), and wakes the agent when the model says it should act or a block\nof topics has ended; if the model fails or is slow, it wakes the agent;\u003c/li>\n\u003cli>when it wakes the agent, sends what others said since its last delivery, with who said it and\nwhether that participant is a human or an agent. It leaves out the agent&#39;s own utterances and\nsentences off the record. While the agent works, it queues what comes and sends it together\nafterwards, so nothing is lost and nothing is sent twice (\u003ccode>dec-agent-runner-delivery\u003c/code>);\u003c/li>\n\u003cli>after the session ends, sends a last prompt and stops the harness.\u003c/li>\n\u003c/ul>\n\u003cp>The runner never speaks for the agent and judges nothing itself: the agent decides whether it is\naddressed and acts through the office tools. Whatever the harness writes as a reply is only\nlogged.\u003c/p>\n"},{"kind":"prose","text":"Keeps an agent in the meeting (`dec-agent-runner-acp`). Agents work in turns","line":758,"renderedHtml":""},{"kind":"prose","text":"(`con-turn-based-agents`): after a turn they wait for a human. The runner does not wait. For one","line":759,"renderedHtml":""},{"kind":"prose","text":"session and one agent key, it:","line":760,"renderedHtml":""},{"kind":"prose","text":"","line":761,"renderedHtml":""},{"kind":"prose","text":"- joins the session as the agent and runs the log replicator in its own process, so it follows","line":762,"renderedHtml":""},{"kind":"prose","text":"  the local log of the agent;","line":763,"renderedHtml":""},{"kind":"prose","text":"- starts the agent harness, opens one ACP session and hands it the office tools as an MCP server","line":764,"renderedHtml":""},{"kind":"prose","text":"  with the key of the agent;","line":765,"renderedHtml":""},{"kind":"prose","text":"- sends a first prompt with the role of the agent and the meeting;","line":766,"renderedHtml":""},{"kind":"prose","text":"- after each utterance of another participant, checks whether to wake the agent","line":767,"renderedHtml":""},{"kind":"prose","text":"  (`dec-wake-check-per-utterance`): it asks the decision model, if the user brought one","line":768,"renderedHtml":""},{"kind":"prose","text":"  (`dec-byo-decision-model`), and wakes the agent when the model says it should act or a block","line":769,"renderedHtml":""},{"kind":"prose","text":"  of topics has ended; if the model fails or is slow, it wakes the agent;","line":770,"renderedHtml":""},{"kind":"prose","text":"- when it wakes the agent, sends what others said since its last delivery, with who said it and","line":771,"renderedHtml":""},{"kind":"prose","text":"  whether that participant is a human or an agent. It leaves out the agent's own utterances and","line":772,"renderedHtml":""},{"kind":"prose","text":"  sentences off the record. While the agent works, it queues what comes and sends it together","line":773,"renderedHtml":""},{"kind":"prose","text":"  afterwards, so nothing is lost and nothing is sent twice (`dec-agent-runner-delivery`);","line":774,"renderedHtml":""},{"kind":"prose","text":"- after the session ends, sends a last prompt and stops the harness.","line":775,"renderedHtml":""},{"kind":"prose","text":"","line":776,"renderedHtml":""},{"kind":"prose","text":"The runner never speaks for the agent and judges nothing itself: the agent decides whether it is","line":777,"renderedHtml":""},{"kind":"prose","text":"addressed and acts through the office tools. Whatever the harness writes as a reply is only","line":778,"renderedHtml":""},{"kind":"prose","text":"logged.","line":779,"renderedHtml":""},{"kind":"prose","text":"","line":780,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-agent-runner","title":"Agent runner","technology":"Go / Agent Client Protocol","parent":"bb-participant-client","requires":"if-client-core, if-replication, if-session-commands","implements":"concept-read-file-write-tools, concept-participant-model","path":"client/agentrunner"},"startLine":782,"endLine":790,"inArc42Fence":true},{"kind":"prose","text":"","line":792,"renderedHtml":""},{"kind":"heading","level":3,"text":"Log replicator","line":793},{"kind":"prose","text":"","line":794,"renderedHtml":"\u003cp>A local process. It keeps a connection to the session stream and appends every event as one line to\na file. There is one file per session and participant, in a private runtime directory of the user,\nso several participants on one machine (for example a human and an agent) do not collide and no\nother user can read the file. After a drop, it reconnects and continues after the last complete\nline in the file. On \u003ccode>session.ended\u003c/code> it writes a final line and stops.\nIt also stops when its parent process dies.\u003c/p>\n\u003cp>If the hub does not know its cursor, the hub has lost events (\u003ccode>dec-restore-from-peers\u003c/code>). The\nreplicator then offers the events the hub misses, with the signed tree head it keeps, through the\nsession commands. It retries until the hub has its cursor again, from its own copy or from another\npeer. Before it goes on, it checks that the log of the hub up to the cursor has the same root\nhash as the local log; if not, it stops with an error instead of continuing a copy that forks.\u003c/p>\n"},{"kind":"prose","text":"A local process. It keeps a connection to the session stream and appends every event as one line to","line":795,"renderedHtml":""},{"kind":"prose","text":"a file. There is one file per session and participant, in a private runtime directory of the user,","line":796,"renderedHtml":""},{"kind":"prose","text":"so several participants on one machine (for example a human and an agent) do not collide and no","line":797,"renderedHtml":""},{"kind":"prose","text":"other user can read the file. After a drop, it reconnects and continues after the last complete","line":798,"renderedHtml":""},{"kind":"prose","text":"line in the file. On `session.ended` it writes a final line and stops.","line":799,"renderedHtml":""},{"kind":"prose","text":"It also stops when its parent process dies.","line":800,"renderedHtml":""},{"kind":"prose","text":"","line":801,"renderedHtml":""},{"kind":"prose","text":"If the hub does not know its cursor, the hub has lost events (`dec-restore-from-peers`). The","line":802,"renderedHtml":""},{"kind":"prose","text":"replicator then offers the events the hub misses, with the signed tree head it keeps, through the","line":803,"renderedHtml":""},{"kind":"prose","text":"session commands. It retries until the hub has its cursor again, from its own copy or from another","line":804,"renderedHtml":""},{"kind":"prose","text":"peer. Before it goes on, it checks that the log of the hub up to the cursor has the same root","line":805,"renderedHtml":""},{"kind":"prose","text":"hash as the local log; if not, it stops with an error instead of continuing a copy that forks.","line":806,"renderedHtml":""},{"kind":"prose","text":"","line":807,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-replicator","title":"Log replicator","technology":"Go / connect-go","parent":"bb-participant-client","requires":"if-session-stream, if-session-commands","implements":"concept-event-log, concept-read-file-write-tools, concept-test-strategy","path":"client/replicator"},"startLine":809,"endLine":817,"inArc42Fence":true},{"kind":"prose","text":"","line":819,"renderedHtml":""},{"kind":"heading","level":4,"text":"Replication control","line":820},{"kind":"prose","text":"","line":821,"renderedHtml":"\u003cp>The in-process interface to start the replication of a session for a participant, to find a\nrunning replicator and to stop it. The CLI runs the replicator as its own process; the MCP server\nruns it inside its own process.\u003c/p>\n"},{"kind":"prose","text":"The in-process interface to start the replication of a session for a participant, to find a","line":822,"renderedHtml":""},{"kind":"prose","text":"running replicator and to stop it. The CLI runs the replicator as its own process; the MCP server","line":823,"renderedHtml":""},{"kind":"prose","text":"runs it inside its own process.","line":824,"renderedHtml":""},{"kind":"prose","text":"","line":825,"renderedHtml":""},{"kind":"ignore","ruleCode":"H020","reason":"The local log is a file for actors, replication control is an in-process call; both are realized by the replicator","startLine":827,"endLine":827},{"kind":"block","blockType":"interface","attributes":{"id":"if-replication","title":"Replication control","provider":"bb-replicator","protocol":"In-process Go call","path":"client/replicator"},"startLine":828,"endLine":834,"inArc42Fence":true},{"kind":"prose","text":"","line":836,"renderedHtml":""},{"kind":"heading","level":3,"text":"Ears","line":837},{"kind":"prose","text":"","line":838,"renderedHtml":"\u003cp>Only for humans with \u003ccode>--mic\u003c/code>. Pipeline: microphone → VAD → Whisper (local) → utterances to the\nsession. The first stage needs a headset and has no voice print and no echo cancellation\n(\u003ccode>con-headset-only\u003c/code>). Raw audio never leaves the device. During a network drop, the ears keep\ntranscribing and queue the utterances locally. They send them in order once the connection is back.\nThe ears choose their speech model by language and speed (\u003ccode>dec-model-download\u003c/code>). They give Whisper\nthe vocabulary of the project and the names of the participants as a prompt\n(\u003ccode>dec-vocabulary-prompt\u003c/code>); the CLI reads the names from the local log and passes them on.\u003c/p>\n"},{"kind":"prose","text":"Only for humans with `--mic`. Pipeline: microphone → VAD → Whisper (local) → utterances to the","line":839,"renderedHtml":""},{"kind":"prose","text":"session. The first stage needs a headset and has no voice print and no echo cancellation","line":840,"renderedHtml":""},{"kind":"prose","text":"(`con-headset-only`). Raw audio never leaves the device. During a network drop, the ears keep","line":841,"renderedHtml":""},{"kind":"prose","text":"transcribing and queue the utterances locally. They send them in order once the connection is back.","line":842,"renderedHtml":""},{"kind":"prose","text":"The ears choose their speech model by language and speed (`dec-model-download`). They give Whisper","line":843,"renderedHtml":""},{"kind":"prose","text":"the vocabulary of the project and the names of the participants as a prompt","line":844,"renderedHtml":""},{"kind":"prose","text":"(`dec-vocabulary-prompt`); the CLI reads the names from the local log and passes them on.","line":845,"renderedHtml":""},{"kind":"prose","text":"","line":846,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-ears","title":"Ears","parent":"bb-participant-client","technology":"Go / whisper.cpp, including its voice activity detection","requires":"if-client-core, if-session-commands","implements":"concept-edge-transcription, concept-test-strategy","path":"client/ears"},"startLine":848,"endLine":856,"inArc42Fence":true},{"kind":"prose","text":"","line":858,"renderedHtml":""},{"kind":"prose","text":"","line":859,"renderedHtml":""}]},{"filePath":"docs/architecture/06-runtime-view.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Runtime View","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"heading","level":2,"text":"Agent joins a meeting","line":3},{"kind":"prose","text":"","line":4,"renderedHtml":"\u003cp>The agent calls \u003ccode>meeting.join\u003c/code>. The MCP server registers it as a participant, starts the log\nreplicator and returns the file path. The agent follows the file in the background. It filters for\nthe events that should wake it up, for example \u003ccode>turn.end\u003c/code> and \u003ccode>addressed\u003c/code>.\u003c/p>\n"},{"kind":"prose","text":"The agent calls `meeting.join`. The MCP server registers it as a participant, starts the log","line":5,"renderedHtml":""},{"kind":"prose","text":"replicator and returns the file path. The agent follows the file in the background. It filters for","line":6,"renderedHtml":""},{"kind":"prose","text":"the events that should wake it up, for example `turn.end` and `addressed`.","line":7,"renderedHtml":""},{"kind":"prose","text":"","line":8,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-agent-joins","title":"Agent joins a meeting","trigger":"Agent calls meeting.join","involves":"bb-mcp, bb-client-core, bb-session-service, bb-replicator, bb-participant-client, bb-office-hub"},"startLine":10,"endLine":15,"inArc42Fence":true},{"kind":"prose","text":"","line":17,"renderedHtml":""},{"kind":"diagram","diagramType":"sequence","id":"seq-agent-joins","scenario":"rs-agent-joins","notation":"mermaid-sequence","aliases":"actor_agent=actor-agent, bb_mcp=bb-mcp, bb_session=bb-session-service, bb_replicator=bb-replicator","source":"sequenceDiagram\n    participant actor_agent as Agent\n    participant bb_mcp as MCP server\n    participant bb_session as Meeting session\n    participant bb_replicator as Log replicator\n    actor_agent->>bb_mcp: meeting.join(session)\n    bb_mcp->>bb_session: join (kind=agent)\n    bb_session-->>bb_mcp: participant id\n    bb_mcp->>bb_replicator: start(session, path)\n    bb_replicator->>bb_session: subscribe(cursor=0)\n    bb_mcp-->>actor_agent: participant, log path\n    bb_session-->>bb_replicator: events (live)\n    actor_agent->>bb_replicator: tail -f path | filter","startLine":19,"endLine":41},{"kind":"prose","text":"","line":42,"renderedHtml":""},{"kind":"heading","level":2,"text":"Human speaks","line":43},{"kind":"prose","text":"","line":44,"renderedHtml":"\u003cp>A human joined with \u003ccode>--mic\u003c/code>. The ears detect the end of a sentence, Whisper transcribes it locally,\nand the utterance is sent. The session appends it to the log. Every replicator writes it to its\nlocal file. The speaker&#39;s terminal shows the status &quot;sent&quot;.\u003c/p>\n"},{"kind":"prose","text":"A human joined with `--mic`. The ears detect the end of a sentence, Whisper transcribes it locally,","line":45,"renderedHtml":""},{"kind":"prose","text":"and the utterance is sent. The session appends it to the log. Every replicator writes it to its","line":46,"renderedHtml":""},{"kind":"prose","text":"local file. The speaker's terminal shows the status \"sent\".","line":47,"renderedHtml":""},{"kind":"prose","text":"","line":48,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-human-speaks","title":"Human speaks, agent receives the sentence","trigger":"End of sentence (VAD pause) in the headset signal","involves":"bb-ears, bb-client-core, bb-session-service, bb-replicator, bb-cli, bb-participant-client, bb-office-hub"},"startLine":50,"endLine":55,"inArc42Fence":true},{"kind":"prose","text":"","line":57,"renderedHtml":""},{"kind":"diagram","diagramType":"sequence","id":"seq-human-speaks","scenario":"rs-human-speaks","notation":"mermaid-sequence","aliases":"actor_human=actor-human, bb_ears=bb-ears, bb_session=bb-session-service, bb_replicator=bb-replicator, bb_cli=bb-cli","source":"sequenceDiagram\n    participant actor_human as Human\n    participant bb_ears as Ears\n    participant bb_session as Meeting session\n    participant bb_replicator as Log replicator\n    participant bb_cli as office CLI\n    actor_human->>bb_ears: speaks (headset)\n    bb_ears->>bb_ears: VAD + Whisper (local)\n    bb_ears->>bb_session: utterance.submit (text, modality=voice)\n    bb_session-->>bb_ears: event id\n    bb_session-->>bb_replicator: utterance.final\n    bb_replicator->>bb_replicator: append line\n    bb_cli->>bb_replicator: read own events\n    bb_cli-->>actor_human: status sent","startLine":59,"endLine":82},{"kind":"prose","text":"","line":83,"renderedHtml":""},{"kind":"heading","level":2,"text":"Network drop and resume","line":84},{"kind":"prose","text":"","line":85,"renderedHtml":"\u003cp>The network of a participant drops for a while. The ears keep transcribing and queue utterances\nlocally. The replicator loses the stream. When the network is back, the ears send the queued\nutterances in order. Each one carries its client ID, so nothing is stored twice. The replicator\nreconnects with the ID of its last line and receives everything it missed.\u003c/p>\n"},{"kind":"prose","text":"The network of a participant drops for a while. The ears keep transcribing and queue utterances","line":86,"renderedHtml":""},{"kind":"prose","text":"locally. The replicator loses the stream. When the network is back, the ears send the queued","line":87,"renderedHtml":""},{"kind":"prose","text":"utterances in order. Each one carries its client ID, so nothing is stored twice. The replicator","line":88,"renderedHtml":""},{"kind":"prose","text":"reconnects with the ID of its last line and receives everything it missed.","line":89,"renderedHtml":""},{"kind":"prose","text":"","line":90,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-network-drop","title":"Network drop and resume","trigger":"Network connection of a participant is lost and comes back","involves":"bb-ears, bb-session-service, bb-replicator, bb-participant-client, bb-office-hub"},"startLine":92,"endLine":97,"inArc42Fence":true},{"kind":"prose","text":"","line":99,"renderedHtml":""},{"kind":"diagram","diagramType":"sequence","id":"seq-network-drop","scenario":"rs-network-drop","notation":"mermaid-sequence","aliases":"bb_ears=bb-ears, bb_session=bb-session-service, bb_replicator=bb-replicator","source":"sequenceDiagram\n    participant bb_ears as Ears\n    participant bb_session as Meeting session\n    participant bb_replicator as Log replicator\n    Note over bb_ears,bb_replicator: network drops\n    bb_ears->>bb_ears: queue utterances (text only)\n    bb_replicator->>bb_replicator: retry with backoff\n    Note over bb_ears,bb_replicator: network is back\n    bb_ears->>bb_session: utterance.submit (client id, in order)\n    bb_session-->>bb_ears: event id (existing id if already stored)\n    bb_replicator->>bb_session: subscribe(cursor=last line)\n    bb_session-->>bb_replicator: missed events, then live","startLine":101,"endLine":122},{"kind":"prose","text":"","line":123,"renderedHtml":""},{"kind":"heading","level":2,"text":"Participant authenticates","line":124},{"kind":"prose","text":"","line":125,"renderedHtml":"\u003cp>Before its first call, a client (CLI, MCP server or ears) asks Identity for a challenge. It signs\nthe challenge with its private key and gets a short-lived access token. It sends the token with\nevery call. The session checks the token and knows the participant. Shortly before the token\nexpires, the client repeats the steps. This also happens after a network drop.\u003c/p>\n"},{"kind":"prose","text":"Before its first call, a client (CLI, MCP server or ears) asks Identity for a challenge. It signs","line":126,"renderedHtml":""},{"kind":"prose","text":"the challenge with its private key and gets a short-lived access token. It sends the token with","line":127,"renderedHtml":""},{"kind":"prose","text":"every call. The session checks the token and knows the participant. Shortly before the token","line":128,"renderedHtml":""},{"kind":"prose","text":"expires, the client repeats the steps. This also happens after a network drop.","line":129,"renderedHtml":""},{"kind":"prose","text":"","line":130,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-authenticate","title":"Participant authenticates with its key","trigger":"First call of a client, or the access token is about to expire","involves":"bb-cli, bb-mcp, bb-ears, bb-client-core, bb-identity, bb-session-service, bb-participant-client, bb-office-hub"},"startLine":132,"endLine":137,"inArc42Fence":true},{"kind":"prose","text":"","line":139,"renderedHtml":""},{"kind":"heading","level":2,"text":"Agent raises its hand and shows an artifact","line":140},{"kind":"prose","text":"","line":141,"renderedHtml":"\u003cp>The agent renders a slide deck through the CLI and raises its hand on the stage. The slides part\nstores the input and the rendered deck in the archive before it returns the ID. When the agent\ngets the floor, it shows the deck by its ID. The stage reads the same events from the session\nstream and loads the deck from the slides part inside the hub.\u003c/p>\n"},{"kind":"prose","text":"The agent renders a slide deck through the CLI and raises its hand on the stage. The slides part","line":142,"renderedHtml":""},{"kind":"prose","text":"stores the input and the rendered deck in the archive before it returns the ID. When the agent","line":143,"renderedHtml":""},{"kind":"prose","text":"gets the floor, it shows the deck by its ID. The stage reads the same events from the session","line":144,"renderedHtml":""},{"kind":"prose","text":"stream and loads the deck from the slides part inside the hub.","line":145,"renderedHtml":""},{"kind":"prose","text":"","line":146,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-agent-shows-artifact","title":"Agent raises its hand and shows an artifact","trigger":"Agent decides after turn.end to raise its hand","involves":"bb-cli, bb-slides, bb-archive, bb-session-service, bb-stage, bb-replicator, bb-participant-client, bb-office-hub"},"startLine":148,"endLine":153,"inArc42Fence":true},{"kind":"prose","text":"","line":155,"renderedHtml":""},{"kind":"diagram","diagramType":"sequence","id":"seq-agent-shows-artifact","scenario":"rs-agent-shows-artifact","notation":"mermaid-sequence","aliases":"actor_agent=actor-agent, bb_cli=bb-cli, bb_slides=bb-slides, bb_archive=bb-archive, bb_session=bb-session-service, bb_stage=bb-stage","source":"sequenceDiagram\n    participant actor_agent as Agent\n    participant bb_cli as office CLI\n    participant bb_slides as Slides\n    participant bb_archive as Archive\n    participant bb_session as Meeting session\n    participant bb_stage as Stage\n    actor_agent->>bb_cli: office slides render deck.md\n    bb_cli->>bb_slides: render\n    bb_slides->>bb_archive: commit input and output\n    bb_slides-->>bb_cli: deck slides/42\n    actor_agent->>bb_cli: office hand raise --topic budget\n    bb_cli->>bb_session: hand.raise\n    bb_session-->>bb_stage: hand.raised\n    Note over bb_session: the moderator gives the floor, event addressed\n    actor_agent->>bb_cli: office stage show slides/42\n    bb_cli->>bb_session: stage.show\n    bb_session-->>bb_stage: artifact.shown\n    bb_stage->>bb_slides: load deck slides/42","startLine":157,"endLine":185},{"kind":"prose","text":"","line":186,"renderedHtml":""},{"kind":"heading","level":2,"text":"Human marks a sentence off the record","line":187},{"kind":"prose","text":"","line":188,"renderedHtml":"\u003cp>What is said stays said (\u003ccode>dec-off-the-record\u003c/code>). The human presses a key in the gateway terminal\nto mark their own sentence off the record. The CLI sends \u003ccode>utterance.mark_off_the_record\u003c/code>. The\nhub checks that the caller is the speaker. The log gets a new event \u003ccode>utterance.off_the_record\u003c/code>\nthat points to the original utterance. Existing lines are never rewritten. From then on, the\ninterfaces deliver the utterance only as a placeholder without its text, the stage hides it, and\nit does not go into minutes, decisions or notes. Agents that already read it must respect the\nmark.\u003c/p>\n"},{"kind":"prose","text":"What is said stays said (`dec-off-the-record`). The human presses a key in the gateway terminal","line":189,"renderedHtml":""},{"kind":"prose","text":"to mark their own sentence off the record. The CLI sends `utterance.mark_off_the_record`. The","line":190,"renderedHtml":""},{"kind":"prose","text":"hub checks that the caller is the speaker. The log gets a new event `utterance.off_the_record`","line":191,"renderedHtml":""},{"kind":"prose","text":"that points to the original utterance. Existing lines are never rewritten. From then on, the","line":192,"renderedHtml":""},{"kind":"prose","text":"interfaces deliver the utterance only as a placeholder without its text, the stage hides it, and","line":193,"renderedHtml":""},{"kind":"prose","text":"it does not go into minutes, decisions or notes. Agents that already read it must respect the","line":194,"renderedHtml":""},{"kind":"prose","text":"mark.","line":195,"renderedHtml":""},{"kind":"prose","text":"","line":196,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-off-the-record","title":"Human marks a sentence off the record","trigger":"A key in the gateway terminal","involves":"bb-cli, bb-session-service, bb-replicator, bb-stage, bb-participant-client, bb-office-hub"},"startLine":198,"endLine":203,"inArc42Fence":true},{"kind":"prose","text":"","line":205,"renderedHtml":""},{"kind":"heading","level":2,"text":"Session ends, the minutes are stored","line":206},{"kind":"prose","text":"","line":207,"renderedHtml":"\u003cp>The moderator ends the session. The agent that keeps the minutes writes the final version with\n\u003ccode>minutes.update\u003c/code>. The meeting session stores the confirmed minutes through the minutes interface.\nThe records part writes them as one YAML file into the archive and commits it before it answers\n(\u003ccode>dec-yaml-git-storage\u003c/code>). Only then does the meeting session write \u003ccode>session.ended\u003c/code> to the log. If\nstoring fails, the session does not end, and the moderator can repeat the command. The\nreplicators stop. Afterwards every participant reads the stored minutes through the minutes\ninterface.\u003c/p>\n"},{"kind":"prose","text":"The moderator ends the session. The agent that keeps the minutes writes the final version with","line":208,"renderedHtml":""},{"kind":"prose","text":"`minutes.update`. The meeting session stores the confirmed minutes through the minutes interface.","line":209,"renderedHtml":""},{"kind":"prose","text":"The records part writes them as one YAML file into the archive and commits it before it answers","line":210,"renderedHtml":""},{"kind":"prose","text":"(`dec-yaml-git-storage`). Only then does the meeting session write `session.ended` to the log. If","line":211,"renderedHtml":""},{"kind":"prose","text":"storing fails, the session does not end, and the moderator can repeat the command. The","line":212,"renderedHtml":""},{"kind":"prose","text":"replicators stop. Afterwards every participant reads the stored minutes through the minutes","line":213,"renderedHtml":""},{"kind":"prose","text":"interface.","line":214,"renderedHtml":""},{"kind":"prose","text":"","line":215,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-session-ends","title":"Session ends, the minutes are stored","trigger":"The moderator ends the session","involves":"bb-mcp, bb-cli, bb-session-service, bb-records, bb-archive, bb-replicator, bb-participant-client, bb-office-hub"},"startLine":217,"endLine":222,"inArc42Fence":true},{"kind":"prose","text":"","line":224,"renderedHtml":""},{"kind":"heading","level":2,"text":"Agent creates a task, a human finishes it","line":225},{"kind":"prose","text":"","line":226,"renderedHtml":"\u003cp>In a meeting, a human asks the agent to note a task for a colleague. The agent calls\n\u003ccode>task.create\u003c/code> with a title, the assignee and the session. The tasks part checks the token, writes\nthe task as one YAML file into the archive and commits it before it answers with the reference of\nthe task (\u003ccode>dec-yaml-git-storage\u003c/code>). Later the assignee lists the open tasks assigned to them and\nsets the status to done. The tasks part rewrites the file in a new commit, so the archive keeps\nthe history. Both commands carry an ID created by the client, so a repeat after a network drop\nchanges nothing.\u003c/p>\n"},{"kind":"prose","text":"In a meeting, a human asks the agent to note a task for a colleague. The agent calls","line":227,"renderedHtml":""},{"kind":"prose","text":"`task.create` with a title, the assignee and the session. The tasks part checks the token, writes","line":228,"renderedHtml":""},{"kind":"prose","text":"the task as one YAML file into the archive and commits it before it answers with the reference of","line":229,"renderedHtml":""},{"kind":"prose","text":"the task (`dec-yaml-git-storage`). Later the assignee lists the open tasks assigned to them and","line":230,"renderedHtml":""},{"kind":"prose","text":"sets the status to done. The tasks part rewrites the file in a new commit, so the archive keeps","line":231,"renderedHtml":""},{"kind":"prose","text":"the history. Both commands carry an ID created by the client, so a repeat after a network drop","line":232,"renderedHtml":""},{"kind":"prose","text":"changes nothing.","line":233,"renderedHtml":""},{"kind":"prose","text":"","line":234,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-task-lifecycle","title":"Agent creates a task, a human finishes it","trigger":"A human asks the agent in a meeting to note a task","involves":"bb-mcp, bb-cli, bb-client-core, bb-tasks, bb-identity, bb-archive, bb-participant-client, bb-office-hub"},"startLine":236,"endLine":241,"inArc42Fence":true},{"kind":"prose","text":"","line":243,"renderedHtml":""},{"kind":"diagram","diagramType":"sequence","id":"seq-task-lifecycle","scenario":"rs-task-lifecycle","notation":"mermaid-sequence","aliases":"bb_mcp=bb-mcp, bb_cli=bb-cli, bb_tasks=bb-tasks, bb_archive=bb-archive","source":"sequenceDiagram\n    participant bb_mcp as MCP server\n    participant bb_cli as office CLI\n    participant bb_tasks as Tasks\n    participant bb_archive as Archive\n    bb_mcp->>bb_tasks: create task (title, assignee, session, command ID)\n    bb_tasks->>bb_archive: commit (one YAML file)\n    bb_archive-->>bb_tasks: commit ID\n    bb_tasks-->>bb_mcp: task with reference local:7\n    bb_cli->>bb_tasks: list tasks (status open, assignee)\n    bb_tasks-->>bb_cli: tasks\n    bb_cli->>bb_tasks: update task local:7 (status done, command ID)\n    bb_tasks->>bb_archive: commit (the file again)\n    bb_tasks-->>bb_cli: task, revision 2","startLine":245,"endLine":268},{"kind":"prose","text":"","line":269,"renderedHtml":""},{"kind":"heading","level":2,"text":"Hub writes sessions to the archive","line":270},{"kind":"prose","text":"","line":271,"renderedHtml":"\u003cp>While sessions run, the meeting session writes every session that changed to the archive, at a\nconfigurable interval and at once when a session ends (\u003ccode>dec-session-persistence\u003c/code>). It takes the\nlog as it is at that moment and signs the tree head over it. The archive writes the log and the\ntree head and commits them as one commit; the push is mocked. Commands and the stream go on\nduring the commit. Events that arrive during a slow commit go into the next write. There is\nnever more than one write in progress (\u003ccode>qs-archive-no-backpressure\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"While sessions run, the meeting session writes every session that changed to the archive, at a","line":272,"renderedHtml":""},{"kind":"prose","text":"configurable interval and at once when a session ends (`dec-session-persistence`). It takes the","line":273,"renderedHtml":""},{"kind":"prose","text":"log as it is at that moment and signs the tree head over it. The archive writes the log and the","line":274,"renderedHtml":""},{"kind":"prose","text":"tree head and commits them as one commit; the push is mocked. Commands and the stream go on","line":275,"renderedHtml":""},{"kind":"prose","text":"during the commit. Events that arrive during a slow commit go into the next write. There is","line":276,"renderedHtml":""},{"kind":"prose","text":"never more than one write in progress (`qs-archive-no-backpressure`).","line":277,"renderedHtml":""},{"kind":"prose","text":"","line":278,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-archive-session","title":"Hub writes sessions to the archive","trigger":"The write interval has passed, or a session has ended","involves":"bb-session-service, bb-archive, bb-office-hub"},"startLine":280,"endLine":285,"inArc42Fence":true},{"kind":"prose","text":"","line":287,"renderedHtml":""},{"kind":"diagram","diagramType":"sequence","id":"seq-archive-session","scenario":"rs-archive-session","notation":"mermaid-sequence","aliases":"bb_session=bb-session-service, bb_archive=bb-archive","source":"sequenceDiagram\n    participant bb_session as Meeting session\n    participant bb_archive as Archive\n    Note over bb_session: interval passed or session.ended\n    bb_session->>bb_session: take the changed sessions, sign their tree heads\n    bb_session->>bb_archive: commit (log and tree head of each session)\n    Note over bb_session: commands and the stream go on\n    bb_archive->>bb_archive: write files, commit, push (mocked)\n    bb_archive-->>bb_session: commit ID\n    Note over bb_session: the next write takes everything since","startLine":289,"endLine":308},{"kind":"prose","text":"","line":309,"renderedHtml":""},{"kind":"heading","level":2,"text":"Hub restarts and restores a session","line":310},{"kind":"prose","text":"","line":311,"renderedHtml":"\u003cp>The hub crashes while a session runs. Its last write to the archive has the session up to some\nevent; the events after it are lost on the hub, but the peers still have them. When the hub starts\nagain, the meeting session reads every stored log back from the archive and checks it against its\nsigned tree head (\u003ccode>dec-restore-from-peers\u003c/code>). A session that has not ended takes no commands yet.\nThe replicators reconnect with their cursors. The hub does not know these cursors and answers that\nthey are beyond the end. Each replicator then asks the hub how many events it has and offers the\nevents after that, with the tree head the hub signed over its copy before the crash\n(\u003ccode>dec-signed-head-in-stream\u003c/code>). The hub checks the signature, the root hash and the consistency\nwith its own log, and appends the missing events with their IDs. The first copy that fits wins;\nlater copies have no effect. The session takes commands again, the replicators follow the stream\nfrom their cursors, and the IDs continue without a gap. A copy that does not verify or forks\nfails, and the replicator stops instead of continuing it.\u003c/p>\n"},{"kind":"prose","text":"The hub crashes while a session runs. Its last write to the archive has the session up to some","line":312,"renderedHtml":""},{"kind":"prose","text":"event; the events after it are lost on the hub, but the peers still have them. When the hub starts","line":313,"renderedHtml":""},{"kind":"prose","text":"again, the meeting session reads every stored log back from the archive and checks it against its","line":314,"renderedHtml":""},{"kind":"prose","text":"signed tree head (`dec-restore-from-peers`). A session that has not ended takes no commands yet.","line":315,"renderedHtml":""},{"kind":"prose","text":"The replicators reconnect with their cursors. The hub does not know these cursors and answers that","line":316,"renderedHtml":""},{"kind":"prose","text":"they are beyond the end. Each replicator then asks the hub how many events it has and offers the","line":317,"renderedHtml":""},{"kind":"prose","text":"events after that, with the tree head the hub signed over its copy before the crash","line":318,"renderedHtml":""},{"kind":"prose","text":"(`dec-signed-head-in-stream`). The hub checks the signature, the root hash and the consistency","line":319,"renderedHtml":""},{"kind":"prose","text":"with its own log, and appends the missing events with their IDs. The first copy that fits wins;","line":320,"renderedHtml":""},{"kind":"prose","text":"later copies have no effect. The session takes commands again, the replicators follow the stream","line":321,"renderedHtml":""},{"kind":"prose","text":"from their cursors, and the IDs continue without a gap. A copy that does not verify or forks","line":322,"renderedHtml":""},{"kind":"prose","text":"fails, and the replicator stops instead of continuing it.","line":323,"renderedHtml":""},{"kind":"prose","text":"","line":324,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-hub-restart","title":"Hub restarts and restores a session from the archive and the peers","trigger":"The hub starts again after a crash while a session runs","involves":"bb-session-service, bb-archive, bb-replicator, bb-participant-client, bb-office-hub"},"startLine":326,"endLine":331,"inArc42Fence":true},{"kind":"prose","text":"","line":333,"renderedHtml":""},{"kind":"diagram","diagramType":"sequence","id":"seq-hub-restart","scenario":"rs-hub-restart","notation":"mermaid-sequence","aliases":"bb_session=bb-session-service, bb_archive=bb-archive, bb_replicator=bb-replicator","source":"sequenceDiagram\n    participant bb_archive as Archive\n    participant bb_session as Meeting session\n    participant bb_replicator as Log replicator\n    Note over bb_session: hub starts after a crash\n    bb_session->>bb_archive: read stored logs and tree heads\n    bb_archive-->>bb_session: logs up to the last write\n    bb_session->>bb_session: verify each log, wait for peers\n    bb_replicator->>bb_session: subscribe(cursor=last line)\n    bb_session-->>bb_replicator: cursor beyond the end\n    bb_replicator->>bb_session: tree head (how many events?)\n    bb_replicator->>bb_session: offer missing events + signed tree head\n    bb_session->>bb_session: check signature, root hash, consistency\n    bb_session-->>bb_replicator: accepted (a later copy: no effect)\n    bb_replicator->>bb_session: tree head at cursor (same root as the local log?)\n    bb_replicator->>bb_session: subscribe(cursor=last line)\n    bb_session-->>bb_replicator: live events, IDs continue","startLine":335,"endLine":361},{"kind":"prose","text":"","line":362,"renderedHtml":""},{"kind":"heading","level":2,"text":"Agent imports a conversation and writes its minutes","line":363},{"kind":"prose","text":"","line":364,"renderedHtml":"\u003cp>An agent has a conversation from another tool as a file in the import format\n(\u003ccode>dec-import-format\u003c/code>). It calls \u003ccode>session.import\u003c/code> with the file. The client core reads the file\nand sends the conversation in pages to the session import. The first page creates the session:\nthe meeting session writes an event that marks the session as imported, the imported\nparticipants and the first utterances. Every further page adds utterances, and the last page\nwrites the end of the import. The client core returns the session ID and the signed tree head\nover the imported log. The hub writes the session to the archive at its next interval, like\nevery other session. The agent then reads the events after a cursor, joins the session like a\nlive one, writes the minutes and records decisions and tasks with the session ID. When it ends\nthe session, the meeting session stores the minutes (\u003ccode>rs-session-ends\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"An agent has a conversation from another tool as a file in the import format","line":365,"renderedHtml":""},{"kind":"prose","text":"(`dec-import-format`). It calls `session.import` with the file. The client core reads the file","line":366,"renderedHtml":""},{"kind":"prose","text":"and sends the conversation in pages to the session import. The first page creates the session:","line":367,"renderedHtml":""},{"kind":"prose","text":"the meeting session writes an event that marks the session as imported, the imported","line":368,"renderedHtml":""},{"kind":"prose","text":"participants and the first utterances. Every further page adds utterances, and the last page","line":369,"renderedHtml":""},{"kind":"prose","text":"writes the end of the import. The client core returns the session ID and the signed tree head","line":370,"renderedHtml":""},{"kind":"prose","text":"over the imported log. The hub writes the session to the archive at its next interval, like","line":371,"renderedHtml":""},{"kind":"prose","text":"every other session. The agent then reads the events after a cursor, joins the session like a","line":372,"renderedHtml":""},{"kind":"prose","text":"live one, writes the minutes and records decisions and tasks with the session ID. When it ends","line":373,"renderedHtml":""},{"kind":"prose","text":"the session, the meeting session stores the minutes (`rs-session-ends`).","line":374,"renderedHtml":""},{"kind":"prose","text":"","line":375,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-import-conversation","title":"Agent imports a conversation and writes its minutes","trigger":"An agent calls session.import with a conversation file","involves":"bb-mcp, bb-cli, bb-client-core, bb-session-service, bb-records, bb-archive, bb-participant-client, bb-office-hub"},"startLine":377,"endLine":382,"inArc42Fence":true},{"kind":"prose","text":"","line":384,"renderedHtml":""},{"kind":"diagram","diagramType":"sequence","id":"seq-import-conversation","scenario":"rs-import-conversation","notation":"mermaid-sequence","aliases":"actor_agent=actor-agent, bb_mcp=bb-mcp, bb_client_core=bb-client-core, bb_session=bb-session-service, bb_archive=bb-archive, bb_records=bb-records","source":"sequenceDiagram\n    participant actor_agent as Agent\n    participant bb_mcp as MCP server\n    participant bb_client_core as Client core\n    participant bb_session as Meeting session\n    participant bb_archive as Archive\n    participant bb_records as Records\n    actor_agent->>bb_mcp: session.import(file)\n    bb_mcp->>bb_client_core: read the import format\n    bb_client_core->>bb_session: first page (source, participants, utterances)\n    bb_session-->>bb_client_core: events stored, signed tree head\n    bb_client_core->>bb_session: last page (complete)\n    bb_session-->>bb_client_core: end of import, signed tree head\n    bb_mcp-->>actor_agent: session ID, tree head\n    bb_session->>bb_archive: write the log (next interval, background)\n    actor_agent->>bb_session: events after a cursor, join, minutes\n    actor_agent->>bb_records: decisions with the session ID\n    actor_agent->>bb_session: end the session\n    bb_session->>bb_records: store the minutes","startLine":386,"endLine":414},{"kind":"prose","text":"","line":415,"renderedHtml":""},{"kind":"heading","level":2,"text":"The agent runner checks after each utterance whether to wake an agent","line":416},{"kind":"prose","text":"","line":417,"renderedHtml":"\u003cp>An agent takes part through the agent runner (\u003ccode>dec-agent-runner-acp\u003c/code>). The runner joined the\nsession with the key of the agent and follows its local log. It started the harness, opened one\nACP session with the office tools and sent a first prompt with the role.\u003c/p>\n\u003cp>A human talks. Each sentence reaches the local log as \u003ccode>utterance.final\u003c/code>. After each utterance,\nthe runner checks whether to wake the agent (\u003ccode>dec-wake-check-per-utterance\u003c/code>): it asks the\ndecision model whether the agent should act now, for example because the speaker addressed it,\nstarted a new topic within a monologue or talks about something that concerns the role of the\nagent (\u003ccode>dec-byo-decision-model\u003c/code>). If so, the runner collects what others said since its last\ndelivery, leaves out the agent&#39;s own utterances and sentences off the record, and sends it as one\nprompt. The agent decides how to act: it answers with \u003ccode>utterance_say\u003c/code> when the speaker asked it,\nraises its hand instead of interrupting, or updates the minutes silently. Its actions reach every\nlocal log, also that of the runner, which leaves them out of the next prompt. If the agent is\nstill busy, the runner queues what comes and sends it together afterwards\n(\u003ccode>dec-agent-runner-delivery\u003c/code>). When the session ends, the runner sends a last prompt and stops\nthe harness.\u003c/p>\n"},{"kind":"prose","text":"An agent takes part through the agent runner (`dec-agent-runner-acp`). The runner joined the","line":418,"renderedHtml":""},{"kind":"prose","text":"session with the key of the agent and follows its local log. It started the harness, opened one","line":419,"renderedHtml":""},{"kind":"prose","text":"ACP session with the office tools and sent a first prompt with the role.","line":420,"renderedHtml":""},{"kind":"prose","text":"","line":421,"renderedHtml":""},{"kind":"prose","text":"A human talks. Each sentence reaches the local log as `utterance.final`. After each utterance,","line":422,"renderedHtml":""},{"kind":"prose","text":"the runner checks whether to wake the agent (`dec-wake-check-per-utterance`): it asks the","line":423,"renderedHtml":""},{"kind":"prose","text":"decision model whether the agent should act now, for example because the speaker addressed it,","line":424,"renderedHtml":""},{"kind":"prose","text":"started a new topic within a monologue or talks about something that concerns the role of the","line":425,"renderedHtml":""},{"kind":"prose","text":"agent (`dec-byo-decision-model`). If so, the runner collects what others said since its last","line":426,"renderedHtml":""},{"kind":"prose","text":"delivery, leaves out the agent's own utterances and sentences off the record, and sends it as one","line":427,"renderedHtml":""},{"kind":"prose","text":"prompt. The agent decides how to act: it answers with `utterance_say` when the speaker asked it,","line":428,"renderedHtml":""},{"kind":"prose","text":"raises its hand instead of interrupting, or updates the minutes silently. Its actions reach every","line":429,"renderedHtml":""},{"kind":"prose","text":"local log, also that of the runner, which leaves them out of the next prompt. If the agent is","line":430,"renderedHtml":""},{"kind":"prose","text":"still busy, the runner queues what comes and sends it together afterwards","line":431,"renderedHtml":""},{"kind":"prose","text":"(`dec-agent-runner-delivery`). When the session ends, the runner sends a last prompt and stops","line":432,"renderedHtml":""},{"kind":"prose","text":"the harness.","line":433,"renderedHtml":""},{"kind":"prose","text":"","line":434,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-agent-runner-turn","title":"The agent runner checks after each utterance whether to wake an agent","trigger":"utterance.final of another participant in the local log of the agent","involves":"bb-agent-runner, bb-client-core, bb-replicator, bb-mcp, bb-cli, bb-session-service, bb-participant-client, bb-office-hub"},"startLine":436,"endLine":441,"inArc42Fence":true},{"kind":"prose","text":"","line":443,"renderedHtml":""},{"kind":"diagram","diagramType":"sequence","id":"seq-agent-runner-turn","scenario":"rs-agent-runner-turn","notation":"mermaid-sequence","aliases":"actor_human=actor-human, actor_agent=actor-agent, actor_decision_model=actor-decision-model, bb_cli=bb-cli, bb_session=bb-session-service, bb_replicator=bb-replicator, bb_agent_runner=bb-agent-runner, bb_mcp=bb-mcp","source":"sequenceDiagram\n    participant actor_human as Human\n    participant bb_cli as office CLI\n    participant bb_session as Meeting session\n    participant bb_replicator as Log replicator\n    participant bb_agent_runner as Agent runner\n    participant actor_decision_model as Decision model\n    participant actor_agent as Agent harness\n    participant bb_mcp as MCP server\n    actor_human->>bb_cli: speaks or types a question\n    bb_cli->>bb_session: utterance.submit\n    bb_session-->>bb_replicator: utterance.final\n    bb_replicator->>bb_replicator: append lines to the local log of the agent\n    bb_agent_runner->>bb_replicator: read new lines\n    bb_agent_runner->>actor_decision_model: new utterance, context, role\n    actor_decision_model-->>bb_agent_runner: act, addressed, topic_closed, reason\n    bb_agent_runner->>actor_agent: session/prompt (who said what)\n    actor_agent->>bb_mcp: utterance_say (answer)\n    bb_mcp->>bb_session: utterance.submit (as the agent)\n    actor_agent-->>bb_agent_runner: end of turn\n    bb_session-->>bb_replicator: utterance.final of the agent\n    Note over bb_agent_runner: leaves out the agent's own utterance","startLine":445,"endLine":476},{"kind":"prose","text":"","line":477,"renderedHtml":""}]},{"filePath":"docs/architecture/07-deployment-view.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Deployment View","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"heading","level":2,"text":"Deployment overview","line":3},{"kind":"prose","text":"","line":4,"renderedHtml":"\u003cp>The first stage has one environment. It contains one office hub, the computers of the human\nparticipants and the runtimes of the agents. An agent and its participant client must share a\nfile system. The CLI and the log replicator run on both client nodes. The diagram shows them only\nonce (see the \u003ccode>hosts\u003c/code> of each node). OPEN: is the hub self-hosted or in the cloud?\u003c/p>\n"},{"kind":"prose","text":"The first stage has one environment. It contains one office hub, the computers of the human","line":5,"renderedHtml":""},{"kind":"prose","text":"participants and the runtimes of the agents. An agent and its participant client must share a","line":6,"renderedHtml":""},{"kind":"prose","text":"file system. The CLI and the log replicator run on both client nodes. The diagram shows them only","line":7,"renderedHtml":""},{"kind":"prose","text":"once (see the `hosts` of each node). OPEN: is the hub self-hosted or in the cloud?","line":8,"renderedHtml":""},{"kind":"prose","text":"","line":9,"renderedHtml":""},{"kind":"diagram","diagramType":"deployment","view":"deployment","id":"deployment-overview","notation":"mermaid-architecture","roots":[],"aliases":"","source":"architecture-beta\n    group env-mvp(cloud)[First stage]\n    group dn-participant-laptop(server)[Participant computer] in env-mvp\n    group dn-agent-runtime(server)[Agent runtime] in env-mvp\n    group dn-office-hub(server)[Office hub] in env-mvp\n    service bb-ears(disk)[Ears] in dn-participant-laptop\n    service bb-cli(server)[office CLI] in dn-participant-laptop\n    service bb-replicator(disk)[Log replicator] in dn-participant-laptop\n    service bb-mcp(server)[MCP server] in dn-agent-runtime\n    service bb-agent-runner(server)[Agent runner] in dn-agent-runtime\n    service bb-session-service(server)[Meeting session] in dn-office-hub\n    service bb-records(database)[Records] in dn-office-hub\n    service bb-tasks(database)[Tasks] in dn-office-hub\n    service bb-slides(database)[Slides] in dn-office-hub\n    service bb-stage(internet)[Stage] in dn-office-hub\n    service bb-identity(server)[Identity] in dn-office-hub\n    service bb-archive(disk)[Archive] in dn-office-hub\n    bb-ears:R --> L:bb-session-service\n    bb-replicator:R --> L:bb-session-service\n    bb-mcp:L --> R:bb-session-service","startLine":11,"endLine":39},{"kind":"prose","text":"","line":40,"renderedHtml":""},{"kind":"heading","level":2,"text":"First stage","line":41},{"kind":"prose","text":"","line":42,"renderedHtml":"\u003cp>The environment in which the system first runs in our own team.\u003c/p>\n"},{"kind":"prose","text":"The environment in which the system first runs in our own team.","line":43,"renderedHtml":""},{"kind":"prose","text":"","line":44,"renderedHtml":""},{"kind":"block","blockType":"deployment-node","attributes":{"id":"env-mvp","title":"First stage","type":"environment"},"startLine":46,"endLine":50,"inArc42Fence":true},{"kind":"prose","text":"","line":52,"renderedHtml":""},{"kind":"heading","level":2,"text":"Participant computer","line":53},{"kind":"prose","text":"","line":54,"renderedHtml":"\u003cp>The laptop of a human with a headset. It runs the CLI, the log replicator and the ears with local\nWhisper. The client comes as a ready binary for Linux and macOS. It chooses its speech model by\nthe spoken language and by whether its build can use a GPU, downloads it once, on first use, and\nchecks it (\u003ccode>dec-model-download\u003c/code>). OPEN: minimum hardware for real-time Whisper with the large\nmodels.\u003c/p>\n"},{"kind":"prose","text":"The laptop of a human with a headset. It runs the CLI, the log replicator and the ears with local","line":55,"renderedHtml":""},{"kind":"prose","text":"Whisper. The client comes as a ready binary for Linux and macOS. It chooses its speech model by","line":56,"renderedHtml":""},{"kind":"prose","text":"the spoken language and by whether its build can use a GPU, downloads it once, on first use, and","line":57,"renderedHtml":""},{"kind":"prose","text":"checks it (`dec-model-download`). OPEN: minimum hardware for real-time Whisper with the large","line":58,"renderedHtml":""},{"kind":"prose","text":"models.","line":59,"renderedHtml":""},{"kind":"prose","text":"","line":60,"renderedHtml":""},{"kind":"block","blockType":"deployment-node","attributes":{"id":"dn-participant-laptop","title":"Participant computer","type":"device","parent":"env-mvp","hosts":"bb-cli, bb-client-core, bb-replicator, bb-ears"},"startLine":62,"endLine":68,"inArc42Fence":true},{"kind":"prose","text":"","line":70,"renderedHtml":""},{"kind":"heading","level":2,"text":"Agent runtime","line":71},{"kind":"prose","text":"","line":72,"renderedHtml":"\u003cp>The computer or container in which the agent runs, for example Claude Code on a laptop or in a\ncloud session. It runs the MCP server, the CLI and the log replicator in the same file system as\nthe agent. With the agent runner, the runner starts the agent harness as its child process on this\nnode, and the harness starts the MCP server. A decision model that the user brings runs wherever\nthe user puts it: as a command on this node, or behind an endpoint that the node can reach.\u003c/p>\n"},{"kind":"prose","text":"The computer or container in which the agent runs, for example Claude Code on a laptop or in a","line":73,"renderedHtml":""},{"kind":"prose","text":"cloud session. It runs the MCP server, the CLI and the log replicator in the same file system as","line":74,"renderedHtml":""},{"kind":"prose","text":"the agent. With the agent runner, the runner starts the agent harness as its child process on this","line":75,"renderedHtml":""},{"kind":"prose","text":"node, and the harness starts the MCP server. A decision model that the user brings runs wherever","line":76,"renderedHtml":""},{"kind":"prose","text":"the user puts it: as a command on this node, or behind an endpoint that the node can reach.","line":77,"renderedHtml":""},{"kind":"prose","text":"","line":78,"renderedHtml":""},{"kind":"block","blockType":"deployment-node","attributes":{"id":"dn-agent-runtime","title":"Agent runtime","type":"container","parent":"env-mvp","hosts":"bb-mcp, bb-cli, bb-client-core, bb-replicator, bb-agent-runner"},"startLine":80,"endLine":86,"inArc42Fence":true},{"kind":"prose","text":"","line":88,"renderedHtml":""},{"kind":"heading","level":2,"text":"Office hub","line":89},{"kind":"prose","text":"","line":90,"renderedHtml":"\u003cp>One server or container that runs the hub: the meeting session, the records, the tasks, the\nslides, the stage and the archive. The archive stores sessions, decisions, minutes, notes, tasks\nand slide decks in a local Git repository on this host (\u003ccode>dec-yaml-git-storage\u003c/code>); the push to a remote\nis mocked for now. The host needs the Git command line tool. It keeps the participants and their keys (identity)\npermanently. The operator gives the hub its signing key for the tree heads (\u003ccode>dec-merkle-log\u003c/code>) at\nevery start, at first as a key file on the command line, and creates that key with a separate\ncommand of the hub. The hub does not create a signing key by itself and does not start without\none (\u003ccode>dec-hub-signing-key\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"One server or container that runs the hub: the meeting session, the records, the tasks, the","line":91,"renderedHtml":""},{"kind":"prose","text":"slides, the stage and the archive. The archive stores sessions, decisions, minutes, notes, tasks","line":92,"renderedHtml":""},{"kind":"prose","text":"and slide decks in a local Git repository on this host (`dec-yaml-git-storage`); the push to a remote","line":93,"renderedHtml":""},{"kind":"prose","text":"is mocked for now. The host needs the Git command line tool. It keeps the participants and their keys (identity)","line":94,"renderedHtml":""},{"kind":"prose","text":"permanently. The operator gives the hub its signing key for the tree heads (`dec-merkle-log`) at","line":95,"renderedHtml":""},{"kind":"prose","text":"every start, at first as a key file on the command line, and creates that key with a separate","line":96,"renderedHtml":""},{"kind":"prose","text":"command of the hub. The hub does not create a signing key by itself and does not start without","line":97,"renderedHtml":""},{"kind":"prose","text":"one (`dec-hub-signing-key`).","line":98,"renderedHtml":""},{"kind":"prose","text":"","line":99,"renderedHtml":""},{"kind":"block","blockType":"deployment-node","attributes":{"id":"dn-office-hub","title":"Office hub","type":"server","parent":"env-mvp","hosts":"bb-session-service, bb-records, bb-tasks, bb-slides, bb-stage, bb-identity, bb-archive"},"startLine":101,"endLine":107,"inArc42Fence":true},{"kind":"prose","text":"","line":109,"renderedHtml":""}]},{"filePath":"docs/architecture/08-concepts.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Cross-cutting Concepts","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"heading","level":2,"text":"Participant model","line":3},{"kind":"prose","text":"","line":4,"renderedHtml":"\u003cp>There are only \u003cstrong>participants\u003c/strong>. Each participant has an identity, a kind (\u003ccode>kind: human | agent\u003c/code>)\nand roles, for example moderator, minute taker or stage control. Rights depend on roles, not on\nthe kind. The kind stays visible for two reasons: the stage marks agents as agents, and only speech\nneeds consent to be recorded.\u003c/p>\n\u003cp>An utterance is an utterance, whatever its channel. \u003ccode>utterance.final\u003c/code> carries\n\u003ccode>modality: voice | text\u003c/code>. Human speech is \u003ccode>voice\u003c/code>. Typed remarks and an agent&#39;s contributions are\n\u003ccode>text\u003c/code>. Later, speech output will voice text utterances, and the model stays the same.\u003c/p>\n"},{"kind":"prose","text":"There are only **participants**. Each participant has an identity, a kind (`kind: human | agent`)","line":5,"renderedHtml":""},{"kind":"prose","text":"and roles, for example moderator, minute taker or stage control. Rights depend on roles, not on","line":6,"renderedHtml":""},{"kind":"prose","text":"the kind. The kind stays visible for two reasons: the stage marks agents as agents, and only speech","line":7,"renderedHtml":""},{"kind":"prose","text":"needs consent to be recorded.","line":8,"renderedHtml":""},{"kind":"prose","text":"","line":9,"renderedHtml":""},{"kind":"prose","text":"An utterance is an utterance, whatever its channel. `utterance.final` carries","line":10,"renderedHtml":""},{"kind":"prose","text":"`modality: voice | text`. Human speech is `voice`. Typed remarks and an agent's contributions are","line":11,"renderedHtml":""},{"kind":"prose","text":"`text`. Later, speech output will voice text utterances, and the model stays the same.","line":12,"renderedHtml":""},{"kind":"prose","text":"","line":13,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-participant-model","title":"One participant model","category":"domain"},"startLine":15,"endLine":19,"inArc42Fence":true},{"kind":"prose","text":"","line":21,"renderedHtml":""},{"kind":"heading","level":2,"text":"Event log with cursor","line":22},{"kind":"prose","text":"","line":23,"renderedHtml":"\u003cp>Each session has an append-only log with exactly one writer, the hub. It gives every event an\nID that grows by one inside the session. So the order is free of conflicts, and the IDs have no\ngaps: a participant that sees event 43 after 41 knows that 42 is missing and fetches the events\nafter its cursor (\u003ccode>dec-events-from-cursor\u003c/code>). The cursor is the last event ID a client has read,\nwhich is also the last line of the local file. Utterances never change and are never removed.\nCorrections and off-the-record marks are new events that point to the original\n(\u003ccode>utterance.corrected\u003c/code>, \u003ccode>utterance.off_the_record\u003c/code>). An utterance off the record keeps its ID; the interfaces\ndeliver a placeholder without its text, so no false gap appears (\u003ccode>dec-off-the-record\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Storage and integrity.\u003c/strong> The hub orders the events and is the gateway to the archive: it writes\nthe log to a Git repository at a configurable interval and at the end, without ever holding up\nthe session (\u003ccode>dec-session-persistence\u003c/code>). At first the repository is local on the hub host\n(\u003ccode>dec-yaml-git-storage\u003c/code>). The peers keep copies as their reading interface; their copies and the\nstored log have the same lines. The events are the leaves of a Merkle tree, and the hub signs its\ntree head (\u003ccode>dec-merkle-log\u003c/code>). Every write to the archive carries the signed tree head over\nexactly the stored log. After a crash, the hub restores a session from the archive, and a peer fills in\nthe rest (\u003ccode>dec-restore-from-peers\u003c/code>). For this, the stream gives every peer a signed tree head over\nits whole copy, and a restored session waits for the peers before it takes commands, so the IDs\nand every cursor stay valid (\u003ccode>dec-signed-head-in-stream\u003c/code>, \u003ccode>rs-hub-restart\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Imported sessions.\u003c/strong> A conversation from outside the office becomes a session through its own\ninterface (\u003ccode>dec-session-import\u003c/code>). The meeting session writes it into the log like live commands,\nso the log keeps one writer and gap-free IDs. The first event marks the session as imported and\nnames its source. The speakers are imported participants, not registered ones. The tree heads\nover an imported log protect it from later changes, but do not prove what was said.\u003c/p>\n\u003cp>\u003cstrong>Resuming after a network drop:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Readers (replicator, stage) reconnect with their last event ID and receive every event after it.\nNothing is lost, and nothing arrives twice.\u003c/li>\n\u003cli>Writers (ears, CLI, MCP) give every command an ID that they create themselves. If they send a\ncommand again after a drop, the hub recognises the ID and returns the existing event.\u003c/li>\n\u003cli>This includes \u003ccode>join\u003c/code>: a client keeps its join command ID, so after a restart it is still the\nsame participant.\u003c/li>\n\u003cli>The ears queue utterances locally while offline (text only) and send them in order.\u003c/li>\n\u003c/ul>\n\u003cp>Event levels (guide values, configurable per participant):\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Event\u003c/th>\n\u003cth>Trigger\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>utterance.final\u003c/code>\u003c/td>\n\u003ctd>End of sentence, about 300–700 ms of silence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>turn.end\u003c/code>\u003c/td>\n\u003ctd>Change of speaker, about 1.5–2 s of silence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>silence.long\u003c/code>\u003c/td>\n\u003ctd>More than 5 s of silence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>addressed\u003c/code>\u003c/td>\n\u003ctd>A participant&#39;s name is mentioned\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hand.raised\u003c/code>, \u003ccode>minutes.updated\u003c/code>, \u003ccode>artifact.shown\u003c/code>\u003c/td>\n\u003ctd>Actions of participants\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>participant.joined/left/paused\u003c/code>, \u003ccode>session.ended\u003c/code>\u003c/td>\n\u003ctd>Life cycle\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Partials are not written to the log (\u003ccode>dec-no-partials-in-log\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Checking a log:\u003c/strong> the events of a session are the leaves of a Merkle tree (\u003ccode>dec-merkle-log\u003c/code>).\nThe hub signs the head of the tree with its own key, which stays the same across restarts. It\nputs the signed head of the log so far into \u003ccode>session.ended\u003c/code>, and returns a signed head, a\nconsistency proof or an inclusion proof on request. A placeholder of an utterance that is off\nthe record carries the leaf hash of the original, so a copy with placeholders still verifies.\nA placeholder can only hide a text; it cannot change what the tree proves.\u003c/p>\n"},{"kind":"prose","text":"Each session has an append-only log with exactly one writer, the hub. It gives every event an","line":24,"renderedHtml":""},{"kind":"prose","text":"ID that grows by one inside the session. So the order is free of conflicts, and the IDs have no","line":25,"renderedHtml":""},{"kind":"prose","text":"gaps: a participant that sees event 43 after 41 knows that 42 is missing and fetches the events","line":26,"renderedHtml":""},{"kind":"prose","text":"after its cursor (`dec-events-from-cursor`). The cursor is the last event ID a client has read,","line":27,"renderedHtml":""},{"kind":"prose","text":"which is also the last line of the local file. Utterances never change and are never removed.","line":28,"renderedHtml":""},{"kind":"prose","text":"Corrections and off-the-record marks are new events that point to the original","line":29,"renderedHtml":""},{"kind":"prose","text":"(`utterance.corrected`, `utterance.off_the_record`). An utterance off the record keeps its ID; the interfaces","line":30,"renderedHtml":""},{"kind":"prose","text":"deliver a placeholder without its text, so no false gap appears (`dec-off-the-record`).","line":31,"renderedHtml":""},{"kind":"prose","text":"","line":32,"renderedHtml":""},{"kind":"
