3cstrong>Decision:\u003c/strong> A test\nchecks the code against the building block view on every test run (\u003ccode>concept-module-boundaries\u003c/code>).\nIt reads the model from the arc42 tooling itself, not with an own parser, and the dependencies of\nthe code from the Go toolchain. It fails on code without a building block, on a dependency\nbetween building blocks that does not go through a required interface, on a test that reaches\ninto a building block, and on a required interface that is never used. A small workspace with\ndeliberate violations proves that each rule fails when it should. \u003cstrong>Consequences:\u003c/strong> Every change\nof a dependency needs a change of the model first. The tests need the arc42 tooling and fail\nwithout it; they do not skip. \u003cstrong>Rejected:\u003c/strong> an own parser of the chapter files (it would drift\nfrom the arc42 syntax); a shared package for common types (it becomes the place where boundaries\nerode).\u003c/p>\n"},{"kind":"prose","text":"**Context:** Rules about module boundaries erode when nothing checks them. **Decision:** A test","line":437,"renderedHtml":""},{"kind":"prose","text":"checks the code against the building block view on every test run (`concept-module-boundaries`).","line":438,"renderedHtml":""},{"kind":"prose","text":"It reads the model from the arc42 tooling itself, not with an own parser, and the dependencies of","line":439,"renderedHtml":""},{"kind":"prose","text":"the code from the Go toolchain. It fails on code without a building block, on a dependency","line":440,"renderedHtml":""},{"kind":"prose","text":"between building blocks that does not go through a required interface, on a test that reaches","line":441,"renderedHtml":""},{"kind":"prose","text":"into a building block, and on a required interface that is never used. A small workspace with","line":442,"renderedHtml":""},{"kind":"prose","text":"deliberate violations proves that each rule fails when it should. **Consequences:** Every change","line":443,"renderedHtml":""},{"kind":"prose","text":"of a dependency needs a change of the model first. The tests need the arc42 tooling and fail","line":444,"renderedHtml":""},{"kind":"prose","text":"without it; they do not skip. **Rejected:** an own parser of the chapter files (it would drift","line":445,"renderedHtml":""},{"kind":"prose","text":"from the arc42 syntax); a shared package for common types (it becomes the place where boundaries","line":446,"renderedHtml":""},{"kind":"prose","text":"erode).","line":447,"renderedHtml":""},{"kind":"prose","text":"","line":448,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-architecture-test","title":"The code is tested against the building block view","status":"accepted","date":"2026-11-07","addresses":"con-contract-tests"},"startLine":450,"endLine":456,"inArc42Fence":true},{"kind":"prose","text":"","line":458,"renderedHtml":""},{"kind":"heading","level":2,"text":"Performance tests separate from end-to-end tests","line":459},{"kind":"prose","text":"","line":460,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> A timing criterion made the end-to-end tests fail on a slower host, although every\nfunction worked. \u003cstrong>Decision:\u003c/strong> End-to-end tests check behaviour only and never fail on timing.\nThe timing criteria of the quality scenarios run as separate performance tests on the reference\nhost. \u003cstrong>Consequences:\u003c/strong> The end-to-end tests run on every host. Performance needs its own run and\nits own reference host.\u003c/p>\n"},{"kind":"prose","text":"**Context:** A timing criterion made the end-to-end tests fail on a slower host, although every","line":461,"renderedHtml":""},{"kind":"prose","text":"function worked. **Decision:** End-to-end tests check behaviour only and never fail on timing.","line":462,"renderedHtml":""},{"kind":"prose","text":"The timing criteria of the quality scenarios run as separate performance tests on the reference","line":463,"renderedHtml":""},{"kind":"prose","text":"host. **Consequences:** The end-to-end tests run on every host. Performance needs its own run and","line":464,"renderedHtml":""},{"kind":"prose","text":"its own reference host.","line":465,"renderedHtml":""},{"kind":"prose","text":"","line":466,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-performance-tests","title":"Performance tests separate from end-to-end tests","status":"accepted","date":"2026-11-07","addresses":"qg-performance"},"startLine":468,"endLine":474,"inArc42Fence":true},{"kind":"prose","text":"","line":476,"renderedHtml":""},{"kind":"heading","level":2,"text":"Events after a cursor","line":477},{"kind":"prose","text":"","line":478,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> A participant may miss events (a gap in its copy), and some agents have no file\nsystem to follow. \u003cstrong>Decision:\u003c/strong> The session stream also answers a one-time request: &quot;give me the\nevents after cursor N&quot;. The hub is the only writer of a session log and gives every event an\nID that grows by one, so the order is free of conflicts and a gap is visible from the IDs alone.\nA participant polls this request when it finds a gap, or instead of a local file. No event needs\nthe ID of its predecessor. \u003cstrong>Consequences:\u003c/strong> Agents without a file system can take part by\npolling. A suppressed utterance must keep its ID (\u003ccode>dec-off-the-record\u003c/code>). If the hub loses a\nlog, it restores it from the archive and the peers, so cursors stay valid\n(\u003ccode>dec-restore-from-peers\u003c/code>). \u003cstrong>Rejected:\u003c/strong> a long-poll tool only for MCP; a predecessor ID in every event (not needed with a\nsingle writer).\u003c/p>\n"},{"kind":"prose","text":"**Context:** A participant may miss events (a gap in its copy), and some agents have no file","line":479,"renderedHtml":""},{"kind":"prose","text":"system to follow. **Decision:** The session stream also answers a one-time request: \"give me the","line":480,"renderedHtml":""},{"kind":"prose","text":"events after cursor N\". The hub is the only writer of a session log and gives every event an","line":481,"renderedHtml":""},{"kind":"prose","text":"ID that grows by one, so the order is free of conflicts and a gap is visible from the IDs alone.","line":482,"renderedHtml":""},{"kind":"prose","text":"A participant polls this request when it finds a gap, or instead of a local file. No event needs","line":483,"renderedHtml":""},{"kind":"prose","text":"the ID of its predecessor. **Consequences:** Agents without a file system can take part by","line":484,"renderedHtml":""},{"kind":"prose","text":"polling. A suppressed utterance must keep its ID (`dec-off-the-record`). If the hub loses a","line":485,"renderedHtml":""},{"kind":"prose","text":"log, it restores it from the archive and the peers, so cursors stay valid","line":486,"renderedHtml":""},{"kind":"prose","text":"(`dec-restore-from-peers`). **Rejected:** a long-poll tool only for MCP; a predecessor ID in every event (not needed with a","line":487,"renderedHtml":""},{"kind":"prose","text":"single writer).","line":488,"renderedHtml":""},{"kind":"prose","text":"","line":489,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-events-from-cursor","title":"Events after a cursor, with gap-free IDs from one writer","status":"accepted","date":"2026-11-07","addresses":"risk-no-filesystem, qg-resumability"},"startLine":491,"endLine":497,"inArc42Fence":true},{"kind":"prose","text":"","line":499,"renderedHtml":""},{"kind":"heading","level":2,"text":"Off the record instead of retraction","line":500},{"kind":"prose","text":"","line":501,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> A spoken sentence has been heard by everyone in the meeting, and agents have already\nread it. A retraction pretends that it was never said. \u003cstrong>Decision:\u003c/strong> What is said stays said.\nUtterances are never retracted or removed. A participant can mark their own sentence off the\nrecord afterwards. This is its own command; the hub checks that the caller is the speaker. The\nmark is a new event. The interfaces then suppress the text: they deliver a placeholder with the\nsame ID, the stage hides it, and it does not go into minutes, decisions or notes. Agents that already\nread it must respect the mark. The raw log keeps the original. Marking the sentences of others\n(moderation) is out of scope for the first stage (issue #31). \u003cstrong>Consequences:\u003c/strong> The log stays\ncomplete and honest. Suppression works for every reader that uses the interfaces, but not for\nwhat an agent already holds in its context. The published session keeps the original and the\nmark; reading it from the archive also gives the placeholder (\u003ccode>dec-session-persistence\u003c/code>).\n\u003cstrong>Rejected:\u003c/strong> retraction; a hold period before\npublishing (it adds seconds of latency); a general classification command (not needed yet).\u003c/p>\n"},{"kind":"prose","text":"**Context:** A spoken sentence has been heard by everyone in the meeting, and agents have already","line":502,"renderedHtml":""},{"kind":"prose","text":"read it. A retraction pretends that it was never said. **Decision:** What is said stays said.","line":503,"renderedHtml":""},{"kind":"prose","text":"Utterances are never retracted or removed. A participant can mark their own sentence off the","line":504,"renderedHtml":""},{"kind":"prose","text":"record afterwards. This is its own command; the hub checks that the caller is the speaker. The","line":505,"renderedHtml":""},{"kind":"prose","text":"mark is a new event. The interfaces then suppress the text: they deliver a placeholder with the","line":506,"renderedHtml":""},{"kind":"prose","text":"same ID, the stage hides it, and it does not go into minutes, decisions or notes. Agents that already","line":507,"renderedHtml":""},{"kind":"prose","text":"read it must respect the mark. The raw log keeps the original. Marking the sentences of others","line":508,"renderedHtml":""},{"kind":"prose","text":"(moderation) is out of scope for the first stage (issue #31). **Consequences:** The log stays","line":509,"renderedHtml":""},{"kind":"prose","text":"complete and honest. Suppression works for every reader that uses the interfaces, but not for","line":510,"renderedHtml":""},{"kind":"prose","text":"what an agent already holds in its context. The published session keeps the original and the","line":511,"renderedHtml":""},{"kind":"prose","text":"mark; reading it from the archive also gives the placeholder (`dec-session-persistence`).","line":512,"renderedHtml":""},{"kind":"prose","text":"**Rejected:** retraction; a hold period before","line":513,"renderedHtml":""},{"kind":"prose","text":"publishing (it adds seconds of latency); a general classification command (not needed yet).","line":514,"renderedHtml":""},{"kind":"prose","text":"","line":515,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-off-the-record","title":"Own sentences can be marked off the record; no retraction","status":"accepted","date":"2026-11-07","addresses":"risk-retraction-leak, qg-confidentiality"},"startLine":517,"endLine":523,"inArc42Fence":true},{"kind":"prose","text":"","line":525,"renderedHtml":""},{"kind":"heading","level":2,"text":"Consent by joining with the microphone","line":526},{"kind":"prose","text":"","line":527,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Capture and storage of speech need consent (GDPR, § 201 German Criminal Code).\n\u003cstrong>Decision:\u003c/strong> Joining with \u003ccode>--mic\u003c/code> is the consent to capture and to storage, also of the raw\ntranscript. Only participants who join with the microphone are transcribed. Joining a session at\nall is the consent that every other participant keeps a copy of the session and that the hub\nstores it in the archive (\u003ccode>dec-session-persistence\u003c/code>). The stage shows the\ncapture status to everyone. Censorship is possible only by marking a sentence off the record later\n(\u003ccode>dec-off-the-record\u003c/code>). \u003cstrong>Consequences:\u003c/strong> No extra step in the meeting. Raw audio still never\nleaves the device. OPEN: a data protection review before the first real use, and how long raw\ntranscripts are kept.\u003c/p>\n"},{"kind":"prose","text":"**Context:** Capture and storage of speech need consent (GDPR, § 201 German Criminal Code).","line":528,"renderedHtml":""},{"kind":"prose","text":"**Decision:** Joining with `--mic` is the consent to capture and to storage, also of the raw","line":529,"renderedHtml":""},{"kind":"prose","text":"transcript. Only participants who join with the microphone are transcribed. Joining a session at","line":530,"renderedHtml":""},{"kind":"prose","text":"all is the consent that every other participant keeps a copy of the session and that the hub","line":531,"renderedHtml":""},{"kind":"prose","text":"stores it in the archive (`dec-session-persistence`). The stage shows the","line":532,"renderedHtml":""},{"kind":"prose","text":"capture status to everyone. Censorship is possible only by marking a sentence off the record later","line":533,"renderedHtml":""},{"kind":"prose","text":"(`dec-off-the-record`). **Consequences:** No extra step in the meeting. Raw audio still never","line":534,"renderedHtml":""},{"kind":"prose","text":"leaves the device. OPEN: a data protection review before the first real use, and how long raw","line":535,"renderedHtml":""},{"kind":"prose","text":"transcripts are kept.","line":536,"renderedHtml":""},{"kind":"prose","text":"","line":537,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-consent-by-mic","title":"Joining with the microphone is the consent to storage","status":"accepted","date":"2026-11-07","addresses":"risk-consent, con-privacy-law, qg-confidentiality"},"startLine":539,"endLine":545,"inArc42Fence":true},{"kind":"prose","text":"","line":547,"renderedHtml":""},{"kind":"heading","level":2,"text":"The hub persists sessions through an archive","line":548},{"kind":"prose","text":"","line":549,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The hub orders every event and holds the complete log while a session runs. Every\npeer holds a copy too, but as the reading interface for agents, not as storage.\n\u003cstrong>Decision:\u003c/strong> The hub is the gateway to the archive: it brings the semantics (order, checks,\nsignatures, placeholders), and an external Git repository is the pure storage behind it. The hub\nwrites the log of a session to the archive at a configurable interval and at \u003ccode>session.ended\u003c/code>.\nWriting never holds up the session: it runs in the background, at most one write is in progress,\nand a write that takes longer than the interval makes the next write take everything that has\ncome since. More frequent is better; the interval only has to stay above the usual commit time.\nPeers do not publish. \u003cstrong>Consequences:\u003c/strong> One place writes, so there is no race between writers.\nA Git commit is slow, so the archive is always a little behind; the peers&#39; copies cover the\nrest (\u003ccode>dec-restore-from-peers\u003c/code>). OPEN: which remote repository. \u003cstrong>Rejected:\u003c/strong> every peer publishes (redundant when the\nhub has the log); a commit per event that the session waits for (it slows every command);\nfully peer-to-peer ordering without a hub.\u003c/p>\n"},{"kind":"prose","text":"**Context:** The hub orders every event and holds the complete log while a session runs. Every","line":550,"renderedHtml":""},{"kind":"prose","text":"peer holds a copy too, but as the reading interface for agents, not as storage.","line":551,"renderedHtml":""},{"kind":"prose","text":"**Decision:** The hub is the gateway to the archive: it brings the semantics (order, checks,","line":552,"renderedHtml":""},{"kind":"prose","text":"signatures, placeholders), and an external Git repository is the pure storage behind it. The hub","line":553,"renderedHtml":""},{"kind":"prose","text":"writes the log of a session to the archive at a configurable interval and at `session.ended`.","line":554,"renderedHtml":""},{"kind":"prose","text":"Writing never holds up the session: it runs in the background, at most one write is in progress,","line":555,"renderedHtml":""},{"kind":"prose","text":"and a write that takes longer than the interval makes the next write take everything that has","line":556,"renderedHtml":""},{"kind":"prose","text":"come since. More frequent is better; the interval only has to stay above the usual commit time.","line":557,"renderedHtml":""},{"kind":"prose","text":"Peers do not publish. **Consequences:** One place writes, so there is no race between writers.","line":558,"renderedHtml":""},{"kind":"prose","text":"A Git commit is slow, so the archive is always a little behind; the peers' copies cover the","line":559,"renderedHtml":""},{"kind":"prose","text":"rest (`dec-restore-from-peers`). OPEN: which remote repository. **Rejected:** every peer publishes (redundant when the","line":560,"renderedHtml":""},{"kind":"prose","text":"hub has the log); a commit per event that the session waits for (it slows every command);","line":561,"renderedHtml":""},{"kind":"prose","text":"fully peer-to-peer ordering without a hub.","line":562,"renderedHtml":""},{"kind":"prose","text":"","line":563,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-session-persistence","title":"The hub persists sessions to a Git repository through an archive","status":"accepted","date":"2026-11-07","addresses":"risk-archive-latency, qg-resumability, qg-performance"},"startLine":565,"endLine":571,"inArc42Fence":true},{"kind":"prose","text":"","line":573,"renderedHtml":""},{"kind":"heading","level":2,"text":"The session log is a Merkle tree signed by the hub","line":574},{"kind":"prose","text":"","line":575,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The Git repository is pure storage outside our control, and after a crash the hub\ntakes the missing events from a peer. Neither must be able to change a session unnoticed.\n\u003cstrong>Decision:\u003c/strong> The events of a session are the leaves of a Merkle tree, as in Certificate\nTransparency. The hub signs the tree head (root hash and size), at least with every write to the\narchive and in \u003ccode>session.ended\u003c/code>. Anyone can check a stored session against its signed tree head,\nand a consistency proof shows that a longer log extends a shorter one. The leaf of an utterance\nthat is off the record keeps its hash, so a copy with a placeholder still verifies.\n\u003cstrong>Consequences:\u003c/strong> Changes in the repository and forged peer copies are visible. The signing key\nof the hub needs protection. \u003cstrong>Rejected:\u003c/strong> a plain hash chain (it cannot prove that one log\nextends another without the whole log).\u003c/p>\n"},{"kind":"prose","text":"**Context:** The Git repository is pure storage outside our control, and after a crash the hub","line":576,"renderedHtml":""},{"kind":"prose","text":"takes the missing events from a peer. Neither must be able to change a session unnoticed.","line":577,"renderedHtml":""},{"kind":"prose","text":"**Decision:** The events of a session are the leaves of a Merkle tree, as in Certificate","line":578,"renderedHtml":""},{"kind":"prose","text":"Transparency. The hub signs the tree head (root hash and size), at least with every write to the","line":579,"renderedHtml":""},{"kind":"prose","text":"archive and in `session.ended`. Anyone can check a stored session against its signed tree head,","line":580,"renderedHtml":""},{"kind":"prose","text":"and a consistency proof shows that a longer log extends a shorter one. The leaf of an utterance","line":581,"renderedHtml":""},{"kind":"prose","text":"that is off the record keeps its hash, so a copy with a placeholder still verifies.","line":582,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** Changes in the repository and forged peer copies are visible. The signing key","line":583,"renderedHtml":""},{"kind":"prose","text":"of the hub needs protection. **Rejected:** a plain hash chain (it cannot prove that one log","line":584,"renderedHtml":""},{"kind":"prose","text":"extends another without the whole log).","line":585,"renderedHtml":""},{"kind":"prose","text":"","line":586,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-merkle-log","title":"Merkle tree with tree heads signed by the hub","status":"accepted","date":"2026-11-07","addresses":"risk-forged-copy, qg-confidentiality"},"startLine":588,"endLine":594,"inArc42Fence":true},{"kind":"prose","text":"","line":596,"renderedHtml":""},{"kind":"heading","level":2,"text":"Peers fill in what the archive does not have yet","line":597},{"kind":"prose","text":"","line":598,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> After a crash, the hub has lost the events since its last write to the archive.\n\u003cstrong>Decision:\u003c/strong> The hub restores a session from the archive. Any peer that still has a longer copy\nsupplies the missing events; the hub accepts them only if a consistency proof against the last\nsigned tree head holds, and continues the IDs after them. The first copy that fits wins.\n\u003cstrong>Consequences:\u003c/strong> Cursors stay valid, so no epoch is needed. No order among the peers is needed.\n\u003cstrong>Rejected:\u003c/strong> an epoch that only tells peers that the log is lost; restoring only from the peer\nthat joined first.\u003c/p>\n"},{"kind":"prose","text":"**Context:** After a crash, the hub has lost the events since its last write to the archive.","line":599,"renderedHtml":""},{"kind":"prose","text":"**Decision:** The hub restores a session from the archive. Any peer that still has a longer copy","line":600,"renderedHtml":""},{"kind":"prose","text":"supplies the missing events; the hub accepts them only if a consistency proof against the last","line":601,"renderedHtml":""},{"kind":"prose","text":"signed tree head holds, and continues the IDs after them. The first copy that fits wins.","line":602,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** Cursors stay valid, so no epoch is needed. No order among the peers is needed.","line":603,"renderedHtml":""},{"kind":"prose","text":"**Rejected:** an epoch that only tells peers that the log is lost; restoring only from the peer","line":604,"renderedHtml":""},{"kind":"prose","text":"that joined first.","line":605,"renderedHtml":""},{"kind":"prose","text":"","line":606,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-restore-from-peers","title":"The hub restores from the archive; peers fill in the rest","status":"accepted","date":"2026-11-07","addresses":"qg-resumability"},"startLine":608,"endLine":614,"inArc42Fence":true},{"kind":"prose","text":"","line":616,"renderedHtml":""},{"kind":"heading","level":2,"text":"Every peer holds a signed tree head over its whole copy","line":617},{"kind":"prose","text":"","line":618,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The hub accepts a peer copy only against a tree head it signed\n(\u003ccode>dec-restore-from-peers\u003c/code>, \u003ccode>dec-merkle-log\u003c/code>). But the events that the hub lost in a crash are\nexactly the ones after its last write to the archive, so the stored tree head does not cover them.\nAfter the restart, the hub also does not know how long the longest copy is. \u003cstrong>Decision:\u003c/strong> The\nsession stream carries a tree head signed by the hub together with the last event the hub has.\nSo every peer holds a signed head over its whole copy, and keeps it next to its local log. A peer\nwhose cursor the hub does not know offers the events the hub misses with that head. The hub checks\nthe signature with its own key, that the events give the root hash, and a consistency proof\nbetween its own head and the head of the copy. After a restart, a session that has not ended\ntakes no commands until a peer copy fits or a configurable wait is over, so no new event can take\nthe ID of a lost one. There is no wait if the hub stopped after a last write of every session.\n\u003cstrong>Consequences:\u003c/strong> A forged or changed copy fails, and the hub needs no extra storage per event.\nEvery batch of the stream costs one signature. Commands of a restored session can fail for up to\nthe wait; clients repeat them, which is safe (\u003ccode>dec-idempotent-commands\u003c/code>). OPEN: a session that the\nhub never wrote to the archive is unknown after a crash until a peer offers a whole copy; a peer\nthat comes back after the wait has a copy that forks. \u003cstrong>Rejected:\u003c/strong> a head signed only at every\nwrite to the archive (it does not cover the lost events); accepting a tail without a signed head\n(anyone could add events); persisting a head on the hub for every event (a write per event).\u003c/p>\n"},{"kind":"prose","text":"**Context:** The hub accepts a peer copy only against a tree head it signed","line":619,"renderedHtml":""},{"kind":"prose","text":"(`dec-restore-from-peers`, `dec-merkle-log`). But the events that the hub lost in a crash are","line":620,"renderedHtml":""},{"kind":"prose","text":"exactly the ones after its last write to the archive, so the stored tree head does not cover them.","line":621,"renderedHtml":""},{"kind":"prose","text":"After the restart, the hub also does not know how long the longest copy is. **Decision:** The","line":622,"renderedHtml":""},{"kind":"prose","text":"session stream carries a tree head signed by the hub together with the last event the hub has.","line":623,"renderedHtml":""},{"kind":"prose","text":"So every peer holds a signed head over its whole copy, and keeps it next to its local log. A peer","line":624,"renderedHtml":""},{"kind":"prose","text":"whose cursor the hub does not know offers the events the hub misses with that head. The hub checks","line":625,"renderedHtml":""},{"kind":"prose","text":"the signature with its own key, that the events give the root hash, and a consistency proof","line":626,"renderedHtml":""},{"kind":"prose","text":"between its own head and the head of the copy. After a restart, a session that has not ended","line":627,"renderedHtml":""},{"kind":"prose","text":"takes no commands until a peer copy fits or a configurable wait is over, so no new event can take","line":628,"renderedHtml":""},{"kind":"prose","text":"the ID of a lost one. There is no wait if the hub stopped after a last write of every session.","line":629,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** A forged or changed copy fails, and the hub needs no extra storage per event.","line":630,"renderedHtml":""},{"kind":"prose","text":"Every batch of the stream costs one signature. Commands of a restored session can fail for up to","line":631,"renderedHtml":""},{"kind":"prose","text":"the wait; clients repeat them, which is safe (`dec-idempotent-commands`). OPEN: a session that the","line":632,"renderedHtml":""},{"kind":"prose","text":"hub never wrote to the archive is unknown after a crash until a peer offers a whole copy; a peer","line":633,"renderedHtml":""},{"kind":"prose","text":"that comes back after the wait has a copy that forks. **Rejected:** a head signed only at every","line":634,"renderedHtml":""},{"kind":"prose","text":"write to the archive (it does not cover the lost events); accepting a tail without a signed head","line":635,"renderedHtml":""},{"kind":"prose","text":"(anyone could add events); persisting a head on the hub for every event (a write per event).","line":636,"renderedHtml":""},{"kind":"prose","text":"","line":637,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-signed-head-in-stream","title":"The stream carries signed tree heads; a restored session waits for peers","status":"accepted","date":"2026-11-07","addresses":"qg-resumability, risk-forged-copy"},"startLine":639,"endLine":645,"inArc42Fence":true},{"kind":"prose","text":"","line":647,"renderedHtml":""},{"kind":"heading","level":2,"text":"One interface of the hub for every type of record","line":648},{"kind":"prose","text":"","line":649,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Decisions, minutes, notes, tasks and slides are different things with different\nlives. Teams already use tools of their own for some of them, for example issues for tasks.\n\u003cstrong>Decision:\u003c/strong> The hub offers its own interface for every type: sessions, decisions, minutes,\nnotes, tasks and slides. Each interface owns its types (\u003ccode>concept-module-boundaries\u003c/code>). Behind\nevery interface, the hub decides where the records are stored; the storage can be exchanged per\ntype without changing the interface. The building blocks: one part of the hub for decisions,\nminutes and notes, one for tasks, one for slides, and one\narchive part that all of them use for storage.\n\u003cstrong>Consequences:\u003c/strong> A new type is a new interface. An agent always knows what it writes.\n\u003cstrong>Rejected:\u003c/strong> one journal for all kinds (it mixes\nrecords with different lives); tasks only in the hub (teams have their own task tools).\u003c/p>\n"},{"kind":"prose","text":"**Context:** Decisions, minutes, notes, tasks and slides are different things with different","line":650,"renderedHtml":""},{"kind":"prose","text":"lives. Teams already use tools of their own for some of them, for example issues for tasks.","line":651,"renderedHtml":""},{"kind":"prose","text":"**Decision:** The hub offers its own interface for every type: sessions, decisions, minutes,","line":652,"renderedHtml":""},{"kind":"prose","text":"notes, tasks and slides. Each interface owns its types (`concept-module-boundaries`). Behind","line":653,"renderedHtml":""},{"kind":"prose","text":"every interface, the hub decides where the records are stored; the storage can be exchanged per","line":654,"renderedHtml":""},{"kind":"prose","text":"type without changing the interface. The building blocks: one part of the hub for decisions,","line":655,"renderedHtml":""},{"kind":"prose","text":"minutes and notes, one for tasks, one for slides, and one","line":656,"renderedHtml":""},{"kind":"prose","text":"archive part that all of them use for storage.","line":657,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** A new type is a new interface. An agent always knows what it writes.","line":658,"renderedHtml":""},{"kind":"prose","text":"**Rejected:** one journal for all kinds (it mixes","line":659,"renderedHtml":""},{"kind":"prose","text":"records with different lives); tasks only in the hub (teams have their own task tools).","line":660,"renderedHtml":""},{"kind":"prose","text":"","line":661,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-records-per-type","title":"One interface of the hub for every type of record","status":"accepted","date":"2026-11-07","addresses":"qg-usability"},"startLine":663,"endLine":669,"inArc42Fence":true},{"kind":"prose","text":"","line":671,"renderedHtml":""},{"kind":"heading","level":2,"text":"Everything as YAML in a local Git repository first","line":672},{"kind":"prose","text":"","line":673,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The storage behind the interfaces should be local and predictably fast at first, and\nreplaceable later. \u003cstrong>Decision:\u003c/strong> At first, the hub stores every type as YAML files in a local Git\nrepository on the hub host and commits locally. The push to a remote is mocked. Tasks are local\ndrafts too. Later, tasks are synced with the task tool of the team (for example GitHub or GitLab\nissues), and the synced task replaces the local draft. \u003cstrong>Consequences:\u003c/strong> No external service is\nneeded to start, and commits stay fast. Sessions are written in the background at an interval\n(\u003ccode>dec-session-persistence\u003c/code>). The session log is the exception to YAML: it is stored with one\nline per event, in the same format as the local log of the peers, because it only grows and every\nwrite appends lines. \u003cstrong>Rejected:\u003c/strong> a database (not needed yet);\nexternal task tools from the start (slow and not predictable).\u003c/p>\n"},{"kind":"prose","text":"**Context:** The storage behind the interfaces should be local and predictably fast at first, and","line":674,"renderedHtml":""},{"kind":"prose","text":"replaceable later. **Decision:** At first, the hub stores every type as YAML files in a local Git","line":675,"renderedHtml":""},{"kind":"prose","text":"repository on the hub host and commits locally. The push to a remote is mocked. Tasks are local","line":676,"renderedHtml":""},{"kind":"prose","text":"drafts too. Later, tasks are synced with the task tool of the team (for example GitHub or GitLab","line":677,"renderedHtml":""},{"kind":"prose","text":"issues), and the synced task replaces the local draft. **Consequences:** No external service is","line":678,"renderedHtml":""},{"kind":"prose","text":"needed to start, and commits stay fast. Sessions are written in the background at an interval","line":679,"renderedHtml":""},{"kind":"prose","text":"(`dec-session-persistence`). The session log is the exception to YAML: it is stored with one","line":680,"renderedHtml":""},{"kind":"prose","text":"line per event, in the same format as the local log of the peers, because it only grows and every","line":681,"renderedHtml":""},{"kind":"prose","text":"write appends lines. **Rejected:** a database (not needed yet);","line":682,"renderedHtml":""},{"kind":"prose","text":"external task tools from the start (slow and not predictable).","line":683,"renderedHtml":""},{"kind":"prose","text":"","line":684,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-yaml-git-storage","title":"Every type as YAML in a local Git repository; push mocked","status":"accepted","date":"2026-11-07","addresses":"risk-archive-latency, qg-performance"},"startLine":686,"endLine":692,"inArc42Fence":true},{"kind":"prose","text":"","line":694,"renderedHtml":""},{"kind":"heading","level":2,"text":"The signing key of the hub is given at start","line":695},{"kind":"prose","text":"","line":696,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The hub signs tree heads. Clients and readers of the archive trust these signatures.\nA key that the hub creates by itself on first start is easy to lose or replace without anyone\nnoticing. \u003cstrong>Decision:\u003c/strong> The operator gives the hub its signing key when the hub starts, at first\nas the name of a key file on the command line. The hub does not create a signing key by itself\nand does not start without one. \u003cstrong>Consequences:\u003c/strong> The operator controls the key and can keep it\nwith other secrets. Replacing the key is a deliberate act. OPEN: how clients pin the public key\nof the hub (#41). \u003cstrong>Rejected:\u003c/strong> a key that the hub creates in its data directory.\u003c/p>\n"},{"kind":"prose","text":"**Context:** The hub signs tree heads. Clients and readers of the archive trust these signatures.","line":697,"renderedHtml":""},{"kind":"prose","text":"A key that the hub creates by itself on first start is easy to lose or replace without anyone","line":698,"renderedHtml":""},{"kind":"prose","text":"noticing. **Decision:** The operator gives the hub its signing key when the hub starts, at first","line":699,"renderedHtml":""},{"kind":"prose","text":"as the name of a key file on the command line. The hub does not create a signing key by itself","line":700,"renderedHtml":""},{"kind":"prose","text":"and does not start without one. **Consequences:** The operator controls the key and can keep it","line":701,"renderedHtml":""},{"kind":"prose","text":"with other secrets. Replacing the key is a deliberate act. OPEN: how clients pin the public key","line":702,"renderedHtml":""},{"kind":"prose","text":"of the hub (#41). **Rejected:** a key that the hub creates in its data directory.","line":703,"renderedHtml":""},{"kind":"prose","text":"","line":704,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-hub-signing-key","title":"The signing key is given to the hub at start","status":"accepted","date":"2026-11-07","addresses":"risk-forged-copy, qg-confidentiality"},"startLine":706,"endLine":712,"inArc42Fence":true},{"kind":"prose","text":"","line":714,"renderedHtml":""},{"kind":"heading","level":2,"text":"A session belongs to exactly one schema","line":715},{"kind":"prose","text":"","line":716,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The leaves of the Merkle tree depend on the encoding of the events, and the encoding\ndepends on the version of the session contract. A client with another version could compute\nother leaves and reject a correct copy. \u003cstrong>Decision:\u003c/strong> A session belongs to exactly one schema, the\nversion of the session contract it was started with. The session records its schema. Changes of\nthe schema are not taken over inside a running session: a hub with another schema does not\ncontinue a session of an older schema, and verifiers check a session with its own schema.\n\u003cstrong>Consequences:\u003c/strong> Copies and archived sessions stay verifiable after an update of the contract.\nAn update of the hub ends the use of running sessions of the old schema for writing.\n\u003cstrong>Rejected:\u003c/strong> a leaf format that is independent of the contract (more work now, not needed yet).\u003c/p>\n"},{"kind":"prose","text":"**Context:** The leaves of the Merkle tree depend on the encoding of the events, and the encoding","line":717,"renderedHtml":""},{"kind":"prose","text":"depends on the version of the session contract. A client with another version could compute","line":718,"renderedHtml":""},{"kind":"prose","text":"other leaves and reject a correct copy. **Decision:** A session belongs to exactly one schema, the","line":719,"renderedHtml":""},{"kind":"prose","text":"version of the session contract it was started with. The session records its schema. Changes of","line":720,"renderedHtml":""},{"kind":"prose","text":"the schema are not taken over inside a running session: a hub with another schema does not","line":721,"renderedHtml":""},{"kind":"prose","text":"continue a session of an older schema, and verifiers check a session with its own schema.","line":722,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** Copies and archived sessions stay verifiable after an update of the contract.","line":723,"renderedHtml":""},{"kind":"prose","text":"An update of the hub ends the use of running sessions of the old schema for writing.","line":724,"renderedHtml":""},{"kind":"prose","text":"**Rejected:** a leaf format that is independent of the contract (more work now, not needed yet).","line":725,"renderedHtml":""},{"kind":"prose","text":"","line":726,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-session-schema","title":"A session belongs to exactly one schema","status":"accepted","date":"2026-11-07","addresses":"risk-forged-copy, qg-resumability"},"startLine":728,"endLine":734,"inArc42Fence":true},{"kind":"prose","text":"","line":736,"renderedHtml":""},{"kind":"heading","level":2,"text":"The end of a session is a milestone, not a stop","line":737},{"kind":"prose","text":"","line":738,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> People keep working after a meeting: artifacts arrive later, and a meeting can go on\nanother day. \u003cstrong>Decision:\u003c/strong> \u003ccode>session.ended\u003c/code> is a milestone that triggers other work, for example\nthe write to the archive. It never blocks anything new; the triggered work runs in the\nbackground, and its result appears as an event in the session log. A later session command (join,\nspeak, raise a hand, show on the stage, pause or resume) opens the session again; the log shows\nthis as its own event. Artifacts through their own interfaces (decisions, minutes, notes, tasks,\nslides) may refer to an ended session and never open it again. Minutes are such an artifact: they\nare written only through the minutes interface and stored at once like every other artifact\n(\u003ccode>dec-records-synchronous\u003c/code>). While a session is open, the hub adds a notice to its log when its\nminutes change, so the stage and agents see them live. \u003cstrong>Consequences:\u003c/strong> Streams, replicators and\nagents keep following a session after its end until the participant leaves. The session itself\nno longer has a command to update minutes. \u003cstrong>Rejected:\u003c/strong> an end that rejects all later commands;\nminutes as a session command.\u003c/p>\n"},{"kind":"prose","text":"**Context:** People keep working after a meeting: artifacts arrive later, and a meeting can go on","line":739,"renderedHtml":""},{"kind":"prose","text":"another day. **Decision:** `session.ended` is a milestone that triggers other work, for example","line":740,"renderedHtml":""},{"kind":"prose","text":"the write to the archive. It never blocks anything new; the triggered work runs in the","line":741,"renderedHtml":""},{"kind":"prose","text":"background, and its result appears as an event in the session log. A later session command (join,","line":742,"renderedHtml":""},{"kind":"prose","text":"speak, raise a hand, show on the stage, pause or resume) opens the session again; the log shows","line":743,"renderedHtml":""},{"kind":"prose","text":"this as its own event. Artifacts through their own interfaces (decisions, minutes, notes, tasks,","line":744,"renderedHtml":""},{"kind":"prose","text":"slides) may refer to an ended session and never open it again. Minutes are such an artifact: they","line":745,"renderedHtml":""},{"kind":"prose","text":"are written only through the minutes interface and stored at once like every other artifact","line":746,"renderedHtml":""},{"kind":"prose","text":"(`dec-records-synchronous`). While a session is open, the hub adds a notice to its log when its","line":747,"renderedHtml":""},{"kind":"prose","text":"minutes change, so the stage and agents see them live. **Consequences:** Streams, replicators and","line":748,"renderedHtml":""},{"kind":"prose","text":"agents keep following a session after its end until the participant leaves. The session itself","line":749,"renderedHtml":""},{"kind":"prose","text":"no longer has a command to update minutes. **Rejected:** an end that rejects all later commands;","line":750,"renderedHtml":""},{"kind":"prose","text":"minutes as a session command.","line":751,"renderedHtml":""},{"kind":"prose","text":"","line":752,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-session-end-milestone","title":"The end of a session is a milestone, not a stop","status":"accepted","date":"2026-11-07","addresses":"qg-usability, risk-archive-latency"},"startLine":754,"endLine":760,"inArc42Fence":true},{"kind":"prose","text":"","line":762,"renderedHtml":""},{"kind":"heading","level":2,"text":"Records are written synchronously and before session writes","line":763},{"kind":"prose","text":"","line":764,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> A client must learn whether its decision, note, task or slide deck was stored.\nSession logs are written in the background, and a Git commit can be slow. \u003cstrong>Decision:\u003c/strong> Records\nare written synchronously: a call returns only after the commit, and a failure reaches the\nclient. Writes of records go before waiting writes of session logs, so a record waits at most for\nthe one session write that is in progress, never for a queue. \u003cstrong>Consequences:\u003c/strong> Clients get a\nclear result. A slow repository slows records, but not the session itself. \u003cstrong>Rejected:\u003c/strong> records\nin the background (the client would not learn about a failure).\u003c/p>\n"},{"kind":"prose","text":"**Context:** A client must learn whether its decision, note, task or slide deck was stored.","line":765,"renderedHtml":""},{"kind":"prose","text":"Session logs are written in the background, and a Git commit can be slow. **Decision:** Records","line":766,"renderedHtml":""},{"kind":"prose","text":"are written synchronously: a call returns only after the commit, and a failure reaches the","line":767,"renderedHtml":""},{"kind":"prose","text":"client. Writes of records go before waiting writes of session logs, so a record waits at most for","line":768,"renderedHtml":""},{"kind":"prose","text":"the one session write that is in progress, never for a queue. **Consequences:** Clients get a","line":769,"renderedHtml":""},{"kind":"prose","text":"clear result. A slow repository slows records, but not the session itself. **Rejected:** records","line":770,"renderedHtml":""},{"kind":"prose","text":"in the background (the client would not learn about a failure).","line":771,"renderedHtml":""},{"kind":"prose","text":"","line":772,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-records-synchronous","title":"Records are written synchronously and before session writes","status":"accepted","date":"2026-11-07","addresses":"risk-archive-latency, qg-usability"},"startLine":774,"endLine":780,"inArc42Fence":true},{"kind":"prose","text":"","line":782,"renderedHtml":""},{"kind":"prose","text":"","line":783,"renderedHtml":""},{"kind":"heading","level":2,"text":"Imported conversations become marked sessions","line":784},{"kind":"prose","text":"","line":785,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Many conversations happen outside the office: in other meeting tools, in chats, or\nwith an agent. The team wants minutes, decisions, notes and tasks from them, like from a session.\nThe hub did not see these conversations happen, so it cannot order and sign their messages one by\none. Nobody may mistake such a session for a live one. \u003cstrong>Decision:\u003c/strong> The hub has its own\ninterface to import a whole conversation as a new session (\u003ccode>if-session-import\u003c/code>), in one call or in\npages. The meeting session realizes it, so every session log keeps one writer. The first event of\nan imported session marks it as imported, with its source, its title and the participant who\nimported it; a last event marks the end of the import. The speakers of the conversation become\nimported participants with a name and a kind; their IDs are marked as imported, so they never\nmatch a registered participant. The utterances keep their order and, if known, the time they were\nmade. Every page carries an ID created by the client (\u003ccode>dec-idempotent-commands\u003c/code>). Until the import\nis complete, the session takes only the pages of the participant who started it. After that, it is\na session like any other: participants join, write minutes and end it, and the stream, the events\nafter a cursor, the archive and the restore treat it like every other session. The end of an\nimport starts a write to the archive, like the end of a session. The hub signs tree\nheads over an imported log as over every log. The signature proves who imported the log and that\nit has not changed since; it does not prove that the speakers said what it says.\n\u003cstrong>Consequences:\u003c/strong> Agents and humans derive records from an imported session through the existing\ninterfaces, without a second path. Readers recognise an imported session by its first event. The\nnew events are a new revision of the session schema (\u003ccode>dec-session-schema\u003c/code>). OPEN: nobody can mark\nan imported sentence off the record, because the speakers are not participants with a key (#50).\nOPEN: an import that stops halfway leaves an incomplete session; it cannot be continued by a new\ncall of the client (#51). \u003cstrong>Rejected:\u003c/strong> a separate part of the hub with its own log (two writers,\nor an extra internal interface for writing many events at once); a signature per imported\nmessage (it would claim an order the hub never saw); ending the session with the import\n(participants could not write minutes into it any more); matching imported speakers to registered\nparticipants by name (the hub cannot check it).\u003c/p>\n"},{"kind":"prose","text":"**Context:** Many conversations happen outside the office: in other meeting tools, in chats, or","line":786,"renderedHtml":""},{"kind":"prose","text":"with an agent. The team wants minutes, decisions, notes and tasks from them, like from a session.","line":787,"renderedHtml":""},{"kind":"prose","text":"The hub did not see these conversations happen, so it cannot order and sign their messages one by","line":788,"renderedHtml":""},{"kind":"prose","text":"one. Nobody may mistake such a session for a live one. **Decision:** The hub has its own","line":789,"renderedHtml":""},{"kind":"prose","text":"interface to import a whole conversation as a new session (`if-session-import`), in one call or in","line":790,"renderedHtml":""},{"kind":"prose","text":"pages. The meeting session realizes it, so every session log keeps one writer. The first event of","line":791,"renderedHtml":""},{"kind":"prose","text":"an imported session marks it as imported, with its source, its title and the participant who","line":792,"renderedHtml":""},{"kind":"prose","text":"imported it; a last event marks the end of the import. The speakers of the conversation become","line":793,"renderedHtml":""},{"kind":"prose","text":"imported participants with a name and a kind; their IDs are marked as imported, so they never","line":794,"renderedHtml":""},{"kind":"prose","text":"match a registered participant. The utterances keep their order and, if known, the time they were","line":795,"renderedHtml":""},{"kind":"prose","text":"made. Every page carries an ID created by the client (`dec-idempotent-commands`). Until the import","line":796,"renderedHtml":""},{"kind":"prose","text":"is complete, the session takes only the pages of the participant who started it. After that, it is","line":797,"renderedHtml":""},{"kind":"prose","text":"a session like any other: participants join, write minutes and end it, and the stream, the events","line":798,"renderedHtml":""},{"kind":"prose","text":"after a cursor, the archive and the restore treat it like every other session. The end of an","line":799,"renderedHtml":""},{"kind":"prose","text":"import starts a write to the archive, like the end of a session. The hub signs tree","line":800,"renderedHtml":""},{"kind":"prose","text":"heads over an imported log as over every log. The signature proves who imported the log and that","line":801,"renderedHtml":""},{"kind":"prose","text":"it has not changed since; it does not prove that the speakers said what it says.","line":802,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** Agents and humans derive records from an imported session through the existing","line":803,"renderedHtml":""},{"kind":"prose","text":"interfaces, without a second path. Readers recognise an imported session by its first event. The","line":804,"renderedHtml":""},{"kind":"prose","text":"new events are a new revision of the session schema (`dec-session-schema`). OPEN: nobody can mark","line":805,"renderedHtml":""},{"kind":"prose","text":"an imported sentence off the record, because the speakers are not participants with a key (#50).","line":806,"renderedHtml":""},{"kind":"prose","text":"OPEN: an import that stops halfway leaves an incomplete session; it cannot be continued by a new","line":807,"renderedHtml":""},{"kind":"prose","text":"call of the client (#51). **Rejected:** a separate part of the hub with its own log (two writers,","line":808,"renderedHtml":""},{"kind":"prose","text":"or an extra internal interface for writing many events at once); a signature per imported","line":809,"renderedHtml":""},{"kind":"prose","text":"message (it would claim an order the hub never saw); ending the session with the import","line":810,"renderedHtml":""},{"kind":"prose","text":"(participants could not write minutes into it any more); matching imported speakers to registered","line":811,"renderedHtml":""},{"kind":"prose","text":"participants by name (the hub cannot check it).","line":812,"renderedHtml":""},{"kind":"prose","text":"","line":813,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-session-import","title":"Imported conversations become marked sessions","status":"proposed","date":"2026-11-07","addresses":"qg-usability, risk-imported-conversation"},"startLine":815,"endLine":821,"inArc42Fence":true},{"kind":"prose","text":"","line":823,"renderedHtml":""},{"kind":"heading","level":2,"text":"An own JSON format for imported conversations, read by the client","line":824},{"kind":"prose","text":"","line":825,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Conversations come from many tools, each with its own export. The import interface\nshould not change with every new tool. \u003cstrong>Decision:\u003c/strong> The first import format is our own: one JSON\ndocument per conversation with its title, its source, its participants and its utterances in\norder. The client core reads it and sends the conversation to the hub in pages, so the CLI and the\nMCP server accept the same format. The README of the client documents the format with an example.\nAdapters for other formats, for example chat exports or WebVTT transcripts of meeting tools, are\nlater work in the client and translate into the same pages. \u003cstrong>Consequences:\u003c/strong> The hub knows only\nthe import interface, not the formats of other tools. An agent can write a conversation as one\nJSON object, in a file or directly as the argument of the MCP tool. A very long conversation is\none file, but goes to the hub in pages. \u003cstrong>Rejected:\u003c/strong> one line per message (the file then needs a\nheader line of another kind, and an agent cannot write it as one object); the JSON form of the\ninterface itself (paging and enum names would leak into a format for authors); reading the\nformats in the hub (every new tool would change the hub).\u003c/p>\n"},{"kind":"prose","text":"**Context:** Conversations come from many tools, each with its own export. The import interface","line":826,"renderedHtml":""},{"kind":"prose","text":"should not change with every new tool. **Decision:** The first import format is our own: one JSON","line":827,"renderedHtml":""},{"kind":"prose","text":"document per conversation with its title, its source, its participants and its utterances in","line":828,"renderedHtml":""},{"kind":"prose","text":"order. The client core reads it and sends the conversation to the hub in pages, so the CLI and the","line":829,"renderedHtml":""},{"kind":"prose","text":"MCP server accept the same format. The README of the client documents the format with an example.","line":830,"renderedHtml":""},{"kind":"prose","text":"Adapters for other formats, for example chat exports or WebVTT transcripts of meeting tools, are","line":831,"renderedHtml":""},{"kind":"prose","text":"later work in the client and translate into the same pages. **Consequences:** The hub knows only","line":832,"renderedHtml":""},{"kind":"prose","text":"the import interface, not the formats of other tools. An agent can write a conversation as one","line":833,"renderedHtml":""},{"kind":"prose","text":"JSON object, in a file or directly as the argument of the MCP tool. A very long conversation is","line":834,"renderedHtml":""},{"kind":"prose","text":"one file, but goes to the hub in pages. **Rejected:** one line per message (the file then needs a","line":835,"renderedHtml":""},{"kind":"prose","text":"header line of another kind, and an agent cannot write it as one object); the JSON form of the","line":836,"renderedHtml":""},{"kind":"prose","text":"interface itself (paging and enum names would leak into a format for authors); reading the","line":837,"renderedHtml":""},{"kind":"prose","text":"formats in the hub (every new tool would change the hub).","line":838,"renderedHtml":""},{"kind":"prose","text":"","line":839,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-import-format","title":"An own JSON format for imported conversations, read by the client","status":"proposed","date":"2026-11-07","addresses":"qg-usability, con-no-intelligence"},"startLine":841,"endLine":847,"inArc42Fence":true},{"kind":"prose","text":"","line":849,"renderedHtml":""},{"kind":"heading","level":2,"text":"The client chooses its speech model by language and speed and downloads it on first use","line":850},{"kind":"prose","text":"","line":851,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The ears need a Whisper model and a voice activity model. The client is published as\na ready binary, so a participant has no build step that could fetch them. One model does not fit\nevery meeting: a large model transcribes names and terms better, a model fine-tuned for one\nlanguage is better still for that language, but both are too slow for live use without a GPU. A\nsmall model is fast on every computer, but makes more mistakes. \u003cstrong>Decision:\u003c/strong> The client knows a\ncatalogue of speech models by name: a small multilingual model, a large multilingual model and a\nlarge model fine-tuned for German. The participant names the spoken language. The client takes the\nbest model for that language: the German model for German, the large multilingual model for every\nother language. The participant can ask for the fast model instead. When the build of the client\nhas no GPU support, the client takes the fast model by itself and says so. A participant can still\nname any model of the catalogue or a model file. When the ears start and the chosen model of the\ncatalogue is missing, the client downloads it once from its public source, or from a mirror that\nthe participant configures. It checks every file against a checksum that is pinned in the client\nand keeps only a matching file. Separate commands list the catalogue with what is downloaded and\nwhich model would be used, and download models ahead of time. A model file that the participant\nchose is never downloaded. \u003cstrong>Consequences:\u003c/strong> The first join with the microphone needs the network\nand takes longer; a large model is about 1.6 GB. Later joins are offline as before. Only the\nmodel files come in; no audio, text or identity goes out (\u003ccode>qg-confidentiality\u003c/code>). A changed or\ndamaged file at the source stops the download instead of changing the transcription. A new model\nor a new version needs a new client. The client decides about the GPU from its build, not from\nthe hardware; a participant with an own build can override it. OPEN: whether the large models are\nfast enough for live use on the GPUs of participant laptops (minimum hardware, chapter 7).\n\u003cstrong>Rejected:\u003c/strong> models inside the binary (gigabytes for agents that never listen); a download\nwithout a checksum (the client would load whatever the source serves); one fixed model for\neveryone (worse for German, or too slow without a GPU); detecting the GPU from the hardware (the\nbinary can only use what it was built with).\u003c/p>\n"},{"kind":"prose","text":"**Context:** The ears need a Whisper model and a voice activity model. The client is published as","line":852,"renderedHtml":""},{"kind":"prose","text":"a ready binary, so a participant has no build step that could fetch them. One model does not fit","line":853,"renderedHtml":""},{"kind":"prose","text":"every meeting: a large model transcribes names and terms better, a model fine-tuned for one","line":854,"renderedHtml":""},{"kind":"prose","text":"language is better still for that language, but both are too slow for live use without a GPU. A","line":855,"renderedHtml":""},{"kind":"prose","text":"small model is fast on every computer, but makes more mistakes. **Decision:** The client knows a","line":856,"renderedHtml":""},{"kind":"prose","text":"catalogue of speech models by name: a small multilingual model, a large multilingual model and a","line":857,"renderedHtml":""},{"kind":"prose","text":"large model fine-tuned for German. The participant names the spoken language. The client takes the","line":858,"renderedHtml":""},{"kind":"prose","text":"best model for that language: the German model for German, the large multilingual model for every","line":859,"renderedHtml":""},{"kind":"prose","text":"other language. The participant can ask for the fast model instead. When the build of the client","line":860,"renderedHtml":""},{"kind":"prose","text":"has no GPU support, the client takes the fast model by itself and says so. A participant can still","line":861,"renderedHtml":""},{"kind":"prose","text":"name any model of the catalogue or a model file. When the ears start and the chosen model of the","line":862,"renderedHtml":""},{"kind":"prose","text":"catalogue is missing, the client downloads it once from its public source, or from a mirror that","line":863,"renderedHtml":""},{"kind":"prose","text":"the participant configures. It checks every file against a checksum that is pinned in the client","line":864,"renderedHtml":""},{"kind":"prose","text":"and keeps only a matching file. Separate commands list the catalogue with what is downloaded and","line":865,"renderedHtml":""},{"kind":"prose","text":"which model would be used, and download models ahead of time. A model file that the participant","line":866,"renderedHtml":""},{"kind":"prose","text":"chose is never downloaded. **Consequences:** The first join with the microphone needs the network","line":867,"renderedHtml":""},{"kind":"prose","text":"and takes longer; a large model is about 1.6 GB. Later joins are offline as before. Only the","line":868,"renderedHtml":""},{"kind":"prose","text":"model files come in; no audio, text or identity goes out (`qg-confidentiality`). A changed or","line":869,"renderedHtml":""},{"kind":"prose","text":"damaged file at the source stops the download instead of changing the transcription. A new model","line":870,"renderedHtml":""},{"kind":"prose","text":"or a new version needs a new client. The client decides about the GPU from its build, not from","line":871,"renderedHtml":""},{"kind":"prose","text":"the hardware; a participant with an own build can override it. OPEN: whether the large models are","line":872,"renderedHtml":""},{"kind":"prose","text":"fast enough for live use on the GPUs of participant laptops (minimum hardware, chapter 7).","line":873,"renderedHtml":""},{"kind":"prose","text":"**Rejected:** models inside the binary (gigabytes for agents that never listen); a download","line":874,"renderedHtml":""},{"kind":"prose","text":"without a checksum (the client would load whatever the source serves); one fixed model for","line":875,"renderedHtml":""},{"kind":"prose","text":"everyone (worse for German, or too slow without a GPU); detecting the GPU from the hardware (the","line":876,"renderedHtml":""},{"kind":"prose","text":"binary can only use what it was built with).","line":877,"renderedHtml":""},{"kind":"prose","text":"","line":878,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-model-download","title":"The client chooses its speech model by language and speed and downloads it on first use","status":"proposed","date":"2026-11-10","addresses":"qg-usability, qg-confidentiality"},"startLine":880,"endLine":886,"inArc42Fence":true},{"kind":"prose","text":"","line":888,"renderedHtml":""},{"kind":"heading","level":2,"text":"The ears give Whisper the vocabulary of the project and the names of the participants","line":889},{"kind":"prose","text":"","line":890,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Whisper often misspells names and terms of a project, for example product names,\nabbreviations and the names of the people in the meeting. These words matter most in minutes and\ntasks. Whisper accepts a short text as a prompt before each sentence and then prefers its words\nand spellings. The prompt is short: Whisper keeps only the last part of a long one.\n\u003cstrong>Decision:\u003c/strong> The ears build the prompt from two sources: a vocabulary file of the project in the\nworking directory of the client (or a file the participant names), then the display names of the\nparticipants of the session, which the client knows from its local log. The terms keep their\norder in the file; the names follow. What does not fit is cut at the end, so the first terms of\nthe file always count. The ears report how many terms and names they use and how many they cut.\nThe previous sentence as additional context is an option and off by default, because nobody has\nmeasured yet whether it helps. \u003cstrong>Consequences:\u003c/strong> A team improves the transcription by writing a\nplain text file; no model is trained. The vocabulary and the names stay on the device like the\naudio (\u003ccode>concept-edge-transcription\u003c/code>). A wrong or very long vocabulary can make Whisper write a\nterm that was not said. OPEN: the effect on the error rate is not measured; a measurement corpus\nis out of scope of the epic (#66). \u003cstrong>Rejected:\u003c/strong> fine-tuning a model per team (training data and\ncompute that a team does not have); correcting the text after Whisper (it cannot recover a word\nthat Whisper did not hear as such).\u003c/p>\n"},{"kind":"prose","text":"**Context:** Whisper often misspells names and terms of a project, for example product names,","line":891,"renderedHtml":""},{"kind":"prose","text":"abbreviations and the names of the people in the meeting. These words matter most in minutes and","line":892,"renderedHtml":""},{"kind":"prose","text":"tasks. Whisper accepts a short text as a prompt before each sentence and then prefers its words","line":893,"renderedHtml":""},{"kind":"prose","text":"and spellings. The prompt is short: Whisper keeps only the last part of a long one.","line":894,"renderedHtml":""},{"kind":"prose","text":"**Decision:** The ears build the prompt from two sources: a vocabulary file of the project in the","line":895,"renderedHtml":""},{"kind":"prose","text":"working directory of the client (or a file the participant names), then the display names of the","line":896,"renderedHtml":""},{"kind":"prose","text":"participants of the session, which the client knows from its local log. The terms keep their","line":897,"renderedHtml":""},{"kind":"prose","text":"order in the file; the names follow. What does not fit is cut at the end, so the first terms of","line":898,"renderedHtml":""},{"kind":"prose","text":"the file always count. The ears report how many terms and names they use and how many they cut.","line":899,"renderedHtml":""},{"kind":"prose","text":"The previous sentence as additional context is an option and off by default, because nobody has","line":900,"renderedHtml":""},{"kind":"prose","text":"measured yet whether it helps. **Consequences:** A team improves the transcription by writing a","line":901,"renderedHtml":""},{"kind":"prose","text":"plain text file; no model is trained. The vocabulary and the names stay on the device like the","line":902,"renderedHtml":""},{"kind":"prose","text":"audio (`concept-edge-transcription`). A wrong or very long vocabulary can make Whisper write a","line":903,"renderedHtml":""},{"kind":"prose","text":"term that was not said. OPEN: the effect on the error rate is not measured; a measurement corpus","line":904,"renderedHtml":""},{"kind":"prose","text":"is out of scope of the epic (#66). **Rejected:** fine-tuning a model per team (training data and","line":905,"renderedHtml":""},{"kind":"prose","text":"compute that a team does not have); correcting the text after Whisper (it cannot recover a word","line":906,"renderedHtml":""},{"kind":"prose","text":"that Whisper did not hear as such).","line":907,"renderedHtml":""},{"kind":"prose","text":"","line":908,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-vocabulary-prompt","title":"The ears give Whisper the vocabulary of the project and the names of the participants","status":"proposed","date":"2026-11-11","addresses":"qg-usability, qg-confidentiality"},"startLine":910,"endLine":916,"inArc42Fence":true},{"kind":"prose","text":"","line":918,"renderedHtml":""}]},{"filePath":"docs/architecture/10-quality-requirements.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Quality Requirements","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>Four quality goals drive the architecture, in this order: confidentiality, then performance, then\nresumability, then usability. When two goals conflict, the one higher in the list wins. Properties\nlike &quot;any agent can connect&quot; are product features, not quality goals. They are covered by the\nsolution strategy and the decisions.\u003c/p>\n"},{"kind":"prose","text":"Four quality goals drive the architecture, in this order: confidentiality, then performance, then","line":3,"renderedHtml":""},{"kind":"prose","text":"resumability, then usability. When two goals conflict, the one higher in the list wins. Properties","line":4,"renderedHtml":""},{"kind":"prose","text":"like \"any agent can connect\" are product features, not quality goals. They are covered by the","line":5,"renderedHtml":""},{"kind":"prose","text":"solution strategy and the decisions.","line":6,"renderedHtml":""},{"kind":"prose","text":"","line":7,"renderedHtml":""},{"kind":"heading","level":2,"text":"Confidentiality","line":8},{"kind":"prose","text":"","line":9,"renderedHtml":"\u003cp>Speech needs special protection (ISO 25010: security, confidentiality). Raw audio must not leave\nthe speaker&#39;s device, and only people who consented are captured.\u003c/p>\n"},{"kind":"prose","text":"Speech needs special protection (ISO 25010: security, confidentiality). Raw audio must not leave","line":10,"renderedHtml":""},{"kind":"prose","text":"the speaker's device, and only people who consented are captured.","line":11,"renderedHtml":""},{"kind":"prose","text":"","line":12,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-confidentiality","title":"Confidentiality","priority":"high"},"startLine":14,"endLine":18,"inArc42Fence":true},{"kind":"prose","text":"","line":20,"renderedHtml":""},{"kind":"heading","level":2,"text":"Performance","line":21},{"kind":"prose","text":"","line":22,"renderedHtml":"\u003cp>An agent must be able to react within the natural pause after a contribution (ISO 25010:\nperformance efficiency, time behaviour). For this, speech must reach the session log without\nnoticeable delay.\u003c/p>\n"},{"kind":"prose","text":"An agent must be able to react within the natural pause after a contribution (ISO 25010:","line":23,"renderedHtml":""},{"kind":"prose","text":"performance efficiency, time behaviour). For this, speech must reach the session log without","line":24,"renderedHtml":""},{"kind":"prose","text":"noticeable delay.","line":25,"renderedHtml":""},{"kind":"prose","text":"","line":26,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-performance","title":"Performance (latency)","priority":"high"},"startLine":28,"endLine":32,"inArc42Fence":true},{"kind":"prose","text":"","line":34,"renderedHtml":""},{"kind":"heading","level":2,"text":"Resumability","line":35},{"kind":"prose","text":"","line":36,"renderedHtml":"\u003cp>Networks drop, especially on laptops in meetings (ISO 25010: reliability, recoverability). After a\ndrop, every client continues where it stopped. No event is lost, and no event is stored or\ndelivered twice.\u003c/p>\n"},{"kind":"prose","text":"Networks drop, especially on laptops in meetings (ISO 25010: reliability, recoverability). After a","line":37,"renderedHtml":""},{"kind":"prose","text":"drop, every client continues where it stopped. No event is lost, and no event is stored or","line":38,"renderedHtml":""},{"kind":"prose","text":"delivered twice.","line":39,"renderedHtml":""},{"kind":"prose","text":"","line":40,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-resumability","title":"Resumability after network drops","priority":"high"},"startLine":42,"endLine":46,"inArc42Fence":true},{"kind":"prose","text":"","line":48,"renderedHtml":""},{"kind":"heading","level":2,"text":"Usability","line":49},{"kind":"prose","text":"","line":50,"renderedHtml":"\u003cp>Participants see at all times what was captured and sent from them, and they can act on it\n(ISO 25010: usability, here mainly transparency and control).\u003c/p>\n"},{"kind":"prose","text":"Participants see at all times what was captured and sent from them, and they can act on it","line":51,"renderedHtml":""},{"kind":"prose","text":"(ISO 25010: usability, here mainly transparency and control).","line":52,"renderedHtml":""},{"kind":"prose","text":"","line":53,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-usability","title":"Usability (transparency of capture)","priority":"high"},"startLine":55,"endLine":59,"inArc42Fence":true},{"kind":"prose","text":"","line":61,"renderedHtml":""},{"kind":"heading","level":2,"text":"No raw audio leaves the device","line":62},{"kind":"prose","text":"","line":63,"renderedHtml":"\u003cp>This is the acceptance test for confidentiality. In a test meeting, a participant speaks with the\nears switched on. We record the outgoing network traffic of their client, for example with a proxy\nor a packet capture. We check that it contains only text events and no audio data.\u003c/p>\n"},{"kind":"prose","text":"This is the acceptance test for confidentiality. In a test meeting, a participant speaks with the","line":64,"renderedHtml":""},{"kind":"prose","text":"ears switched on. We record the outgoing network traffic of their client, for example with a proxy","line":65,"renderedHtml":""},{"kind":"prose","text":"or a packet capture. We check that it contains only text events and no audio data.","line":66,"renderedHtml":""},{"kind":"prose","text":"","line":67,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-no-raw-audio","title":"No raw audio in outgoing traffic","quality":"qg-confidentiality","stimulus":"A participant speaks for 30 minutes with --mic while outgoing traffic is recorded","response":"The client sends only text events and metadata","metric":"0 bytes of audio data in the capture"},"startLine":69,"endLine":76,"inArc42Fence":true},{"kind":"prose","text":"","line":78,"renderedHtml":""},{"kind":"heading","level":2,"text":"From transcription to the session log","line":79},{"kind":"prose","text":"","line":80,"renderedHtml":"\u003cp>We measure from the end of the transcription of a sentence (Whisper returns the final utterance)\nto the moment the event is in the local copy of the log at another participant. That is what an\nagent actually sees. The time for voice activity detection and Whisper is not included; the next\nscenario covers it.\u003c/p>\n"},{"kind":"prose","text":"We measure from the end of the transcription of a sentence (Whisper returns the final utterance)","line":81,"renderedHtml":""},{"kind":"prose","text":"to the moment the event is in the local copy of the log at another participant. That is what an","line":82,"renderedHtml":""},{"kind":"prose","text":"agent actually sees. The time for voice activity detection and Whisper is not included; the next","line":83,"renderedHtml":""},{"kind":"prose","text":"scenario covers it.","line":84,"renderedHtml":""},{"kind":"prose","text":"","line":85,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-transcript-to-log","title":"End of transcription to event in the log","quality":"qg-performance","stimulus":"Whisper returns a final utterance","response":"utterance.final is in the local log of another participant","metric":"\u003c 200 ms (OPEN: p95 or maximum)"},"startLine":87,"endLine":94,"inArc42Fence":true},{"kind":"prose","text":"","line":96,"renderedHtml":""},{"kind":"heading","level":2,"text":"From end of speech to the log","line":97},{"kind":"prose","text":"","line":98,"renderedHtml":"\u003cp>This is what a participant experiences: the time from the end of a spoken sentence until the\nsentence is in the local log of another participant. It includes the pause that ends a sentence,\nWhisper and the way into the log. The reference hardware is the CPU-only host of the first stage.\u003c/p>\n"},{"kind":"prose","text":"This is what a participant experiences: the time from the end of a spoken sentence until the","line":99,"renderedHtml":""},{"kind":"prose","text":"sentence is in the local log of another participant. It includes the pause that ends a sentence,","line":100,"renderedHtml":""},{"kind":"prose","text":"Whisper and the way into the log. The reference hardware is the CPU-only host of the first stage.","line":101,"renderedHtml":""},{"kind":"prose","text":"","line":102,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-speech-to-log","title":"End of speech to event in the local log","quality":"qg-performance","stimulus":"A participant with --mic finishes a sentence","response":"utterance.final is in the local log of another participant","metric":"p95 ≤ 1.5 s on the reference hardware"},"startLine":104,"endLine":111,"inArc42Fence":true},{"kind":"prose","text":"","line":113,"renderedHtml":""},{"kind":"heading","level":2,"text":"Audio capture with a real headset","line":114},{"kind":"prose","text":"","line":115,"renderedHtml":"\u003cp>The automated tests use a WAV file. This manual test checks real audio capture and recognition\nquality (see \u003ccode>concept-test-strategy\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"The automated tests use a WAV file. This manual test checks real audio capture and recognition","line":116,"renderedHtml":""},{"kind":"prose","text":"quality (see `concept-test-strategy`).","line":117,"renderedHtml":""},{"kind":"prose","text":"","line":118,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-manual-headset","title":"Manual test with a real headset","quality":"qg-performance","stimulus":"A person joins with --mic on a participant laptop with a headset and speaks a few sentences","response":"Each sentence appears as utterance.final with readable text; no audio leaves the device","metric":"All spoken sentences arrive; recognition is good enough to follow the meeting (OPEN: define a word error rate)"},"startLine":120,"endLine":127,"inArc42Fence":true},{"kind":"prose","text":"","line":129,"renderedHtml":""},{"kind":"heading","level":2,"text":"Slow archive does not slow the session","line":130},{"kind":"prose","text":"","line":131,"renderedHtml":"\u003cp>The hub writes to the archive in the background. Even with a slow Git repository, speech reaches\nthe local log of the other participants as fast as without it.\u003c/p>\n"},{"kind":"prose","text":"The hub writes to the archive in the background. Even with a slow Git repository, speech reaches","line":132,"renderedHtml":""},{"kind":"prose","text":"the local log of the other participants as fast as without it.","line":133,"renderedHtml":""},{"kind":"prose","text":"","line":134,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-archive-no-backpressure","title":"A slow archive does not delay the session","quality":"qg-performan
