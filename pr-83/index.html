rite unit tests for internal functions or classes. They tie the tests to the inner\nstructure and make refactoring expensive. Tests check behaviour at the boundaries of building\nblocks instead (see the next constraint).\u003c/p>\n"},{"kind":"prose","text":"We do not write unit tests for internal functions or classes. They tie the tests to the inner","line":86,"renderedHtml":""},{"kind":"prose","text":"structure and make refactoring expensive. Tests check behaviour at the boundaries of building","line":87,"renderedHtml":""},{"kind":"prose","text":"blocks instead (see the next constraint).","line":88,"renderedHtml":""},{"kind":"prose","text":"","line":89,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-no-unit-tests","title":"No unit tests","category":"convention","source":"Maintainer"},"startLine":91,"endLine":96,"inArc42Fence":true},{"kind":"prose","text":"","line":98,"renderedHtml":""},{"kind":"heading","level":2,"text":"Black-box contract tests per building block","line":99},{"kind":"prose","text":"","line":100,"renderedHtml":"\u003cp>Every building block is tested as a black box through its interfaces (chapter 5). A contract test\nstarts the block, uses only its provided interfaces and checks the results. It knows nothing about\nthe inside of the block. If a block needs another block, the test uses the real block or a fake\nthat follows the same contract. End-to-end tests combine several blocks in the same way.\u003c/p>\n"},{"kind":"prose","text":"Every building block is tested as a black box through its interfaces (chapter 5). A contract test","line":101,"renderedHtml":""},{"kind":"prose","text":"starts the block, uses only its provided interfaces and checks the results. It knows nothing about","line":102,"renderedHtml":""},{"kind":"prose","text":"the inside of the block. If a block needs another block, the test uses the real block or a fake","line":103,"renderedHtml":""},{"kind":"prose","text":"that follows the same contract. End-to-end tests combine several blocks in the same way.","line":104,"renderedHtml":""},{"kind":"prose","text":"","line":105,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-contract-tests","title":"Black-box contract tests per building block","category":"convention","source":"Maintainer"},"startLine":107,"endLine":112,"inArc42Fence":true},{"kind":"prose","text":"","line":114,"renderedHtml":""}]},{"filePath":"docs/architecture/03-system-context.arc42.md","nodes":[{"kind":"heading","level":1,"text":"System Scope and Context","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>The system has two parts: the \u003cstrong>office hub\u003c/strong> and the \u003cstrong>participant client\u003c/strong> (CLI, MCP server,\nlog replicator, agent runner and, optionally, the ears). The actors see both only as black boxes with their\ninterfaces. Outside the system are the participants themselves\n(humans and agents), the meeting tool and, optionally, a decision model that a user brings. The meeting tool only carries the shared stage.\u003c/p>\n"},{"kind":"prose","text":"The system has two parts: the **office hub** and the **participant client** (CLI, MCP server,","line":3,"renderedHtml":""},{"kind":"prose","text":"log replicator, agent runner and, optionally, the ears). The actors see both only as black boxes with their","line":4,"renderedHtml":""},{"kind":"prose","text":"interfaces. Outside the system are the participants themselves","line":5,"renderedHtml":""},{"kind":"prose","text":"(humans and agents), the meeting tool and, optionally, a decision model that a user brings. The meeting tool only carries the shared stage.","line":6,"renderedHtml":""},{"kind":"prose","text":"","line":7,"renderedHtml":""},{"kind":"heading","level":2,"text":"Context diagram","line":8},{"kind":"prose","text":"","line":9,"renderedHtml":""},{"kind":"diagram","diagramType":"context","view":"context","id":"context-overview","notation":"mermaid","roots":[],"aliases":"actor_agent=actor-agent, actor_decision_model=actor-decision-model, actor_human=actor-human, actor_meeting_tool=actor-meeting-tool, bb_office_hub=bb-office-hub, bb_participant_client=bb-participant-client","source":"flowchart LR\n    actor_agent([Agent])\n    actor_decision_model([Decision model])\n    actor_human([Human participant])\n    actor_meeting_tool([Meeting tool])\n    subgraph office [Agentic Office]\n        bb_office_hub[Office hub]\n        bb_participant_client[Participant client]\n    end\n    actor_agent -->|if-mcp| bb_participant_client\n    actor_agent -->|if-cli| bb_participant_client\n    actor_agent -->|if-local-log| bb_participant_client\n    actor_agent -->|if-acp-client| bb_participant_client\n    actor_decision_model -->|if-decision-model| bb_participant_client\n    actor_human -->|if-cli| bb_participant_client\n    actor_human -->|if-audio-in| bb_participant_client\n    actor_human -->|if-local-log| bb_participant_client\n    actor_human -->|if-stage-web| bb_office_hub\n    actor_meeting_tool -->|if-stage-web| bb_office_hub","startLine":11,"endLine":39},{"kind":"prose","text":"","line":40,"renderedHtml":""},{"kind":"heading","level":2,"text":"Human participant","line":41},{"kind":"prose","text":"","line":42,"renderedHtml":"\u003cp>A team member in a meeting. They use the CLI like an agent does: show artifacts, raise a hand,\nedit minutes. With \u003ccode>--mic\u003c/code> they also switch on the ears. Their speech is then transcribed\nlocally, and the terminal shows what was captured and sent. One person opens the stage in a\nbrowser and shares it in the meeting.\u003c/p>\n"},{"kind":"prose","text":"A team member in a meeting. They use the CLI like an agent does: show artifacts, raise a hand,","line":43,"renderedHtml":""},{"kind":"prose","text":"edit minutes. With `--mic` they also switch on the ears. Their speech is then transcribed","line":44,"renderedHtml":""},{"kind":"prose","text":"locally, and the terminal shows what was captured and sent. One person opens the stage in a","line":45,"renderedHtml":""},{"kind":"prose","text":"browser and shares it in the meeting.","line":46,"renderedHtml":""},{"kind":"prose","text":"","line":47,"renderedHtml":""},{"kind":"block","blockType":"actor","attributes":{"id":"actor-human","title":"Human participant","type":"person","description":"Speaks (optionally transcribed), uses the CLI, shares the stage","requires":"if-cli, if-audio-in, if-local-log, if-stage-web"},"startLine":49,"endLine":55,"inArc42Fence":true},{"kind":"prose","text":"","line":57,"renderedHtml":""},{"kind":"heading","level":2,"text":"Agent","line":58},{"kind":"prose","text":"","line":59,"renderedHtml":"\u003cp>Any agent, for example Claude Code or an agent built on the Agent SDK. It joins a session, reads\nthe locally replicated log as a file (\u003ccode>tail -f\u003c/code>, \u003ccode>grep\u003c/code>) and acts through tools (MCP or CLI). It\nbrings all the intelligence.\u003c/p>\n\u003cp>An agent can also run in an \u003cstrong>agent harness\u003c/strong> that speaks the Agent Client Protocol (ACP), for\nexample Claude Code through its ACP adapter, opencode or Kiro. Then the agent runner of the client\nstarts the harness, opens one ACP session for the meeting and sends it what was said\n(\u003ccode>dec-agent-runner-acp\u003c/code>). The harness answers as the ACP agent, and the client is the ACP client.\nThe agent still acts through the office tools, which the runner hands to the harness session.\u003c/p>\n"},{"kind":"prose","text":"Any agent, for example Claude Code or an agent built on the Agent SDK. It joins a session, reads","line":60,"renderedHtml":""},{"kind":"prose","text":"the locally replicated log as a file (`tail -f`, `grep`) and acts through tools (MCP or CLI). It","line":61,"renderedHtml":""},{"kind":"prose","text":"brings all the intelligence.","line":62,"renderedHtml":""},{"kind":"prose","text":"","line":63,"renderedHtml":""},{"kind":"prose","text":"An agent can also run in an **agent harness** that speaks the Agent Client Protocol (ACP), for","line":64,"renderedHtml":""},{"kind":"prose","text":"example Claude Code through its ACP adapter, opencode or Kiro. Then the agent runner of the client","line":65,"renderedHtml":""},{"kind":"prose","text":"starts the harness, opens one ACP session for the meeting and sends it what was said","line":66,"renderedHtml":""},{"kind":"prose","text":"(`dec-agent-runner-acp`). The harness answers as the ACP agent, and the client is the ACP client.","line":67,"renderedHtml":""},{"kind":"prose","text":"The agent still acts through the office tools, which the runner hands to the harness session.","line":68,"renderedHtml":""},{"kind":"prose","text":"","line":69,"renderedHtml":""},{"kind":"block","blockType":"actor","attributes":{"id":"actor-agent","title":"Agent","type":"system","description":"Reads the session log as a file or gets it from the agent runner over ACP, writes through tools; keeps minutes, raises its hand, creates artifacts","requires":"if-mcp, if-cli, if-local-log, if-acp-client"},"startLine":71,"endLine":77,"inArc42Fence":true},{"kind":"prose","text":"","line":79,"renderedHtml":""},{"kind":"heading","level":2,"text":"Decision model","line":80},{"kind":"prose","text":"","line":81,"renderedHtml":"\u003cp>A model that a user brings and configures for the agent runner (\u003ccode>dec-byo-decision-model\u003c/code>), for\nexample a small local model behind an OpenAI-compatible endpoint, or a program. After each\nutterance of another participant, the runner asks it whether the agent should act now, whom the\nspeaker addressed and whether a block of topics has ended. The office ships no such model.\u003c/p>\n"},{"kind":"prose","text":"A model that a user brings and configures for the agent runner (`dec-byo-decision-model`), for","line":82,"renderedHtml":""},{"kind":"prose","text":"example a small local model behind an OpenAI-compatible endpoint, or a program. After each","line":83,"renderedHtml":""},{"kind":"prose","text":"utterance of another participant, the runner asks it whether the agent should act now, whom the","line":84,"renderedHtml":""},{"kind":"prose","text":"speaker addressed and whether a block of topics has ended. The office ships no such model.","line":85,"renderedHtml":""},{"kind":"prose","text":"","line":86,"renderedHtml":""},{"kind":"block","blockType":"actor","attributes":{"id":"actor-decision-model","title":"Decision model","type":"system","description":"Optional, brought by the user; answers after each utterance whether the agent should act and whether a topic has ended","requires":"if-decision-model"},"startLine":88,"endLine":94,"inArc42Fence":true},{"kind":"prose","text":"","line":96,"renderedHtml":""},{"kind":"heading","level":2,"text":"Meeting tool","line":97},{"kind":"prose","text":"","line":98,"renderedHtml":"\u003cp>Zoom, Teams, Meet, Jitsi or any other tool. We do not integrate it. It only carries the screen\nshare of the stage to all participants, including those without a client.\u003c/p>\n"},{"kind":"prose","text":"Zoom, Teams, Meet, Jitsi or any other tool. We do not integrate it. It only carries the screen","line":99,"renderedHtml":""},{"kind":"prose","text":"share of the stage to all participants, including those without a client.","line":100,"renderedHtml":""},{"kind":"prose","text":"","line":101,"renderedHtml":""},{"kind":"block","blockType":"actor","attributes":{"id":"actor-meeting-tool","title":"Meeting tool","type":"system","description":"Carries the stage shared by screen share; no integration","requires":"if-stage-web"},"startLine":103,"endLine":109,"inArc42Fence":true},{"kind":"prose","text":"","line":111,"renderedHtml":""}]},{"filePath":"docs/architecture/04-solution-strategy.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Solution Strategy","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>The hub is state and tools, the client adds senses, and neither is the brain. Agents and humans take part as\nparticipants of the same kind. They read what happens from a locally replicated file and act\nthrough CLI or MCP tools. Speech is transcribed at the edge. The office is present in the meeting\nthrough a shared stage, not through an integration into the meeting tool.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Quality goal\u003c/th>\n\u003cth>Approach\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Confidentiality\u003c/td>\n\u003ctd>Transcription at the edge; only text leaves the device\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Performance\u003c/td>\n\u003ctd>Staged events without partials; log as a locally replicated file; the agent filters what it reacts to\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Resumability\u003c/td>\n\u003ctd>Append-only log with cursor; resume from the last known event; idempotent commands\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Usability\u003c/td>\n\u003ctd>One participant model; everyone sees their own events; the stage shows who is captured\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"kind":"prose","text":"The hub is state and tools, the client adds senses, and neither is the brain. Agents and humans take part as","line":3,"renderedHtml":""},{"kind":"prose","text":"participants of the same kind. They read what happens from a locally replicated file and act","line":4,"renderedHtml":""},{"kind":"prose","text":"through CLI or MCP tools. Speech is transcribed at the edge. The office is present in the meeting","line":5,"renderedHtml":""},{"kind":"prose","text":"through a shared stage, not through an integration into the meeting tool.","line":6,"renderedHtml":""},{"kind":"prose","text":"","line":7,"renderedHtml":""},{"kind":"prose","text":"| Quality goal | Approach |","line":8,"renderedHtml":""},{"kind":"prose","text":"|---|---|","line":9,"renderedHtml":""},{"kind":"prose","text":"| Confidentiality | Transcription at the edge; only text leaves the device |","line":10,"renderedHtml":""},{"kind":"prose","text":"| Performance | Staged events without partials; log as a locally replicated file; the agent filters what it reacts to |","line":11,"renderedHtml":""},{"kind":"prose","text":"| Resumability | Append-only log with cursor; resume from the last known event; idempotent commands |","line":12,"renderedHtml":""},{"kind":"prose","text":"| Usability | One participant model; everyone sees their own events; the stage shows who is captured |","line":13,"renderedHtml":""},{"kind":"prose","text":"","line":14,"renderedHtml":""},{"kind":"block","blockType":"solution-strategy","attributes":{"id":"strategy-architecture","title":"Headless office with file-based participation and transcription at the edge","addresses":"qg-confidentiality, qg-performance, qg-resumability, qg-usability"},"startLine":16,"endLine":20,"inArc42Fence":true},{"kind":"prose","text":"","line":22,"renderedHtml":""},{"kind":"heading","level":2,"text":"Bring your own agent","line":23},{"kind":"prose","text":"","line":24,"renderedHtml":"\u003cp>The agent makes every judgement about content. The hub stores, calculates, renders and checks\nagainst rules. So any agent can connect, and the hub stays deterministic and testable (see\n\u003ccode>dec-headless-byoa\u003c/code>). The client may contain models on the participant&#39;s side, for example the\nspeech model of the ears or a decision model that the user brings (\u003ccode>dec-models-in-client\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"The agent makes every judgement about content. The hub stores, calculates, renders and checks","line":25,"renderedHtml":""},{"kind":"prose","text":"against rules. So any agent can connect, and the hub stays deterministic and testable (see","line":26,"renderedHtml":""},{"kind":"prose","text":"`dec-headless-byoa`). The client may contain models on the participant's side, for example the","line":27,"renderedHtml":""},{"kind":"prose","text":"speech model of the ears or a decision model that the user brings (`dec-models-in-client`).","line":28,"renderedHtml":""},{"kind":"prose","text":"","line":29,"renderedHtml":""},{"kind":"heading","level":2,"text":"Keep the agent in the meeting","line":30},{"kind":"prose","text":"","line":31,"renderedHtml":"\u003cp>Agents work in turns (\u003ccode>con-turn-based-agents\u003c/code>). The agent runner of the client follows the\nlocal log for an agent and checks after each utterance whether to start the agent&#39;s next turn.\nIt talks to the agent harness over the Agent Client Protocol and hands it the office tools (see\n\u003ccode>dec-agent-runner-acp\u003c/code>, \u003ccode>dec-wake-check-per-utterance\u003c/code>). The agent itself decides whether it is\naddressed and how to act.\u003c/p>\n"},{"kind":"prose","text":"Agents work in turns (`con-turn-based-agents`). The agent runner of the client follows the","line":32,"renderedHtml":""},{"kind":"prose","text":"local log for an agent and checks after each utterance whether to start the agent's next turn.","line":33,"renderedHtml":""},{"kind":"prose","text":"It talks to the agent harness over the Agent Client Protocol and hands it the office tools (see","line":34,"renderedHtml":""},{"kind":"prose","text":"`dec-agent-runner-acp`, `dec-wake-check-per-utterance`). The agent itself decides whether it is","line":35,"renderedHtml":""},{"kind":"prose","text":"addressed and how to act.","line":36,"renderedHtml":""},{"kind":"prose","text":"","line":37,"renderedHtml":""},{"kind":"heading","level":2,"text":"Read from the file, write through tools","line":38},{"kind":"prose","text":"","line":39,"renderedHtml":"\u003cp>\u003ccode>join\u003c/code> returns the path to a locally replicated JSONL file. The agent reads it with standard tools\nand sets its own pace with filters. Actions go through tools that answer at once. Every action then\nshows up in the log as well (see \u003ccode>dec-log-as-file\u003c/code>, \u003ccode>concept-read-file-write-tools\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"`join` returns the path to a locally replicated JSONL file. The agent reads it with standard tools","line":40,"renderedHtml":""},{"kind":"prose","text":"and sets its own pace with filters. Actions go through tools that answer at once. Every action then","line":41,"renderedHtml":""},{"kind":"prose","text":"shows up in the log as well (see `dec-log-as-file`, `concept-read-file-write-tools`).","line":42,"renderedHtml":""},{"kind":"prose","text":"","line":43,"renderedHtml":""},{"kind":"heading","level":2,"text":"Resume instead of restart","line":44},{"kind":"prose","text":"","line":45,"renderedHtml":"\u003cp>The log is append-only, and every event has an ID. After a network drop, every client continues\nfrom the last event it knows. Commands carry IDs that the client creates, so a repeated command\ndoes not create a second event (see \u003ccode>concept-event-log\u003c/code>, \u003ccode>dec-idempotent-commands\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"The log is append-only, and every event has an ID. After a network drop, every client continues","line":46,"renderedHtml":""},{"kind":"prose","text":"from the last event it knows. Commands carry IDs that the client creates, so a repeated command","line":47,"renderedHtml":""},{"kind":"prose","text":"does not create a second event (see `concept-event-log`, `dec-idempotent-commands`).","line":48,"renderedHtml":""},{"kind":"prose","text":"","line":49,"renderedHtml":""},{"kind":"heading","level":2,"text":"One core, two adapters","line":50},{"kind":"prose","text":"","line":51,"renderedHtml":"\u003cp>The same features are available through the CLI and through MCP. The CLI is not an add-on: agents\nwith a shell and humans both use it (see \u003ccode>dec-cli-and-mcp\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"The same features are available through the CLI and through MCP. The CLI is not an add-on: agents","line":52,"renderedHtml":""},{"kind":"prose","text":"with a shell and humans both use it (see `dec-cli-and-mcp`).","line":53,"renderedHtml":""},{"kind":"prose","text":"","line":54,"renderedHtml":""},{"kind":"heading","level":2,"text":"Transcription at the edge","line":55},{"kind":"prose","text":"","line":56,"renderedHtml":"\u003cp>Each human transcribes only themselves, locally, with a headset. Who is speaking follows from the\nsetup, without speaker recognition. Raw audio does not leave the device (see\n\u003ccode>dec-local-single-ear\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"Each human transcribes only themselves, locally, with a headset. Who is speaking follows from the","line":57,"renderedHtml":""},{"kind":"prose","text":"setup, without speaker recognition. Raw audio does not leave the device (see","line":58,"renderedHtml":""},{"kind":"prose","text":"`dec-local-single-ear`).","line":59,"renderedHtml":""},{"kind":"prose","text":"","line":60,"renderedHtml":""},{"kind":"heading","level":2,"text":"Stage by screen share","line":61},{"kind":"prose","text":"","line":62,"renderedHtml":"\u003cp>We do not integrate meeting tools. Instead, the hub renders a stage as a web page, and someone\nshares it in the meeting. The agent shows itself there: raised hands, minutes, artifacts (see\n\u003ccode>dec-stage-screenshare\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"We do not integrate meeting tools. Instead, the hub renders a stage as a web page, and someone","line":63,"renderedHtml":""},{"kind":"prose","text":"shares it in the meeting. The agent shows itself there: raised hands, minutes, artifacts (see","line":64,"renderedHtml":""},{"kind":"prose","text":"`dec-stage-screenshare`).","line":65,"renderedHtml":""},{"kind":"prose","text":"","line":66,"renderedHtml":""}]},{"filePath":"docs/architecture/05-building-blocks.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Building Block View","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>The diagram shows every dependency between building blocks: an arrow is an interface that a\nblock lists in \u003ccode>requires\u003c/code>, pointing to the provider. The architecture test enforces exactly these\ndependencies in the code (\u003ccode>concept-module-boundaries\u003c/code>). Interfaces that only external actors use\n(CLI, MCP, stage view, audio input) are in chapter 3.\u003c/p>\n\u003cp>At the top level the system has two parts. The \u003cstrong>office hub\u003c/strong> manages sessions, the records of\nthe team (decisions, minutes and notes), the tasks, the slide decks and the stage. The \u003cstrong>participant client\u003c/strong> runs on the computer of every participant,\nhuman or agent.\u003c/p>\n"},{"kind":"prose","text":"The diagram shows every dependency between building blocks: an arrow is an interface that a","line":3,"renderedHtml":""},{"kind":"prose","text":"block lists in `requires`, pointing to the provider. The architecture test enforces exactly these","line":4,"renderedHtml":""},{"kind":"prose","text":"dependencies in the code (`concept-module-boundaries`). Interfaces that only external actors use","line":5,"renderedHtml":""},{"kind":"prose","text":"(CLI, MCP, stage view, audio input) are in chapter 3.","line":6,"renderedHtml":""},{"kind":"prose","text":"","line":7,"renderedHtml":""},{"kind":"prose","text":"At the top level the system has two parts. The **office hub** manages sessions, the records of","line":8,"renderedHtml":""},{"kind":"prose","text":"the team (decisions, minutes and notes), the tasks, the slide decks and the stage. The **participant client** runs on the computer of every participant,","line":9,"renderedHtml":""},{"kind":"prose","text":"human or agent.","line":10,"renderedHtml":""},{"kind":"prose","text":"","line":11,"renderedHtml":""},{"kind":"heading","level":2,"text":"Overview","line":12},{"kind":"prose","text":"","line":13,"renderedHtml":""},{"kind":"diagram","diagramType":"building-block","view":"building-block","id":"bb-overview","notation":"mermaid","roots":["bb-office-hub","bb-participant-client"],"aliases":"bb_office_hub=bb-office-hub, bb_participant_client=bb-participant-client","source":"flowchart LR\n    bb_office_hub[Office hub]\n    bb_participant_client[Participant client]\n    bb_participant_client -->|if-session-commands| bb_office_hub\n    bb_participant_client -->|if-session-import| bb_office_hub\n    bb_participant_client -->|if-decision-api| bb_office_hub\n    bb_participant_client -->|if-minutes-api| bb_office_hub\n    bb_participant_client -->|if-note-api| bb_office_hub\n    bb_participant_client -->|if-task-api| bb_office_hub\n    bb_participant_client -->|if-slides-api| bb_office_hub\n    bb_participant_client -->|if-auth-api| bb_office_hub\n    bb_participant_client -->|if-session-stream| bb_office_hub","startLine":15,"endLine":37},{"kind":"prose","text":"","line":38,"renderedHtml":""},{"kind":"heading","level":2,"text":"Office hub","line":39},{"kind":"prose","text":"","line":40,"renderedHtml":"\u003cp>The central, headless part. It holds the state of the team and of running meetings, offers\ndeterministic tools and renders the stage. It is the gateway to the archive. It contains no LLM.\u003c/p>\n"},{"kind":"prose","text":"The central, headless part. It holds the state of the team and of running meetings, offers","line":41,"renderedHtml":""},{"kind":"prose","text":"deterministic tools and renders the stage. It is the gateway to the archive. It contains no LLM.","line":42,"renderedHtml":""},{"kind":"prose","text":"","line":43,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-office-hub","title":"Office hub","technology":"Go (monorepo)","implements":"concept-event-log, concept-participant-model, concept-module-boundaries","path":"hub"},"startLine":45,"endLine":51,"inArc42Fence":true},{"kind":"prose","text":"","line":53,"renderedHtml":"\u003cp>White box: the parts of the office hub and how they use each other. An arrow to a part that\nrealizes an interface of the office hub points to that part.\u003c/p>\n"},{"kind":"prose","text":"White box: the parts of the office hub and how they use each other. An arrow to a part that","line":54,"renderedHtml":""},{"kind":"prose","text":"realizes an interface of the office hub points to that part.","line":55,"renderedHtml":""},{"kind":"prose","text":"","line":56,"renderedHtml":""},{"kind":"diagram","diagramType":"building-block","view":"building-block","id":"bb-office-hub-whitebox","notation":"mermaid","roots":["bb-office-hub"],"aliases":"bb_office_hub=bb-office-hub, bb_archive=bb-archive, bb_identity=bb-identity, bb_records=bb-records, bb_session_service=bb-session-service, bb_slides=bb-slides, bb_stage=bb-stage, bb_tasks=bb-tasks","source":"flowchart LR\n    subgraph bb_office_hub [Office hub]\n        bb_archive[Archive]\n        bb_identity[Identity]\n        bb_records[Records]\n        bb_session_service[Meeting session]\n        bb_slides[Slides]\n        bb_stage[Stage]\n        bb_tasks[Tasks]\n    end\n    bb_records -->|if-archive-storage| bb_archive\n    bb_records -->|if-token-check| bb_identity\n    bb_session_service -->|if-archive-storage| bb_archive\n    bb_session_service -->|if-minutes-api| bb_records\n    bb_session_service -->|if-token-check| bb_identity\n    bb_slides -->|if-archive-storage| bb_archive\n    bb_slides -->|if-token-check| bb_identity\n    bb_stage -->|if-session-stream| bb_session_service\n    bb_stage -->|if-slides-api| bb_slides\n    bb_stage -->|if-auth-api| bb_identity\n    bb_tasks -->|if-archive-storage| bb_archive\n    bb_tasks -->|if-token-check| bb_identity","startLine":58,"endLine":90},{"kind":"prose","text":"","line":91,"renderedHtml":""},{"kind":"heading","level":3,"text":"Session commands","line":92},{"kind":"prose","text":"","line":93,"renderedHtml":"\u003cp>Synchronous calls that answer at once: \u003ccode>join\u003c/code>, \u003ccode>leave\u003c/code>, \u003ccode>utterance.submit\u003c/code>, \u003ccode>utterance.mark_off_the_record\u003c/code>,\n\u003ccode>pause\u003c/code>, \u003ccode>hand.raise\u003c/code>, \u003ccode>minutes.update\u003c/code>, \u003ccode>stage.show\u003c/code>. Each successful call creates one event in the\nlog. Each call carries an ID created by the client, so a repeated call has no extra effect.\u003c/p>\n\u003cp>The session commands also let anyone with a token check a session log (\u003ccode>dec-merkle-log\u003c/code>): they\nreturn the signed tree head of a log (for the current log or for its first events), a\nconsistency proof between two sizes, an inclusion proof for one event, and the public key of the\nhub that signs the tree heads. The verification code for clients belongs to this interface,\nbecause the interface owns the event types.\u003c/p>\n\u003cp>After a restart, a peer offers its copy of a session log with one more command\n(\u003ccode>dec-restore-from-peers\u003c/code>): the events the hub misses and a tree head signed by the hub over the\ncopy. The hub accepts the copy only if it verifies and extends its own log. A copy that is not\nlonger has no effect, and a copy that does not verify or forks fails.\u003c/p>\n"},{"kind":"prose","text":"Synchronous calls that answer at once: `join`, `leave`, `utterance.submit`, `utterance.mark_off_the_record`,","line":94,"renderedHtml":""},{"kind":"prose","text":"`pause`, `hand.raise`, `minutes.update`, `stage.show`. Each successful call creates one event in the","line":95,"renderedHtml":""},{"kind":"prose","text":"log. Each call carries an ID created by the client, so a repeated call has no extra effect.","line":96,"renderedHtml":""},{"kind":"prose","text":"","line":97,"renderedHtml":""},{"kind":"prose","text":"The session commands also let anyone with a token check a session log (`dec-merkle-log`): they","line":98,"renderedHtml":""},{"kind":"prose","text":"return the signed tree head of a log (for the current log or for its first events), a","line":99,"renderedHtml":""},{"kind":"prose","text":"consistency proof between two sizes, an inclusion proof for one event, and the public key of the","line":100,"renderedHtml":""},{"kind":"prose","text":"hub that signs the tree heads. The verification code for clients belongs to this interface,","line":101,"renderedHtml":""},{"kind":"prose","text":"because the interface owns the event types.","line":102,"renderedHtml":""},{"kind":"prose","text":"","line":103,"renderedHtml":""},{"kind":"prose","text":"After a restart, a peer offers its copy of a session log with one more command","line":104,"renderedHtml":""},{"kind":"prose","text":"(`dec-restore-from-peers`): the events the hub misses and a tree head signed by the hub over the","line":105,"renderedHtml":""},{"kind":"prose","text":"copy. The hub accepts the copy only if it verifies and extends its own log. A copy that is not","line":106,"renderedHtml":""},{"kind":"prose","text":"longer has no effect, and a copy that does not verify or forks fails.","line":107,"renderedHtml":""},{"kind":"prose","text":"","line":108,"renderedHtml":""},{"kind":"ignore","ruleCode":"H020","reason":"Commands and stream are two contracts of one Connect service; they share its package","startLine":110,"endLine":110},{"kind":"block","blockType":"interface","attributes":{"id":"if-session-commands","title":"Session commands","provider":"bb-office-hub","x-realized-by":"bb-session-service","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/session/api"},"startLine":111,"endLine":118,"inArc42Fence":true},{"kind":"prose","text":"","line":120,"renderedHtml":""},{"kind":"heading","level":3,"text":"Session stream","line":121},{"kind":"prose","text":"","line":122,"renderedHtml":"\u003cp>Delivers the event log of a session from a cursor onwards, then live. This is the basis for local\nreplication and for the stage. After a drop, the subscriber reconnects with its last event ID.\nIt also answers a one-time request for the events after a cursor. A participant uses it when it\nfinds a gap in its copy, or to follow the session without a file system (\u003ccode>dec-events-from-cursor\u003c/code>).\nWith the last event it has, the stream sends a tree head signed by the hub over all events up to\nit, so a subscriber always holds a signed head over its whole copy (\u003ccode>dec-signed-head-in-stream\u003c/code>).\nA cursor beyond the end of the log means that the hub lost events: the subscriber then offers its\ncopy.\u003c/p>\n\u003cp>The interface also defines the stored form of a session log: one line per event and the signed\ntree head next to it. The local log of a participant and the session log in the archive use the\nsame lines (\u003ccode>dec-yaml-git-storage\u003c/code>), so every reader can rebuild the events and check them\nagainst the tree head with the event types of this interface alone.\u003c/p>\n"},{"kind":"prose","text":"Delivers the event log of a session from a cursor onwards, then live. This is the basis for local","line":123,"renderedHtml":""},{"kind":"prose","text":"replication and for the stage. After a drop, the subscriber reconnects with its last event ID.","line":124,"renderedHtml":""},{"kind":"prose","text":"It also answers a one-time request for the events after a cursor. A participant uses it when it","line":125,"renderedHtml":""},{"kind":"prose","text":"finds a gap in its copy, or to follow the session without a file system (`dec-events-from-cursor`).","line":126,"renderedHtml":""},{"kind":"prose","text":"With the last event it has, the stream sends a tree head signed by the hub over all events up to","line":127,"renderedHtml":""},{"kind":"prose","text":"it, so a subscriber always holds a signed head over its whole copy (`dec-signed-head-in-stream`).","line":128,"renderedHtml":""},{"kind":"prose","text":"A cursor beyond the end of the log means that the hub lost events: the subscriber then offers its","line":129,"renderedHtml":""},{"kind":"prose","text":"copy.","line":130,"renderedHtml":""},{"kind":"prose","text":"","line":131,"renderedHtml":""},{"kind":"prose","text":"The interface also defines the stored form of a session log: one line per event and the signed","line":132,"renderedHtml":""},{"kind":"prose","text":"tree head next to it. The local log of a participant and the session log in the archive use the","line":133,"renderedHtml":""},{"kind":"prose","text":"same lines (`dec-yaml-git-storage`), so every reader can rebuild the events and check them","line":134,"renderedHtml":""},{"kind":"prose","text":"against the tree head with the event types of this interface alone.","line":135,"renderedHtml":""},{"kind":"prose","text":"","line":136,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-session-stream","title":"Session stream (replication from a cursor)","provider":"bb-office-hub","x-realized-by":"bb-session-service","protocol":"Connect RPC, server streaming (dec-connect-rpc)","path":"hub/session/api"},"startLine":138,"endLine":145,"inArc42Fence":true},{"kind":"prose","text":"","line":147,"renderedHtml":""},{"kind":"heading","level":3,"text":"Session import","line":148},{"kind":"prose","text":"","line":149,"renderedHtml":"\u003cp>Imports a whole conversation that happened outside the office as a new session\n(\u003ccode>dec-session-import\u003c/code>): a meeting in another tool, a chat, or a conversation with an agent. The\nimport names its source and, optionally, a title. It lists the participants (a name, human or\nagent) and the utterances in order (speaker, text, modality and, if known, the time they were\nmade). A conversation comes in one call or in pages. Each page carries an ID created by the client,\nso a repeated page has no extra effect. The last page completes the import.\u003c/p>\n\u003cp>The import only fills the log. The meeting session writes the events of an import like those of\nlive commands, and the session stream, the events after a cursor and the archive deliver them the\nsame way. The first event of an imported session marks it as imported, with its source and the\nparticipant who imported it. A last event marks the end of the import. While an import is not\ncomplete, the session takes only the next pages of the same participant. After it, the session\nbehaves like any other session, so participants derive minutes, decisions, notes and tasks\nthrough the existing interfaces.\u003c/p>\n\u003cp>The speakers of an imported conversation are not registered participants: the hub cannot check\nwho they are. Their participant IDs are marked as imported, so they never match a registered\nparticipant. The hub signs tree heads over an imported log like over every log. Such a signature\nproves which participant imported the log and that the log has not changed since; it does not\nprove that the speakers said what the log says.\u003c/p>\n"},{"kind":"prose","text":"Imports a whole conversation that happened outside the office as a new session","line":150,"renderedHtml":""},{"kind":"prose","text":"(`dec-session-import`): a meeting in another tool, a chat, or a conversation with an agent. The","line":151,"renderedHtml":""},{"kind":"prose","text":"import names its source and, optionally, a title. It lists the participants (a name, human or","line":152,"renderedHtml":""},{"kind":"prose","text":"agent) and the utterances in order (speaker, text, modality and, if known, the time they were","line":153,"renderedHtml":""},{"kind":"prose","text":"made). A conversation comes in one call or in pages. Each page carries an ID created by the client,","line":154,"renderedHtml":""},{"kind":"prose","text":"so a repeated page has no extra effect. The last page completes the import.","line":155,"renderedHtml":""},{"kind":"prose","text":"","line":156,"renderedHtml":""},{"kind":"prose","text":"The import only fills the log. The meeting session writes the events of an import like those of","line":157,"renderedHtml":""},{"kind":"prose","text":"live commands, and the session stream, the events after a cursor and the archive deliver them the","line":158,"renderedHtml":""},{"kind":"prose","text":"same way. The first event of an imported session marks it as imported, with its source and the","line":159,"renderedHtml":""},{"kind":"prose","text":"participant who imported it. A last event marks the end of the import. While an import is not","line":160,"renderedHtml":""},{"kind":"prose","text":"complete, the session takes only the next pages of the same participant. After it, the session","line":161,"renderedHtml":""},{"kind":"prose","text":"behaves like any other session, so participants derive minutes, decisions, notes and tasks","line":162,"renderedHtml":""},{"kind":"prose","text":"through the existing interfaces.","line":163,"renderedHtml":""},{"kind":"prose","text":"","line":164,"renderedHtml":""},{"kind":"prose","text":"The speakers of an imported conversation are not registered participants: the hub cannot check","line":165,"renderedHtml":""},{"kind":"prose","text":"who they are. Their participant IDs are marked as imported, so they never match a registered","line":166,"renderedHtml":""},{"kind":"prose","text":"participant. The hub signs tree heads over an imported log like over every log. Such a signature","line":167,"renderedHtml":""},{"kind":"prose","text":"proves which participant imported the log and that the log has not changed since; it does not","line":168,"renderedHtml":""},{"kind":"prose","text":"prove that the speakers said what the log says.","line":169,"renderedHtml":""},{"kind":"prose","text":"","line":170,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-session-import","title":"Session import","provider":"bb-office-hub","x-realized-by":"bb-session-service","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/session/importapi"},"startLine":172,"endLine":179,"inArc42Fence":true},{"kind":"prose","text":"","line":181,"renderedHtml":""},{"kind":"heading","level":3,"text":"Auth API","line":182},{"kind":"prose","text":"","line":183,"renderedHtml":"\u003cp>Challenge and response: the client asks for a challenge, signs it with its private key and gets a\nshort-lived access token that is bound to its key. Also: create a read-only stage link.\u003c/p>\n"},{"kind":"prose","text":"Challenge and response: the client asks for a challenge, signs it with its private key and gets a","line":184,"renderedHtml":""},{"kind":"prose","text":"short-lived access token that is bound to its key. Also: create a read-only stage link.","line":185,"renderedHtml":""},{"kind":"prose","text":"","line":186,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-auth-api","title":"Auth API","provider":"bb-office-hub","x-realized-by":"bb-identity","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/identity/api"},"startLine":188,"endLine":195,"inArc42Fence":true},{"kind":"prose","text":"","line":197,"renderedHtml":""},{"kind":"heading","level":3,"text":"Decisions","line":198},{"kind":"prose","text":"","line":199,"renderedHtml":"\u003cp>Record a decision and list the decisions, oldest first, by session and from a cursor. A decision\nrecords its author and whether the author is a human or an agent. Each command carries an ID\ncreated by the client, so a repeated command has no extra effect. A sentence that is off the\nrecord must not go into a decision (\u003ccode>dec-off-the-record\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"Record a decision and list the decisions, oldest first, by session and from a cursor. A decision","line":200,"renderedHtml":""},{"kind":"prose","text":"records its author and whether the author is a human or an agent. Each command carries an ID","line":201,"renderedHtml":""},{"kind":"prose","text":"created by the client, so a repeated command has no extra effect. A sentence that is off the","line":202,"renderedHtml":""},{"kind":"prose","text":"record must not go into a decision (`dec-off-the-record`).","line":203,"renderedHtml":""},{"kind":"prose","text":"","line":204,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-decision-api","title":"Decisions","provider":"bb-office-hub","x-realized-by":"bb-records","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/records/decision/api"},"startLine":206,"endLine":213,"inArc42Fence":true},{"kind":"prose","text":"","line":215,"renderedHtml":""},{"kind":"heading","level":3,"text":"Minutes","line":216},{"kind":"prose","text":"","line":217,"renderedHtml":"\u003cp>The minutes of a session. While the session runs, participants write the running minutes\nthrough the session commands (\u003ccode>minutes.update\u003c/code>). When the session ends, the meeting session\nstores the last version through this interface (\u003ccode>rs-session-ends\u003c/code>). Clients read the stored\nminutes of a session and list all stored minutes; they do not write them here. A sentence that\nis off the record must not go into the minutes.\u003c/p>\n"},{"kind":"prose","text":"The minutes of a session. While the session runs, participants write the running minutes","line":218,"renderedHtml":""},{"kind":"prose","text":"through the session commands (`minutes.update`). When the session ends, the meeting session","line":219,"renderedHtml":""},{"kind":"prose","text":"stores the last version through this interface (`rs-session-ends`). Clients read the stored","line":220,"renderedHtml":""},{"kind":"prose","text":"minutes of a session and list all stored minutes; they do not write them here. A sentence that","line":221,"renderedHtml":""},{"kind":"prose","text":"is off the record must not go into the minutes.","line":222,"renderedHtml":""},{"kind":"prose","text":"","line":223,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-minutes-api","title":"Minutes","provider":"bb-office-hub","x-realized-by":"bb-records","protocol":"Connect RPC, unary (dec-connect-rpc); in-process for the meeting session","path":"hub/records/minutes/api"},"startLine":225,"endLine":232,"inArc42Fence":true},{"kind":"prose","text":"","line":234,"renderedHtml":""},{"kind":"heading","level":3,"text":"Notes","line":235},{"kind":"prose","text":"","line":236,"renderedHtml":"\u003cp>Add a free note, with or without a session, and list the notes like the decisions. A sentence\nthat is off the record must not go into a note.\u003c/p>\n"},{"kind":"prose","text":"Add a free note, with or without a session, and list the notes like the decisions. A sentence","line":237,"renderedHtml":""},{"kind":"prose","text":"that is off the record must not go into a note.","line":238,"renderedHtml":""},{"kind":"prose","text":"","line":239,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-note-api","title":"Notes","provider":"bb-office-hub","x-realized-by":"bb-records","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/records/note/api"},"startLine":241,"endLine":248,"inArc42Fence":true},{"kind":"prose","text":"","line":250,"renderedHtml":""},{"kind":"heading","level":3,"text":"Tasks","line":251},{"kind":"prose","text":"","line":252,"renderedHtml":"\u003cp>Create a task, read one, list tasks and change them: title, description, assignee, status (open,\nin progress, done, cancelled) and a link to a session. List filters by status, assignee and\nsession and reads page by page. A task records its author and whether the author is a human or\nan agent, and who changed it last. Each command carries an ID created by the client, so a\nrepeated command has no extra effect. A sentence that is off the record must not go into a task.\u003c/p>\n\u003cp>For now every task is a local draft of the hub (\u003ccode>dec-yaml-git-storage\u003c/code>). Later the hub syncs tasks\nwith the task tool of the team, and the synced task replaces the draft. So that this step does\nnot change the contract, a task is named by a stable reference with a scheme, for example\n\u003ccode>local:42\u003c/code> today and \u003ccode>github:owner/repo#12\u003c/code> later. Clients treat the reference as opaque: they\nkeep it and pass it back. Each task also says where it lives; today that is always the hub.\nOPEN: how a synced task replaces its draft, and which side is the truth (#40).\u003c/p>\n"},{"kind":"prose","text":"Create a task, read one, list tasks and change them: title, description, assignee, status (open,","line":253,"renderedHtml":""},{"kind":"prose","text":"in progress, done, cancelled) and a link to a session. List filters by status, assignee and","line":254,"renderedHtml":""},{"kind":"prose","text":"session and reads page by page. A task records its author and whether the author is a human or","line":255,"renderedHtml":""},{"kind":"prose","text":"an agent, and who changed it last. Each command carries an ID created by the client, so a","line":256,"renderedHtml":""},{"kind":"prose","text":"repeated command has no extra effect. A sentence that is off the record must not go into a task.","line":257,"renderedHtml":""},{"kind":"prose","text":"","line":258,"renderedHtml":""},{"kind":"prose","text":"For now every task is a local draft of the hub (`dec-yaml-git-storage`). Later the hub syncs tasks","line":259,"renderedHtml":""},{"kind":"prose","text":"with the task tool of the team, and the synced task replaces the draft. So that this step does","line":260,"renderedHtml":""},{"kind":"prose","text":"not change the contract, a task is named by a stable reference with a scheme, for example","line":261,"renderedHtml":""},{"kind":"prose","text":"`local:42` today and `github:owner/repo#12` later. Clients treat the reference as opaque: they","line":262,"renderedHtml":""},{"kind":"prose","text":"keep it and pass it back. Each task also says where it lives; today that is always the hub.","line":263,"renderedHtml":""},{"kind":"prose","text":"OPEN: how a synced task replaces its draft, and which side is the truth (#40).","line":264,"renderedHtml":""},{"kind":"prose","text":"","line":265,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-task-api","title":"Tasks","provider":"bb-office-hub","x-realized-by":"bb-tasks","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/tasks/api"},"startLine":267,"endLine":274,"inArc42Fence":true},{"kind":"prose","text":"","line":276,"renderedHtml":""},{"kind":"heading","level":3,"text":"Slides","line":277},{"kind":"prose","text":"","line":278,"renderedHtml":"\u003cp>Render a slide deck from a structured description (an optional title; slides with a title,\nbullets and speaker notes) and fetch a deck by its ID, with its input and its rendered output. A\ndeck records its author and whether the author is a human or an agent. Each command carries an ID\ncreated by the client, so a repeated command has no extra effect. Rendering is deterministic\n(\u003ccode>con-no-intelligence\u003c/code>): the same input gives the same output. A sentence that is off the record\nmust not go into a deck.\u003c/p>\n\u003cp>A deck has an ID with the type in front, for example \u003ccode>slides/42\u003c/code>. The stage shows a deck by this\nID. In general, an artifact is anything that the stage can show by an ID like this; today slide\ndecks are the only type (\u003ccode>term-artifact\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"Render a slide deck from a structured description (an optional title; slides with a title,","line":279,"renderedHtml":""},{"kind":"prose","text":"bullets and speaker notes) and fetch a deck by its ID, with its input and its rendered output. A","line":280,"renderedHtml":""},{"kind":"prose","text":"deck records its author and whether the author is a human or an agent. Each command carries an ID","line":281,"renderedHtml":""},{"kind":"prose","text":"created by the client, so a repeated command has no extra effect. Rendering is deterministic","line":282,"renderedHtml":""},{"kind":"prose","text":"(`con-no-intelligence`): the same input gives the same output. A sentence that is off the record","line":283,"renderedHtml":""},{"kind":"prose","text":"must not go into a deck.","line":284,"renderedHtml":""},{"kind":"prose","text":"","line":285,"renderedHtml":""},{"kind":"prose","text":"A deck has an ID with the type in front, for example `slides/42`. The stage shows a deck by this","line":286,"renderedHtml":""},{"kind":"prose","text":"ID. In general, an artifact is anything that the stage can show by an ID like this; today slide","line":287,"renderedHtml":""},{"kind":"prose","text":"decks are the only type (`term-artifact`).","line":288,"renderedHtml":""},{"kind":"prose","text":"","line":289,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-slides-api","title":"Slides","provider":"bb-office-hub","x-realized-by":"bb-slides","protocol":"Connect RPC, unary (dec-connect-rpc); in-process for the stage","path":"hub/slides/api"},"startLine":291,"endLine":298,"inArc42Fence":true},{"kind":"prose","text":"","line":300,"renderedHtml":""},{"kind":"heading","level":3,"text":"Stage view","line":301},{"kind":"prose","text":"","line":302,"renderedHtml":"\u003cp>A browser view of one session, opened by a link.\u003c/p>\n"},{"kind":"prose","text":"A browser view of one session, opened by a link.","line":303,"renderedHtml":""},{"kind":"prose","text":"","line":304,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-stage-web","title":"Stage view","provider":"bb-office-hub","x-realized-by":"bb-stage","protocol":"HTTPS (browser)","path":"hub/stage"},"startLine":306,"endLine":313,"inArc42Fence":true},{"kind":"prose","text":"","line":315,"renderedHtml":""},{"kind":"heading","level":3,"text":"Meeting session","line":316},{"kind":"prose","text":"","line":317,"renderedHtml":"\u003cp>Manages sessions and their participants. Accepts utterances from the ears and actions from\nparticipants, and writes everything to one append-only event log per session. It also takes\nimported conversations (\u003ccode>if-session-import\u003c/code>) and writes them into the log of a new session, so a\nsession log has one writer in every case. Subscribers receive\nthe log from a cursor onwards. Events are merged by time only: the participant model already says\nwho spoke.\u003c/p>\n"},{"kind":"prose","text":"Manages sessions and their participants. Accepts utterances from the ears and actions from","line":318,"renderedHtml":""},{"kind":"prose","text":"participants, and writes everything to one append-only event log per session. It also takes","line":319,"renderedHtml":""},{"kind":"prose","text":"imported conversations (`if-session-import`) and writes them into the log of a new session, so a","line":320,"renderedHtml":""},{"kind":"prose","text":"session log has one writer in every case. Subscribers receive","line":321,"renderedHtml":""},{"kind":"prose","text":"the log from a cursor onwards. Events are merged by time only: the participant model already says","line":322,"renderedHtml":""},{"kind":"prose","text":"who spoke.","line":323,"renderedHtml":""},{"kind":"prose","text":"","line":324,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-session-service","title":"Meeting session","technology":"Go / connect-go","parent":"bb-office-hub","implements":"concept-event-log, concept-participant-model, concept-identity","requires":"if-minutes-api, if-token-check, if-archive-storage","path":"hub/session"},"startLine":326,"endLine":334,"inArc42Fence":true},{"kind":"prose","text":"","line":336,"renderedHtml":"\u003cp>The meeting session writes the log of every session that changed to the archive, at a\nconfigurable interval and when the session ends (\u003ccode>dec-session-persistence\u003c/code>). The end of an import\nalso starts a write, so an imported session reaches the archive soon (\u003ccode>dec-session-import\u003c/code>). The write runs in\nthe background: commands and the stream never wait for it. At most one write is in progress. A\nslow write makes the next write take everything that has come since. Every write stores the raw\nlog (with the original text of sentences that are off the record, and their marks) and the tree\nhead signed by the hub over exactly that log (\u003ccode>dec-merkle-log\u003c/code>).\u003c/p>\n\u003cp>When the hub starts, the meeting session reads every stored log back from the archive and checks\nit against its signed tree head before it uses it (\u003ccode>dec-restore-from-peers\u003c/code>). A restored session\nkeeps its IDs, so every cursor stays valid. The events after the last write are lost; a peer\nfills them in. Until a peer copy fits, or a configurable wait is over, a restored session that has\nnot ended takes no commands (\u003ccode>dec-signed-head-in-stream\u003c/code>). The archive also records whether the\nhub stopped after a last write of every session; then nothing is lost and there is no wait.\u003c/p>\n"},{"kind":"prose","text":"The meeting session writes the log of every session that changed to the archive, at a","line":337,"renderedHtml":""},{"kind":"prose","text":"configurable interval and when the session ends (`dec-session-persistence`). The end of an import","line":338,"renderedHtml":""},{"kind":"prose","text":"also starts a write, so an imported session reaches the archive soon (`dec-session-import`). The write runs in","line":339,"renderedHtml":""},{"kind":"prose","text":"the background: commands and the stream never wait for it. At most one write is in progress. A","line":340,"renderedHtml":""},{"kind":"prose","text":"slow write makes the next write take everything that has come since. Every write stores the raw","line":341,"renderedHtml":""},{"kind":"prose","text":"log (with the original text of sentences that are off the record, and their marks) and the tree","line":342,"renderedHtml":""},{"kind":"prose","text":"head signed by the hub over exactly that log (`dec-merkle-log`).","line":343,"renderedHtml":""},{"kind":"prose","text":"","line":344,"renderedHtml":""},{"kind":"prose","text":"When the hub starts, the meeting session reads every stored log back from the archive and checks","line":345,"renderedHtml":""},{"kind":"prose","text":"it against its signed tree head before it uses it (`dec-restore-from-peers`). A restored session","line":346,"renderedHtml":""},{"kind":"prose","text":"keeps its IDs, so every cursor stays valid. The events after the last write are lost; a peer","line":347,"renderedHtml":""},{"kind":"prose","text":"fills them in. Until a peer copy fits, or a configurable wait is over, a restored session that has","line":348,"renderedHtml":""},{"kind":"prose","text":"not ended takes no commands (`dec-signed-head-in-stream`). The archive also records whether the","line":349,"renderedHtml":""},{"kind":"prose","text":"hub stopped after a last write of every session; then nothing is lost and there is no wait.","line":350,"renderedHtml":""},{"kind":"prose","text":"","line":351,"renderedHtml":""},{"kind":"heading","level":3,"text":"Records","line":352},{"kind":"prose","text":"","line":353,"renderedHtml":"\u003cp>The memory of the team: decisions, minutes and notes (\u003ccode>dec-records-per-type\u003c/code>). Each type has its\nown interface and its own types.\nEach record keeps its origin: who wrote it, and whether a human or an agent. Tasks are not part\nof this block; they have their own part of the hub.\u003c/p>\n\u003cp>Every record is one YAML file in the archive, and every new record is one commit\n(\u003ccode>dec-yaml-git-storage\u003c/code>). A command returns only after its commit, so a record that a client got\nback is stored. Local commits are fast, so this does not slow the meeting; the commit of the\nminutes is part of ending a session. When the hub starts, the block reads its records back from\nthe archive, so they survive a restart.\u003c/p>\n"},{"kind":"prose","text":"The memory of the team: decisions, minutes and notes (`dec-records-per-type`). Each type has its","line":354,"renderedHtml":""},{"kind":"prose","text":"own interface and its own types.","line":355,"renderedHtml":""},{"kind":"prose","text":"Each record keeps its origin: who wrote it, and whether a human or an agent. Tasks are not part","line":356,"renderedHtml":""},{"kind":"prose","text":"of this block; they have their own part of the hub.","line":357,"renderedHtml":""},{"kind":"prose","text":"","line":358,"renderedHtml":""},{"kind":"prose","text":"Every record is one YAML file in the archive, and every new record is one commit","line":359,"renderedHtml":""},{"kind":"prose","text":"(`dec-yaml-git-storage`). A command returns only after its commit, so a record that a client got","line":360,"renderedHtml":""},{"kind":"prose","text":"back is stored. Local commits are fast, so this does not slow the meeting; the commit of the","line":361,"renderedHtml":""},{"kind":"prose","text":"minutes is part of ending a session. When the hub starts, the block reads its records back from","line":362,"renderedHtml":""},{"kind":"prose","text":"the archive, so they survive a restart.","line":363,"renderedHtml":""},{"kind":"prose","text":"","line":364,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-records","title":"Records (decisions, minutes, notes)","technology":"Go / YAML in the archive","parent":"bb-office-hub","path":"hub/records","requires":"if-token-check, if-archive-storage"},"startLine":366,"endLine":373,"inArc42Fence":true},{"kind":"prose","text":"","line":375,"renderedHtml":""},{"kind":"heading","level":3,"text":"Tasks part","line":376},{"kind":"prose","text":"","line":377,"renderedHtml":"\u003cp>Keeps the tasks of the team behind the task interface (\u003ccode>dec-records-per-type\u003c/code>). For now every\ntask is a local draft: one YAML file in the archive per task (\u003ccode>dec-yaml-git-storage\u003c/code>). Creating a\ntask is one commit, and every change rewrites the file in a new commit, so the archive keeps the\nhistory of every task. A command returns only after its commit. When the hub starts, the block\nreads its tasks back from the archive, so they survive a restart. Like the records part, it\nwrites synchronously and can wait behind a session write of the archive (#45).\u003c/p>\n\u003cp>A later sync with the task tool of the team (#40) belongs to this block. Only the hub will hold\nthe credentials of that tool.\u003c/p>\n"},{"kind":"prose","text":"Keeps the tasks of the team behind the task interface (`dec-records-per-type`). For now every","line":378,"renderedHtml":""},{"kind":"prose","text":"task is a local draft: one YAML file in the archive per task (`dec-yaml-git-storage`). Creating a","line":379,"renderedHtml":""},{"kind":"prose","text":"task is one commit, and every change rewrites the file in a new commit, so the archive keeps the","line":380,"renderedHtml":""},{"kind":"prose","text":"history of every task. A command returns only after its commit. When the hub starts, the block","line":381,"renderedHtml":""},{"kind":"prose","text":"reads its tasks back from the archive, so they survive a restart. Like the records part, it","line":382,"renderedHtml":""},{"kind":"prose","text":"writes synchronously and can wait behind a session write of the archive (#45).","line":383,"renderedHtml":""},{"kind":"prose","text":"","line":384,"renderedHtml":""},{"kind":"prose","text":"A later sync with the task tool of the team (#40) belongs to this block. Only the hub will hold","line":385,"renderedHtml":""},{"kind":"prose","text":"the credentials of that tool.","line":386,"renderedHtml":""},{"kind":"prose","text":"","line":387,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-tasks","title":"Tasks","technology":"Go / YAML in the archive","parent":"bb-office-hub","path":"hub/tasks","requires":"if-token-check, if-archive-storage"},"startLine":389,"endLine":396,"inArc42Fence":true},{"kind":"prose","text":"","line":398,"renderedHtml":""},{"kind":"heading","level":3,"text":"Slides part","line":399},{"kind":"prose","text":"","line":400,"renderedHtml":"\u003cp>Renders slide decks and keeps them behind the slides interface (\u003ccode>dec-records-per-type\u003c/code>). Rendering\nis deterministic and without streaming. Every deck is stored in the archive in one commit\n(\u003ccode>dec-yaml-git-storage\u003c/code>): its input as YAML and its rendered output next to it. A command returns\nonly after its commit. The output is stored and not rendered again on read, so a deck stays\nexactly what was shown in a meeting, even if a later version of the hub renders differently.\nBecause rendering is deterministic, the stored input is enough to get the same output again.\nWhen the hub starts, the block reads its decks back from the archive, so they survive a restart.\nLike the records part, it writes synchronously and can wait behind a session write of the\narchive (#45).\u003c/p>\n\u003cp>The check of business plans by calculation (consistency, unit economics, completeness) is a\ndifferent type with its own interface when it is built (#3).\u003c/p>\n"},{"kind":"prose","text":"Renders slide decks and keeps them behind the slides interface (`dec-records-per-type`). Rendering","line":401,"renderedHtml":""},{"kind":"prose","text":"is deterministic and without streaming. Every deck is stored in the archive in one commit","line":402,"renderedHtml":""},{"kind":"prose","text":"(`dec-yaml-git-storage`): its input as YAML and its rendered output next to it. A command returns","line":403,"renderedHtml":""},{"kind":"prose","text":"only after its commit. The output is stored and not rendered again on read, so a deck stays","line":404,"renderedHtml":""},{"kind":"prose","text":"exactly what was shown in a meeting, even if a later version of the hub renders differently.","line":405,"renderedHtml":""},{"kind":"prose","text":"Because rendering is deterministic, the stored input is enough to get the same output again.","line":406,"renderedHtml":""},{"kind":"prose","text":"When the hub starts, the block reads its decks back from the archive, so they survive a restart.","line":407,"renderedHtml":""},{"kind":"prose","text":"Like the records part, it writes synchronously and can wait behind a session write of the","line":408,"renderedHtml":""},{"kind":"prose","text":"archive (#45).","line":409,"renderedHtml":""},{"kind":"prose","text":"","line":410,"renderedHtml":""},{"kind":"prose","text":"The check of business plans by calculation (consistency, unit economics, completeness) is a","line":411,"renderedHtml":""},{"kind":"prose","text":"different type with its own interface when it is built (#3).","line":412,"renderedHtml":""},{"kind":"prose","text":"","line":413,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-slides","title":"Slides","technology":"Go / YAML and HTML in the archive","parent":"bb-office-hub","path":"hub/slides","requires":"if-token-check, if-archive-storage"},"startLine":415,"endLine":422,"inArc42Fence":true},{"kind":"prose","text":"","line":424,"renderedHtml":""},{"kind":"heading","level":3,"text":"Archive","line":425},{"kind":"prose","text":"","line":426,"renderedHtml":"\u003cp>The storage that all record parts of the hub use (\u003ccode>dec-records-per-type\u003c/code>). It stores records as\nfiles in a local Git repository on the hub host and commits locally (\u003ccode>dec-yaml-git-storage\u003c/code>).\nEvery change of a caller is one commit. The archive does not know the records: the caller\ndecides the files and their content. Callers read their files back from the current commit, for\nexample to rebuild their index at start. After every commit, the archive pushes to a remote. The\npush is mocked for now: it does nothing and reports success. A commit can be slow, so callers\nthat must not wait call it in the background.\u003c/p>\n"},{"kind":"prose","text":"The storage that all record parts of the hub use (`dec-records-per-type`). It stores records as","line":427,"renderedHtml":""},{"kind":"prose","text":"files in a local Git repository on the hub host and commits locally (`dec-yaml-git-storage`).","line":428,"renderedHtml":""},{"kind":"prose","text":"Every change of a caller is one commit. The archive does not know the records: the caller","line":429,"renderedHtml":""},{"kind":"prose","text":"decides the files and their content. Callers read their files back from the current commit, for","line":430,"renderedHtml":""},{"kind":"prose","text":"example to rebuild their index at start. After every commit, the archive pushes to a remote. The","line":431,"renderedHtml":""},{"kind":"prose","text":"push is mocked for now: it does nothing and reports success. A commit can be slow, so callers","line":432,"renderedHtml":""},{"kind":"prose","text":"that must not wait call it in the background.","line":433,"renderedHtml":""},{"kind":"prose","text":"","line":434,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-archive","title":"Archive","technology":"Go / local Git repository","parent":"bb-office-hub","path":"hub/archive"},"startLine":436,"endLine":442,"inArc42Fence":true},{"kind":"prose","text":"","line":444,"renderedHtml":""},{"kind":"heading","level":4,"text":"Archive storage","line":445},{"kind":"prose","text":"","line":446,"renderedHtml":"\u003cp>The in-process interface of the archive: write a set of files as one commit, and read the files\nof a directory as they are in the current commit. Paths are relative to the repository.\u003c/p>\n"},{"kind":"prose","text":"The in-process interface of the archive: write a set of files as one commit, and read the files","line":447,"renderedHtml":""},{"kind":"prose","text":"of a directory as they are in the current commit. Paths are relative to the repository.","line":448,"renderedHtml":""},{"kind":"prose","text":"","line":449,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-archive-storage","title":"Archive storage","provider":"bb-archive","protocol":"In-process Go call","path":"hub/archive/storage"},"startLine":451,"endLine":457,"inArc42Fence":true},{"kind":"prose","text":"","line":459,"renderedHtml":""},{"kind":"heading","level":3,"text":"Stage","line":460},{"kind":"prose","text":"","line":461,"renderedHtml":"\u003cp>One web page per session, shown in the meeting by screen share. It shows the running minutes,\nraised hands, the shown artifact (a slide deck), and who is captured or paused. It marks an\nimported session with its source and the participant who imported it, and never shows it as\nlive. It is only a view of the session log and has no logic of its own.\u003c/p>\n"},{"kind":"prose","text":"One web page per session, shown in the meeting by screen share. It shows the running minutes,","line":462,"renderedHtml":""},{"kind":"prose","text":"raised hands, the shown artifact (a slide deck), and who is captured or paused. It marks an","line":463,"renderedHtml":""},{"kind":"prose","text":"imported session with its source and the participant who imported it, and never shows it as","line":464,"renderedHtml":""},{"kind":"prose","text":"live. It is only a view of the session log and has no logic of its own.","line":465,"renderedHtml":""},{"kind":"prose","text":"","line":466,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-stage","title":"Stage","technology":"Go, rendered by the hub / server-sent events","parent":"bb-office-hub","requires":"if-session-stream, if-slides-api, if-auth-api","implements":"concept-transparency","path":"hub/stage"},"startLine":468,"endLine":476,"inArc42Fence":true},{"kind":"prose","text":"","line":478,"renderedHtml":""},{"kind":"heading","level":3,"text":"Identity","line":479},{"kind":"prose","text":"","line":480,"renderedHtml":"\u003cp>Knows all participants and their public keys. Each participant, human or agent, is its own actor\nwith its own Ed25519 key pair. The client creates the key pair locally and sends only the public\nkey. In the first stage, a new public key is registered by hand when we meet the person\n(issue #2 describes a real enrollment flow). Identity issues short-lived access tokens and creates\nread-only links for the stage.\u003c/p>\n"},{"kind":"prose","text":"Knows all participants and their public keys. Each participant, human or agent, is its own actor","line":481,"renderedHtml":""},{"kind":"prose","text":"with its own Ed25519 key pair. The client creates the key pair locally and sends only the public","line":482,"renderedHtml":""},{"kind":"prose","text":"key. In the first stage, a new public key is registered by hand when we meet the person","line":483,"renderedHtml":""},{"kind":"prose","text":"(issue #2 describes a real enrollment flow). Identity issues short-lived access tokens and creates","line":484,"renderedHtml":""},{"kind":"prose","text":"read-only links for the stage.","line":485,"renderedHtml":""},{"kind":"prose","text":"","line":486,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-identity","title":"Identity","technology":"Go","parent":"bb-office-hub","implements":"concept-identity","path":"hub/identity"},"startLine":488,"endLine":495,"inArc42Fence":true},{"kind":"prose","text":"","line":497,"renderedHtml":""},{"kind":"heading","level":4,"text":"Token check","line":498},{"kind":"prose","text":"","line":499,"renderedHtml":"\u003cp>Other parts of the hub check access tokens here and learn which participant a token belongs to.\u003c/p>\n"},{"kind":"prose","text":"Other parts of the hub check access tokens here and learn which participant a token belongs to.","line":500,"renderedHtml":""},{"kind":"prose","text":"","line":501,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-token-check","title":"Token check","provider":"bb-identity","protocol":"In-process Go call","path":"hub/identity/tokencheck"},"startLine":503,"endLine":509,"inArc42Fence":true},{"kind":"prose","text":"","line":511,"renderedHtml":""},{"kind":"heading","level":2,"text":"Participant client","line":512},{"kind":"prose","text":"","line":513,"renderedHtml":"\u003cp>Runs locally on every participant&#39;s computer and is the same for humans and agents. It contains\nthe CLI, the MCP server, the log replicator, the agent runner and, optionally, the ears. Unlike the\nhub, the client may contain models (\u003ccode>dec-models-in-client\u003c/code>): the speech model of the ears, and a\ndecision model that the user brings for the agent runner.\u003c/p>\n"},{"kind":"prose","text":"Runs locally on every participant's computer and is the same for humans and agents. It contains","line":514,"renderedHtml":""},{"kind":"prose","text":"the CLI, the MCP server, the log replicator, the agent runner and, optionally, the ears. Unlike the","line":515,"renderedHtml":""},{"kind":"prose","text":"hub, the client may contain models (`dec-models-in-client`): the speech model of the ears, and a","line":516,"renderedHtml":""},{"kind":"prose","text":"decision model that the user brings for the agent runner.","line":517,"renderedHtml":""},{"kind":"prose","text":"","line":518,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-participant-client","title":"Participant client","technology":"Go (one binary)","implements":"concept-participant-model, concept-read-file-write-tools, concept-module-boundaries","path":"client"},"startLine":520,"endLine":526,"inArc42Fence":true},{"kind":"prose","text":"","line":528,"renderedHtml":"\u003cp>White box: the parts of the participant client and how they use each other. An arrow to a part that\nrealizes an interface of the participant client points to that part.\u003c/p>\n"},{"kind":"prose","text":"White box: the parts of the participant client and how they use each other. An arrow to a part that","line":529,"renderedHtml":""},{"kind":"prose","text":"realizes an interface of the participant client points to that part.","line":530,"renderedHtml":""},{"kind":"prose","text":"","line":531,"renderedHtml":""},{"kind":"diagram","diagramType":"building-block","view":"building-block","id":"bb-participant-client-whitebox","notation":"mermaid","roots":["bb-participant-client"],"aliases":"bb_participant_client=bb-participant-client, bb_agent_runner=bb-agent-runner, bb_cli=bb-cli, bb_client_core=bb-client-core, bb_ears=bb-ears, bb_mcp=bb-mcp, bb_replicator=bb-replicator","source":"flowchart LR\n    subgraph bb_participant_client [Participant client]\n        bb_agent_runner[Agent runner]\n        bb_cli[office CLI]\n        bb_client_core[Client core]\n        bb_ears[Ears]\n        bb_mcp[MCP server]\n        bb_replicator[Log replicator]\n    end\n    bb_agent_runner -->|if-client-core| bb_client_core\n    bb_agent_runner -->|if-replication| bb_replicator\n    bb_cli -->|if-client-core| bb_client_core\n    bb_cli -->|if-replication| bb_replicator\n    bb_ears -->|if-client-core| bb_client_core\n    bb_mcp -->|if-client-core| bb_client_core\n    bb_mcp -->|if-replication| bb_replicator","startLine":533,"endLine":559},{"kind":"prose","text":"","line":560,"renderedHtml":""},{"kind":"heading","level":3,"text":"CLI","line":561},{"kind":"prose","text":"","line":562,"renderedHtml":"\u003cp>Shell commands with machine-readable output (OPEN: \u003ccode>--json\u003c/code> convention).\u003c/p>\n"},{"kind":"prose","text":"Shell commands with machine-readable output (OPEN: `--json` convention).","line":563,"renderedHtml":""},{"kind":"prose","text":"","line":564,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-cli","title":"office CLI","provider":"bb-participant-client","x-realized-by":"bb-cli","protocol":"Shell / stdout","path":"client/cli"},"startLine":566,"endLine":573,"inArc42Fence":true},{"kind":"prose","text":"","line":575,"renderedHtml":""},{"kind":"heading","level":3,"text":"MCP tools","line":576},{"kind":"prose","text":"","line":577,"renderedHtml":"\u003cp>Tools such as \u003ccode>meeting.join\u003c/code>, \u003ccode>meeting.leave\u003c/code>, \u003ccode>hand.raise\u003c/code>, \u003ccode>minutes.update\u003c/code>, \u003ccode>stage.show\u003c/code>,\n\u003ccode>slides.render\u003c/code>, \u003ccode>slides.get\u003c/code>, \u003ccode>plan.validate\u003c/code>, \u003ccode>decision.record\u003c/code>, \u003ccode>minutes.get\u003c/code>, \u003ccode>note.add\u003c/code>, \u003ccode>task.create\u003c/code>,\n\u003ccode>task.update\u003c/code>, \u003ccode>session.import\u003c/code>.\u003c/p>\n"},{"kind":"prose","text":"Tools such as `meeting.join`, `meeting.leave`, `hand.raise`, `minutes.update`, `stage.show`,","line":578,"renderedHtml":""},{"kind":"prose","text":"`slides.render`, `slides.get`, `plan.validate`, `decision.record`, `minutes.get`, `note.add`, `task.create`,","line":579,"renderedHtml":""},{"kind":"prose","text":"`task.update`, `session.import`.","line":580,"renderedHtml":""},{"kind":"prose","text":"","line":581,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-mcp","title":"MCP tools","provider":"bb-participant-client","x-realized-by":"bb-mcp","protocol":"MCP (stdio)","path":"client/mcp"},"startLine":583,"endLine":590,"inArc42Fence":true},{"kind":"prose","text":"","line":592,"renderedHtml":""},{"kind":"heading","level":3,"text":"Local session log","line":593},{"kind":"prose","text":"","line":594,"renderedHtml":"\u003cp>An append-only JSONL file with one compact line per event. Every line carries the event type in\ndotted form (for example \u003ccode>&quot;type&quot;:&quot;utterance.final&quot;\u003c/code>) and the event ID as a JSON number, so that\n\u003ccode>tail -f\u003c/code>, \u003ccode>grep\u003c/code> and \u003ccode>jq\u003c/code> work without conversion. The line form belongs to the session stream,\nso the session log in the archive has the same lines. Next to the log, the replicator keeps the\nlatest tree head that the hub signed over it (\u003ccode>dec-signed-head-in-stream\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"An append-only JSONL file with one compact line per event. Every line carries the event type in","line":595,"renderedHtml":""},{"kind":"prose","text":"dotted form (for example `\"type\":\"utterance.final\"`) and the event ID as a JSON number, so that","line":596,"renderedHtml":""},{"kind":"prose","text":"`tail -f`, `grep` and `jq` work without conversion. The line form belongs to the session stream,","line":597,"renderedHtml":""},{"kind":"prose","text":"so the session log in the archive has the same lines. Next to the log, the replicator keeps the","line":598,"renderedHtml":""},{"kind":"prose","text":"latest tree head that the hub signed over it (`dec-signed-head-in-stream`).","line":599,"renderedHtml":""},{"kind":"prose","text":"","line":600,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-local-log","title":"Local session log","provider":"bb-participant-client","x-realized-by":"bb-replicator","protocol":"JSONL file (append-only)","path":"client/replicator"},"startLine":602,"endLine":609,"inArc42Fence":true},{"kind":"prose","text":"","line":611,"renderedHtml":""},{"kind":"heading","level":3,"text":"Audio input","line":612},{"kind":"prose","text":"","line":613,"renderedHtml":"\u003cp>The participant&#39;s local audio device (headset).\u003c/p>\n"},{"kind":"prose","text":"The participant's local audio device (headset).","line":614,"renderedHtml":""},{"kind":"prose","text":"","line":615,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-audio-in","title":"Audio input","provider":"bb-participant-client","x-realized-by":"bb-ears","protocol":"Local audio device","path":"client/ears"},"startLine":617,"endLine":624,"inArc42Fence":true},{"kind":"prose","text":"","line":626,"renderedHtml":""},{"kind":"heading","level":3,"text":"Agent Client Protocol (client side)","line":627},{"kind":"prose","text":"","line":628,"renderedHtml":"\u003cp>The participant client is the client of the Agent Client Protocol (ACP) for an agent harness,\nfor example Claude Code through its ACP adapter, opencode or Kiro. The agent runner starts the\nharness as a child process and
