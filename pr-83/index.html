prose","text":"**Storage and integrity.** The hub orders the events and is the gateway to the archive: it writes","line":33,"renderedHtml":""},{"kind":"prose","text":"the log to a Git repository at a configurable interval and at the end, without ever holding up","line":34,"renderedHtml":""},{"kind":"prose","text":"the session (`dec-session-persistence`). At first the repository is local on the hub host","line":35,"renderedHtml":""},{"kind":"prose","text":"(`dec-yaml-git-storage`). The peers keep copies as their reading interface; their copies and the","line":36,"renderedHtml":""},{"kind":"prose","text":"stored log have the same lines. The events are the leaves of a Merkle tree, and the hub signs its","line":37,"renderedHtml":""},{"kind":"prose","text":"tree head (`dec-merkle-log`). Every write to the archive carries the signed tree head over","line":38,"renderedHtml":""},{"kind":"prose","text":"exactly the stored log. After a crash, the hub restores a session from the archive, and a peer fills in","line":39,"renderedHtml":""},{"kind":"prose","text":"the rest (`dec-restore-from-peers`). For this, the stream gives every peer a signed tree head over","line":40,"renderedHtml":""},{"kind":"prose","text":"its whole copy, and a restored session waits for the peers before it takes commands, so the IDs","line":41,"renderedHtml":""},{"kind":"prose","text":"and every cursor stay valid (`dec-signed-head-in-stream`, `rs-hub-restart`).","line":42,"renderedHtml":""},{"kind":"prose","text":"","line":43,"renderedHtml":""},{"kind":"prose","text":"**Imported sessions.** A conversation from outside the office becomes a session through its own","line":44,"renderedHtml":""},{"kind":"prose","text":"interface (`dec-session-import`). The meeting session writes it into the log like live commands,","line":45,"renderedHtml":""},{"kind":"prose","text":"so the log keeps one writer and gap-free IDs. The first event marks the session as imported and","line":46,"renderedHtml":""},{"kind":"prose","text":"names its source. The speakers are imported participants, not registered ones. The tree heads","line":47,"renderedHtml":""},{"kind":"prose","text":"over an imported log protect it from later changes, but do not prove what was said.","line":48,"renderedHtml":""},{"kind":"prose","text":"","line":49,"renderedHtml":""},{"kind":"prose","text":"**Resuming after a network drop:**","line":50,"renderedHtml":""},{"kind":"prose","text":"","line":51,"renderedHtml":""},{"kind":"prose","text":"- Readers (replicator, stage) reconnect with their last event ID and receive every event after it.","line":52,"renderedHtml":""},{"kind":"prose","text":"  Nothing is lost, and nothing arrives twice.","line":53,"renderedHtml":""},{"kind":"prose","text":"- Writers (ears, CLI, MCP) give every command an ID that they create themselves. If they send a","line":54,"renderedHtml":""},{"kind":"prose","text":"  command again after a drop, the hub recognises the ID and returns the existing event.","line":55,"renderedHtml":""},{"kind":"prose","text":"- This includes `join`: a client keeps its join command ID, so after a restart it is still the","line":56,"renderedHtml":""},{"kind":"prose","text":"  same participant.","line":57,"renderedHtml":""},{"kind":"prose","text":"- The ears queue utterances locally while offline (text only) and send them in order.","line":58,"renderedHtml":""},{"kind":"prose","text":"","line":59,"renderedHtml":""},{"kind":"prose","text":"Event levels (guide values, configurable per participant):","line":60,"renderedHtml":""},{"kind":"prose","text":"","line":61,"renderedHtml":""},{"kind":"prose","text":"| Event | Trigger |","line":62,"renderedHtml":""},{"kind":"prose","text":"|---|---|","line":63,"renderedHtml":""},{"kind":"prose","text":"| `utterance.final` | End of sentence, about 300–700 ms of silence |","line":64,"renderedHtml":""},{"kind":"prose","text":"| `turn.end` | Change of speaker, about 1.5–2 s of silence |","line":65,"renderedHtml":""},{"kind":"prose","text":"| `silence.long` | More than 5 s of silence |","line":66,"renderedHtml":""},{"kind":"prose","text":"| `addressed` | A participant's name is mentioned |","line":67,"renderedHtml":""},{"kind":"prose","text":"| `hand.raised`, `minutes.updated`, `artifact.shown` | Actions of participants |","line":68,"renderedHtml":""},{"kind":"prose","text":"| `participant.joined/left/paused`, `session.ended` | Life cycle |","line":69,"renderedHtml":""},{"kind":"prose","text":"","line":70,"renderedHtml":""},{"kind":"prose","text":"Partials are not written to the log (`dec-no-partials-in-log`).","line":71,"renderedHtml":""},{"kind":"prose","text":"","line":72,"renderedHtml":""},{"kind":"prose","text":"**Checking a log:** the events of a session are the leaves of a Merkle tree (`dec-merkle-log`).","line":73,"renderedHtml":""},{"kind":"prose","text":"The hub signs the head of the tree with its own key, which stays the same across restarts. It","line":74,"renderedHtml":""},{"kind":"prose","text":"puts the signed head of the log so far into `session.ended`, and returns a signed head, a","line":75,"renderedHtml":""},{"kind":"prose","text":"consistency proof or an inclusion proof on request. A placeholder of an utterance that is off","line":76,"renderedHtml":""},{"kind":"prose","text":"the record carries the leaf hash of the original, so a copy with placeholders still verifies.","line":77,"renderedHtml":""},{"kind":"prose","text":"A placeholder can only hide a text; it cannot change what the tree proves.","line":78,"renderedHtml":""},{"kind":"prose","text":"","line":79,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-event-log","title":"Append-only session log with cursor and resume","category":"integration"},"startLine":81,"endLine":85,"inArc42Fence":true},{"kind":"prose","text":"","line":87,"renderedHtml":""},{"kind":"heading","level":2,"text":"Read from the file, write through tools","line":88},{"kind":"prose","text":"","line":89,"renderedHtml":"\u003cp>Participants read what happens from the locally replicated file. Agents usually do this with a\nbackground process and a filter (\u003ccode>tail -f … | grep &#39;&quot;turn.end&quot;\\|&quot;addressed&quot;&#39;\u003c/code>). They act through\ntools (CLI or MCP) that answer at once and check their input. Every action then appears in the log.\nSo agents can confirm their own actions, and several agents can coordinate without a protocol of\ntheir own.\u003c/p>\n\u003cp>An agent can also fetch the events after a cursor itself: when it finds a gap in its copy, or\nwhen it has no file system and polls instead of following a file (\u003ccode>dec-events-from-cursor\u003c/code>).\u003c/p>\n\u003cp>An agent in a harness that works in turns cannot follow a file by itself. The agent runner reads\nthe file for it and puts what was said into the agent&#39;s next prompt (\u003ccode>dec-agent-runner-acp\u003c/code>). The\nagent still writes through the tools, and it can still read the file for earlier events.\u003c/p>\n"},{"kind":"prose","text":"Participants read what happens from the locally replicated file. Agents usually do this with a","line":90,"renderedHtml":""},{"kind":"prose","text":"background process and a filter (`tail -f … | grep '\"turn.end\"\\|\"addressed\"'`). They act through","line":91,"renderedHtml":""},{"kind":"prose","text":"tools (CLI or MCP) that answer at once and check their input. Every action then appears in the log.","line":92,"renderedHtml":""},{"kind":"prose","text":"So agents can confirm their own actions, and several agents can coordinate without a protocol of","line":93,"renderedHtml":""},{"kind":"prose","text":"their own.","line":94,"renderedHtml":""},{"kind":"prose","text":"","line":95,"renderedHtml":""},{"kind":"prose","text":"An agent can also fetch the events after a cursor itself: when it finds a gap in its copy, or","line":96,"renderedHtml":""},{"kind":"prose","text":"when it has no file system and polls instead of following a file (`dec-events-from-cursor`).","line":97,"renderedHtml":""},{"kind":"prose","text":"","line":98,"renderedHtml":""},{"kind":"prose","text":"An agent in a harness that works in turns cannot follow a file by itself. The agent runner reads","line":99,"renderedHtml":""},{"kind":"prose","text":"the file for it and puts what was said into the agent's next prompt (`dec-agent-runner-acp`). The","line":100,"renderedHtml":""},{"kind":"prose","text":"agent still writes through the tools, and it can still read the file for earlier events.","line":101,"renderedHtml":""},{"kind":"prose","text":"","line":102,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-read-file-write-tools","title":"Read from the file, write through tools","category":"integration"},"startLine":104,"endLine":108,"inArc42Fence":true},{"kind":"prose","text":"","line":110,"renderedHtml":""},{"kind":"heading","level":2,"text":"Transcription at the edge","line":111},{"kind":"prose","text":"","line":112,"renderedHtml":"\u003cp>Each human transcribes only themselves, locally. Raw audio never leaves the device. Only text and\nmetadata are sent. With a headset, the single ear comes for free. Use with loudspeakers (echo\ncancellation, voice print) and the room ear (speaker recognition) come later. Voice prints are\nbiometric data (Art. 9 GDPR) and need explicit consent.\u003c/p>\n"},{"kind":"prose","text":"Each human transcribes only themselves, locally. Raw audio never leaves the device. Only text and","line":113,"renderedHtml":""},{"kind":"prose","text":"metadata are sent. With a headset, the single ear comes for free. Use with loudspeakers (echo","line":114,"renderedHtml":""},{"kind":"prose","text":"cancellation, voice print) and the room ear (speaker recognition) come later. Voice prints are","line":115,"renderedHtml":""},{"kind":"prose","text":"biometric data (Art. 9 GDPR) and need explicit consent.","line":116,"renderedHtml":""},{"kind":"prose","text":"","line":117,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-edge-transcription","title":"Local transcription; only text leaves the device","category":"privacy"},"startLine":119,"endLine":123,"inArc42Fence":true},{"kind":"prose","text":"","line":125,"renderedHtml":""},{"kind":"heading","level":2,"text":"Transparency and consent","line":126},{"kind":"prose","text":"","line":127,"renderedHtml":"\u003cp>People who are captured see every sentence with its status in their terminal. They can pause and\nmark a sentence off the record afterwards. The stage shows everyone who is captured, paused or not\ncaptured. People without a client are not transcribed. Joining with the microphone is the consent\nto capture and to storage, also of the raw transcript (\u003ccode>dec-consent-by-mic\u003c/code>). Only the user who\nruns the client can read local log files.\u003c/p>\n"},{"kind":"prose","text":"People who are captured see every sentence with its status in their terminal. They can pause and","line":128,"renderedHtml":""},{"kind":"prose","text":"mark a sentence off the record afterwards. The stage shows everyone who is captured, paused or not","line":129,"renderedHtml":""},{"kind":"prose","text":"captured. People without a client are not transcribed. Joining with the microphone is the consent","line":130,"renderedHtml":""},{"kind":"prose","text":"to capture and to storage, also of the raw transcript (`dec-consent-by-mic`). Only the user who","line":131,"renderedHtml":""},{"kind":"prose","text":"runs the client can read local log files.","line":132,"renderedHtml":""},{"kind":"prose","text":"","line":133,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-transparency","title":"Transparency and consent","category":"privacy"},"startLine":135,"endLine":139,"inArc42Fence":true},{"kind":"prose","text":"","line":141,"renderedHtml":""},{"kind":"heading","level":2,"text":"Identity and access","line":142},{"kind":"prose","text":"","line":143,"renderedHtml":"\u003cp>\u003cstrong>Actors and keys.\u003c/strong> Every participant is its own actor with its own Ed25519 key pair: each human\ndevice and each agent. The key pair is created locally. Only the public key leaves the device. An\nagent does not act on behalf of a human; it acts as itself.\u003c/p>\n\u003cp>\u003cstrong>First contact.\u003c/strong> In the first stage, we trust a new public key because we meet the person. An\nadmin registers the key by hand. A real enrollment flow is issue #2.\u003c/p>\n\u003cp>\u003cstrong>Authentication.\u003c/strong> Challenge and response: the client signs a challenge from the hub and gets\nan access token that lives about 15 minutes and is bound to its key. Every call carries the token.\nAll connections use TLS.\u003c/p>\n\u003cp>\u003cstrong>Stage.\u003c/strong> A browser has no key. Identity creates a read-only link with a token that only allows\nviewing the stage of one session.\u003c/p>\n\u003cp>\u003cstrong>Revocation.\u003c/strong> Each participant can have several keys (several devices). An admin can remove a\nkey; tokens bound to it stop working when they expire, at the latest.\u003c/p>\n\u003cp>\u003cstrong>Out of scope for the first stage:\u003c/strong> acting on behalf of someone else (delegation), self-service\nenrollment (issue #2), encryption of stored data (OPEN).\u003c/p>\n"},{"kind":"prose","text":"**Actors and keys.** Every participant is its own actor with its own Ed25519 key pair: each human","line":144,"renderedHtml":""},{"kind":"prose","text":"device and each agent. The key pair is created locally. Only the public key leaves the device. An","line":145,"renderedHtml":""},{"kind":"prose","text":"agent does not act on behalf of a human; it acts as itself.","line":146,"renderedHtml":""},{"kind":"prose","text":"","line":147,"renderedHtml":""},{"kind":"prose","text":"**First contact.** In the first stage, we trust a new public key because we meet the person. An","line":148,"renderedHtml":""},{"kind":"prose","text":"admin registers the key by hand. A real enrollment flow is issue #2.","line":149,"renderedHtml":""},{"kind":"prose","text":"","line":150,"renderedHtml":""},{"kind":"prose","text":"**Authentication.** Challenge and response: the client signs a challenge from the hub and gets","line":151,"renderedHtml":""},{"kind":"prose","text":"an access token that lives about 15 minutes and is bound to its key. Every call carries the token.","line":152,"renderedHtml":""},{"kind":"prose","text":"All connections use TLS.","line":153,"renderedHtml":""},{"kind":"prose","text":"","line":154,"renderedHtml":""},{"kind":"prose","text":"**Stage.** A browser has no key. Identity creates a read-only link with a token that only allows","line":155,"renderedHtml":""},{"kind":"prose","text":"viewing the stage of one session.","line":156,"renderedHtml":""},{"kind":"prose","text":"","line":157,"renderedHtml":""},{"kind":"prose","text":"**Revocation.** Each participant can have several keys (several devices). An admin can remove a","line":158,"renderedHtml":""},{"kind":"prose","text":"key; tokens bound to it stop working when they expire, at the latest.","line":159,"renderedHtml":""},{"kind":"prose","text":"","line":160,"renderedHtml":""},{"kind":"prose","text":"**Out of scope for the first stage:** acting on behalf of someone else (delegation), self-service","line":161,"renderedHtml":""},{"kind":"prose","text":"enrollment (issue #2), encryption of stored data (OPEN).","line":162,"renderedHtml":""},{"kind":"prose","text":"","line":163,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-identity","title":"Identity and access with local key pairs","category":"security"},"startLine":165,"endLine":169,"inArc42Fence":true},{"kind":"prose","text":"","line":171,"renderedHtml":""},{"kind":"heading","level":2,"text":"Test strategy","line":172},{"kind":"prose","text":"","line":173,"renderedHtml":"\u003cp>\u003cstrong>No unit tests.\u003c/strong> Every building block is tested as a black box through its interfaces\n(\u003ccode>con-no-unit-tests\u003c/code>, \u003ccode>con-contract-tests\u003c/code>). The interfaces in chapter 5 are the contracts.\u003c/p>\n\u003cp>\u003cstrong>Automated end-to-end tests\u003c/strong> run on a host without a microphone. They feed a recorded\nWAV file through the ears in real time. This covers the whole pipeline after audio capture: voice\nactivity detection, Whisper, submitting the utterance, the session log and the local copy. The\ntests also cover resume after the replicator is killed.\u003c/p>\n\u003cp>\u003cstrong>End-to-end tests never check performance.\u003c/strong> They check behaviour only: no audio leaves the\ndevice, no event is lost or duplicated, the status of a sentence becomes visible. They pass on any\nhost that runs the system. \u003cstrong>Performance tests\u003c/strong> are separate. They check the timing criteria of\nthe quality scenarios (chapter 10) with their full lengths and run on the reference host.\u003c/p>\n\u003cp>\u003cstrong>Architecture test.\u003c/strong> A test checks the code against this model on every run of the tests (see\n\u003ccode>concept-module-boundaries\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Manual tests\u003c/strong> cover what a WAV file cannot: real audio capture from a device and Whisper\naccuracy on real speech. A person joins with a headset on a participant laptop and speaks a few\nsentences. We do this before we judge recognition quality, because the test WAV is synthetic and\ncleaner than a headset in a meeting.\u003c/p>\n\u003cp>\u003cstrong>Not planned:\u003c/strong> a virtual microphone on the hub host. It needs administrator rights and adds\nlittle.\u003c/p>\n"},{"kind":"prose","text":"**No unit tests.** Every building block is tested as a black box through its interfaces","line":174,"renderedHtml":""},{"kind":"prose","text":"(`con-no-unit-tests`, `con-contract-tests`). The interfaces in chapter 5 are the contracts.","line":175,"renderedHtml":""},{"kind":"prose","text":"","line":176,"renderedHtml":""},{"kind":"prose","text":"**Automated end-to-end tests** run on a host without a microphone. They feed a recorded","line":177,"renderedHtml":""},{"kind":"prose","text":"WAV file through the ears in real time. This covers the whole pipeline after audio capture: voice","line":178,"renderedHtml":""},{"kind":"prose","text":"activity detection, Whisper, submitting the utterance, the session log and the local copy. The","line":179,"renderedHtml":""},{"kind":"prose","text":"tests also cover resume after the replicator is killed.","line":180,"renderedHtml":""},{"kind":"prose","text":"","line":181,"renderedHtml":""},{"kind":"prose","text":"**End-to-end tests never check performance.** They check behaviour only: no audio leaves the","line":182,"renderedHtml":""},{"kind":"prose","text":"device, no event is lost or duplicated, the status of a sentence becomes visible. They pass on any","line":183,"renderedHtml":""},{"kind":"prose","text":"host that runs the system. **Performance tests** are separate. They check the timing criteria of","line":184,"renderedHtml":""},{"kind":"prose","text":"the quality scenarios (chapter 10) with their full lengths and run on the reference host.","line":185,"renderedHtml":""},{"kind":"prose","text":"","line":186,"renderedHtml":""},{"kind":"prose","text":"**Architecture test.** A test checks the code against this model on every run of the tests (see","line":187,"renderedHtml":""},{"kind":"prose","text":"`concept-module-boundaries`).","line":188,"renderedHtml":""},{"kind":"prose","text":"","line":189,"renderedHtml":""},{"kind":"prose","text":"**Manual tests** cover what a WAV file cannot: real audio capture from a device and Whisper","line":190,"renderedHtml":""},{"kind":"prose","text":"accuracy on real speech. A person joins with a headset on a participant laptop and speaks a few","line":191,"renderedHtml":""},{"kind":"prose","text":"sentences. We do this before we judge recognition quality, because the test WAV is synthetic and","line":192,"renderedHtml":""},{"kind":"prose","text":"cleaner than a headset in a meeting.","line":193,"renderedHtml":""},{"kind":"prose","text":"","line":194,"renderedHtml":""},{"kind":"prose","text":"**Not planned:** a virtual microphone on the hub host. It needs administrator rights and adds","line":195,"renderedHtml":""},{"kind":"prose","text":"little.","line":196,"renderedHtml":""},{"kind":"prose","text":"","line":197,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-test-strategy","title":"Test strategy for the audio pipeline","category":"testing"},"startLine":199,"endLine":203,"inArc42Fence":true},{"kind":"prose","text":"","line":205,"renderedHtml":""},{"kind":"heading","level":2,"text":"Module boundaries","line":206},{"kind":"prose","text":"","line":207,"renderedHtml":"\u003cp>The building block view (chapter 5) is the map of the code, and a test enforces it.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>One path per building block.\u003c/strong> A building block is a black box with one responsibility. Its\npath is where its code lives. A child lies under the path of its parent.\u003c/li>\n\u003cli>\u003cstrong>An interface belongs to its provider.\u003c/strong> Its path lies inside the path of the provider. The\ntypes of an interface are part of the interface: every provider defines its own types, even if\nanother interface has a similar one (for example the kind of a participant, of an actor and of\nthe author of a decision). Consumers map between them.\u003c/li>\n\u003cli>\u003cstrong>No shared package.\u003c/strong> There is no common or core package that everyone may use. Code that\nseveral building blocks need is either an interface of one of them, or a missing building block,\nor acceptable duplication. Cross-cutting concepts (this chapter) are rules, not places.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>requires\u003c/code> is the permission.\u003c/strong> A building block may only use the interfaces it provides or\nlists in \u003ccode>requires\u003c/code>. Every listed interface must be used. So a new dependency shows up in the\nmodel before it can exist in the code.\u003c/li>\n\u003cli>\u003cstrong>Black box and white box.\u003c/strong> An interface that crosses the boundary of a parent building block\nbelongs to that parent: it is part of its black box. One direct child realizes it, and the\nmodel names that child. Only the realizing child may use such an interface without requiring\nit. Interfaces that stay inside a parent belong to the child that provides them. So level 1 of\nthe building block view shows the contracts across the boundary, and level 2 shows how the\nparts work together.\u003c/li>\n\u003cli>\u003cstrong>The white box knows its parts.\u003c/strong> A parent building block may wire its direct children. A\nchild never uses the inside of its parent, and siblings know each other only through\ninterfaces.\u003c/li>\n\u003cli>\u003cstrong>Tests are external actors.\u003c/strong> They may use interfaces only and never reach into a building\nblock.\u003c/li>\n\u003cli>\u003cstrong>Interfaces for actors only\u003c/strong> (CLI, MCP, stage view, audio input) also have a path: the place\nwhere their contract is defined. Building blocks do not use them.\u003c/li>\n\u003c/ul>\n"},{"kind":"prose","text":"The building block view (chapter 5) is the map of the code, and a test enforces it.","line":208,"renderedHtml":""},{"kind":"prose","text":"","line":209,"renderedHtml":""},{"kind":"prose","text":"- **One path per building block.** A building block is a black box with one responsibility. Its","line":210,"renderedHtml":""},{"kind":"prose","text":"  path is where its code lives. A child lies under the path of its parent.","line":211,"renderedHtml":""},{"kind":"prose","text":"- **An interface belongs to its provider.** Its path lies inside the path of the provider. The","line":212,"renderedHtml":""},{"kind":"prose","text":"  types of an interface are part of the interface: every provider defines its own types, even if","line":213,"renderedHtml":""},{"kind":"prose","text":"  another interface has a similar one (for example the kind of a participant, of an actor and of","line":214,"renderedHtml":""},{"kind":"prose","text":"  the author of a decision). Consumers map between them.","line":215,"renderedHtml":""},{"kind":"prose","text":"- **No shared package.** There is no common or core package that everyone may use. Code that","line":216,"renderedHtml":""},{"kind":"prose","text":"  several building blocks need is either an interface of one of them, or a missing building block,","line":217,"renderedHtml":""},{"kind":"prose","text":"  or acceptable duplication. Cross-cutting concepts (this chapter) are rules, not places.","line":218,"renderedHtml":""},{"kind":"prose","text":"- **`requires` is the permission.** A building block may only use the interfaces it provides or","line":219,"renderedHtml":""},{"kind":"prose","text":"  lists in `requires`. Every listed interface must be used. So a new dependency shows up in the","line":220,"renderedHtml":""},{"kind":"prose","text":"  model before it can exist in the code.","line":221,"renderedHtml":""},{"kind":"prose","text":"- **Black box and white box.** An interface that crosses the boundary of a parent building block","line":222,"renderedHtml":""},{"kind":"prose","text":"  belongs to that parent: it is part of its black box. One direct child realizes it, and the","line":223,"renderedHtml":""},{"kind":"prose","text":"  model names that child. Only the realizing child may use such an interface without requiring","line":224,"renderedHtml":""},{"kind":"prose","text":"  it. Interfaces that stay inside a parent belong to the child that provides them. So level 1 of","line":225,"renderedHtml":""},{"kind":"prose","text":"  the building block view shows the contracts across the boundary, and level 2 shows how the","line":226,"renderedHtml":""},{"kind":"prose","text":"  parts work together.","line":227,"renderedHtml":""},{"kind":"prose","text":"- **The white box knows its parts.** A parent building block may wire its direct children. A","line":228,"renderedHtml":""},{"kind":"prose","text":"  child never uses the inside of its parent, and siblings know each other only through","line":229,"renderedHtml":""},{"kind":"prose","text":"  interfaces.","line":230,"renderedHtml":""},{"kind":"prose","text":"- **Tests are external actors.** They may use interfaces only and never reach into a building","line":231,"renderedHtml":""},{"kind":"prose","text":"  block.","line":232,"renderedHtml":""},{"kind":"prose","text":"- **Interfaces for actors only** (CLI, MCP, stage view, audio input) also have a path: the place","line":233,"renderedHtml":""},{"kind":"prose","text":"  where their contract is defined. Building blocks do not use them.","line":234,"renderedHtml":""},{"kind":"prose","text":"","line":235,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-module-boundaries","title":"Module boundaries follow the building blocks","category":"structure"},"startLine":237,"endLine":241,"inArc42Fence":true},{"kind":"prose","text":"","line":243,"renderedHtml":""}]},{"filePath":"docs/architecture/09-decisions.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Architecture Decisions","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>All decisions come from the concept discussion on 2026-11-06 and the first review. Decisions the\nmaintainer made explicitly are \u003ccode>accepted\u003c/code>. Proposals that still need confirmation are \u003ccode>proposed\u003c/code>.\u003c/p>\n"},{"kind":"prose","text":"All decisions come from the concept discussion on 2026-11-06 and the first review. Decisions the","line":3,"renderedHtml":""},{"kind":"prose","text":"maintainer made explicitly are `accepted`. Proposals that still need confirmation are `proposed`.","line":4,"renderedHtml":""},{"kind":"prose","text":"","line":5,"renderedHtml":""},{"kind":"heading","level":2,"text":"Headless, no intelligence in the application","line":6},{"kind":"prose","text":"","line":7,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Agents improve fast, and every team uses different ones. \u003cstrong>Decision:\u003c/strong> The application\nonly exposes APIs (MCP, CLI) and media connectors. The agent makes the judgements.\n\u003cstrong>Consequences:\u003c/strong> The hub stays deterministic and testable. Features that need judgement do not\nbelong in the hub (\u003ccode>dec-models-in-client\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"**Context:** Agents improve fast, and every team uses different ones. **Decision:** The application","line":8,"renderedHtml":""},{"kind":"prose","text":"only exposes APIs (MCP, CLI) and media connectors. The agent makes the judgements.","line":9,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** The hub stays deterministic and testable. Features that need judgement do not","line":10,"renderedHtml":""},{"kind":"prose","text":"belong in the hub (`dec-models-in-client`).","line":11,"renderedHtml":""},{"kind":"prose","text":"","line":12,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-headless-byoa","title":"Headless office, bring your own agent","status":"accepted","date":"2026-11-06","addresses":"con-no-intelligence"},"startLine":14,"endLine":20,"inArc42Fence":true},{"kind":"prose","text":"","line":22,"renderedHtml":""},{"kind":"heading","level":2,"text":"The rule \"no intelligence\" binds the hub, not the client","line":23},{"kind":"prose","text":"","line":24,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The rule &quot;no intelligence&quot; was written for the whole application. The hub holds the\nstate of the team and needs governance: its results must be deterministic and traceable. The\nclient runs on the computer of a participant, and the ears already use a speech model there. To\nkeep an agent in a meeting at a sensible cost, the client may want to ask a small model whether\nthe agent should act. \u003cstrong>Decision:\u003c/strong> \u003ccode>con-no-intelligence\u003c/code> applies to the hub only. The\nparticipant client may contain models, generative or not, on the participant&#39;s side. The office\nships no generative model; a user brings one (\u003ccode>dec-byo-decision-model\u003c/code>). \u003cstrong>Consequences:\u003c/strong> The\nhub stays as it is. A model in the client can only change what the client of that participant\ndoes, never what the hub stores or how it decides. Tests of the client use test doubles of such\nmodels and never call a real model. \u003cstrong>Rejected:\u003c/strong> a model in the hub (no governance); no model in\nthe client at all (the agent would have to be woken at every utterance, also when nobody needs\nit).\u003c/p>\n"},{"kind":"prose","text":"**Context:** The rule \"no intelligence\" was written for the whole application. The hub holds the","line":25,"renderedHtml":""},{"kind":"prose","text":"state of the team and needs governance: its results must be deterministic and traceable. The","line":26,"renderedHtml":""},{"kind":"prose","text":"client runs on the computer of a participant, and the ears already use a speech model there. To","line":27,"renderedHtml":""},{"kind":"prose","text":"keep an agent in a meeting at a sensible cost, the client may want to ask a small model whether","line":28,"renderedHtml":""},{"kind":"prose","text":"the agent should act. **Decision:** `con-no-intelligence` applies to the hub only. The","line":29,"renderedHtml":""},{"kind":"prose","text":"participant client may contain models, generative or not, on the participant's side. The office","line":30,"renderedHtml":""},{"kind":"prose","text":"ships no generative model; a user brings one (`dec-byo-decision-model`). **Consequences:** The","line":31,"renderedHtml":""},{"kind":"prose","text":"hub stays as it is. A model in the client can only change what the client of that participant","line":32,"renderedHtml":""},{"kind":"prose","text":"does, never what the hub stores or how it decides. Tests of the client use test doubles of such","line":33,"renderedHtml":""},{"kind":"prose","text":"models and never call a real model. **Rejected:** a model in the hub (no governance); no model in","line":34,"renderedHtml":""},{"kind":"prose","text":"the client at all (the agent would have to be woken at every utterance, also when nobody needs","line":35,"renderedHtml":""},{"kind":"prose","text":"it).","line":36,"renderedHtml":""},{"kind":"prose","text":"","line":37,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-models-in-client","title":"The rule \"no intelligence\" binds the hub, not the client","status":"accepted","date":"2026-11-11","addresses":"con-no-intelligence"},"startLine":39,"endLine":45,"inArc42Fence":true},{"kind":"prose","text":"","line":47,"renderedHtml":""},{"kind":"heading","level":2,"text":"An agent runner drives the agent harness over ACP","line":48},{"kind":"prose","text":"","line":49,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Claude Code, opencode and Kiro work in turns (\u003ccode>con-turn-based-agents\u003c/code>). They finish\na turn and wait for a human. Following the local log with \u003ccode>tail -f\u003c/code> in a background task works\nonly while the agent is in a turn, and people must use a keyword so that a filter wakes the\nagent. People want to address the agent in plain words. \u003cstrong>Decision:\u003c/strong> A new part of the client,\nthe agent runner, keeps the agent in the meeting. It follows the local log of the agent and\nstarts the agent&#39;s turns. Runner and harness are separate programs. They talk over the Agent\nClient Protocol (ACP): the runner is the ACP client and starts the harness as its ACP agent over\nstandard input and output. The runner opens one ACP session per meeting and hands it the office\ntools as an MCP server that runs with the key of the agent. \u003cstrong>Consequences:\u003c/strong> Every harness that\nspeaks ACP can take part without code for that harness in the office. The agent keeps its\ncontext across the meeting in one ACP session. The agent still acts only through the office\ntools, as itself. A harness that does not speak ACP still works the old way, through MCP or the\nCLI and the log file. The runner depends on a protocol that is young and still changes.\n\u003cstrong>Rejected:\u003c/strong> a runner per harness (code for every product); building the agent into the office\n(\u003ccode>dec-headless-byoa\u003c/code>); MCP notifications to wake the agent (most clients do not pass them on,\n\u003ccode>con-turn-based-agents\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"**Context:** Claude Code, opencode and Kiro work in turns (`con-turn-based-agents`). They finish","line":50,"renderedHtml":""},{"kind":"prose","text":"a turn and wait for a human. Following the local log with `tail -f` in a background task works","line":51,"renderedHtml":""},{"kind":"prose","text":"only while the agent is in a turn, and people must use a keyword so that a filter wakes the","line":52,"renderedHtml":""},{"kind":"prose","text":"agent. People want to address the agent in plain words. **Decision:** A new part of the client,","line":53,"renderedHtml":""},{"kind":"prose","text":"the agent runner, keeps the agent in the meeting. It follows the local log of the agent and","line":54,"renderedHtml":""},{"kind":"prose","text":"starts the agent's turns. Runner and harness are separate programs. They talk over the Agent","line":55,"renderedHtml":""},{"kind":"prose","text":"Client Protocol (ACP): the runner is the ACP client and starts the harness as its ACP agent over","line":56,"renderedHtml":""},{"kind":"prose","text":"standard input and output. The runner opens one ACP session per meeting and hands it the office","line":57,"renderedHtml":""},{"kind":"prose","text":"tools as an MCP server that runs with the key of the agent. **Consequences:** Every harness that","line":58,"renderedHtml":""},{"kind":"prose","text":"speaks ACP can take part without code for that harness in the office. The agent keeps its","line":59,"renderedHtml":""},{"kind":"prose","text":"context across the meeting in one ACP session. The agent still acts only through the office","line":60,"renderedHtml":""},{"kind":"prose","text":"tools, as itself. A harness that does not speak ACP still works the old way, through MCP or the","line":61,"renderedHtml":""},{"kind":"prose","text":"CLI and the log file. The runner depends on a protocol that is young and still changes.","line":62,"renderedHtml":""},{"kind":"prose","text":"**Rejected:** a runner per harness (code for every product); building the agent into the office","line":63,"renderedHtml":""},{"kind":"prose","text":"(`dec-headless-byoa`); MCP notifications to wake the agent (most clients do not pass them on,","line":64,"renderedHtml":""},{"kind":"prose","text":"`con-turn-based-agents`).","line":65,"renderedHtml":""},{"kind":"prose","text":"","line":66,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-agent-runner-acp","title":"An agent runner drives the agent harness over ACP","status":"accepted","date":"2026-11-11","addresses":"con-turn-based-agents, qg-usability"},"startLine":68,"endLine":74,"inArc42Fence":true},{"kind":"prose","text":"","line":76,"renderedHtml":""},{"kind":"heading","level":2,"text":"Check after each utterance whether to wake the agent","line":77},{"kind":"prose","text":"","line":78,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The agent should notice when it is addressed, without a keyword. It should also\nnotice when a speaker starts a new topic within a monologue, or talks about something that\nconcerns the role of the agent. The end of a turn (\u003ccode>turn.end\u003c/code>) comes too late for that.\n\u003cstrong>Decision:\u003c/strong> After each utterance of another participant, the runner checks whether to wake the\nagent. A decision model that the user brings makes the check (\u003ccode>dec-byo-decision-model\u003c/code>). When it\nsays the agent should act, the runner sends the agent what others said since its last delivery,\nas one prompt. Each utterance says who spoke and whether that participant is a human or an\nagent. The agent decides by itself how to act: answer, raise its hand, or update the minutes\nsilently. OPEN: what the runner does without a decision model. A check per utterance would then\nwake the agent at every utterance. Until this is decided, the runner wakes it at each change of\nspeaker instead. \u003cstrong>Consequences:\u003c/strong> People talk to the agent in plain words, and the agent can\nfollow topics within a long monologue. The check runs for every utterance, so the decision model\nmust be fast and cheap. An agent may act while someone still speaks; it should not interrupt\nspeech, but raise its hand or write. \u003cstrong>Rejected:\u003c/strong> a wake-up only at each change of speaker (it\nmisses a new topic within a monologue); a keyword (not natural).\u003c/p>\n"},{"kind":"prose","text":"**Context:** The agent should notice when it is addressed, without a keyword. It should also","line":79,"renderedHtml":""},{"kind":"prose","text":"notice when a speaker starts a new topic within a monologue, or talks about something that","line":80,"renderedHtml":""},{"kind":"prose","text":"concerns the role of the agent. The end of a turn (`turn.end`) comes too late for that.","line":81,"renderedHtml":""},{"kind":"prose","text":"**Decision:** After each utterance of another participant, the runner checks whether to wake the","line":82,"renderedHtml":""},{"kind":"prose","text":"agent. A decision model that the user brings makes the check (`dec-byo-decision-model`). When it","line":83,"renderedHtml":""},{"kind":"prose","text":"says the agent should act, the runner sends the agent what others said since its last delivery,","line":84,"renderedHtml":""},{"kind":"prose","text":"as one prompt. Each utterance says who spoke and whether that participant is a human or an","line":85,"renderedHtml":""},{"kind":"prose","text":"agent. The agent decides by itself how to act: answer, raise its hand, or update the minutes","line":86,"renderedHtml":""},{"kind":"prose","text":"silently. OPEN: what the runner does without a decision model. A check per utterance would then","line":87,"renderedHtml":""},{"kind":"prose","text":"wake the agent at every utterance. Until this is decided, the runner wakes it at each change of","line":88,"renderedHtml":""},{"kind":"prose","text":"speaker instead. **Consequences:** People talk to the agent in plain words, and the agent can","line":89,"renderedHtml":""},{"kind":"prose","text":"follow topics within a long monologue. The check runs for every utterance, so the decision model","line":90,"renderedHtml":""},{"kind":"prose","text":"must be fast and cheap. An agent may act while someone still speaks; it should not interrupt","line":91,"renderedHtml":""},{"kind":"prose","text":"speech, but raise its hand or write. **Rejected:** a wake-up only at each change of speaker (it","line":92,"renderedHtml":""},{"kind":"prose","text":"misses a new topic within a monologue); a keyword (not natural).","line":93,"renderedHtml":""},{"kind":"prose","text":"","line":94,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-wake-check-per-utterance","title":"Check after each utterance whether to wake the agent","status":"accepted","date":"2026-11-12","addresses":"con-turn-based-agents, qg-usability"},"startLine":96,"endLine":102,"inArc42Fence":true},{"kind":"prose","text":"","line":104,"renderedHtml":""},{"kind":"heading","level":2,"text":"What the agent runner sends, and when","line":105},{"kind":"prose","text":"","line":106,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The runner must deliver what was said reliably, while the agent may be busy and the\nlog may grow. \u003cstrong>Decision:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>The runner joins the session with the key of the agent and runs the log replicator in its own\nprocess. The agent does not need to join; a join through the tools reuses the same participant\nand the same local log.\u003c/li>\n\u003cli>It delivers utterances in the order of the log, from the cursor of its last delivery. It leaves\nout the agent&#39;s own utterances and sentences off the record. A sentence that goes off the record\nbefore it was delivered is never delivered; for a delivered one, the next prompt tells the\nagent that it is off the record.\u003c/li>\n\u003cli>One prompt runs at a time. While the agent works, the runner queues further turns and sends\nthem together in one prompt afterwards. A turn without new utterances of others wakes nobody.\u003c/li>\n\u003cli>After \u003ccode>session.ended\u003c/code>, the runner sends what is left and a last prompt with the task of the\nrole for the end, then stops the harness. It does not leave the session, because a session\ncommand would open it again (\u003ccode>dec-session-end-milestone\u003c/code>).\u003c/li>\n\u003cli>The runner answers permission requests of the harness by a rule of the user: by default it\nallows the office tools and rejects every other tool. It offers the harness no access to its\nfile system or terminal.\u003c/li>\n\u003cli>A new runner opens a new ACP session. It starts its delivery after the join of the agent, so\na new runner for the same agent delivers what was said since that join.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Consequences:\u003c/strong> Nothing is lost and nothing is sent twice within one ACP session. The agent\ngets fewer, larger prompts when it is slow. The permission rule keeps an unattended agent from\nrunning other tools unless the user allows them. \u003cstrong>Rejected:\u003c/strong> cancelling a running prompt when a\nnew turn comes (the agent would lose its work); one prompt per turn while busy (the agent would\nlag behind more and more).\u003c/p>\n"},{"kind":"prose","text":"**Context:** The runner must deliver what was said reliably, while the agent may be busy and the","line":107,"renderedHtml":""},{"kind":"prose","text":"log may grow. **Decision:**","line":108,"renderedHtml":""},{"kind":"prose","text":"","line":109,"renderedHtml":""},{"kind":"prose","text":"- The runner joins the session with the key of the agent and runs the log replicator in its own","line":110,"renderedHtml":""},{"kind":"prose","text":"  process. The agent does not need to join; a join through the tools reuses the same participant","line":111,"renderedHtml":""},{"kind":"prose","text":"  and the same local log.","line":112,"renderedHtml":""},{"kind":"prose","text":"- It delivers utterances in the order of the log, from the cursor of its last delivery. It leaves","line":113,"renderedHtml":""},{"kind":"prose","text":"  out the agent's own utterances and sentences off the record. A sentence that goes off the record","line":114,"renderedHtml":""},{"kind":"prose","text":"  before it was delivered is never delivered; for a delivered one, the next prompt tells the","line":115,"renderedHtml":""},{"kind":"prose","text":"  agent that it is off the record.","line":116,"renderedHtml":""},{"kind":"prose","text":"- One prompt runs at a time. While the agent works, the runner queues further turns and sends","line":117,"renderedHtml":""},{"kind":"prose","text":"  them together in one prompt afterwards. A turn without new utterances of others wakes nobody.","line":118,"renderedHtml":""},{"kind":"prose","text":"- After `session.ended`, the runner sends what is left and a last prompt with the task of the","line":119,"renderedHtml":""},{"kind":"prose","text":"  role for the end, then stops the harness. It does not leave the session, because a session","line":120,"renderedHtml":""},{"kind":"prose","text":"  command would open it again (`dec-session-end-milestone`).","line":121,"renderedHtml":""},{"kind":"prose","text":"- The runner answers permission requests of the harness by a rule of the user: by default it","line":122,"renderedHtml":""},{"kind":"prose","text":"  allows the office tools and rejects every other tool. It offers the harness no access to its","line":123,"renderedHtml":""},{"kind":"prose","text":"  file system or terminal.","line":124,"renderedHtml":""},{"kind":"prose","text":"- A new runner opens a new ACP session. It starts its delivery after the join of the agent, so","line":125,"renderedHtml":""},{"kind":"prose","text":"  a new runner for the same agent delivers what was said since that join.","line":126,"renderedHtml":""},{"kind":"prose","text":"","line":127,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** Nothing is lost and nothing is sent twice within one ACP session. The agent","line":128,"renderedHtml":""},{"kind":"prose","text":"gets fewer, larger prompts when it is slow. The permission rule keeps an unattended agent from","line":129,"renderedHtml":""},{"kind":"prose","text":"running other tools unless the user allows them. **Rejected:** cancelling a running prompt when a","line":130,"renderedHtml":""},{"kind":"prose","text":"new turn comes (the agent would lose its work); one prompt per turn while busy (the agent would","line":131,"renderedHtml":""},{"kind":"prose","text":"lag behind more and more).","line":132,"renderedHtml":""},{"kind":"prose","text":"","line":133,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-agent-runner-delivery","title":"What the agent runner sends, and when","status":"proposed","date":"2026-11-11","addresses":"qg-resumability, qg-usability, risk-retraction-leak, risk-agent-wakeups, risk-harness-drift"},"startLine":135,"endLine":141,"inArc42Fence":true},{"kind":"prose","text":"","line":143,"renderedHtml":""},{"kind":"heading","level":2,"text":"A decision model that the user brings","line":144},{"kind":"prose","text":"","line":145,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The runner checks after each utterance whether to wake the agent\n(\u003ccode>dec-wake-check-per-utterance\u003c/code>). Waking a harness with a large model for this costs time and\nmoney, and it is slow to decide that it is not addressed. A small model can decide this faster\nand cheaper. The hub must stay without intelligence (\u003ccode>con-no-intelligence\u003c/code>), and the office\nshould not pick a model for its users. \u003cstrong>Decision:\u003c/strong> The runner has an interface for a decision\nmodel that the user brings and configures (\u003ccode>if-decision-model\u003c/code>). It is an OpenAI-compatible chat\nendpoint with structured output by JSON schema (for example llama.cpp, Ollama or a hosted model),\nor a command that reads the request as JSON and writes the answer as JSON. After each utterance,\nthe runner asks it and gets \u003ccode>act\u003c/code>, \u003ccode>addressed\u003c/code>, \u003ccode>topic_closed\u003c/code> and \u003ccode>reason\u003c/code>. It wakes the agent\nwhen \u003ccode>act\u003c/code> is true. When \u003ccode>topic_closed\u003c/code> is true, it wakes the agent with the task of the role for\nthe end of a topic, for example to update the minutes or to record decisions. Without a decision\nmodel, the runner wakes the agent at each change of speaker (OPEN, see\n\u003ccode>dec-wake-check-per-utterance\u003c/code>). If the model fails or does not answer in time, the runner wakes the agent and logs why.\n\u003cstrong>Consequences:\u003c/strong> The office ships no model and stays free of a model vendor. A wrong answer of\nthe model can keep the agent silent when it was addressed; the fallback covers only errors and\ntime-outs. Utterances that did not wake the agent stay queued and reach it with the next prompt,\nso nothing is lost. \u003cstrong>Rejected:\u003c/strong> a model built into the office; a fixed vendor API.\u003c/p>\n"},{"kind":"prose","text":"**Context:** The runner checks after each utterance whether to wake the agent","line":146,"renderedHtml":""},{"kind":"prose","text":"(`dec-wake-check-per-utterance`). Waking a harness with a large model for this costs time and","line":147,"renderedHtml":""},{"kind":"prose","text":"money, and it is slow to decide that it is not addressed. A small model can decide this faster","line":148,"renderedHtml":""},{"kind":"prose","text":"and cheaper. The hub must stay without intelligence (`con-no-intelligence`), and the office","line":149,"renderedHtml":""},{"kind":"prose","text":"should not pick a model for its users. **Decision:** The runner has an interface for a decision","line":150,"renderedHtml":""},{"kind":"prose","text":"model that the user brings and configures (`if-decision-model`). It is an OpenAI-compatible chat","line":151,"renderedHtml":""},{"kind":"prose","text":"endpoint with structured output by JSON schema (for example llama.cpp, Ollama or a hosted model),","line":152,"renderedHtml":""},{"kind":"prose","text":"or a command that reads the request as JSON and writes the answer as JSON. After each utterance,","line":153,"renderedHtml":""},{"kind":"prose","text":"the runner asks it and gets `act`, `addressed`, `topic_closed` and `reason`. It wakes the agent","line":154,"renderedHtml":""},{"kind":"prose","text":"when `act` is true. When `topic_closed` is true, it wakes the agent with the task of the role for","line":155,"renderedHtml":""},{"kind":"prose","text":"the end of a topic, for example to update the minutes or to record decisions. Without a decision","line":156,"renderedHtml":""},{"kind":"prose","text":"model, the runner wakes the agent at each change of speaker (OPEN, see","line":157,"renderedHtml":""},{"kind":"prose","text":"`dec-wake-check-per-utterance`). If the model fails or does not answer in time, the runner wakes the agent and logs why.","line":158,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** The office ships no model and stays free of a model vendor. A wrong answer of","line":159,"renderedHtml":""},{"kind":"prose","text":"the model can keep the agent silent when it was addressed; the fallback covers only errors and","line":160,"renderedHtml":""},{"kind":"prose","text":"time-outs. Utterances that did not wake the agent stay queued and reach it with the next prompt,","line":161,"renderedHtml":""},{"kind":"prose","text":"so nothing is lost. **Rejected:** a model built into the office; a fixed vendor API.","line":162,"renderedHtml":""},{"kind":"prose","text":"","line":163,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-byo-decision-model","title":"A decision model that the user brings","status":"accepted","date":"2026-11-11","addresses":"con-no-intelligence, qg-performance, qg-usability, risk-agent-wakeups"},"startLine":165,"endLine":171,"inArc42Fence":true},{"kind":"prose","text":"","line":173,"renderedHtml":""},{"kind":"heading","level":2,"text":"Own speech-to-text pipeline with Whisper","line":174},{"kind":"prose","text":"","line":175,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> No transcribed stream is available. \u003cstrong>Decision:\u003c/strong> We connect Whisper ourselves.\n\u003cstrong>Consequences:\u003c/strong> We decide how fine-grained events are and when they are sent (end of sentence,\nchange of speaker). This allows the agent to process in stages. \u003cstrong>Rejected:\u003c/strong> transcription by the\nmeeting tool, because it is not available and cannot be controlled.\u003c/p>\n"},{"kind":"prose","text":"**Context:** No transcribed stream is available. **Decision:** We connect Whisper ourselves.","line":176,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** We decide how fine-grained events are and when they are sent (end of sentence,","line":177,"renderedHtml":""},{"kind":"prose","text":"change of speaker). This allows the agent to process in stages. **Rejected:** transcription by the","line":178,"renderedHtml":""},{"kind":"prose","text":"meeting tool, because it is not available and cannot be controlled.","line":179,"renderedHtml":""},{"kind":"prose","text":"","line":180,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-own-whisper","title":"Own speech-to-text pipeline with Whisper and staged events","status":"accepted","date":"2026-11-06","addresses":"qg-performance"},"startLine":182,"endLine":188,"inArc42Fence":true},{"kind":"prose","text":"","line":190,"renderedHtml":""},{"kind":"heading","level":2,"text":"Local gateway, single ear with a headset","line":191},{"kind":"prose","text":"","line":192,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Whisper does not tell speakers apart. Loudspeakers and rooms cause echo and mixed\nsignals. \u003cstrong>Decision:\u003c/strong> Each human transcribes only themselves, locally, with a headset in the first\nstage. \u003cstrong>Consequences:\u003c/strong> Who is speaking follows from the setup. Raw audio stays local.\nLoudspeakers and rooms are not covered yet. \u003cstrong>Rejected:\u003c/strong> central speaker recognition (pyannote) on\na mixed signal.\u003c/p>\n"},{"kind":"prose","text":"**Context:** Whisper does not tell speakers apart. Loudspeakers and rooms cause echo and mixed","line":193,"renderedHtml":""},{"kind":"prose","text":"signals. **Decision:** Each human transcribes only themselves, locally, with a headset in the first","line":194,"renderedHtml":""},{"kind":"prose","text":"stage. **Consequences:** Who is speaking follows from the setup. Raw audio stays local.","line":195,"renderedHtml":""},{"kind":"prose","text":"Loudspeakers and rooms are not covered yet. **Rejected:** central speaker recognition (pyannote) on","line":196,"renderedHtml":""},{"kind":"prose","text":"a mixed signal.","line":197,"renderedHtml":""},{"kind":"prose","text":"","line":198,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-local-single-ear","title":"Local transcription per participant (single ear, headset)","status":"accepted","date":"2026-11-06","addresses":"con-privacy-law, con-headset-only, qg-confidentiality, risk-speaker-mode"},"startLine":200,"endLine":206,"inArc42Fence":true},{"kind":"prose","text":"","line":208,"renderedHtml":""},{"kind":"heading","level":2,"text":"Stage by screen share instead of a meeting tool integration","line":209},{"kind":"prose","text":"","line":210,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Bots for Zoom, Teams or Meet are costly and tied to one platform. \u003cstrong>Decision:\u003c/strong> The\nhub renders a stage as a web page that is shown by screen share. \u003cstrong>Consequences:\u003c/strong> It works with\nany tool. The agent&#39;s presence is visual. People without a client still see what happens.\u003c/p>\n"},{"kind":"prose","text":"**Context:** Bots for Zoom, Teams or Meet are costly and tied to one platform. **Decision:** The","line":211,"renderedHtml":""},{"kind":"prose","text":"hub renders a stage as a web page that is shown by screen share. **Consequences:** It works with","line":212,"renderedHtml":""},{"kind":"prose","text":"any tool. The agent's presence is visual. People without a client still see what happens.","line":213,"renderedHtml":""},{"kind":"prose","text":"","line":214,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-stage-screenshare","title":"Stage by screen share","status":"accepted","date":"2026-11-06","addresses":"con-any-meeting-tool, qg-usability"},"startLine":216,"endLine":222,"inArc42Fence":true},{"kind":"prose","text":"","line":224,"renderedHtml":""},{"kind":"heading","level":2,"text":"Text first, speech output later","line":225},{"kind":"prose","text":"","line":226,"renderedHtml":"\u003cp>\u003cstrong>Decision:\u003c/strong> At first, agents contribute only as text on the stage. \u003cstrong>Consequences:\u003c/strong> The humans\nkeep control of the conversation: an agent raises its hand visibly, and the moderator gives the\nfloor. Speech output can be added later through the audio of the\nscreen share, without changing the architecture. The person who shares will then need echo\ncancellation.\u003c/p>\n"},{"kind":"prose","text":"**Decision:** At first, agents contribute only as text on the stage. **Consequences:** The humans","line":227,"renderedHtml":""},{"kind":"prose","text":"keep control of the conversation: an agent raises its hand visibly, and the moderator gives the","line":228,"renderedHtml":""},{"kind":"prose","text":"floor. Speech output can be added later through the audio of the","line":229,"renderedHtml":""},{"kind":"prose","text":"screen share, without changing the architecture. The person who shares will then need echo","line":230,"renderedHtml":""},{"kind":"prose","text":"cancellation.","line":231,"renderedHtml":""},{"kind":"prose","text":"","line":232,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-text-first","title":"Text first, speech output later","status":"accepted","date":"2026-11-06","addresses":"qg-usability"},"startLine":234,"endLine":240,"inArc42Fence":true},{"kind":"prose","text":"","line":242,"renderedHtml":""},{"kind":"heading","level":2,"text":"Gateway as a CLI","line":243},{"kind":"prose","text":"","line":244,"renderedHtml":"\u003cp>\u003cstrong>Decision:\u003c/strong> At first, the gateway is a CLI. It shows what was recorded and sent, and it lets the\nuser pause and mark a sentence off the record. \u003cstrong>Consequences:\u003c/strong> There is no separate user interface. The display is a\nfiltered view of the local log.\u003c/p>\n"},{"kind":"prose","text":"**Decision:** At first, the gateway is a CLI. It shows what was recorded and sent, and it lets the","line":245,"renderedHtml":""},{"kind":"prose","text":"user pause and mark a sentence off the record. **Consequences:** There is no separate user interface. The display is a","line":246,"renderedHtml":""},{"kind":"prose","text":"filtered view of the local log.","line":247,"renderedHtml":""},{"kind":"prose","text":"","line":248,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-gateway-cli","title":"Gateway as a CLI","status":"accepted","date":"2026-11-06","addresses":"qg-usability"},"startLine":250,"endLine":256,"inArc42Fence":true},{"kind":"prose","text":"","line":258,"renderedHtml":""},{"kind":"heading","level":2,"text":"Session log as a local file","line":259},{"kind":"prose","text":"","line":260,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Agents work in turns, and MCP push rarely reaches the model. \u003cstrong>Decision:\u003c/strong> \u003ccode>join\u003c/code> starts\na local replicator that copies the log over a socket. It returns a file path at once, and the agent\nfollows that file. \u003cstrong>Consequences:\u003c/strong> The agent sets its pace with filters, the history is\nsearchable, and nothing depends on client features. It needs a shared file system.\n\u003cstrong>Rejected:\u003c/strong> MCP notifications as the main channel; long polling as the main channel.\u003c/p>\n"},{"kind":"prose","text":"**Context:** Agents work in turns, and MCP push rarely reaches the model. **Decision:** `join` starts","line":261,"renderedHtml":""},{"kind":"prose","text":"a local replicator that copies the log over a socket. It returns a file path at once, and the agent","line":262,"renderedHtml":""},{"kind":"prose","text":"follows that file. **Consequences:** The agent sets its pace with filters, the history is","line":263,"renderedHtml":""},{"kind":"prose","text":"searchable, and nothing depends on client features. It needs a shared file system.","line":264,"renderedHtml":""},{"kind":"prose","text":"**Rejected:** MCP notifications as the main channel; long polling as the main channel.","line":265,"renderedHtml":""},{"kind":"prose","text":"","line":266,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-log-as-file","title":"Session log as a locally replicated file","status":"accepted","date":"2026-11-06","addresses":"con-turn-based-agents, qg-performance, qg-resumability"},"startLine":268,"endLine":274,"inArc42Fence":true},{"kind":"prose","text":"","line":276,"renderedHtml":""},{"kind":"heading","level":2,"text":"One participant model","line":277},{"kind":"prose","text":"","line":278,"renderedHtml":"\u003cp>\u003cstrong>Decision:\u003c/strong> Humans and agents are participants with the same tools. For humans with a microphone,\nspeech is also transcribed. \u003cstrong>Consequences:\u003c/strong> The gateway is \u003ccode>join --mic\u003c/code>. The whole system can be\ntested without any agent.\u003c/p>\n"},{"kind":"prose","text":"**Decision:** Humans and agents are participants with the same tools. For humans with a microphone,","line":279,"renderedHtml":""},{"kind":"prose","text":"speech is also transcribed. **Consequences:** The gateway is `join --mic`. The whole system can be","line":280,"renderedHtml":""},{"kind":"prose","text":"tested without any agent.","line":281,"renderedHtml":""},{"kind":"prose","text":"","line":282,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-unified-participant","title":"Humans and agents as participants of the same kind","status":"accepted","date":"2026-11-06","addresses":"qg-usability"},"startLine":284,"endLine":290,"inArc42Fence":true},{"kind":"prose","text":"","line":292,"renderedHtml":""},{"kind":"heading","level":2,"text":"CLI and MCP as equals","line":293},{"kind":"prose","text":"","line":294,"renderedHtml":"\u003cp>\u003cstrong>Decision:\u003c/strong> All features are available through the CLI and through MCP, built on one shared core.\nThis holds for the tools and for the live layer. \u003cstrong>Consequences:\u003c/strong> Two thin adapters. The CLI is not\nan add-on.\u003c/p>\n"},{"kind":"prose","text":"**Decision:** All features are available through the CLI and through MCP, built on one shared core.","line":295,"renderedHtml":""},{"kind":"prose","text":"This holds for the tools and for the live layer. **Consequences:** Two thin adapters. The CLI is not","line":296,"renderedHtml":""},{"kind":"prose","text":"an add-on.","line":297,"renderedHtml":""},{"kind":"prose","text":"","line":298,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-cli-and-mcp","title":"CLI and MCP from one shared core","status":"accepted","date":"2026-11-06","addresses":"con-turn-based-agents"},"startLine":300,"endLine":306,"inArc42Fence":true},{"kind":"prose","text":"","line":308,"renderedHtml":""},{"kind":"heading","level":2,"text":"No partials in the log","line":309},{"kind":"prose","text":"","line":310,"renderedHtml":"\u003cp>\u003cstrong>Decision:\u003c/strong> Partial transcripts (\u003ccode>partial\u003c/code>) are not replicated. Only final utterances and signals\nare. \u003cstrong>Consequences:\u003c/strong> Less noise, a smaller file, a shorter path into the log. Whoever needs\npartials can get them later through a separate option.\u003c/p>\n"},{"kind":"prose","text":"**Decision:** Partial transcripts (`partial`) are not replicated. Only final utterances and signals","line":311,"renderedHtml":""},{"kind":"prose","text":"are. **Consequences:** Less noise, a smaller file, a shorter path into the log. Whoever needs","line":312,"renderedHtml":""},{"kind":"prose","text":"partials can get them later through a separate option.","line":313,"renderedHtml":""},{"kind":"prose","text":"","line":314,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-no-partials-in-log","title":"No partials in the session log","status":"accepted","date":"2026-11-06","addresses":"qg-performance"},"startLine":316,"endLine":322,"inArc42Fence":true},{"kind":"prose","text":"","line":324,"renderedHtml":""},{"kind":"heading","level":2,"text":"Idempotent commands with client IDs","line":325},{"kind":"prose","text":"","line":326,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> After a network drop, a client does not know if its last command arrived.\n\u003cstrong>Decision:\u003c/strong> Every command carries an ID that the client creates. The IDs are unique and sortable\nby time. The hub stores the ID with the event. If the same ID arrives again, the hub returns\nthe existing event and creates no new one. This also applies to \u003ccode>join\u003c/code>: the client keeps its join\ncommand ID, so a restarted client stays the same participant. \u003cstrong>Consequences:\u003c/strong> Clients can simply\nrepeat commands after a drop. The hub must keep the IDs at least for the life of the session.\nThe spike confirmed this: 0 lost and 0 duplicate events while the replicator was killed three\ntimes.\u003c/p>\n"},{"kind":"prose","text":"**Context:** After a network drop, a client does not know if its last command arrived.","line":327,"renderedHtml":""},{"kind":"prose","text":"**Decision:** Every command carries an ID that the client creates. The IDs are unique and sortable","line":328,"renderedHtml":""},{"kind":"prose","text":"by time. The hub stores the ID with the event. If the same ID arrives again, the hub returns","line":329,"renderedHtml":""},{"kind":"prose","text":"the existing event and creates no new one. This also applies to `join`: the client keeps its join","line":330,"renderedHtml":""},{"kind":"prose","text":"command ID, so a restarted client stays the same participant. **Consequences:** Clients can simply","line":331,"renderedHtml":""},{"kind":"prose","text":"repeat commands after a drop. The hub must keep the IDs at least for the life of the session.","line":332,"renderedHtml":""},{"kind":"prose","text":"The spike confirmed this: 0 lost and 0 duplicate events while the replicator was killed three","line":333,"renderedHtml":""},{"kind":"prose","text":"times.","line":334,"renderedHtml":""},{"kind":"prose","text":"","line":335,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-idempotent-commands","title":"Idempotent commands with client-generated IDs","status":"accepted","date":"2026-11-06","addresses":"qg-resumability"},"startLine":337,"endLine":343,"inArc42Fence":true},{"kind":"prose","text":"","line":345,"renderedHtml":""},{"kind":"heading","level":2,"text":"Connect RPC for commands and stream","line":346},{"kind":"prose","text":"","line":347,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> We want one typed contract for synchronous commands and for the session stream.\n\u003cstrong>Decision:\u003c/strong> Define both interfaces in Protobuf and serve them with Connect RPC: unary calls for\ncommands, server streaming for the session stream. The lines of the local JSONL file use the\ncanonical JSON form of the same event messages. \u003cstrong>Consequences:\u003c/strong> One schema for hub, clients\nand file format. Connect also speaks gRPC and gRPC-Web, and its own protocol is plain HTTP with\nJSON, so other clients can join without a special library. Maturity differs by language (see\n\u003ccode>risk-connect-maturity\u003c/code>); with Go we use the stable connect-go. \u003cstrong>Rejected:\u003c/strong> plain gRPC (needs\ngrpc-web and a proxy in the browser); tRPC (TypeScript only); WebSocket with JSON Schema (typed only\nby documentation).\u003c/p>\n"},{"kind":"prose","text":"**Context:** We want one typed contract for synchronous commands and for the session stream.","line":348,"renderedHtml":""},{"kind":"prose","text":"**Decision:** Define both interfaces in Protobuf and serve them with Connect RPC: unary calls for","line":349,"renderedHtml":""},{"kind":"prose","text":"commands, server streaming for the session stream. The lines of the local JSONL file use the","line":350,"renderedHtml":""},{"kind":"prose","text":"canonical JSON form of the same event messages. **Consequences:** One schema for hub, clients","line":351,"renderedHtml":""},{"kind":"prose","text":"and file format. Connect also speaks gRPC and gRPC-Web, and its own protocol is plain HTTP with","line":352,"renderedHtml":""},{"kind":"prose","text":"JSON, so other clients can join without a special library. Maturity differs by language (see","line":353,"renderedHtml":""},{"kind":"prose","text":"`risk-connect-maturity`); with Go we use the stable connect-go. **Rejected:** plain gRPC (needs","line":354,"renderedHtml":""},{"kind":"prose","text":"grpc-web and a proxy in the browser); tRPC (TypeScript only); WebSocket with JSON Schema (typed only","line":355,"renderedHtml":""},{"kind":"prose","text":"by documentation).","line":356,"renderedHtml":""},{"kind":"prose","text":"","line":357,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-connect-rpc","title":"Connect RPC with Protobuf for session commands and stream","status":"accepted","date":"2026-11-06","addresses":"qg-performance, qg-resumability, risk-connect-maturity"},"startLine":359,"endLine":365,"inArc42Fence":true},{"kind":"prose","text":"","line":367,"renderedHtml":""},{"kind":"heading","level":2,"text":"Go for everything, one monorepo","line":368},{"kind":"prose","text":"","line":369,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> We want one toolchain in one monorepo. The CLI should be easy to install. The ears need\nlocal Whisper. \u003cstrong>Decision:\u003c/strong> All parts are written in \u003cstrong>Go\u003c/strong>: server, CLI, MCP server, log\nreplicator, ears and stage. They live in one monorepo with one shared core. The stage is rendered on\nthe hub with Go templates and gets live updates through server-sent events. It needs no\nTypeScript and no frontend build. \u003cstrong>Reasons:\u003c/strong> connect-go is stable (v2); there is an official MCP\nSDK for Go; Go builds one static binary for the CLI; whisper.cpp has Go bindings, so the ears need\nno Python. \u003cstrong>Consequences:\u003c/strong> One language, one build, shared types between all parts. The ears use\nwhisper.cpp, so building the ears also needs a C/C++ compiler. Rich interaction in the\nbrowser would need a new decision. \u003cstrong>Considered:\u003c/strong> Rust (official connect-rust since 2026-08, but\nstill 0.x; strong for real-time audio, slower development); Python for the ears (connect-python not\nstable); TypeScript for the stage (second toolchain).\u003c/p>\n"},{"kind":"prose","text":"**Context:** We want one toolchain in one monorepo. The CLI should be easy to install. The ears need","line":370,"renderedHtml":""},{"kind":"prose","text":"local Whisper. **Decision:** All parts are written in **Go**: server, CLI, MCP server, log","line":371,"renderedHtml":""},{"kind":"prose","text":"replicator, ears and stage. They live in one monorepo with one shared core. The stage is rendered on","line":372,"renderedHtml":""},{"kind":"prose","text":"the hub with Go templates and gets live updates through server-sent events. It needs no","line":373,"renderedHtml":""},{"kind":"prose","text":"TypeScript and no frontend build. **Reasons:** connect-go is stable (v2); there is an official MCP","line":374,"renderedHtml":""},{"kind":"prose","text":"SDK for Go; Go builds one static binary for the CLI; whisper.cpp has Go bindings, so the ears need","line":375,"renderedHtml":""},{"kind":"prose","text":"no Python. **Consequences:** One language, one build, shared types between all parts. The ears use","line":376,"renderedHtml":""},{"kind":"prose","text":"whisper.cpp, so building the ears also needs a C/C++ compiler. Rich interaction in the","line":377,"renderedHtml":""},{"kind":"prose","text":"browser would need a new decision. **Considered:** Rust (official connect-rust since 2026-08, but","line":378,"renderedHtml":""},{"kind":"prose","text":"still 0.x; strong for real-time audio, slower development); Python for the ears (connect-python not","line":379,"renderedHtml":""},{"kind":"prose","text":"stable); TypeScript for the stage (second toolchain).","line":380,"renderedHtml":""},{"kind":"prose","text":"","line":381,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-languages","title":"Go for all parts in one monorepo","status":"accepted","date":"2026-11-06","addresses":"risk-connect-maturity, risk-whisper-latency, qg-performance"},"startLine":383,"endLine":389,"inArc42Fence":true},{"kind":"prose","text":"","line":391,"renderedHtml":""},{"kind":"heading","level":2,"text":"Local key pairs, one actor per agent","line":392},{"kind":"prose","text":"","line":393,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Participants and agents must prove who they are. We want no secrets stored on the\nhub. \u003cstrong>Decision:\u003c/strong> Every participant, including every agent, has its own Ed25519 key pair,\ncreated locally. Only the public key is sent to the hub. In the first stage, keys are registered\nby hand at first contact. Agents act as themselves, not on behalf of a human. The stage is opened\nwith a read-only link. A participant can have several keys (several devices), and an admin can\nremove a key. \u003cstrong>Proposed details:\u003c/strong> challenge and response with a short-lived access token bound\nto the key. \u003cstrong>Consequences:\u003c/strong> No shared secrets; agents\nneed only a key file. Enrollment needs a manual step for now (issue #2). \u003cstrong>Considered:\u003c/strong> OIDC with\nan existing identity provider (standard, but heavy for a small team); mTLS with client certificates\n(strong, but certificate management and awkward in the browser); static API tokens (secret on the\nhub, no binding to a device); passkeys (good for humans in the browser, not for CLI and agents).\u003c/p>\n"},{"kind":"prose","text":"**Context:** Participants and agents must prove who they are. We want no secrets stored on the","line":394,"renderedHtml":""},{"kind":"prose","text":"hub. **Decision:** Every participant, including every agent, has its own Ed25519 key pair,","line":395,"renderedHtml":""},{"kind":"prose","text":"created locally. Only the public key is sent to the hub. In the first stage, keys are registered","line":396,"renderedHtml":""},{"kind":"prose","text":"by hand at first contact. Agents act as themselves, not on behalf of a human. The stage is opened","line":397,"renderedHtml":""},{"kind":"prose","text":"with a read-only link. A participant can have several keys (several devices), and an admin can","line":398,"renderedHtml":""},{"kind":"prose","text":"remove a key. **Proposed details:** challenge and response with a short-lived access token bound","line":399,"renderedHtml":""},{"kind":"prose","text":"to the key. **Consequences:** No shared secrets; agents","line":400,"renderedHtml":""},{"kind":"prose","text":"need only a key file. Enrollment needs a manual step for now (issue #2). **Considered:** OIDC with","line":401,"renderedHtml":""},{"kind":"prose","text":"an existing identity provider (standard, but heavy for a small team); mTLS with client certificates","line":402,"renderedHtml":""},{"kind":"prose","text":"(strong, but certificate management and awkward in the browser); static API tokens (secret on the","line":403,"renderedHtml":""},{"kind":"prose","text":"hub, no binding to a device); passkeys (good for humans in the browser, not for CLI and agents).","line":404,"renderedHtml":""},{"kind":"prose","text":"","line":405,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-auth-keypair","title":"Local Ed25519 key pairs, one actor per agent","status":"accepted","date":"2026-11-06","addresses":"qg-confidentiality, con-privacy-law"},"startLine":407,"endLine":413,"inArc42Fence":true},{"kind":"prose","text":"","line":415,"renderedHtml":""},{"kind":"heading","level":2,"text":"Contract tests instead of unit tests","line":416},{"kind":"prose","text":"","line":417,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> The architecture is still changing. Tests should survive changes inside a building\nblock. \u003cstrong>Decision:\u003c/strong> We write no unit tests. Each building block gets black-box contract tests\nagainst its provided interfaces. End-to-end tests run real processes across several blocks.\n\u003cstrong>Consequences:\u003c/strong> The interfaces in chapter 5 must be precise enough to test against. Tests stay\nvalid when the inside of a block changes. Errors deep inside a block are found through its\ninterfaces, which can make them harder to locate. \u003cstrong>Rejected:\u003c/strong> unit tests per function.\u003c/p>\n"},{"kind":"prose","text":"**Context:** The architecture is still changing. Tests should survive changes inside a building","line":418,"renderedHtml":""},{"kind":"prose","text":"block. **Decision:** We write no unit tests. Each building block gets black-box contract tests","line":419,"renderedHtml":""},{"kind":"prose","text":"against its provided interfaces. End-to-end tests run real processes across several blocks.","line":420,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** The interfaces in chapter 5 must be precise enough to test against. Tests stay","line":421,"renderedHtml":""},{"kind":"prose","text":"valid when the inside of a block changes. Errors deep inside a block are found through its","line":422,"renderedHtml":""},{"kind":"prose","text":"interfaces, which can make them harder to locate. **Rejected:** unit tests per function.","line":423,"renderedHtml":""},{"kind":"prose","text":"","line":424,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-contract-tests","title":"Black-box contract tests instead of unit tests","status":"accepted","date":"2026-11-06","addresses":"con-no-unit-tests, con-contract-tests"},"startLine":426,"endLine":432,"inArc42Fence":true},{"kind":"prose","text":"","line":434,"renderedHtml":""},{"kind":"heading","level":2,"text":"Architecture test against the arc42 model","line":435},{"kind":"prose","text":"","line":436,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> Rules about module boundaries erode when nothing checks them. \u00
