<script>window.__WORKSPACE__={"elements":[{"id":"con-any-meeting-tool","title":"Any meeting tool, unchanged","category":"organizational","source":"Product vision","kind":"constraint","loc":{"file":"docs/architecture/02-constraints.arc42.md","line":76,"heading":"Any meeting tool, unchanged","prose":"\nTeams keep their meeting tool (Zoom, Teams, Meet, Jitsi …). The office must work without any\nintegration into these tools.\n"}},{"id":"con-contract-tests","title":"Black-box contract tests per building block","category":"convention","source":"Maintainer","kind":"constraint","loc":{"file":"docs/architecture/02-constraints.arc42.md","line":107,"heading":"Black-box contract tests per building block","prose":"\nEvery building block is tested as a black box through its interfaces (chapter 5). A contract test\nstarts the block, uses only its provided interfaces and checks the results. It knows nothing about\nthe inside of the block. If a block needs another block, the test uses the real block or a fake\nthat follows the same contract. End-to-end tests combine several blocks in the same way.\n"}},{"id":"con-headset-only","title":"Ears only with a headset (no echo cancellation, no voice print)","category":"technical","source":"Scope of the first stage; to be lifted by issue #1","kind":"constraint","loc":{"file":"docs/architecture/02-constraints.arc42.md","line":62,"heading":"Headset required for the ears","prose":"\nThe first stage has no echo cancellation and no voice print. Only a headset makes sure that the\nears hear nothing but their owner. Use with loudspeakers is not supported. Issue #1 describes how\nto lift this constraint.\n"}},{"id":"con-no-intelligence","title":"No intelligence of its own in the hub","category":"convention","source":"Product vision; scope limited to the hub by the maintainer on 2026-11-11","kind":"constraint","loc":{"file":"docs/architecture/02-constraints.arc42.md","line":47,"heading":"No intelligence in the hub","prose":"\nThe office hub contains no LLM and makes no judgements about content. It stores, calculates,\nrenders and checks against rules. The hub holds the state of the team and needs governance:\nevery result of the hub must be deterministic and traceable. The agent does the judging and the\nwording.\n\nThe rule applies to the hub only. The participant client runs on the computer of a participant\nand may contain models, generative or not: the ears transcribe with a speech model, and the\nagent runner may ask a decision model that the user brings (`dec-models-in-client`).\nSpeech-to-text counts as conversion, not as judgement.\n"}},{"id":"con-no-unit-tests","title":"No unit tests","category":"convention","source":"Maintainer","kind":"constraint","loc":{"file":"docs/architecture/02-constraints.arc42.md","line":91,"heading":"No unit tests","prose":"\nWe do not write unit tests for internal functions or classes. They tie the tests to the inner\nstructure and make refactoring expensive. Tests check behaviour at the boundaries of building\nblocks instead (see the next constraint).\n"}},{"id":"con-privacy-law","title":"GDPR and § 201 German Criminal Code","category":"organizational","source":"Legislation (DE/EU)","kind":"constraint","loc":{"file":"docs/architecture/02-constraints.arc42.md","line":10,"heading":"Data protection and confidentiality of speech","prose":"\nListening in meetings touches the GDPR and § 201 of the German Criminal Code (confidentiality of\nthe spoken word). People who are captured must have consented, and they must be able to see that\nthey are captured. Captured content needs retention and deletion rules.\n"}},{"id":"con-turn-based-agents","title":"Agents work in turns; MCP push is rarely supported","category":"technical","source":"Behaviour of common agent clients (2026)","kind":"constraint","loc":{"file":"docs/architecture/02-constraints.arc42.md","line":26,"heading":"Agents work in turns","prose":"\nToday's agents work in turns. Standard MCP clients usually do not pass server notifications on to\nthe model. The model only sees tool results. So the live connection must not depend on push\nfeatures of the client. An agent finishes a turn and then waits for a new prompt; something\noutside the agent must start its next turn (`dec-agent-runner-acp`).\n"}},{"id":"actor-agent","title":"Agent","type":"system","requires":["if-mcp","if-cli","if-local-log","if-acp-client"],"description":"Reads the session log as a file or gets it from the agent runner over ACP, writes through tools; keeps minutes, raises its hand, creates artifacts","kind":"actor","loc":{"file":"docs/architecture/03-system-context.arc42.md","line":71,"heading":"Agent","prose":"\nAny agent, for example Claude Code or an agent built on the Agent SDK. It joins a session, reads\nthe locally replicated log as a file (`tail -f`, `grep`) and acts through tools (MCP or CLI). It\nbrings all the intelligence.\n\nAn agent can also run in an **agent harness** that speaks the Agent Client Protocol (ACP), for\nexample Claude Code through its ACP adapter, opencode or Kiro. Then the agent runner of the client\nstarts the harness, opens one ACP session for the meeting and sends it what was said\n(`dec-agent-runner-acp`). The harness answers as the ACP agent, and the client is the ACP client.\nThe agent still acts through the office tools, which the runner hands to the harness session.\n"}},{"id":"actor-decision-model","title":"Decision model","type":"system","requires":["if-decision-model"],"description":"Optional, brought by the user; answers after each utterance whether the agent should act and whether a topic has ended","kind":"actor","loc":{"file":"docs/architecture/03-system-context.arc42.md","line":88,"heading":"Decision model","prose":"\nA model that a user brings and configures for the agent runner (`dec-byo-decision-model`), for\nexample a small local model behind an OpenAI-compatible endpoint, or a program. After each\nutterance of another participant, the runner asks it whether the agent should act now, whom the\nspeaker addressed and whether a block of topics has ended. The office ships no such model.\n"}},{"id":"actor-human","title":"Human participant","type":"person","requires":["if-cli","if-audio-in","if-local-log","if-stage-web"],"description":"Speaks (optionally transcribed), uses the CLI, shares the stage","kind":"actor","loc":{"file":"docs/architecture/03-system-context.arc42.md","line":49,"heading":"Human participant","prose":"\nA team member in a meeting. They use the CLI like an agent does: show artifacts, raise a hand,\nedit minutes. With `--mic` they also switch on the ears. Their speech is then transcribed\nlocally, and the terminal shows what was captured and sent. One person opens the stage in a\nbrowser and shares it in the meeting.\n"}},{"id":"actor-meeting-tool","title":"Meeting tool","type":"system","requires":["if-stage-web"],"description":"Carries the stage shared by screen share; no integration","kind":"actor","loc":{"file":"docs/architecture/03-system-context.arc42.md","line":103,"heading":"Meeting tool","prose":"\nZoom, Teams, Meet, Jitsi or any other tool. We do not integrate it. It only carries the screen\nshare of the stage to all participants, including those without a client.\n"}},{"id":"strategy-architecture","title":"Headless office with file-based participation and transcription at the edge","addresses":["qg-confidentiality","qg-performance","qg-resumability","qg-usability"],"kind":"solution-strategy","loc":{"file":"docs/architecture/04-solution-strategy.arc42.md","line":16,"heading":"Solution Strategy","prose":"\nThe hub is state and tools, the client adds senses, and neither is the brain. Agents and humans take part as\nparticipants of the same kind. They read what happens from a locally replicated file and act\nthrough CLI or MCP tools. Speech is transcribed at the edge. The office is present in the meeting\nthrough a shared stage, not through an integration into the meeting tool.\n\n| Quality goal | Approach |\n|---|---|\n| Confidentiality | Transcription at the edge; only text leaves the device |\n| Performance | Staged events without partials; log as a locally replicated file; the agent filters what it reacts to |\n| Resumability | Append-only log with cursor; resume from the last known event; idempotent commands |\n| Usability | One participant model; everyone sees their own events; the stage shows who is captured |\n"}},{"id":"bb-agent-runner","title":"Agent runner","technology":"Go / Agent Client Protocol","parent":"bb-participant-client","path":"client/agentrunner","implements":["concept-read-file-write-tools","concept-participant-model"],"requires":["if-client-core","if-replication","if-session-commands"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":782,"heading":"Agent runner","prose":"\nKeeps an agent in the meeting (`dec-agent-runner-acp`). Agents work in turns\n(`con-turn-based-agents`): after a turn they wait for a human. The runner does not wait. For one\nsession and one agent key, it:\n\n- joins the session as the agent and runs the log replicator in its own process, so it follows\n  the local log of the agent;\n- starts the agent harness, opens one ACP session and hands it the office tools as an MCP server\n  with the key of the agent;\n- sends a first prompt with the role of the agent and the meeting;\n- after each utterance of another participant, checks whether to wake the agent\n  (`dec-wake-check-per-utterance`): it asks the decision model, if the user brought one\n  (`dec-byo-decision-model`), and wakes the agent when the model says it should act or a block\n  of topics has ended; if the model fails or is slow, it wakes the agent;\n- when it wakes the agent, sends what others said since its last delivery, with who said it and\n  whether that participant is a human or an agent. It leaves out the agent's own utterances and\n  sentences off the record. While the agent works, it queues what comes and sends it together\n  afterwards, so nothing is lost and nothing is sent twice (`dec-agent-runner-delivery`);\n- after the session ends, sends a last prompt and stops the harness.\n\nThe runner never speaks for the agent and judges nothing itself: the agent decides whether it is\naddressed and acts through the office tools. Whatever the harness writes as a reply is only\nlogged.\n"}},{"id":"bb-archive","title":"Archive","technology":"Go / local Git repository","parent":"bb-office-hub","path":"hub/archive","implements":[],"requires":[],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":436,"heading":"Archive","prose":"\nThe storage that all record parts of the hub use (`dec-records-per-type`). It stores records as\nfiles in a local Git repository on the hub host and commits locally (`dec-yaml-git-storage`).\nEvery change of a caller is one commit. The archive does not know the records: the caller\ndecides the files and their content. Callers read their files back from the current commit, for\nexample to rebuild their index at start. After every commit, the archive pushes to a remote. The\npush is mocked for now: it does nothing and reports success. A commit can be slow, so callers\nthat must not wait call it in the background.\n"}},{"id":"bb-cli","title":"office CLI","technology":"Go, single binary","parent":"bb-participant-client","path":"client/cli","implements":["concept-read-file-write-tools"],"requires":["if-client-core","if-replication","if-session-commands","if-slides-api","if-auth-api"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":727,"heading":"office CLI","prose":"\nThe main access for humans and for agents with a shell. `office meeting join \u003csession> [--mic]`\nstarts the replication and prints the log path. `office agent run` starts the agent runner for\nan agent harness. With `--mic`, the terminal shows the user's own\nutterances with their status (partial → final → sent / off the record). Keys let the user pause and\nmark a sentence off the record. `office session import \u003cfile>` imports a conversation from a\nfile in the import format of the client (`dec-import-format`). Other commands cover slides, the\nstage, decisions, minutes, notes and tasks.\n"}},{"id":"bb-client-core","title":"Client core","technology":"Go","parent":"bb-participant-client","path":"client/core","implements":[],"requires":["if-session-commands","if-session-import","if-auth-api","if-decision-api","if-minutes-api","if-note-api","if-task-api","if-slides-api"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":691,"heading":"Client core","prose":"\nThe shared core of the CLI, the MCP server and the ears (\"one core, two adapters\",\n`dec-cli-and-mcp`). It holds the configuration of a participant, authenticates with Identity,\ncreates the command IDs and calls the interfaces of the office hub. It reads the import format\nof conversations and sends a conversation to the session import in pages\n(`dec-import-format`), so the CLI and the MCP server import in the same way. The adapters add only their\nown way of talking to a human or an agent.\n"}},{"id":"bb-ears","title":"Ears","technology":"Go / whisper.cpp, including its voice activity detection","parent":"bb-participant-client","path":"client/ears","implements":["concept-edge-transcription","concept-test-strategy"],"requires":["if-client-core","if-session-commands"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":848,"heading":"Ears","prose":"\nOnly for humans with `--mic`. Pipeline: microphone → VAD → Whisper (local) → utterances to the\nsession. The first stage needs a headset and has no voice print and no echo cancellation\n(`con-headset-only`). Raw audio never leaves the device. During a network drop, the ears keep\ntranscribing and queue the utterances locally. They send them in order once the connection is back.\nThe ears choose their speech model by language and speed (`dec-model-download`). They give Whisper\nthe vocabulary of the project and the names of the participants as a prompt\n(`dec-vocabulary-prompt`); the CLI reads the names from the local log and passes them on.\n"}},{"id":"bb-identity","title":"Identity","technology":"Go","parent":"bb-office-hub","path":"hub/identity","implements":["concept-identity"],"requires":[],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":488,"heading":"Identity","prose":"\nKnows all participants and their public keys. Each participant, human or agent, is its own actor\nwith its own Ed25519 key pair. The client creates the key pair locally and sends only the public\nkey. In the first stage, a new public key is registered by hand when we meet the person\n(issue #2 describes a real enrollment flow). Identity issues short-lived access tokens and creates\nread-only links for the stage.\n"}},{"id":"bb-mcp","title":"MCP server","technology":"Go / official MCP Go SDK","parent":"bb-participant-client","path":"client/mcp","implements":["concept-read-file-write-tools"],"requires":["if-client-core","if-replication","if-session-commands","if-slides-api","if-auth-api"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":745,"heading":"MCP server","prose":"\nA local MCP server (stdio) with the same features as the CLI. `meeting.join` starts the\nreplication and returns the path to the log file. The replication lives as long as the MCP\nprocess.\n"}},{"id":"bb-office-hub","title":"Office hub","technology":"Go (monorepo)","path":"hub","implements":["concept-event-log","concept-participant-model","concept-module-boundaries"],"requires":[],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":45,"heading":"Office hub","prose":"\nThe central, headless part. It holds the state of the team and of running meetings, offers\ndeterministic tools and renders the stage. It is the gateway to the archive. It contains no LLM.\n"}},{"id":"bb-participant-client","title":"Participant client","technology":"Go (one binary)","path":"client","implements":["concept-participant-model","concept-read-file-write-tools","concept-module-boundaries"],"requires":[],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":520,"heading":"Participant client","prose":"\nRuns locally on every participant's computer and is the same for humans and agents. It contains\nthe CLI, the MCP server, the log replicator, the agent runner and, optionally, the ears. Unlike the\nhub, the client may contain models (`dec-models-in-client`): the speech model of the ears, and a\ndecision model that the user brings for the agent runner.\n"}},{"id":"bb-records","title":"Records (decisions, minutes, notes)","technology":"Go / YAML in the archive","parent":"bb-office-hub","path":"hub/records","implements":[],"requires":["if-token-check","if-archive-storage"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":366,"heading":"Records","prose":"\nThe memory of the team: decisions, minutes and notes (`dec-records-per-type`). Each type has its\nown interface and its own types.\nEach record keeps its origin: who wrote it, and whether a human or an agent. Tasks are not part\nof this block; they have their own part of the hub.\n\nEvery record is one YAML file in the archive, and every new record is one commit\n(`dec-yaml-git-storage`). A command returns only after its commit, so a record that a client got\nback is stored. Local commits are fast, so this does not slow the meeting; the commit of the\nminutes is part of ending a session. When the hub starts, the block reads its records back from\nthe archive, so they survive a restart.\n"}},{"id":"bb-replicator","title":"Log replicator","technology":"Go / connect-go","parent":"bb-participant-client","path":"client/replicator","implements":["concept-event-log","concept-read-file-write-tools","concept-test-strategy"],"requires":["if-session-stream","if-session-commands"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":809,"heading":"Log replicator","prose":"\nA local process. It keeps a connection to the session stream and appends every event as one line to\na file. There is one file per session and participant, in a private runtime directory of the user,\nso several participants on one machine (for example a human and an agent) do not collide and no\nother user can read the file. After a drop, it reconnects and continues after the last complete\nline in the file. On `session.ended` it writes a final line and stops.\nIt also stops when its parent process dies.\n\nIf the hub does not know its cursor, the hub has lost events (`dec-restore-from-peers`). The\nreplicator then offers the events the hub misses, with the signed tree head it keeps, through the\nsession commands. It retries until the hub has its cursor again, from its own copy or from another\npeer. Before it goes on, it checks that the log of the hub up to the cursor has the same root\nhash as the local log; if not, it stops with an error instead of continuing a copy that forks.\n"}},{"id":"bb-session-service","title":"Meeting session","technology":"Go / connect-go","parent":"bb-office-hub","path":"hub/session","implements":["concept-event-log","concept-participant-model","concept-identity"],"requires":["if-minutes-api","if-token-check","if-archive-storage"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":326,"heading":"Meeting session","prose":"\nManages sessions and their participants. Accepts utterances from the ears and actions from\nparticipants, and writes everything to one append-only event log per session. It also takes\nimported conversations (`if-session-import`) and writes them into the log of a new session, so a\nsession log has one writer in every case. Subscribers receive\nthe log from a cursor onwards. Events are merged by time only: the participant model already says\nwho spoke.\n"}},{"id":"bb-slides","title":"Slides","technology":"Go / YAML and HTML in the archive","parent":"bb-office-hub","path":"hub/slides","implements":[],"requires":["if-token-check","if-archive-storage"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":415,"heading":"Slides part","prose":"\nRenders slide decks and keeps them behind the slides interface (`dec-records-per-type`). Rendering\nis deterministic and without streaming. Every deck is stored in the archive in one commit\n(`dec-yaml-git-storage`): its input as YAML and its rendered output next to it. A command returns\nonly after its commit. The output is stored and not rendered again on read, so a deck stays\nexactly what was shown in a meeting, even if a later version of the hub renders differently.\nBecause rendering is deterministic, the stored input is enough to get the same output again.\nWhen the hub starts, the block reads its decks back from the archive, so they survive a restart.\nLike the records part, it writes synchronously and can wait behind a session write of the\narchive (#45).\n\nThe check of business plans by calculation (consistency, unit economics, completeness) is a\ndifferent type with its own interface when it is built (#3).\n"}},{"id":"bb-stage","title":"Stage","technology":"Go, rendered by the hub / server-sent events","parent":"bb-office-hub","path":"hub/stage","implements":["concept-transparency"],"requires":["if-session-stream","if-slides-api","if-auth-api"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":468,"heading":"Stage","prose":"\nOne web page per session, shown in the meeting by screen share. It shows the running minutes,\nraised hands, the shown artifact (a slide deck), and who is captured or paused. It marks an\nimported session with its source and the participant who imported it, and never shows it as\nlive. It is only a view of the session log and has no logic of its own.\n"}},{"id":"bb-tasks","title":"Tasks","technology":"Go / YAML in the archive","parent":"bb-office-hub","path":"hub/tasks","implements":[],"requires":["if-token-check","if-archive-storage"],"kind":"building-block","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":389,"heading":"Tasks part","prose":"\nKeeps the tasks of the team behind the task interface (`dec-records-per-type`). For now every\ntask is a local draft: one YAML file in the archive per task (`dec-yaml-git-storage`). Creating a\ntask is one commit, and every change rewrites the file in a new commit, so the archive keeps the\nhistory of every task. A command returns only after its commit. When the hub starts, the block\nreads its tasks back from the archive, so they survive a restart. Like the records part, it\nwrites synchronously and can wait behind a session write of the archive (#45).\n\nA later sync with the task tool of the team (#40) belongs to this block. Only the hub will hold\nthe credentials of that tool.\n"}},{"id":"if-acp-client","title":"Agent Client Protocol (client side)","provider":"bb-participant-client","protocol":"ACP, JSON-RPC over stdio (agentclientprotocol.com)","path":"client/agentrunner","extensions":{"realized-by":"bb-agent-runner"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":643,"heading":"Agent Client Protocol (client side)","prose":"\nThe participant client is the client of the Agent Client Protocol (ACP) for an agent harness,\nfor example Claude Code through its ACP adapter, opencode or Kiro. The agent runner starts the\nharness as a child process and talks JSON-RPC with it over its standard input and output. The\ncontract is the published protocol; the client takes the client side and the harness the agent\nside (`dec-agent-runner-acp`):\n\n- The runner opens one ACP session per meeting and hands it the office tools as an MCP server\n  that runs with the key of the agent.\n- It sends prompts: a first one with the role and the meeting, then what was said.\n- It answers the requests of the harness for permission to use a tool by a rule of the user\n  (`dec-agent-runner-delivery`). It offers no access to its file system or terminal.\n- It ends the harness when the runner ends.\n"}},{"id":"if-archive-storage","title":"Archive storage","provider":"bb-archive","protocol":"In-process Go call","path":"hub/archive/storage","kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":451,"heading":"Archive storage","prose":"\nThe in-process interface of the archive: write a set of files as one commit, and read the files\nof a directory as they are in the current commit. Paths are relative to the repository.\n"}},{"id":"if-audio-in","title":"Audio input","provider":"bb-participant-client","protocol":"Local audio device","path":"client/ears","extensions":{"realized-by":"bb-ears"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":617,"heading":"Audio input","prose":"\nThe participant's local audio device (headset).\n"}},{"id":"if-auth-api","title":"Auth API","provider":"bb-office-hub","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/identity/api","extensions":{"realized-by":"bb-identity"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":188,"heading":"Auth API","prose":"\nChallenge and response: the client asks for a challenge, signs it with its private key and gets a\nshort-lived access token that is bound to its key. Also: create a read-only stage link.\n"}},{"id":"if-cli","title":"office CLI","provider":"bb-participant-client","protocol":"Shell / stdout","path":"client/cli","extensions":{"realized-by":"bb-cli"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":566,"heading":"CLI","prose":"\nShell commands with machine-readable output (OPEN: `--json` convention).\n"}},{"id":"if-client-core","title":"Client core API","provider":"bb-client-core","protocol":"In-process Go call","path":"client/core","kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":707,"heading":"Client core API","prose":"\nThe in-process interface of the client core for the adapters: configuration, authenticated\nclients of the office hub, command IDs and the commands of a participant.\n"}},{"id":"if-decision-api","title":"Decisions","provider":"bb-office-hub","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/records/decision/api","extensions":{"realized-by":"bb-records"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":206,"heading":"Decisions","prose":"\nRecord a decision and list the decisions, oldest first, by session and from a cursor. A decision\nrecords its author and whether the author is a human or an agent. Each command carries an ID\ncreated by the client, so a repeated command has no extra effect. A sentence that is off the\nrecord must not go into a decision (`dec-off-the-record`).\n"}},{"id":"if-decision-model","title":"Decision model","provider":"bb-participant-client","protocol":"OpenAI-compatible chat completions with JSON schema, or JSON on stdin and stdout of a command","path":"client/agentrunner/decision","extensions":{"realized-by":"bb-agent-runner"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":671,"heading":"Decision model","prose":"\nThe contract for a decision model that the user brings (`dec-byo-decision-model`). At each change\nof speaker, the agent runner sends a request: the session, the agent and its role, the\nparticipants, the recent context and the new utterances, and who ended the turn. The model\nanswers with structured output:\n\n- `act`: whether the agent should act now;\n- `addressed`: the participant whom the speaker addressed, or empty;\n- `topic_closed`: whether a block of topics has ended;\n- `reason`: a short reason, for the log of the runner.\n\nThe model is reached in one of two ways: an OpenAI-compatible chat endpoint with structured\noutput by JSON schema, or a command that reads the request as JSON on its standard input and\nwrites the answer as JSON on its standard output. The contract owns the request, the answer and\nits JSON schema.\n"}},{"id":"if-local-log","title":"Local session log","provider":"bb-participant-client","protocol":"JSONL file (append-only)","path":"client/replicator","extensions":{"realized-by":"bb-replicator"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":602,"heading":"Local session log","prose":"\nAn append-only JSONL file with one compact line per event. Every line carries the event type in\ndotted form (for example `\"type\":\"utterance.final\"`) and the event ID as a JSON number, so that\n`tail -f`, `grep` and `jq` work without conversion. The line form belongs to the session stream,\nso the session log in the archive has the same lines. Next to the log, the replicator keeps the\nlatest tree head that the hub signed over it (`dec-signed-head-in-stream`).\n"}},{"id":"if-mcp","title":"MCP tools","provider":"bb-participant-client","protocol":"MCP (stdio)","path":"client/mcp","extensions":{"realized-by":"bb-mcp"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":583,"heading":"MCP tools","prose":"\nTools such as `meeting.join`, `meeting.leave`, `hand.raise`, `minutes.update`, `stage.show`,\n`slides.render`, `slides.get`, `plan.validate`, `decision.record`, `minutes.get`, `note.add`, `task.create`,\n`task.update`, `session.import`.\n"}},{"id":"if-minutes-api","title":"Minutes","provider":"bb-office-hub","protocol":"Connect RPC, unary (dec-connect-rpc); in-process for the meeting session","path":"hub/records/minutes/api","extensions":{"realized-by":"bb-records"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":225,"heading":"Minutes","prose":"\nThe minutes of a session. While the session runs, participants write the running minutes\nthrough the session commands (`minutes.update`). When the session ends, the meeting session\nstores the last version through this interface (`rs-session-ends`). Clients read the stored\nminutes of a session and list all stored minutes; they do not write them here. A sentence that\nis off the record must not go into the minutes.\n"}},{"id":"if-note-api","title":"Notes","provider":"bb-office-hub","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/records/note/api","extensions":{"realized-by":"bb-records"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":241,"heading":"Notes","prose":"\nAdd a free note, with or without a session, and list the notes like the decisions. A sentence\nthat is off the record must not go into a note.\n"}},{"id":"if-replication","title":"Replication control","provider":"bb-replicator","protocol":"In-process Go call","path":"client/replicator","kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":828,"heading":"Replication control","prose":"\nThe in-process interface to start the replication of a session for a participant, to find a\nrunning replicator and to stop it. The CLI runs the replicator as its own process; the MCP server\nruns it inside its own process.\n"}},{"id":"if-session-commands","title":"Session commands","provider":"bb-office-hub","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/session/api","extensions":{"realized-by":"bb-session-service"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":111,"heading":"Session commands","prose":"\nSynchronous calls that answer at once: `join`, `leave`, `utterance.submit`, `utterance.mark_off_the_record`,\n`pause`, `hand.raise`, `minutes.update`, `stage.show`. Each successful call creates one event in the\nlog. Each call carries an ID created by the client, so a repeated call has no extra effect.\n\nThe session commands also let anyone with a token check a session log (`dec-merkle-log`): they\nreturn the signed tree head of a log (for the current log or for its first events), a\nconsistency proof between two sizes, an inclusion proof for one event, and the public key of the\nhub that signs the tree heads. The verification code for clients belongs to this interface,\nbecause the interface owns the event types.\n\nAfter a restart, a peer offers its copy of a session log with one more command\n(`dec-restore-from-peers`): the events the hub misses and a tree head signed by the hub over the\ncopy. The hub accepts the copy only if it verifies and extends its own log. A copy that is not\nlonger has no effect, and a copy that does not verify or forks fails.\n"}},{"id":"if-session-import","title":"Session import","provider":"bb-office-hub","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/session/importapi","extensions":{"realized-by":"bb-session-service"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":172,"heading":"Session import","prose":"\nImports a whole conversation that happened outside the office as a new session\n(`dec-session-import`): a meeting in another tool, a chat, or a conversation with an agent. The\nimport names its source and, optionally, a title. It lists the participants (a name, human or\nagent) and the utterances in order (speaker, text, modality and, if known, the time they were\nmade). A conversation comes in one call or in pages. Each page carries an ID created by the client,\nso a repeated page has no extra effect. The last page completes the import.\n\nThe import only fills the log. The meeting session writes the events of an import like those of\nlive commands, and the session stream, the events after a cursor and the archive deliver them the\nsame way. The first event of an imported session marks it as imported, with its source and the\nparticipant who imported it. A last event marks the end of the import. While an import is not\ncomplete, the session takes only the next pages of the same participant. After it, the session\nbehaves like any other session, so participants derive minutes, decisions, notes and tasks\nthrough the existing interfaces.\n\nThe speakers of an imported conversation are not registered participants: the hub cannot check\nwho they are. Their participant IDs are marked as imported, so they never match a registered\nparticipant. The hub signs tree heads over an imported log like over every log. Such a signature\nproves which participant imported the log and that the log has not changed since; it does not\nprove that the speakers said what the log says.\n"}},{"id":"if-session-stream","title":"Session stream (replication from a cursor)","provider":"bb-office-hub","protocol":"Connect RPC, server streaming (dec-connect-rpc)","path":"hub/session/api","extensions":{"realized-by":"bb-session-service"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":138,"heading":"Session stream","prose":"\nDelivers the event log of a session from a cursor onwards, then live. This is the basis for local\nreplication and for the stage. After a drop, the subscriber reconnects with its last event ID.\nIt also answers a one-time request for the events after a cursor. A participant uses it when it\nfinds a gap in its copy, or to follow the session without a file system (`dec-events-from-cursor`).\nWith the last event it has, the stream sends a tree head signed by the hub over all events up to\nit, so a subscriber always holds a signed head over its whole copy (`dec-signed-head-in-stream`).\nA cursor beyond the end of the log means that the hub lost events: the subscriber then offers its\ncopy.\n\nThe interface also defines the stored form of a session log: one line per event and the signed\ntree head next to it. The local log of a participant and the session log in the archive use the\nsame lines (`dec-yaml-git-storage`), so every reader can rebuild the events and check them\nagainst the tree head with the event types of this interface alone.\n"}},{"id":"if-slides-api","title":"Slides","provider":"bb-office-hub","protocol":"Connect RPC, unary (dec-connect-rpc); in-process for the stage","path":"hub/slides/api","extensions":{"realized-by":"bb-slides"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":291,"heading":"Slides","prose":"\nRender a slide deck from a structured description (an optional title; slides with a title,\nbullets and speaker notes) and fetch a deck by its ID, with its input and its rendered output. A\ndeck records its author and whether the author is a human or an agent. Each command carries an ID\ncreated by the client, so a repeated command has no extra effect. Rendering is deterministic\n(`con-no-intelligence`): the same input gives the same output. A sentence that is off the record\nmust not go into a deck.\n\nA deck has an ID with the type in front, for example `slides/42`. The stage shows a deck by this\nID. In general, an artifact is anything that the stage can show by an ID like this; today slide\ndecks are the only type (`term-artifact`).\n"}},{"id":"if-stage-web","title":"Stage view","provider":"bb-office-hub","protocol":"HTTPS (browser)","path":"hub/stage","extensions":{"realized-by":"bb-stage"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":306,"heading":"Stage view","prose":"\nA browser view of one session, opened by a link.\n"}},{"id":"if-task-api","title":"Tasks","provider":"bb-office-hub","protocol":"Connect RPC, unary (dec-connect-rpc)","path":"hub/tasks/api","extensions":{"realized-by":"bb-tasks"},"kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":267,"heading":"Tasks","prose":"\nCreate a task, read one, list tasks and change them: title, description, assignee, status (open,\nin progress, done, cancelled) and a link to a session. List filters by status, assignee and\nsession and reads page by page. A task records its author and whether the author is a human or\nan agent, and who changed it last. Each command carries an ID created by the client, so a\nrepeated command has no extra effect. A sentence that is off the record must not go into a task.\n\nFor now every task is a local draft of the hub (`dec-yaml-git-storage`). Later the hub syncs tasks\nwith the task tool of the team, and the synced task replaces the draft. So that this step does\nnot change the contract, a task is named by a stable reference with a scheme, for example\n`local:42` today and `github:owner/repo#12` later. Clients treat the reference as opaque: they\nkeep it and pass it back. Each task also says where it lives; today that is always the hub.\nOPEN: how a synced task replaces its draft, and which side is the truth (#40).\n"}},{"id":"if-token-check","title":"Token check","provider":"bb-identity","protocol":"In-process Go call","path":"hub/identity/tokencheck","kind":"interface","loc":{"file":"docs/architecture/05-building-blocks.arc42.md","line":503,"heading":"Token check","prose":"\nOther parts of the hub check access tokens here and learn which participant a token belongs to.\n"}},{"id":"rs-agent-joins","title":"Agent joins a meeting","involves":["bb-mcp","bb-client-core","bb-session-service","bb-replicator","bb-participant-client","bb-office-hub"],"trigger":"Agent calls meeting.join","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":10,"heading":"Agent joins a meeting","prose":"\nThe agent calls `meeting.join`. The MCP server registers it as a participant, starts the log\nreplicator and returns the file path. The agent follows the file in the background. It filters for\nthe events that should wake it up, for example `turn.end` and `addressed`.\n"}},{"id":"rs-agent-runner-turn","title":"The agent runner checks after each utterance whether to wake an agent","involves":["bb-agent-runner","bb-client-core","bb-replicator","bb-mcp","bb-cli","bb-session-service","bb-participant-client","bb-office-hub"],"trigger":"utterance.final of another participant in the local log of the agent","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":436,"heading":"The agent runner checks after each utterance whether to wake an agent","prose":"\nAn agent takes part through the agent runner (`dec-agent-runner-acp`). The runner joined the\nsession with the key of the agent and follows its local log. It started the harness, opened one\nACP session with the office tools and sent a first prompt with the role.\n\nA human talks. Each sentence reaches the local log as `utterance.final`. After each utterance,\nthe runner checks whether to wake the agent (`dec-wake-check-per-utterance`): it asks the\ndecision model whether the agent should act now, for example because the speaker addressed it,\nstarted a new topic within a monologue or talks about something that concerns the role of the\nagent (`dec-byo-decision-model`). If so, the runner collects what others said since its last\ndelivery, leaves out the agent's own utterances and sentences off the record, and sends it as one\nprompt. The agent decides how to act: it answers with `utterance_say` when the speaker asked it,\nraises its hand instead of interrupting, or updates the minutes silently. Its actions reach every\nlocal log, also that of the runner, which leaves them out of the next prompt. If the agent is\nstill busy, the runner queues what comes and sends it together afterwards\n(`dec-agent-runner-delivery`). When the session ends, the runner sends a last prompt and stops\nthe harness.\n"}},{"id":"rs-agent-shows-artifact","title":"Agent raises its hand and shows an artifact","involves":["bb-cli","bb-slides","bb-archive","bb-session-service","bb-stage","bb-replicator","bb-participant-client","bb-office-hub"],"trigger":"Agent decides after turn.end to raise its hand","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":148,"heading":"Agent raises its hand and shows an artifact","prose":"\nThe agent renders a slide deck through the CLI and raises its hand on the stage. The slides part\nstores the input and the rendered deck in the archive before it returns the ID. When the agent\ngets the floor, it shows the deck by its ID. The stage reads the same events from the session\nstream and loads the deck from the slides part inside the hub.\n"}},{"id":"rs-archive-session","title":"Hub writes sessions to the archive","involves":["bb-session-service","bb-archive","bb-office-hub"],"trigger":"The write interval has passed, or a session has ended","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":280,"heading":"Hub writes sessions to the archive","prose":"\nWhile sessions run, the meeting session writes every session that changed to the archive, at a\nconfigurable interval and at once when a session ends (`dec-session-persistence`). It takes the\nlog as it is at that moment and signs the tree head over it. The archive writes the log and the\ntree head and commits them as one commit; the push is mocked. Commands and the stream go on\nduring the commit. Events that arrive during a slow commit go into the next write. There is\nnever more than one write in progress (`qs-archive-no-backpressure`).\n"}},{"id":"rs-authenticate","title":"Participant authenticates with its key","involves":["bb-cli","bb-mcp","bb-ears","bb-client-core","bb-identity","bb-session-service","bb-participant-client","bb-office-hub"],"trigger":"First call of a client, or the access token is about to expire","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":132,"heading":"Participant authenticates","prose":"\nBefore its first call, a client (CLI, MCP server or ears) asks Identity for a challenge. It signs\nthe challenge with its private key and gets a short-lived access token. It sends the token with\nevery call. The session checks the token and knows the participant. Shortly before the token\nexpires, the client repeats the steps. This also happens after a network drop.\n"}},{"id":"rs-hub-restart","title":"Hub restarts and restores a session from the archive and the peers","involves":["bb-session-service","bb-archive","bb-replicator","bb-participant-client","bb-office-hub"],"trigger":"The hub starts again after a crash while a session runs","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":326,"heading":"Hub restarts and restores a session","prose":"\nThe hub crashes while a session runs. Its last write to the archive has the session up to some\nevent; the events after it are lost on the hub, but the peers still have them. When the hub starts\nagain, the meeting session reads every stored log back from the archive and checks it against its\nsigned tree head (`dec-restore-from-peers`). A session that has not ended takes no commands yet.\nThe replicators reconnect with their cursors. The hub does not know these cursors and answers that\nthey are beyond the end. Each replicator then asks the hub how many events it has and offers the\nevents after that, with the tree head the hub signed over its copy before the crash\n(`dec-signed-head-in-stream`). The hub checks the signature, the root hash and the consistency\nwith its own log, and appends the missing events with their IDs. The first copy that fits wins;\nlater copies have no effect. The session takes commands again, the replicators follow the stream\nfrom their cursors, and the IDs continue without a gap. A copy that does not verify or forks\nfails, and the replicator stops instead of continuing it.\n"}},{"id":"rs-human-speaks","title":"Human speaks, agent receives the sentence","involves":["bb-ears","bb-client-core","bb-session-service","bb-replicator","bb-cli","bb-participant-client","bb-office-hub"],"trigger":"End of sentence (VAD pause) in the headset signal","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":50,"heading":"Human speaks","prose":"\nA human joined with `--mic`. The ears detect the end of a sentence, Whisper transcribes it locally,\nand the utterance is sent. The session appends it to the log. Every replicator writes it to its\nlocal file. The speaker's terminal shows the status \"sent\".\n"}},{"id":"rs-import-conversation","title":"Agent imports a conversation and writes its minutes","involves":["bb-mcp","bb-cli","bb-client-core","bb-session-service","bb-records","bb-archive","bb-participant-client","bb-office-hub"],"trigger":"An agent calls session.import with a conversation file","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":377,"heading":"Agent imports a conversation and writes its minutes","prose":"\nAn agent has a conversation from another tool as a file in the import format\n(`dec-import-format`). It calls `session.import` with the file. The client core reads the file\nand sends the conversation in pages to the session import. The first page creates the session:\nthe meeting session writes an event that marks the session as imported, the imported\nparticipants and the first utterances. Every further page adds utterances, and the last page\nwrites the end of the import. The client core returns the session ID and the signed tree head\nover the imported log. The hub writes the session to the archive at its next interval, like\nevery other session. The agent then reads the events after a cursor, joins the session like a\nlive one, writes the minutes and records decisions and tasks with the session ID. When it ends\nthe session, the meeting session stores the minutes (`rs-session-ends`).\n"}},{"id":"rs-network-drop","title":"Network drop and resume","involves":["bb-ears","bb-session-service","bb-replicator","bb-participant-client","bb-office-hub"],"trigger":"Network connection of a participant is lost and comes back","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":92,"heading":"Network drop and resume","prose":"\nThe network of a participant drops for a while. The ears keep transcribing and queue utterances\nlocally. The replicator loses the stream. When the network is back, the ears send the queued\nutterances in order. Each one carries its client ID, so nothing is stored twice. The replicator\nreconnects with the ID of its last line and receives everything it missed.\n"}},{"id":"rs-off-the-record","title":"Human marks a sentence off the record","involves":["bb-cli","bb-session-service","bb-replicator","bb-stage","bb-participant-client","bb-office-hub"],"trigger":"A key in the gateway terminal","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":198,"heading":"Human marks a sentence off the record","prose":"\nWhat is said stays said (`dec-off-the-record`). The human presses a key in the gateway terminal\nto mark their own sentence off the record. The CLI sends `utterance.mark_off_the_record`. The\nhub checks that the caller is the speaker. The log gets a new event `utterance.off_the_record`\nthat points to the original utterance. Existing lines are never rewritten. From then on, the\ninterfaces deliver the utterance only as a placeholder without its text, the stage hides it, and\nit does not go into minutes, decisions or notes. Agents that already read it must respect the\nmark.\n"}},{"id":"rs-session-ends","title":"Session ends, the minutes are stored","involves":["bb-mcp","bb-cli","bb-session-service","bb-records","bb-archive","bb-replicator","bb-participant-client","bb-office-hub"],"trigger":"The moderator ends the session","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":217,"heading":"Session ends, the minutes are stored","prose":"\nThe moderator ends the session. The agent that keeps the minutes writes the final version with\n`minutes.update`. The meeting session stores the confirmed minutes through the minutes interface.\nThe records part writes them as one YAML file into the archive and commits it before it answers\n(`dec-yaml-git-storage`). Only then does the meeting session write `session.ended` to the log. If\nstoring fails, the session does not end, and the moderator can repeat the command. The\nreplicators stop. Afterwards every participant reads the stored minutes through the minutes\ninterface.\n"}},{"id":"rs-task-lifecycle","title":"Agent creates a task, a human finishes it","involves":["bb-mcp","bb-cli","bb-client-core","bb-tasks","bb-identity","bb-archive","bb-participant-client","bb-office-hub"],"trigger":"A human asks the agent in a meeting to note a task","kind":"runtime-scenario","loc":{"file":"docs/architecture/06-runtime-view.arc42.md","line":236,"heading":"Agent creates a task, a human finishes it","prose":"\nIn a meeting, a human asks the agent to note a task for a colleague. The agent calls\n`task.create` with a title, the assignee and the session. The tasks part checks the token, writes\nthe task as one YAML file into the archive and commits it before it answers with the reference of\nthe task (`dec-yaml-git-storage`). Later the assignee lists the open tasks assigned to them and\nsets the status to done. The tasks part rewrites the file in a new commit, so the archive keeps\nthe history. Both commands carry an ID created by the client, so a repeat after a network drop\nchanges nothing.\n"}},{"id":"dn-agent-runtime","title":"Agent runtime","type":"container","hosts":["bb-mcp","bb-cli","bb-client-core","bb-replicator","bb-agent-runner"],"parent":"env-mvp","kind":"deployment-node","loc":{"file":"docs/architecture/07-deployment-view.arc42.md","line":80,"heading":"Agent runtime","prose":"\nThe computer or container in which the agent runs, for example Claude Code on a laptop or in a\ncloud session. It runs the MCP server, the CLI and the log replicator in the same file system as\nthe agent. With the agent runner, the runner starts the agent harness as its child process on this\nnode, and the harness starts the MCP server. A decision model that the user brings runs wherever\nthe user puts it: as a command on this node, or behind an endpoint that the node can reach.\n"}},{"id":"dn-office-hub","title":"Office hub","type":"server","hosts":["bb-session-service","bb-records","bb-tasks","bb-slides","bb-stage","bb-identity","bb-archive"],"parent":"env-mvp","kind":"deployment-node","loc":{"file":"docs/architecture/07-deployment-view.arc42.md","line":101,"heading":"Office hub","prose":"\nOne server or container that runs the hub: the meeting session, the records, the tasks, the\nslides, the stage and the archive. The archive stores sessions, decisions, minutes, notes, tasks\nand slide decks in a local Git repository on this host (`dec-yaml-git-storage`); the push to a remote\nis mocked for now. The host needs the Git command line tool. It keeps the participants and their keys (identity)\npermanently. The operator gives the hub its signing key for the tree heads (`dec-merkle-log`) at\nevery start, at first as a key file on the command line, and creates that key with a separate\ncommand of the hub. The hub does not create a signing key by itself and does not start without\none (`dec-hub-signing-key`).\n"}},{"id":"dn-participant-laptop","title":"Participant computer","type":"device","hosts":["bb-cli","bb-client-core","bb-replicator","bb-ears"],"parent":"env-mvp","kind":"deployment-node","loc":{"file":"docs/architecture/07-deployment-view.arc42.md","line":62,"heading":"Participant computer","prose":"\nThe laptop of a human with a headset. It runs the CLI, the log replicator and the ears with local\nWhisper. The client comes as a ready binary for Linux and macOS. It chooses its speech model by\nthe spoken language and by whether its build can use a GPU, downloads it once, on first use, and\nchecks it (`dec-model-download`). OPEN: minimum hardware for real-time Whisper with the large\nmodels.\n"}},{"id":"env-mvp","title":"First stage","type":"environment","hosts":[],"kind":"deployment-node","loc":{"file":"docs/architecture/07-deployment-view.arc42.md","line":46,"heading":"First stage","prose":"\nThe environment in which the system first runs in our own team.\n"}},{"id":"concept-edge-transcription","title":"Local transcription; only text leaves the device","category":"privacy","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":119,"heading":"Transcription at the edge","prose":"\nEach human transcribes only themselves, locally. Raw audio never leaves the device. Only text and\nmetadata are sent. With a headset, the single ear comes for free. Use with loudspeakers (echo\ncancellation, voice print) and the room ear (speaker recognition) come later. Voice prints are\nbiometric data (Art. 9 GDPR) and need explicit consent.\n"}},{"id":"concept-event-log","title":"Append-only session log with cursor and resume","category":"integration","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":81,"heading":"Event log with cursor","prose":"\nEach session has an append-only log with exactly one writer, the hub. It gives every event an\nID that grows by one inside the session. So the order is free of conflicts, and the IDs have no\ngaps: a participant that sees event 43 after 41 knows that 42 is missing and fetches the events\nafter its cursor (`dec-events-from-cursor`). The cursor is the last event ID a client has read,\nwhich is also the last line of the local file. Utterances never change and are never removed.\nCorrections and off-the-record marks are new events that point to the original\n(`utterance.corrected`, `utterance.off_the_record`). An utterance off the record keeps its ID; the interfaces\ndeliver a placeholder without its text, so no false gap appears (`dec-off-the-record`).\n\n**Storage and integrity.** The hub orders the events and is the gateway to the archive: it writes\nthe log to a Git repository at a configurable interval and at the end, without ever holding up\nthe session (`dec-session-persistence`). At first the repository is local on the hub host\n(`dec-yaml-git-storage`). The peers keep copies as their reading interface; their copies and the\nstored log have the same lines. The events are the leaves of a Merkle tree, and the hub signs its\ntree head (`dec-merkle-log`). Every write to the archive carries the signed tree head over\nexactly the stored log. After a crash, the hub restores a session from the archive, and a peer fills in\nthe rest (`dec-restore-from-peers`). For this, the stream gives every peer a signed tree head over\nits whole copy, and a restored session waits for the peers before it takes commands, so the IDs\nand every cursor stay valid (`dec-signed-head-in-stream`, `rs-hub-restart`).\n\n**Imported sessions.** A conversation from outside the office becomes a session through its own\ninterface (`dec-session-import`). The meeting session writes it into the log like live commands,\nso the log keeps one writer and gap-free IDs. The first event marks the session as imported and\nnames its source. The speakers are imported participants, not registered ones. The tree heads\nover an imported log protect it from later changes, but do not prove what was said.\n\n**Resuming after a network drop:**\n\n- Readers (replicator, stage) reconnect with their last event ID and receive every event after it.\n  Nothing is lost, and nothing arrives twice.\n- Writers (ears, CLI, MCP) give every command an ID that they create themselves. If they send a\n  command again after a drop, the hub recognises the ID and returns the existing event.\n- This includes `join`: a client keeps its join command ID, so after a restart it is still the\n  same participant.\n- The ears queue utterances locally while offline (text only) and send them in order.\n\nEvent levels (guide values, configurable per participant):\n\n| Event | Trigger |\n|---|---|\n| `utterance.final` | End of sentence, about 300–700 ms of silence |\n| `turn.end` | Change of speaker, about 1.5–2 s of silence |\n| `silence.long` | More than 5 s of silence |\n| `addressed` | A participant's name is mentioned |\n| `hand.raised`, `minutes.updated`, `artifact.shown` | Actions of participants |\n| `participant.joined/left/paused`, `session.ended` | Life cycle |\n\nPartials are not written to the log (`dec-no-partials-in-log`).\n\n**Checking a log:** the events of a session are the leaves of a Merkle tree (`dec-merkle-log`).\nThe hub signs the head of the tree with its own key, which stays the same across restarts. It\nputs the signed head of the log so far into `session.ended`, and returns a signed head, a\nconsistency proof or an inclusion proof on request. A placeholder of an utterance that is off\nthe record carries the leaf hash of the original, so a copy with placeholders still verifies.\nA placeholder can only hide a text; it cannot change what the tree proves.\n"}},{"id":"concept-identity","title":"Identity and access with local key pairs","category":"security","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":165,"heading":"Identity and access","prose":"\n**Actors and keys.** Every participant is its own actor with its own Ed25519 key pair: each human\ndevice and each agent. The key pair is created locally. Only the public key leaves the device. An\nagent does not act on behalf of a human; it acts as itself.\n\n**First contact.** In the first stage, we trust a new public key because we meet the person. An\nadmin registers the key by hand. A real enrollment flow is issue #2.\n\n**Authentication.** Challenge and response: the client signs a challenge from the hub and gets\nan access token that lives about 15 minutes and is bound to its key. Every call carries the token.\nAll connections use TLS.\n\n**Stage.** A browser has no key. Identity creates a read-only link with a token that only allows\nviewing the stage of one session.\n\n**Revocation.** Each participant can have several keys (several devices). An admin can remove a\nkey; tokens bound to it stop working when they expire, at the latest.\n\n**Out of scope for the first stage:** acting on behalf of someone else (delegation), self-service\nenrollment (issue #2), encryption of stored data (OPEN).\n"}},{"id":"concept-module-boundaries","title":"Module boundaries follow the building blocks","category":"structure","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":237,"heading":"Module boundaries","prose":"\nThe building block view (chapter 5) is the map of the code, and a test enforces it.\n\n- **One path per building block.** A building block is a black box with one responsibility. Its\n  path is where its code lives. A child lies under the path of its parent.\n- **An interface belongs to its provider.** Its path lies inside the path of the provider. The\n  types of an interface are part of the interface: every provider defines its own types, even if\n  another interface has a similar one (for example the kind of a participant, of an actor and of\n  the author of a decision). Consumers map between them.\n- **No shared package.** There is no common or core package that everyone may use. Code that\n  several building blocks need is either an interface of one of them, or a missing building block,\n  or acceptable duplication. Cross-cutting concepts (this chapter) are rules, not places.\n- **`requires` is the permission.** A building block may only use the interfaces it provides or\n  lists in `requires`. Every listed interface must be used. So a new dependency shows up in the\n  model before it can exist in the code.\n- **Black box and white box.** An interface that crosses the boundary of a parent building block\n  belongs to that parent: it is part of its black box. One direct child realizes it, and the\n  model names that child. Only the realizing child may use such an interface without requiring\n  it. Interfaces that stay inside a parent belong to the child that provides them. So level 1 of\n  the building block view shows the contracts across the boundary, and level 2 shows how the\n  parts work together.\n- **The white box knows its parts.** A parent building block may wire its direct children. A\n  child never uses the inside of its parent, and siblings know each other only through\n  interfaces.\n- **Tests are external actors.** They may use interfaces only and never reach into a building\n  block.\n- **Interfaces for actors only** (CLI, MCP, stage view, audio input) also have a path: the place\n  where their contract is defined. Building blocks do not use them.\n"}},{"id":"concept-participant-model","title":"One participant model","category":"domain","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":15,"heading":"Participant model","prose":"\nThere are only **participants**. Each participant has an identity, a kind (`kind: human | agent`)\nand roles, for example moderator, minute taker or stage control. Rights depend on roles, not on\nthe kind. The kind stays visible for two reasons: the stage marks agents as agents, and only speech\nneeds consent to be recorded.\n\nAn utterance is an utterance, whatever its channel. `utterance.final` carries\n`modality: voice | text`. Human speech is `voice`. Typed remarks and an agent's contributions are\n`text`. Later, speech output will voice text utterances, and the model stays the same.\n"}},{"id":"concept-read-file-write-tools","title":"Read from the file, write through tools","category":"integration","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":104,"heading":"Read from the file, write through tools","prose":"\nParticipants read what happens from the locally replicated file. Agents usually do this with a\nbackground process and a filter (`tail -f … | grep '\"turn.end\"\\|\"addressed\"'`). They act through\ntools (CLI or MCP) that answer at once and check their input. Every action then appears in the log.\nSo agents can confirm their own actions, and several agents can coordinate without a protocol of\ntheir own.\n\nAn agent can also fetch the events after a cursor itself: when it finds a gap in its copy, or\nwhen it has no file system and polls instead of following a file (`dec-events-from-cursor`).\n\nAn agent in a harness that works in turns cannot follow a file by itself. The agent runner reads\nthe file for it and puts what was said into the agent's next prompt (`dec-agent-runner-acp`). The\nagent still writes through the tools, and it can still read the file for earlier events.\n"}},{"id":"concept-test-strategy","title":"Test strategy for the audio pipeline","category":"testing","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":199,"heading":"Test strategy","prose":"\n**No unit tests.** Every building block is tested as a black box through its interfaces\n(`con-no-unit-tests`, `con-contract-tests`). The interfaces in chapter 5 are the contracts.\n\n**Automated end-to-end tests** run on a host without a microphone. They feed a recorded\nWAV file through the ears in real time. This covers the whole pipeline after audio capture: voice\nactivity detection, Whisper, submitting the utterance, the session log and the local copy. The\ntests also cover resume after the replicator is killed.\n\n**End-to-end tests never check performance.** They check behaviour only: no audio leaves the\ndevice, no event is lost or duplicated, the status of a sentence becomes visible. They pass on any\nhost that runs the system. **Performance tests** are separate. They check the timing criteria of\nthe quality scenarios (chapter 10) with their full lengths and run on the reference host.\n\n**Architecture test.** A test checks the code against this model on every run of the tests (see\n`concept-module-boundaries`).\n\n**Manual tests** cover what a WAV file cannot: real audio capture from a device and Whisper\naccuracy on real speech. A person joins with a headset on a participant laptop and speaks a few\nsentences. We do this before we judge recognition quality, because the test WAV is synthetic and\ncleaner than a headset in a meeting.\n\n**Not planned:** a virtual microphone on the hub host. It needs administrator rights and adds\nlittle.\n"}},{"id":"concept-transparency","title":"Transparency and consent","category":"privacy","kind":"concept","loc":{"file":"docs/architecture/08-concepts.arc42.md","line":135,"heading":"Transparency and consent","prose":"\nPeople who are captured see every sentence with its status in their terminal. They can pause and\nmark a sentence off the record afterwards. The stage shows everyone who is captured, paused or not\ncaptured. People without a client are not transcribed. Joining with the microphone is the consent\nto capture and to storage, also of the raw transcript (`dec-consent-by-mic`). Only the user who\nruns the client can read local log files.\n"}},{"id":"dec-agent-runner-acp","title":"An agent runner drives the agent harness over ACP","status":"accepted","date":"2026-11-11","addresses":["con-turn-based-agents","qg-usability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":68,"heading":"An agent runner drives the agent harness over ACP","prose":"\n**Context:** Claude Code, opencode and Kiro work in turns (`con-turn-based-agents`). They finish\na turn and wait for a human. Following the local log with `tail -f` in a background task works\nonly while the agent is in a turn, and people must use a keyword so that a filter wakes the\nagent. People want to address the agent in plain words. **Decision:** A new part of the client,\nthe agent runner, keeps the agent in the meeting. It follows the local log of the agent and\nstarts the agent's turns. Runner and harness are separate programs. They talk over the Agent\nClient Protocol (ACP): the runner is the ACP client and starts the harness as its ACP agent over\nstandard input and output. The runner opens one ACP session per meeting and hands it the office\ntools as an MCP server that runs with the key of the agent. **Consequences:** Every harness that\nspeaks ACP can take part without code for that harness in the office. The agent keeps its\ncontext across the meeting in one ACP session. The agent still acts only through the office\ntools, as itself. A harness that does not speak ACP still works the old way, through MCP or the\nCLI and the log file. The runner depends on a protocol that is young and still changes.\n**Rejected:** a runner per harness (code for every product); building the agent into the office\n(`dec-headless-byoa`); MCP notifications to wake the agent (most clients do not pass them on,\n`con-turn-based-agents`).\n"}},{"id":"dec-agent-runner-delivery","title":"What the agent runner sends, and when","status":"proposed","date":"2026-11-11","addresses":["qg-resumability","qg-usability","risk-retraction-leak","risk-agent-wakeups","risk-harness-drift"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":135,"heading":"What the agent runner sends, and when","prose":"\n**Context:** The runner must deliver what was said reliably, while the agent may be busy and the\nlog may grow. **Decision:**\n\n- The runner joins the session with the key of the agent and runs the log replicator in its own\n  process. The agent does not need to join; a join through the tools reuses the same participant\n  and the same local log.\n- It delivers utterances in the order of the log, from the cursor of its last delivery. It leaves\n  out the agent's own utterances and sentences off the record. A sentence that goes off the record\n  before it was delivered is never delivered; for a delivered one, the next prompt tells the\n  agent that it is off the record.\n- One prompt runs at a time. While the agent works, the runner queues further turns and sends\n  them together in one prompt afterwards. A turn without new utterances of others wakes nobody.\n- After `session.ended`, the runner sends what is left and a last prompt with the task of the\n  role for the end, then stops the harness. It does not leave the session, because a session\n  command would open it again (`dec-session-end-milestone`).\n- The runner answers permission requests of the harness by a rule of the user: by default it\n  allows the office tools and rejects every other tool. It offers the harness no access to its\n  file system or terminal.\n- A new runner opens a new ACP session. It starts its delivery after the join of the agent, so\n  a new runner for the same agent delivers what was said since that join.\n\n**Consequences:** Nothing is lost and nothing is sent twice within one ACP session. The agent\ngets fewer, larger prompts when it is slow. The permission rule keeps an unattended agent from\nrunning other tools unless the user allows them. **Rejected:** cancelling a running prompt when a\nnew turn comes (the agent would lose its work); one prompt per turn while busy (the agent would\nlag behind more and more).\n"}},{"id":"dec-architecture-test","title":"The code is tested against the building block view","status":"accepted","date":"2026-11-07","addresses":["con-contract-tests"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":450,"heading":"Architecture test against the arc42 model","prose":"\n**Context:** Rules about module boundaries erode when nothing checks them. **Decision:** A test\nchecks the code against the building block view on every test run (`concept-module-boundaries`).\nIt reads the model from the arc42 tooling itself, not with an own parser, and the dependencies of\nthe code from the Go toolchain. It fails on code without a building block, on a dependency\nbetween building blocks that does not go through a required interface, on a test that reaches\ninto a building block, and on a required interface that is never used. A small workspace with\ndeliberate violations proves that each rule fails when it should. **Consequences:** Every change\nof a dependency needs a change of the model first. The tests need the arc42 tooling and fail\nwithout it; they do not skip. **Rejected:** an own parser of the chapter files (it would drift\nfrom the arc42 syntax); a shared package for common types (it becomes the place where boundaries\nerode).\n"}},{"id":"dec-auth-keypair","title":"Local Ed25519 key pairs, one actor per agent","status":"accepted","date":"2026-11-06","addresses":["qg-confidentiality","con-privacy-law"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":407,"heading":"Local key pairs, one actor per agent","prose":"\n**Context:** Participants and agents must prove who they are. We want no secrets stored on the\nhub. **Decision:** Every participant, including every agent, has its own Ed25519 key pair,\ncreated locally. Only the public key is sent to the hub. In the first stage, keys are registered\nby hand at first contact. Agents act as themselves, not on behalf of a human. The stage is opened\nwith a read-only link. A participant can have several keys (several devices), and an admin can\nremove a key. **Proposed details:** challenge and response with a short-lived access token bound\nto the key. **Consequences:** No shared secrets; agents\nneed only a key file. Enrollment needs a manual step for now (issue #2). **Considered:** OIDC with\nan existing identity provider (standard, but heavy for a small team); mTLS with client certificates\n(strong, but certificate management and awkward in the browser); static API tokens (secret on the\nhub, no binding to a device); passkeys (good for humans in the browser, not for CLI and agents).\n"}},{"id":"dec-byo-decision-model","title":"A decision model that the user brings","status":"accepted","date":"2026-11-11","addresses":["con-no-intelligence","qg-performance","qg-usability","risk-agent-wakeups"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":165,"heading":"A decision model that the user brings","prose":"\n**Context:** The runner checks after each utterance whether to wake the agent\n(`dec-wake-check-per-utterance`). Waking a harness with a large model for this costs time and\nmoney, and it is slow to decide that it is not addressed. A small model can decide this faster\nand cheaper. The hub must stay without intelligence (`con-no-intelligence`), and the office\nshould not pick a model for its users. **Decision:** The runner has an interface for a decision\nmodel that the user brings and configures (`if-decision-model`). It is an OpenAI-compatible chat\nendpoint with structured output by JSON schema (for example llama.cpp, Ollama or a hosted model),\nor a command that reads the request as JSON and writes the answer as JSON. After each utterance,\nthe runner asks it and gets `act`, `addressed`, `topic_closed` and `reason`. It wakes the agent\nwhen `act` is true. When `topic_closed` is true, it wakes the agent with the task of the role for\nthe end of a topic, for example to update the minutes or to record decisions. Without a decision\nmodel, the runner wakes the agent at each change of speaker (OPEN, see\n`dec-wake-check-per-utterance`). If the model fails or does not answer in time, the runner wakes the agent and logs why.\n**Consequences:** The office ships no model and stays free of a model vendor. A wrong answer of\nthe model can keep the agent silent when it was addressed; the fallback covers only errors and\ntime-outs. Utterances that did not wake the agent stay queued and reach it with the next prompt,\nso nothing is lost. **Rejected:** a model built into the office; a fixed vendor API.\n"}},{"id":"dec-cli-and-mcp","title":"CLI and MCP from one shared core","status":"accepted","date":"2026-11-06","addresses":["con-turn-based-agents"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":300,"heading":"CLI and MCP as equals","prose":"\n**Decision:** All features are available through the CLI and through MCP, built on one shared core.\nThis holds for the tools and for the live layer. **Consequences:** Two thin adapters. The CLI is not\nan add-on.\n"}},{"id":"dec-connect-rpc","title":"Connect RPC with Protobuf for session commands and stream","status":"accepted","date":"2026-11-06","addresses":["qg-performance","qg-resumability","risk-connect-maturity"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":359,"heading":"Connect RPC for commands and stream","prose":"\n**Context:** We want one typed contract for synchronous commands and for the session stream.\n**Decision:** Define both interfaces in Protobuf and serve them with Connect RPC: unary calls for\ncommands, server streaming for the session stream. The lines of the local JSONL file use the\ncanonical JSON form of the same event messages. **Consequences:** One schema for hub, clients\nand file format. Connect also speaks gRPC and gRPC-Web, and its own protocol is plain HTTP with\nJSON, so other clients can join without a special library. Maturity differs by language (see\n`risk-connect-maturity`); with Go we use the stable connect-go. **Rejected:** plain gRPC (needs\ngrpc-web and a proxy in the browser); tRPC (TypeScript only); WebSocket with JSON Schema (typed only\nby documentation).\n"}},{"id":"dec-consent-by-mic","title":"Joining with the microphone is the consent to storage","status":"accepted","date":"2026-11-07","addresses":["risk-consent","con-privacy-law","qg-confidentiality"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":539,"heading":"Consent by joining with the microphone","prose":"\n**Context:** Capture and storage of speech need consent (GDPR, § 201 German Criminal Code).\n**Decision:** Joining with `--mic` is the consent to capture and to storage, also of the raw\ntranscript. Only participants who join with the microphone are transcribed. Joining a session at\nall is the consent that every other participant keeps a copy of the session and that the hub\nstores it in the archive (`dec-session-persistence`). The stage shows the\ncapture status to everyone. Censorship is possible only by marking a sentence off the record later\n(`dec-off-the-record`). **Consequences:** No extra step in the meeting. Raw audio still never\nleaves the device. OPEN: a data protection review before the first real use, and how long raw\ntranscripts are kept.\n"}},{"id":"dec-contract-tests","title":"Black-box contract tests instead of unit tests","status":"accepted","date":"2026-11-06","addresses":["con-no-unit-tests","con-contract-tests"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":426,"heading":"Contract tests instead of unit tests","prose":"\n**Context:** The architecture is still changing. Tests should survive changes inside a building\nblock. **Decision:** We write no unit tests. Each building block gets black-box contract tests\nagainst its provided interfaces. End-to-end tests run real processes across several blocks.\n**Consequences:** The interfaces in chapter 5 must be precise enough to test against. Tests stay\nvalid when the inside of a block changes. Errors deep inside a block are found through its\ninterfaces, which can make them harder to locate. **Rejected:** unit tests per function.\n"}},{"id":"dec-events-from-cursor","title":"Events after a cursor, with gap-free IDs from one writer","status":"accepted","date":"2026-11-07","addresses":["risk-no-filesystem","qg-resumability"],"kind":"decision","loc":{"file":"docs/architecture/09-decisions.arc42.md","line":491,"heading":"Events after a cursor","prose":"\n**Context:** A participant may miss events (a gap in its copy), and some agents have no file\nsystem to follow. **Decision:** The se
